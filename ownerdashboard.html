<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>K@si Web | Owner Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-950 text-white min-h-screen">


<header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">

    <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"
    >

        <h1 class="text-2xl font-bold">
            💈 Owner Dashboard
        </h1>


        <div class="flex gap-2">

            <a
                href="home.html"
                class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg"
            >
                Home
            </a>


            <button
                id="logoutBtn"
                class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="max-w-7xl mx-auto px-4 py-8">


    <!-- LOADING -->

    <div
        id="loading"
        class="text-center py-20"
    >

        <div class="text-4xl mb-4">
            💈
        </div>

        <p>
            Loading dashboard...
        </p>

    </div>


    <!-- ERROR -->

    <section
        id="errorSection"
        class="hidden max-w-xl mx-auto"
    >

        <div
            class="bg-red-950/50 border border-red-800 rounded-2xl p-6"
        >

                Dashboard Error

            ></p>


            <button
                id="retryBtn"

                Try Again

        </div>

    </section>


    <!-- CREATE SALON -->

    <section
        id="createSalonSection"
        class="hidden max-w-xl mx-auto"
    >

        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6"
        >

            <h2 class="text-2xl font-bold mb-2">
                Create Your Salon
            </h2>


            <p class="text-gray-400 mb-6">
                Your owner account is ready.
                Connect it to your salon.
            </p>


            <input
                id="salonName"
                type="text"
                placeholder="Salon name"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <input

                type="text"
                placeholder="Location"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <input
                id="salonHours"
                type="text"
                placeholder="Opening hours e.g. 06:00 - 18:00"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <input
                id="salonImage"
                type="url"
                placeholder="Image URL (optional)"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <button
                id="createSalonBtn"
                class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold"
            >
                Create Salon
            </button>

    <!-- OWNER CONTENT -->

    <section
        id="ownerContent"
        class="hidden"
    >


        <!-- SALON -->

        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6"
        >

            <div
                class="flex flex-col md:flex-row md:justify-between md:items-center gap-4"
            >

                <div>

                    <p class="text-sm text-gray-500 mb-1">
                        My Salon
                    </p>

                    <h2
                        id="salonTitle"
                        class="text-3xl font-bold"
                    >
                        My Salon
                    </h2>

                    <p
                        id="salonInfo"
                        class="text-gray-400 mt-2"
                    ></p>

                </div>


                <div
                    class="bg-gray-800 rounded-xl px-5 py-3"
                >

                    <p class="text-gray-400 text-sm">
                        Today's bookings
                    </p>

                    <p
                        id="bookingCount"
                        class="text-2xl font-bold"
                    >
                        0
                    </p>

                </div>

            </div>

        </div>


        <!-- BOOKINGS -->

        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6"
        >

            <div
                class="flex justify-between items-center mb-5"
            >

                <div>

                    <h2 class="text-2xl font-bold">
                        Today's Bookings
                    </h2>

                    <p
                        id="todayDate"
                        class="text-gray-400"
                    ></p>

                </div>

            </div>


            <div
                id="bookingsList"
                class="space-y-4"
            >

                Loading bookings...

            </div>

        </div>


    </section>


</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    addDoc,
    collection,
    query,
    where,
    getDocs,
    onSnapshot,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let salonId = null;

let unsubscribeBookings = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById("loading");

const errorSection =
    document.getElementById("errorSection");

const errorMessage =
    document.getElementById("errorMessage");

const createSalonSection =
    document.getElementById("createSalonSection");

const ownerContent =
    document.getElementById("ownerContent");

const bookingsList =
    document.getElementById("bookingsList");

const bookingCount =
    document.getElementById("bookingCount");


/* =========================================================
   DATE
========================================================= */

function todayZA() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:
                "Africa/Johannesburg",

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit"
        }
    ).format(
        new Date()
    );

}


document.getElementById(
    "todayDate"
).textContent =
    todayZA();


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "owners.html";

            return;

        }


        currentUser =
            user;


        await initializeOwnerDashboard();

    }
);


/* =========================================================
   INITIALIZE DASHBOARD
========================================================= */

async function initializeOwnerDashboard() {

    showLoading();


    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        /*
         * User profile must exist.
         */

        if (!userSnap.exists()) {

            throw new Error(
                "Your user profile does not exist in Firestore."
            );

        }


        const userData =
            userSnap.data();


        /*
         * Only salon owners can use
         * this dashboard.
         */

        if (
            userData.role !==
            "salon_owner"
        ) {

            window.location.href =
                "salons.html";

            return;

        }


        /*
         * First use salonId from user profile.
         */

        salonId =
            userData.salonId ||
            null;


        /*
         * If salonId is missing,
         * search salons by ownerId.
         */

        if (!salonId) {

            salonId =
                await findSalonForOwner(
                    currentUser.uid
                );


            /*
             * Repair user profile.
             */

            if (salonId) {

                await setDoc(
                    userRef,
                    {

                        salonId:
                            salonId,

                        role:
                            "salon_owner",

                        email:
                            currentUser.email || "",

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge:
                            true
                    }
                );

            }

        }


        /*
         * No salon found.
         */

        if (!salonId) {

            hideLoading();

            createSalonSection.classList.remove(
                "hidden"
            );

            return;

        }


        /*
         * Load salon.
         */

        const salonLoaded =
            await loadSalon();


        if (!salonLoaded) {

            return;

        }


        hideLoading();

        ownerContent.classList.remove(
            "hidden"
        );


        listenForBookings();

    } catch (error) {

        console.error(
            "Dashboard initialization error:",
            error
        );

        showError(
            error.message
        );

    }

}


/* =========================================================
   FIND SALON BY OWNER ID
========================================================= */

async function findSalonForOwner(
    ownerId
) {

    const q =
        query(
            collection(
                db,
                "salons"
            ),
            where(
                "ownerId",
                "==",
                ownerId
            )
        );


    const snapshot =
        await getDocs(q);


    if (
        snapshot.empty
    ) {

        return null;

    }


    /*
     * If multiple salons exist,
     * use the first one.
     */

    return snapshot.docs[0].id;

}


/* =========================================================
   CREATE SALON
========================================================= */

document
    .getElementById("createSalonBtn")
    .addEventListener(
        "click",
        async () => {

            if (!currentUser) {

                alert(
                    "You are not logged in."
                );

                return;

            }


            const name =
                document
                    .getElementById("salonName")
                    .value
                    .trim();


            const location =
                document
                    .getElementById("salonLocation")
                    .value
                    .trim();


            const hours =
                document
                    .getElementById("salonHours")
                    .value
                    .trim();


            const image =
                document
                    .getElementById("salonImage")
                    .value
                    .trim();


            if (
                !name ||
                !location
            ) {

                alert(
                    "Please enter your salon name and location."
                );

                return;

            }


            const button =
                document.getElementById(
                    "createSalonBtn"
                );


            button.disabled =
                true;

            button.textContent =
                "Creating...";


            try {

                /*
                 * Create salon.
                 */

                const salonRef =
                    await addDoc(
                        collection(
                            db,
                            "salons"
                        ),
                        {

                            ownerId:
                                currentUser.uid,

                            ownerEmail:
                                currentUser.email || "",

                            name:
                                name,

                            location:
                                location,

                            hours:
                                hours ||
                                "09:00 - 18:00",

                            image:
                                image || "",

                            services: [

                                {
                                    name:
                                        "Basic Cut",

                                    price:
                                        80
                                },

                                {
                                    name:
                                        "Fade",

                                    price:
                                        120
                                },

                                {
                                    name:
                                        "Premium Cut",

                                    price:
                                        150
                                }

                            ],

                            createdAt:
                                serverTimestamp(),

                            updatedAt:
                                serverTimestamp()

                        }
                    );


                /*
                 * Connect salon to owner.
                 */

                await setDoc(
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    ),
                    {

                        salonId:
                            salonRef.id,

                        role:
                            "salon_owner",

                        email:
                            currentUser.email || "",

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge:
                            true
                    }
                );


                salonId =
                    salonRef.id;


                createSalonSection.classList.add(
                    "hidden"
                );


                const loaded =
                    await loadSalon();


                if (!loaded) {
                    return;
                }


                ownerContent.classList.remove(
                    "hidden"
                );


                listenForBookings();


            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Could not create salon: " +
                    error.message
                );

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "Create Salon";

            }

        }
    );


/* =========================================================
   LOAD SALON
========================================================= */

async function loadSalon() {

    if (!salonId) {

        return false;

    }


    const salonRef =
        doc(
            db,
            "salons",
            salonId
        );


    const salonSnap =
        await getDoc(
            salonRef
        );


    if (!salonSnap.exists()) {

        /*
         * The saved salonId is invalid.
         * Try finding the salon again.
         */

        const recoveredSalonId =
            await findSalonForOwner(
                currentUser.uid
            );


        if (
            recoveredSalonId &&
            recoveredSalonId !== salonId
        ) {

            salonId =
                recoveredSalonId;


            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {

                    salonId:
                        salonId,

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge:
                        true
                }
            );


            return await loadSalon();

        }


        showError(
            "Your salon could not be found."
        );

        return false;

    }


    const salon =
        salonSnap.data();


    /*
     * IMPORTANT SECURITY CHECK.
     *
     * The salon must belong to
     * the currently authenticated owner.
     */

    if (
        salon.ownerId !==
        currentUser.uid
    ) {

        /*
         * Try recovery by ownerId.
         */

        const recoveredSalonId =
            await findSalonForOwner(
                currentUser.uid
            );


        if (
            recoveredSalonId &&
            recoveredSalonId !== salonId
        ) {

            salonId =
                recoveredSalonId;


            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {

                    salonId:
                        salonId,

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge:
                        true
                }
            );


            return await loadSalon();

        }


        throw new Error(
            "This salon does not belong to your owner account."
        );

    }


    /*
     * Repair missing ownerEmail.
     */

    if (
        !salon.ownerEmail &&
        currentUser.email
    ) {

        try {

            await updateDoc(
                salonRef,
                {

                    ownerEmail:
                        currentUser.email,

                    updatedAt:
                        serverTimestamp()

                }
            );

        } catch (error) {

            console.warn(
                "Could not update owner email:",
                error
            );

        }

    }


    document.getElementById(
        "salonTitle"
    ).textContent =
        salon.name ||
        "My Salon";


    document.getElementById(
        "salonInfo"
    ).textContent =
        [
            salon.location ||
                "Location not set",

            salon.hours ||
                "Hours not set"
        ]
        .join(" • ");


    return true;

}


/* =========================================================
   BOOKINGS
========================================================= */

function listenForBookings() {

    if (
        unsubscribeBookings
    ) {

        unsubscribeBookings();

        unsubscribeBookings =
            null;

    }


    if (!salonId) {

        return;

    }


    /*
     * Only query by salonId.
     *
     * We filter today's date locally
     * to avoid requiring a composite
     * Firestore index.
     */

    const q =
        query(
            collection(
                db,
                "bookings"
            ),
            where(
                "salonId",
                "==",
                salonId
            )
        );


    unsubscribeBookings =
        onSnapshot(
            q,

            snapshot => {

                const today =
                    todayZA();


                const bookings =
                    snapshot.docs
                        .map(
                            bookingDoc => ({

                                id:
                                    bookingDoc.id,

                                ...bookingDoc.data()

                            })
                        )
                        .filter(
                            booking =>
                                String(
                                    booking.date ||
                                    ""
                                ) === today
                        );


                bookings.sort(
                    (a, b) =>
                        String(
                            a.time || ""
                        ).localeCompare(
                            String(
                                b.time || ""
                            )
                        )
                );


                renderBookings(
                    bookings
                );

            },

            error => {

                console.error(
                    "Bookings listener error:",
                    error
                );


                bookingsList.innerHTML = `
                    <div class="bg-red-950/40 border border-red-800 rounded-xl p-5">
                        <p class="text-red-400 font-bold">
                            Could not load bookings
                        </p>

                        <p class="text-red-300 text-sm mt-2">
                            ${escapeHtml(error.message)}
                        </p>
                    </div>
                `;

            }
        );

}


/* =========================================================
   RENDER BOOKINGS
========================================================= */

function renderBookings(
    bookings
) {

    bookingCount.textContent =
        String(
            bookings.length
        );


    if (
        bookings.length === 0
    ) {

        bookingsList.innerHTML = `
            <div class="text-center py-12 text-gray-500">
                <div class="text-4xl mb-3">
                    💈
                </div>

                <p>
                    No bookings for today.
                </p>
            </div>
        `;

        return;

    }


    bookingsList.innerHTML =
        "";


    bookings.forEach(
        booking => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "border border-gray-800 bg-gray-950 rounded-xl p-5";


            const status =
                String(
                    booking.status ||
                    "pending"
                );


            card.innerHTML = `

                <div class="flex justify-between items-start gap-3">

                    <div>

                        <h3 class="text-xl font-bold">
                            ${escapeHtml(
                                booking.customerName ||
                                "Customer"
                            )}
                        </h3>

                        <p class="text-gray-400 mt-1">
                            📞 ${escapeHtml(
                                booking.phone ||
                                "No phone"
                            )}
                        </p>

                    </div>


                    <span
                        class="px-3 py-1 rounded-full text-sm font-bold ${statusClass(
                            status
                        )}"
                    >
                        ${escapeHtml(
                            status
                        )}
                    </span>

                </div>


                <div class="mt-4 space-y-2 text-gray-300">

                    <p>
                        ✂️
                        <span class="text-white">
                            ${escapeHtml(
                                booking.service ||
                                "Service"
                            )}
                        </span>
                    </p>


                    <p>
                        💰
                        <span class="text-white">
                            R${formatPrice(
                                booking.price
                            )}
                        </span>
                    </p>


                    <p>
                        🕐
                        <span class="text-white">
                            ${escapeHtml(
                                booking.time ||
                                "--:--"
                            )}
                        </span>
                    </p>

                </div>


                ${
                    status === "pending"
                    ? `

                        <div class="flex gap-2 mt-5">

                            <button
                                class="approve flex-1 bg-green-600 hover:bg-green-700 p-2 rounded-lg font-bold"
                                data-id="${escapeHtml(booking.id)}"
                            >
                                Approve
                            </button>


                            <button
                                class="decline flex-1 bg-red-600 hover:bg-red-700 p-2 rounded-lg font-bold"
                                data-id="${escapeHtml(booking.id)}"
                            >
                                Decline
                            </button>

                        </div>

                    `
                    : ""
                }


                ${
                    status === "approved"
                    ? `

                        <button
                            class="complete w-full mt-5 bg-purple-600 hover:bg-purple-700 p-2 rounded-lg font-bold"
                            data-id="${escapeHtml(booking.id)}"
                        >
                            Mark as Completed
                        </button>

                    `
                    : ""
                }

            `;


            bookingsList.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   BOOKING ACTIONS
========================================================= */

document.addEventListener(
    "click",
    async event => {

        const approve =
            event.target.closest(
                ".approve"
            );


        const decline =
            event.target.closest(
                ".decline"
            );


        const complete =
            event.target.closest(
                ".complete"
            );


        let id =
            null;

        let newStatus =
            null;


        if (approve) {

            id =
                approve.dataset.id;

            newStatus =
                "approved";

        }


        if (decline) {

            id =
                decline.dataset.id;

            newStatus =
                "declined";

        }


        if (complete) {

            id =
                complete.dataset.id;

            newStatus =
                "completed";

        }


        if (
            !id ||
            !newStatus
        ) {

            return;

        }


        try {

            /*
             * Update only the selected booking.
             *
             * Firestore security rules should
             * also verify that this booking
             * belongs to this owner's salon.
             */

            await updateDoc(
                doc(
                    db,
                    "bookings",
                    id
                ),
                {

                    status:
                        newStatus,

                    updatedAt:
                        serverTimestamp()

                }
            );

        } catch (error) {

            console.error(
                "Booking update error:",
                error
            );


            alert(
                "Could not update booking:\n\n" +
                error.message
            );

        }

    }
);


/* =========================================================
   LOGOUT
========================================================= */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async () => {

            try {

                if (
                    unsubscribeBookings
                ) {

                    unsubscribeBookings();

                }


                await signOut(
                    auth
                );


                window.location.href =
                    "index.html";

            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Could not log out: " +
                    error.message
                );

            }

        }
    );


/* =========================================================
   RETRY
========================================================= */

document
    .getElementById("retryBtn")
    .addEventListener(
        "click",
        () => {

            initializeOwnerDashboard();

        }
    );


/* =========================================================
   UI HELPERS
========================================================= */

function showLoading() {

    loading.classList.remove(
        "hidden"
    );

    errorSection.classList.add(
        "hidden"
    );

    createSalonSection.classList.add(
        "hidden"
    );

    ownerContent.classList.add(
        "hidden"
    );

}


function hideLoading() {

    loading.classList.add(
        "hidden"
    );

}


function showError(
    message
) {

    loading.classList.add(
        "hidden"
    );

    createSalonSection.classList.add(
        "hidden"
    );

    ownerContent.classList.add(
        "hidden"
    );

    errorSection.classList.remove(
        "hidden"
    );


    errorMessage.textContent =
        message ||
        "An unknown error occurred.";

}


function statusClass(
    status
) {

    switch (
        status
    ) {

        case "approved":

            return "bg-green-900 text-green-300";


        case "declined":

            return "bg-red-900 text-red-300";


        case "completed":

            return "bg-purple-900 text-purple-300";


        default:

            return "bg-yellow-900 text-yellow-300";

    }

}


function formatPrice(
    value
) {

    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {

        return "0";

    }


    return number.toFixed(
        0
    );

}


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>
