<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="K@si Web Salon Owner Dashboard"
    >

    <title>K@si Web | Owner Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-950 text-white min-h-screen">


<!-- =========================================================
     HEADER
========================================================= -->

<header

>

<!-- =========================================================

========================================================= -->

<main

        >

        </div>

    <!-- =====================================================
         CREATE SALON
    ====================================================== -->

    <section

        class="hidden max-w-xl mx-auto"
    >

        <div

            <div class="text-center mb-6">

                <div class="text-5xl mb-3">
                    💈

                <h2 class="text-2xl font-bold mb-2">
                    Create Your Salon

                <p class="text-gray-400">
                    Your owner account is ready.
                    Connect it to your salon.
                </p>

            </div>


            <label
                for="salonName"

                Salon Name

            <input
                id="salonName"
                type="text"
                autocomplete="organization"

            <label
                for="salonLocation"
                class="block text-sm text-gray-400 mb-2"
            >
                Location
            </label>

            <input
                id="salonLocation"
                type="text"
                placeholder="e.g. Soweto"
                class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
            >


            <label
                for="salonHours"
                class="block text-sm text-gray-400 mb-2"
            >
                Opening Hours
            </label>

            <input
                id="salonHours"
                type="text"
                placeholder="e.g. 06:00 - 18:00"
                class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
            >


            <label
                for="salonImage"
                class="block text-sm text-gray-400 mb-2"
            >
                Salon Image URL
            </label>

            <input
                id="salonImage"
                type="url"
                placeholder="https://..."
                class="w-full p-3 mb-5 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
            >


            <button
                id="createSalonBtn"
                type="button"
                class="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed p-3 rounded-lg font-bold transition"
            >
                Create Salon
            </button>

        </div>

    </section>



    <!-- =====================================================
         OWNER CONTENT
    ====================================================== -->

    <section
        id="ownerContent"
        class="hidden"
    >


        <!-- =================================================
             SALON INFORMATION
        ================================================== -->

        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6"
        >

            <div
                class="flex flex-col md:flex-row md:justify-between md:items-center gap-5"
            >

                <div>

                    <p class="text-sm text-gray-500 mb-1">
                        My Salon
                    </p>


                    <h2
                        id="salonTitle"
                        class="text-3xl font-bold"
                    >
                        My Salon
                    </h2>

                        id="salonInfo"
                        class="text-gray-400 mt-2"
                    ></p>


                    <p
                        id="salonIdDisplay"
                        class="text-xs text-gray-600 mt-2 break-all"
                    ></p>

                </div>


                <div
                    class="bg-gray-800 rounded-xl px-6 py-4 text-center"
                >

                    <p class="text-gray-400 text-sm">
                        Today's bookings
                    </p>


                    <p
                        id="bookingCount"
                        class="text-3xl font-bold"
                    >
                        0
                    </p>

                </div>

            </div>

        </div>



        <!-- =================================================
             BOOKINGS
        ================================================== -->

        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6"
        >

            <div
                class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-5"
            >

                <div>

                    <h2 class="text-2xl font-bold">
                        Today's Bookings
                    </h2>


                    <p
                        id="todayDate"
                        class="text-gray-400"
                    ></p>

                </div>

            </div>


            <div
                id="bookingsList"

            >

                    Loading bookings...
                </div>

            </div>

        </div>


    </section>


</main>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    addDoc,
    collection,
    query,
    where,
    getDocs,
    onSnapshot,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f"

};



/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        app
    );


const db =
    getFirestore(
        app
    );



/* =========================================================
   STATE
========================================================= */

let currentUser =
    null;

let salonId =
    null;

let currentSalon =
    null;

let unsubscribeBookings =
    null;

let dashboardStarted =
    false;



/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );


const errorSection =
    document.getElementById(
        "errorSection"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const createSalonSection =
    document.getElementById(
        "createSalonSection"
    );


const ownerContent =
    document.getElementById(
        "ownerContent"
    );


const bookingsList =
    document.getElementById(
        "bookingsList"
    );


const bookingCount =
    document.getElementById(
        "bookingCount"
    );



/* =========================================================
   SOUTH AFRICA DATE
========================================================= */

function todayZA() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:
                "Africa/Johannesburg",

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit"
        }
    ).format(
        new Date()
    );

}


document.getElementById(
    "todayDate"
).textContent =
    todayZA();



/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        console.log(
            "AUTH STATE:",
            user
                ? user.uid
                : "No user"
        );


        if (!user) {

            currentUser =
                null;

            window.location.replace(
                "owners.html"
            );

            return;

        }


        currentUser =
            user;


        /*
         * Prevent duplicate initialization.
         */

        if (
            dashboardStarted
        ) {

            return;

        }


        dashboardStarted =
            true;


        await initializeOwnerDashboard();

    }
);



/* =========================================================
   INITIALIZE OWNER DASHBOARD
========================================================= */

async function initializeOwnerDashboard() {

    showLoading();


    try {

        if (!currentUser) {

            throw new Error(
                "You are not logged in."
            );

        }


        console.log(
            "Initializing dashboard for:",
            currentUser.uid
        );


        /* -------------------------------------------------
           LOAD USER PROFILE
        ------------------------------------------------- */

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        if (
            !userSnap.exists()
        ) {

            await signOut(
                auth
            );


            window.location.replace(
                "owners.html"
            );


            return;

        }


        const userData =
            userSnap.data();


        console.log(
            "USER DATA:",
            userData
        );


        /* -------------------------------------------------
           OWNER ROLE CHECK
        ------------------------------------------------- */

        const role =
            userData.role ||
            userData.Role ||
            null;


        if (
            role !==
            "salon_owner"
        ) {

            await signOut(
                auth
            );


            window.location.replace(
                "owners.html"
            );


            return;

        }


        /* -------------------------------------------------
           GET SALON ID
        ------------------------------------------------- */

        salonId =
            userData.salonId ||
            null;


        console.log(
            "Salon ID from user:",
            salonId
        );


        /* -------------------------------------------------
           VERIFY EXISTING SALON ID
        ------------------------------------------------- */

        if (
            salonId
        ) {

            const salonRef =
                doc(
                    db,
                    "salons",
                    salonId
                );


            const salonSnap =
                await getDoc(
                    salonRef
                );


            if (
                !salonSnap.exists()
            ) {

                console.warn(
                    "Stored salonId does not exist."
                );


                salonId =
                    null;

            } else {

                const salonData =
                    salonSnap.data();


                /*
                 * Make sure this salon belongs
                 * to the authenticated owner.
                 */

                if (
                    salonData.ownerId !==
                    currentUser.uid
                ) {

                    console.warn(
                        "Stored salon belongs to another owner."
                    );


                    salonId =
                        null;

                }

            }

        }


        /* -------------------------------------------------
           RECOVER SALON BY OWNER ID
        ------------------------------------------------- */

        if (
            !salonId
        ) {

            console.log(
                "Searching salons using ownerId..."
            );


            salonId =
                await findSalonForOwner(
                    currentUser.uid
                );


            if (
                salonId
            ) {

                console.log(
                    "Recovered salon:",
                    salonId
                );


                await setDoc(
                    userRef,
                    {

                        salonId:
                            salonId,

                        role:
                            "salon_owner",

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge:
                            true
                    }
                );

            }

        }


        /* -------------------------------------------------
           NO SALON
        ------------------------------------------------- */

        if (
            !salonId
        ) {

            console.log(
                "Owner has no salon yet."
            );


            hideLoading();


            ownerContent.classList.add(
                "hidden"
            );


            createSalonSection.classList.remove(
                "hidden"
            );


            return;

        }


        /* -------------------------------------------------
           LOAD SALON
        ------------------------------------------------- */

        const loaded =
            await loadSalon();


        if (!loaded) {

            return;

        }


        hideLoading();


        createSalonSection.classList.add(
            "hidden"
        );


        ownerContent.classList.remove(
            "hidden"
        );


        /*
         * Start realtime bookings.
         */

        listenForBookings();

    } catch (error) {

        console.error(
            "Dashboard initialization error:",
            error
        );


        showError(
            error.message
        );

    }

}



/* =========================================================
   FIND SALON FOR OWNER
========================================================= */

async function findSalonForOwner(
    ownerId
) {

    try {

        const q =
            query(
                collection(
                    db,
                    "salons"
                ),
                where(
                    "ownerId",
                    "==",
                    ownerId
                )
            );


        const snapshot =
            await getDocs(
                q
            );


        console.log(
            "Owner salon query results:",
            snapshot.size
        );


        if (
            snapshot.empty
        ) {

            return null;

        }


        /*
         * Find the first valid salon.
         */

        for (
            const salonDoc of snapshot.docs
        ) {

            const data =
                salonDoc.data();


            if (
                data.ownerId ===
                ownerId
            ) {

                return salonDoc.id;

            }

        }


        return null;

    } catch (error) {

        console.error(
            "Salon lookup failed:",
            error
        );


        /*
         * Return null so a new owner can
         * still access Create Salon.
         */

        return null;

    }

}



/* =========================================================
   CREATE SALON
========================================================= */

document
    .getElementById(
        "createSalonBtn"
    )
    .addEventListener(
        "click",
        createSalon
    );


async function createSalon() {

    if (
        !currentUser
    ) {

        alert(
            "You are not logged in."
        );

        return;

    }


    const name =
        document
            .getElementById(
                "salonName"
            )
            .value
            .trim();


    const location =
        document
            .getElementById(
                "salonLocation"
            )
            .value
            .trim();


    const hours =
        document
            .getElementById(
                "salonHours"
            )
            .value
            .trim();


    const image =
        document
            .getElementById(
                "salonImage"
            )
            .value
            .trim();


    if (
        !name
    ) {

        alert(
            "Please enter your salon name."
        );

        return;

    }


    if (
        !location
    ) {

        alert(
            "Please enter your salon location."
        );

        return;

    }


    const button =
        document.getElementById(
            "createSalonBtn"
        );


    button.disabled =
        true;

    button.textContent =
        "Creating salon...";


    try {

        /* -------------------------------------------------
           CHECK AGAIN BEFORE CREATE
        ------------------------------------------------- */

        const existingSalon =
            await findSalonForOwner(
                currentUser.uid
            );


        if (
            existingSalon
        ) {

            salonId =
                existingSalon;

        } else {

            /* ---------------------------------------------
               CREATE SALON DOCUMENT
            ---------------------------------------------- */

            const salonRef =
                await addDoc(
                    collection(
                        db,
                        "salons"
                    ),
                    {

                        ownerId:
                            currentUser.uid,

                        ownerEmail:
                            currentUser.email ||
                            "",

                        name:
                            name,

                        location:
                            location,

                        hours:
                            hours ||
                            "06:00 - 18:00",

                        image:
                            image ||
                            "",

                        services: [

                            {
                                name:
                                    "Basic Cut",

                                price:
                                    80
                            },

                            {
                                name:
                                    "Fade",

                                price:
                                    120
                            },

                            {
                                name:
                                    "Beard Trim",

                                price:
                                    80
                            }

                        ],

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );


            salonId =
                salonRef.id;

        }


        /* -------------------------------------------------
           CONNECT USER TO SALON
        ------------------------------------------------- */

        await setDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {

                email:
                    currentUser.email ||
                    "",

                role:
                    "salon_owner",

                salonId:
                    salonId,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:
                    true
            }
        );


        console.log(
            "Salon connected:",
            salonId
        );


        /* -------------------------------------------------
           LOAD NEW SALON
        ------------------------------------------------- */

        const loaded =
            await loadSalon();


        if (
            !loaded
        ) {

            return;

        }


        createSalonSection.classList.add(
            "hidden"
        );


        ownerContent.classList.remove(
            "hidden"
        );


        listenForBookings();


    } catch (error) {

        console.error(
            "Create salon error:",
            error
        );


        alert(
            "Could not create/connect your salon.\n\n" +
            error.message
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "Create Salon";

    }

}



/* =========================================================
   LOAD SALON
========================================================= */

async function loadSalon() {

    if (
        !salonId ||
        !currentUser
    ) {

        return false;

    }


    console.log(
        "Loading salon:",
        salonId
    );


    const salonRef =
        doc(
            db,
            "salons",
            salonId
        );


    const salonSnap =
        await getDoc(
            salonRef
        );


    if (
        !salonSnap.exists()
    ) {

        console.warn(
            "Salon document does not exist."
        );


        salonId =
            null;


        return false;

    }


    const salonData =
        salonSnap.data();


    console.log(
        "SALON DATA:",
        salonData
    );


    /*
     * Verify ownership.
     */

    if (
        salonData.ownerId !==
        currentUser.uid
    ) {

        throw new Error(
            "This salon does not belong to your owner account."
        );

    }


    currentSalon =
        {
            id:
                salonSnap.id,

            ...salonData
        };


    /*
     * Display salon information.
     */

    document.getElementById(
        "salonTitle"
    ).textContent =
        salonData.name ||
        "My Salon";


    document.getElementById(
        "salonInfo"
    ).textContent =
        [
            salonData.location ||
                "Location not set",

            salonData.hours ||
                "Hours not set"
        ].join(
            " • "
        );


    document.getElementById(
        "salonIdDisplay"
    ).textContent =
        "Salon ID: " +
        salonSnap.id;


    return true;

}



/* =========================================================
   BOOKINGS LISTENER
========================================================= */

function listenForBookings() {

    if (
        unsubscribeBookings
    ) {

        unsubscribeBookings();

        unsubscribeBookings =
            null;

    }


    if (
        !salonId
    ) {

        bookingsList.innerHTML = `
            <div class="text-gray-500">
                No salon connected.
            </div>
        `;

        return;

    }


    console.log(
        "Listening for bookings for salon:",
        salonId
    );


    /*
     * We query ONLY by salonId.
     *
     * Today's date is filtered in JavaScript.
     * This avoids needing a composite Firestore index.
     */

    const bookingsQuery =
        query(
            collection(
                db,
                "bookings"
            ),
            where(
                "salonId",
                "==",
                salonId
            )
        );


    unsubscribeBookings =
        onSnapshot(
            bookingsQuery,

            snapshot => {

                console.log(
                    "Bookings received:",
                    snapshot.size
                );


                const today =
                    todayZA();


                const bookings =
                    snapshot.docs
                        .map(
                            bookingDoc => ({

                                id:
                                    bookingDoc.id,

                                ...bookingDoc.data()

                            })
                        )
                        .filter(
                            booking => {

                                return String(
                                    booking.date ||
                                    ""
                                ) === today;

                            }
                        );


                /*
                 * Sort by time.
                 */

                bookings.sort(
                    (
                        a,
                        b
                    ) => {

                        return String(
                            a.time ||
                            ""
                        ).localeCompare(
                            String(
                                b.time ||
                                ""
                            )
                        );

                    }
                );


                renderBookings(
                    bookings
                );

            },

            error => {

                console.error(
                    "Bookings listener error:",
                    error
                );


                bookingsList.innerHTML = `

                    <div
                        class="bg-red-950/40 border border-red-800 rounded-xl p-5"
                    >

                        <p class="text-red-400 font-bold">
                            Could not load bookings
                        </p>

                        <p class="text-red-300 text-sm mt-2 break-words">
                            ${escapeHtml(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }
        );

}



/* =========================================================
   RENDER BOOKINGS
========================================================= */

function renderBookings(
    bookings
) {

    bookingCount.textContent =
        String(
            bookings.length
        );


    if (
        bookings.length === 0
    ) {

        bookingsList.innerHTML = `

            <div
                class="text-center py-12 text-gray-500"
            >

                <div class="text-5xl mb-3">
                    💈
                </div>

                <p>
                    No bookings for today.
                </p>

            </div>

        `;

        return;

    }


    bookingsList.innerHTML =
        "";


    bookings.forEach(
        booking => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "border border-gray-800 bg-gray-950 rounded-xl p-5";


            const status =
                String(
                    booking.status ||
                    "pending"
                ).toLowerCase();


            card.innerHTML = `

                <div
                    class="flex justify-between items-start gap-3"
                >

                    <div>

                        <h3
                            class="text-xl font-bold"
                        >
                            ${escapeHtml(
                                booking.customerName ||
                                "Customer"
                            )}
                        </h3>


                        <p
                            class="text-gray-400 mt-1"
                        >
                            📞
                            ${escapeHtml(
                                booking.phone ||
                                "No phone number"
                            )}
                        </p>

                    </div>


                    <span
                        class="shrink-0 px-3 py-1 rounded-full text-sm font-bold ${statusClass(
                            status
                        )}"
                    >
                        ${escapeHtml(
                            status
                        )}
                    </span>

                </div>


                <div
                    class="mt-4 space-y-2 text-gray-300"
                >

                    <p>
                        ✂️
                        <span class="text-white">
                            ${escapeHtml(
                                booking.service ||
                                "Service not specified"
                            )}
                        </span>
                    </p>


                    <p>
                        💰
                        <span class="text-white">
                            R${formatPrice(
                                booking.price
                            )}
                        </span>
                    </p>


                    <p>
                        🕐
                        <span class="text-white">
                            ${escapeHtml(
                                booking.time ||
                                "--:--"
                            )}
                        </span>
                    </p>

                </div>


                ${
                    status === "pending"
                    ? `

                        <div
                            class="flex flex-col sm:flex-row gap-2 mt-5"
                        >

                            <button
                                type="button"
                                class="approve flex-1 bg-green-600 hover:bg-green-700 p-3 rounded-lg font-bold transition"
                                data-id="${escapeHtml(
                                    booking.id
                                )}"
                            >
                                ✓ Approve
                            </button>


                            <button
                                type="button"
                                class="decline flex-1 bg-red-600 hover:bg-red-700 p-3 rounded-lg font-bold transition"
                                data-id="${escapeHtml(
                                    booking.id
                                )}"
                            >
                                ✕ Decline
                            </button>

                        </div>

                    `
                    : ""
                }


                ${
                    status === "approved"
                    ? `

                        <button
                            type="button"
                            class="complete w-full mt-5 bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold transition"
                            data-id="${escapeHtml(
                                booking.id
                            )}"
                        >
                            ✓ Mark as Completed
                        </button>

                    `
                    : ""
                }

            `;


            bookingsList.appendChild(
                card
            );

        }
    );

}



/* =========================================================
   BOOKING ACTIONS
========================================================= */

document.addEventListener(
    "click",
    async event => {

        const approveButton =
            event.target.closest(
                ".approve"
            );


        const declineButton =
            event.target.closest(
                ".decline"
            );


        const completeButton =
            event.target.closest(
                ".complete"
            );


        let button =
            null;

        let bookingId =
            null;

        let newStatus =
            null;


        if (
            approveButton
        ) {

            button =
                approveButton;

            bookingId =
                approveButton.dataset.id;

            newStatus =
                "approved";

        }


        if (
            declineButton
        ) {

            button =
                declineButton;

            bookingId =
                declineButton.dataset.id;

            newStatus =
                "declined";

        }


        if (
            completeButton
        ) {

            button =
                completeButton;

            bookingId =
                completeButton.dataset.id;

            newStatus =
                "completed";

        }


        if (
            !button ||
            !bookingId ||
            !newStatus
        ) {

            return;

        }


        /*
         * Disable button immediately to prevent
         * duplicate clicks.
         */

        button.disabled =
            true;

        button.classList.add(
            "opacity-50"
        );


        try {

            /*
             * First verify the booking belongs
             * to this salon.
             */

            const bookingRef =
                doc(
                    db,
                    "bookings",
                    bookingId
                );


            const bookingSnap =
                await getDoc(
                    bookingRef
                );


            if (
                !bookingSnap.exists()
            ) {

                throw new Error(
                    "This booking no longer exists."
                );

            }


            const booking =
                bookingSnap.data();


            if (
                booking.salonId !==
                salonId
            ) {

                throw new Error(
                    "This booking does not belong to your salon."
                );

            }


            /*
             * Update status.
             */

            await updateDoc(
                bookingRef,
                {

                    status:
                        newStatus,

                    updatedAt:
                        serverTimestamp()

                }
            );


            console.log(
                "Booking updated:",
                bookingId,
                newStatus
            );

        } catch (error) {

            console.error(
                "Booking update error:",
                error
            );


            alert(
                "Could not update booking.\n\n" +
                error.message
            );


            button.disabled =
                false;

            button.classList.remove(
                "opacity-50"
            );

        }

    }
);



/* =========================================================
   LOGOUT
========================================================= */

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async () => {

            const button =
                document.getElementById(
                    "logoutBtn"
                );


            button.disabled =
                true;

            button.textContent =
                "Logging out...";


            try {

                if (
                    unsubscribeBookings
                ) {

                    unsubscribeBookings();

                    unsubscribeBookings =
                        null;

                }


                sessionStorage.removeItem(
                    "ownerUid"
                );


                sessionStorage.removeItem(
                    "ownerSalonId"
                );


                sessionStorage.removeItem(
                    "justLoggedIn"
                );


                await signOut(
                    auth
                );


                window.location.replace(
                    "index.html"
                );

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );


                alert(
                    "Could not log out.\n\n" +
                    error.message
                );


                button.disabled =
                    false;

                button.textContent =
                    "Logout";

            }

        }
    );

) {

        "hidden"
    );


    createSalonSection.classList.add(

/* =========================================================
   STATUS STYLE
========================================================= */

function statusClass(
    status
) {

    switch (
        status
    ) {

        case "approved":

            return (
                "bg-green-900 text-green-300"
            );


        case "declined":

            return (
                "bg-red-900 text-red-300"
            );


        case "completed":

            return (
                "bg-purple-900 text-purple-300"
            );


        case "cancelled":

            return (
                "bg-gray-700 text-gray-300"
            );


        default:

            return (
                "bg-yellow-900 text-yellow-300"
            );

    }

}



/* =========================================================
   PRICE FORMAT
========================================================= */

function formatPrice(
    value
) {

    const number =
        Number(
            value
        );


    if (
        Number.isNaN(number)
    ) {

        return "0";

    }


    return number.toFixed(
        0
    );

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
