<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>K@si Web | Salon Owner</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-950 text-white min-h-screen">


<header class="bg-gray-900 border-b border-gray-800">

    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">

        <h1 class="text-2xl font-bold">
            💈 K@si Web
        </h1>

        <a
            href="index.html"
            class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg"
        >
            Home
        </a>

    </div>

</header>


<main class="max-w-md mx-auto px-4 py-10">


    <!-- LOGIN -->

    <section
        id="loginSection"
        class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl"
    >

        <h2 class="text-3xl font-bold mb-2">
            Salon Owner Login
        </h2>

        <p class="text-gray-400 mb-6">
            Login to manage your salon and bookings.
        </p>


        <div
            id="loginError"
            class="hidden bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg mb-4"
        ></div>


        <label class="block text-sm text-gray-400 mb-2">
            Email
        </label>

        <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="owner@example.com"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label class="block text-sm text-gray-400 mb-2">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <button
            id="loginBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-bold"
        >
            Login
        </button>


        <p class="text-center text-gray-500 text-sm mt-6">
            Don't have an owner account?
        </p>


        <button
            id="showRegisterBtn"
            class="w-full mt-3 bg-gray-800 hover:bg-gray-700 p-3 rounded-lg"
        >
            Create Owner Account
        </button>

    </section>


    <!-- REGISTER -->

    <section
        id="registerSection"
        class="hidden bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl"
    >

        <h2 class="text-3xl font-bold mb-2">
            Create Owner Account
        </h2>

        <p class="text-gray-400 mb-6">
            Create your salon owner account.
        </p>


        <div
            id="registerError"
            class="hidden bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg mb-4"
        ></div>


        <label class="block text-sm text-gray-400 mb-2">
            Email
        </label>

        <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            placeholder="owner@example.com"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label class="block text-sm text-gray-400 mb-2">
            Password
        </label>

        <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label class="block text-sm text-gray-400 mb-2">
            Confirm Password
        </label>

        <input
            id="registerConfirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat password"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <button
            id="registerBtn"
            class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold"
        >
            Create Owner Account
        </button>


        <button
            id="showLoginBtn"
            class="w-full mt-3 bg-gray-800 hover:bg-gray-700 p-3 rounded-lg"
        >
            Back to Login
        </button>

    </section>


    <!-- LOADING -->

    <div
        id="pageLoading"
        class="hidden text-center mt-6 text-gray-400"
    >
        Checking account...
    </div>


</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    query,
    collection,
    where,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   ELEMENTS
========================================================= */

const loginSection =
    document.getElementById("loginSection");

const registerSection =
    document.getElementById("registerSection");

const loginBtn =
    document.getElementById("loginBtn");

const registerBtn =
    document.getElementById("registerBtn");

const loginError =
    document.getElementById("loginError");

const registerError =
    document.getElementById("registerError");

const pageLoading =
    document.getElementById("pageLoading");


/* =========================================================
   SHOW LOGIN
========================================================= */

document
    .getElementById("showLoginBtn")
    .addEventListener("click", () => {

        registerSection.classList.add("hidden");

        loginSection.classList.remove("hidden");

        clearErrors();

    });


/* =========================================================
   SHOW REGISTER
========================================================= */

document
    .getElementById("showRegisterBtn")
    .addEventListener("click", () => {

        loginSection.classList.add("hidden");

        registerSection.classList.remove("hidden");

        clearErrors();

    });


/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
    "click",
    async () => {

        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("loginPassword")
                .value;


        clearErrors();


        if (!email || !password) {

            showLoginError(
                "Please enter your email and password."
            );

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";


        try {

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(userRef);


            /*
             * If there is no users document,
             * do not allow an ordinary customer
             * to enter the owner dashboard.
             */

            if (!userSnap.exists()) {

                await signOut(auth);

                showLoginError(
                    "This account is not registered as a salon owner."
                );

                return;
            }


            const userData =
                userSnap.data();


            if (
                userData.role !==
                "salon_owner"
            ) {

                await signOut(auth);

                showLoginError(
                    "This account is not a salon owner."
                );

                return;
            }


            /*
             * Find the owner's salon if salonId
             * is missing from the user document.
             */

            let foundSalonId =
                userData.salonId || null;


            if (!foundSalonId) {

                foundSalonId =
                    await findSalonForOwner(
                        user.uid
                    );


                if (foundSalonId) {

                    await setDoc(
                        userRef,
                        {
                            salonId:
                                foundSalonId,

                            updatedAt:
                                serverTimestamp()
                        },
                        {
                            merge: true
                        }
                    );

                }

            }


            sessionStorage.setItem(
                "justLoggedIn",
                "true"
            );


            window.location.href =
                "ownerdashboard.html";


        } catch (error) {

            console.error(
                "Owner login error:",
                error
            );

            showLoginError(
                getFirebaseErrorMessage(
                    error
                )
            );

        } finally {

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login";

        }

    }
);


/* =========================================================
   REGISTER
========================================================= */

registerBtn.addEventListener(
    "click",
    async () => {

        const email =
            document
                .getElementById("registerEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("registerPassword")
                .value;

        const confirmPassword =
            document
                .getElementById(
                    "registerConfirmPassword"
                )
                .value;


        clearErrors();


        if (!email || !password || !confirmPassword) {

            showRegisterError(
                "Please complete all fields."
            );

            return;
        }


        if (password.length < 6) {

            showRegisterError(
                "Password must contain at least 6 characters."
            );

            return;
        }


        if (
            password !==
            confirmPassword
        ) {

            showRegisterError(
                "Passwords do not match."
            );

            return;
        }


        registerBtn.disabled = true;

        registerBtn.textContent =
            "Creating account...";


        try {

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            /*
             * Create owner profile.
             */

            await setDoc(
                doc(
                    db,
                    "users",
                    user.uid
                ),
                {

                    email:
                        email,

                    role:
                        "salon_owner",

                    salonId:
                        null,

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );


            /*
             * New owner has no salon yet.
             * Dashboard will show Create Salon.
             */

            window.location.href =
                "ownerdashboard.html";


        } catch (error) {

            console.error(
                "Owner registration error:",
                error
            );

            showRegisterError(
                getFirebaseErrorMessage(
                    error
                )
            );

        } finally {

            registerBtn.disabled = false;

            registerBtn.textContent =
                "Create Owner Account";

        }

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {
            return;
        }


        /*
         * If an owner is already logged in,
         * take them directly to dashboard.
         */

        try {

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (
                userSnap.exists() &&
                userSnap.data().role ===
                "salon_owner"
            ) {

                window.location.href =
                    "ownerdashboard.html";

            }

        } catch (error) {

            console.error(
                error
            );

        }

    }
);


/* =========================================================
   FIND SALON FOR OWNER
========================================================= */

async function findSalonForOwner(
    ownerId
) {

    try {

        const q =
            query(
                collection(
                    db,
                    "salons"
                ),
                where(
                    "ownerId",
                    "==",
                    ownerId
                )
            );


        const snapshot =
            await getDocs(q);


        if (
            snapshot.empty
        ) {

            return null;

        }


        return snapshot.docs[0].id;

    } catch (error) {

        console.error(
            "Could not find salon:",
            error
        );

        return null;

    }

}


/* =========================================================
   ERROR HELPERS
========================================================= */

function clearErrors() {

    loginError.classList.add(
        "hidden"
    );

    registerError.classList.add(
        "hidden"
    );

    loginError.textContent =
        "";

    registerError.textContent =
        "";

}


function showLoginError(
    message
) {

    loginError.textContent =
        message;

    loginError.classList.remove(
        "hidden"
    );

}


function showRegisterError(
    message
) {

    registerError.textContent =
        message;

    registerError.classList.remove(
        "hidden"
    );

}


function getFirebaseErrorMessage(
    error
) {

    switch (
        error.code
    ) {

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/user-not-found":
            return "No account was found with this email.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/email-already-in-use":
            return "An account with this email already exists.";

        case "auth/weak-password":
            return "Password is too weak. Use at least 6 characters.";

        case "auth/network-request-failed":
            return "Network error. Check your internet connection.";

        case "auth/too-many-requests":
            return "Too many login attempts. Please try again later.";

        default:
            return error.message ||
                "Something went wrong. Please try again.";

    }

}

</script>

</body>
    </html>
