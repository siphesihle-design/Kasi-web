<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Admin Dashboard</title>
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css?v=21">
    <style>
       .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; margin-bottom:20px; }
       .stat-card { text-align:center; padding:20px; }
       .stat-card h3 { font-size:2.2rem; color:#7B68EE; margin:0 0 5px 0; }
       .stat-card p { color:#B0B0D0; margin:0; }
        table { width:100%; border-collapse:collapse; font-size:0.9rem; }
        th, td { padding:12px; text-align:left; border-bottom:1px solid rgba(123,104,238,0.2); }
        th { color:#7B68EE; }
       .status-pill { padding:5px 10px; border-radius:20px; font-size:0.75rem; font-weight:700; }
       .status-pending { background:rgba(255,165,0,0.2); color:#FFA500; }
       .status-approved { background:rgba(0,200,83,0.2); color:#00c853; }
       .status-completed { background:rgba(123,104,238,0.2); color:#7B68EE; }
       .status-declined { background:rgba(255,71,87,0.2); color:#ff4757; }
       .deleteBtn { background:#ff4757; border:none; color:white; padding:6px 10px; border-radius:8px; cursor:pointer; }
       .deleteBtn:hover { opacity:0.8; }
    </style>
</head>
<body>
    <header class="header">
        <h1 id="dashboardTitle"><i class='bx bx-shield'></i> Admin Dashboard</h1>
        <nav>
            <a href="home.html" class="nav-item" id="homeBtn"><i class='bx bx-home-alt'></i><span>Home</span></a>
            <a href="#" id="logoutBtn" class="nav-item"><i class='bx bx-log-out'></i><span>Logout</span></a>
        </nav>
    </header>

    <div class="container">
        <div id="loadingScreen" class="glass-card" style="text-align:center; padding:40px;">
            <i class='bx bx-loader-circle bx-spin' style="font-size:2rem; color:#7B68EE;"></i>
            <p>Loading Dashboard...</p>
        </div>

        <div id="adminContent" style="display:none;">
            <!-- STATS -->
            <div class="stats-grid">
                <div class="glass-card stat-card"><h3 id="totalBookings">0</h3><p>Total Today</p></div>
                <div class="glass-card stat-card"><h3 id="pendingBookings">0</h3><p>Pending</p></div>
                <div class="glass-card stat-card"><h3 id="completedBookings">0</h3><p>Completed</p></div>
                <div class="glass-card stat-card"><h3 id="totalRevenue">R0</h3><p>Revenue</p></div>
            </div>

            <!-- BOOKINGS TABLE -->
            <div class="glass-card">
                <h2>All Bookings Today</h2>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Salon</th>
                                <th>Service</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="allBookingsTable">
                            <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
        authDomain: "kasi-web-d073f.firebaseapp.com",
        projectId: "kasi-web-d073f",
        appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let redirecting = false;

    // GUARD
    onAuthStateChanged(auth, async (user) => {
        if (!user &&!redirecting) { redirecting = true; window.location.href = 'index.html'; return; }

        const userSnap = await getDoc(doc(db, "users", user.uid));
        if (!userSnap.exists() || userSnap.data().role!== 'admin') { 
            if(!redirecting) { redirecting = true; window.location.href = 'index.html'; } 
            return; 
        }

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadAdminData();
    });

    function loadAdminData() {
        const today = new Date().toISOString().split('T')[0];
        const q = query(collection(db, "bookings"), where("date", "==", today), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            const table = document.getElementById('allBookingsTable');
            table.innerHTML = "";

            let total = 0, pending = 0, completed = 0, revenue = 0;

            if(snapshot.empty) {
                table.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No bookings for today</td></tr>`;
            }

            snapshot.forEach(docSnap => {
                const b = docSnap.data();
                total++;
                if(b.status === 'pending') pending++;
                if(b.status === 'completed') { completed++; revenue += Number(b.price) || 0; }

                const statusClass = `status-${b.status}`;

                table.innerHTML += `
                <tr>
                    <td><strong>${b.name}</strong><br><small style="color:#B0B0D0;">${b.phone}</small></td>
                    <td>${b.salon}</td>
                    <td>${b.service} <br><small>R${b.price}</small></td>
                    <td>${b.time}</td>
                    <td><span class="status-pill ${statusClass}">${b.status.toUpperCase()}</span></td>
                    <td><button class="deleteBtn" data-id="${docSnap.id}"><i class='bx bx-trash'></i></button></td>
                </tr>`;
            });

            document.getElementById('totalBookings').textContent = total;
            document.getElementById('pendingBookings').textContent = pending;
            document.getElementById('completedBookings').textContent = completed;
            document.getElementById('totalRevenue').textContent = `R${revenue}`;
        });
    }

    // DELETE BOOKING
    document.addEventListener('click', async (e) => {
        const delBtn = e.target.closest('.deleteBtn');
        if(delBtn) {
            if(confirm("Delete this booking?")) {
                await deleteDoc(doc(db, "bookings", delBtn.dataset.id));
            }
        }
    });

    // BUTTONS
    document.getElementById('homeBtn').onclick = () => { window.location.href = 'home.html'; }
    document.getElementById('logoutBtn').onclick = () => { signOut(auth).then(() => { window.location.href = 'index.html' }) }
</script>
</body>
</html>
