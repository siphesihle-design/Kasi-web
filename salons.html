<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#111827">

    <title>K@si Web | Salons</title>

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            padding-bottom: 95px;
        }

        .nav-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 72px;

            background: rgba(17, 24, 39, 0.97);
            backdrop-filter: blur(16px);

            border-top: 1px solid rgba(75, 85, 99, 0.45);

            display: flex;
            justify-content: space-around;
            align-items: center;

            z-index: 9998;

            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            width: 90px;
            height: 62px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: #9ca3af;

            text-decoration: none;

            font-size: 0.78rem;
            font-weight: 700;

        .salon-card {

        .salon-card:hover {

</head>


<body class="bg-gray-950 text-white min-h-screen">


<!-- =========================================================

========================================================= -->

<header class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur border-b border-gray-800">

        <h1 class="text-2xl font-bold flex items-center gap-2">

        </h1>

        <div class="flex gap-2">

            <a

<!-- =========================================================

<main class="max-w-7xl mx-auto px-4 py-8">

<!-- =========================================================
     BOOKING MODAL
========================================================= -->

<div
    id="bookingModal"
    class="hidden fixed inset-0 z-[10000] bg-black/80
           flex items-center justify-center p-4"
>

    <div
        class="bg-gray-900 border border-gray-700
               rounded-2xl p-6 w-full max-w-md
               max-h-[90vh] overflow-y-auto shadow-2xl"
    >

        <h2 class="text-2xl font-bold mb-1">

        <p
            id="selectedSalonName"

        ></p>


        <!-- NAME -->

        <label class="block text-xs font-semibold text-gray-400 mb-1">

        <input

            placeholder="e.g. Siphesihle"

        <!-- SERVICE -->

        <select

                   bg-gray-800 border border-gray-700
                   outline-none focus:border-purple-500"
        >

            <option value="">
                Choose service
            </option>

        </select>


        <!-- DATE / TIME -->

        <div class="grid grid-cols-2 gap-3 mb-5">

            <div>

                <label class="block text-xs font-semibold text-gray-400 mb-1">
                    Date
                </label>

                <input
                    id="bookingDate"
                    type="date"
                    class="w-full p-3 rounded-lg
                           bg-gray-800 border border-gray-700

            </div>


            <div>

                <label class="block text-xs font-semibold text-gray-400 mb-1">
                    Time
                </label>

                <input
                    id="bookingTime"
                    type="time"
                    class="w-full p-3 rounded-lg
                           bg-gray-800 border border-gray-700
                           outline-none focus:border-purple-500"
                >

            </div>

        </div>


        <!-- BUTTONS -->

        <div class="flex gap-3">

            <button
                id="confirmBooking"
                class="flex-1 bg-gradient-to-r
                       from-purple-600 to-blue-600
                       hover:from-purple-700 hover:to-blue-700
                       p-3 rounded-lg font-bold
                       disabled:opacity-50"
            >
                Confirm
            </button>

            <button
                id="cancelBooking"
                class="flex-1 bg-gray-800
                       hover:bg-gray-700
                       p-3 rounded-lg font-semibold"

                Cancel

        </div>

</div>



<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<div class="nav-grid">

    <a href="index.html" class="nav-item">

        </span>

    <a href="home.html" class="nav-item">

        <span>

    </a>


    <a href="salons.html" class="nav-item active">

        <i class="bx bx-cut"></i>

        <span>
            Salons
        </span>

    </a>

</div>



<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f"

};



/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



/* =========================================================
   YOUR EXISTING SALON
========================================================= */

const KNOWN_SALON_ID =
    "OleEsl79wihSXIHynsVw";


const KNOWN_OWNER_ID =
    "prgctpY58cVmPocgLuSRLRMajOI2";



/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let selectedSalon = null;



const salonsList =
    document.getElementById("salonsList");


const loginStatus =
    document.getElementById("loginStatus");


const firestoreStatus =
    document.getElementById("firestoreStatus");


const logoutBtn =
    document.getElementById("logoutBtn");


const modal =
    document.getElementById("bookingModal");


const serviceSelect =
    document.getElementById("serviceSelect");


const confirmBooking =
    document.getElementById("confirmBooking");



/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(auth, user => {

    currentUser = user || null;


    if (user) {

        loginStatus.innerHTML = `
            👋 Logged in as
            <b class="text-purple-400">
                ${escapeHtml(user.email || "User")}
            </b>
        `;

        logoutBtn.classList.remove("hidden");

    } else {

        loginStatus.innerHTML = `
            ⚠️
            <span class="text-yellow-400">
                Login is required before booking.
            </span>
        `;

        logoutBtn.classList.add("hidden");

    }

});



/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async () => {

    try {

        await signOut(auth);

        window.location.href = "index.html";

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }

});



/* =========================================================
   LOAD SALONS
========================================================= */

async function loadSalons() {

    salonsList.innerHTML = `
        <div class="text-center col-span-full text-gray-400 py-10">

            <i class="bx bx-loader-alt bx-spin text-3xl"></i>

            <p class="mt-3">
                Loading salons...
            </p>

        </div>
    `;


    firestoreStatus.classList.add("hidden");


    try {

        console.log(
            "K@si Web: Reading salons collection..."
        );


        const salonsCollection =
            collection(db, "salons");


        const snapshot =
            await getDocs(salonsCollection);


        console.log(
            "Firestore salons count:",
            snapshot.size
        );


        salonsList.innerHTML = "";


        /* =====================================================
           NO DOCUMENTS
        ===================================================== */

        if (snapshot.empty) {

            console.warn(
                "Firestore returned no salon documents."
            );


            salonsList.innerHTML = `

                <div class="
                    col-span-full
                    text-center
                    py-16
                ">

                    <i class="
                        bx bx-store
                        text-6xl
                        text-gray-700
                    "></i>

                    <h3 class="
                        text-2xl
                        font-bold
                        text-gray-300
                        mt-4
                    ">
                        No salons registered yet
                    </h3>

                    <p class="
                        text-gray-500
                        mt-2
                    ">
                        The salons collection is empty.
                    </p>

                </div>

            `;

            return;
        }



        /* =====================================================
           LOOP THROUGH EVERY SALON
        ===================================================== */

        let displayed = 0;


        snapshot.forEach(salonDoc => {

            const id =
                salonDoc.id;


            const salon =
                salonDoc.data();


            console.log(
                "Salon found:",
                id,
                salon
            );


            if (!salon) {
                return;
            }


            renderSalon(
                id,
                salon
            );


            displayed++;

        });



        /* =====================================================
           NOTHING VALID
        ===================================================== */

        if (displayed === 0) {

            salonsList.innerHTML = `

                <div class="
                    col-span-full
                    text-center
                    text-gray-400
                    py-10
                ">

                    No valid salon documents found.

                </div>

            `;

        }

    }

    catch (error) {

        console.error(
            "Firestore salons error:",
            error
        );


        salonsList.innerHTML = `

            <div class="
                col-span-full
                text-center
                py-12
            ">

                <i class="
                    bx bx-error-circle
                    text-5xl
                    text-red-500
                "></i>

                <h3 class="
                    text-xl
                    font-bold
                    text-red-400
                    mt-3
                ">
                    Could not load salons
                </h3>

                <p class="
                    text-gray-400
                    text-sm
                    mt-2
                ">
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;

    }

}



/* =========================================================
   RENDER SALON
========================================================= */

function renderSalon(id, salon) {

    const salonId =
        id;


    const ownerId =
        salon.ownerId ||
        salon.OwnerId ||
        (
            salonId === KNOWN_SALON_ID
                ? KNOWN_OWNER_ID
                : ""
        );


    const services =
        Array.isArray(salon.services)
            ? salon.services
            : [];


    const image =
        salon.image ||
        "https://via.placeholder.com/800x450?text=Kasi+Salon";


    const card =
        document.createElement("div");


    card.className = `
        salon-card
        bg-gray-900
        border
        border-gray-800
        rounded-2xl
        overflow-hidden
        shadow-xl
        flex
        flex-col
        justify-between
    `;


    card.innerHTML = `

        <div>

            <img
                src="${escapeHtml(image)}"
                class="salon-image"
                alt="${escapeHtml(
                    salon.name || "Kasi Salon"
                )}"
                onerror="
                    this.src='https://via.placeholder.com/800x450?text=Kasi+Salon'
                "
            >


            <div class="p-5">

                <h3 class="
                    text-2xl
                    font-bold
                    mb-3
                ">
                    ${escapeHtml(
                        salon.name ||
                        "Kasi Salon"
                    )}
                </h3>


                <p class="
                    text-gray-400
                    mb-2
                    flex
                    items-center
                    gap-2
                ">

                    <i class="
                        bx bx-map
                        text-purple-400
                    "></i>

                    ${escapeHtml(
                        salon.location ||
                        "Location not provided"
                    )}

                </p>


                <p class="
                    text-gray-400
                    mb-4
                    flex
                    items-center
                    gap-2
                ">

                    <i class="
                        bx bx-time
                        text-purple-400
                    "></i>

                    ${escapeHtml(
                        salon.hours ||
                        "Hours not provided"
                    )}

                </p>


                ${
                    services.length > 0

                    ?

                    `
                    <div class="mb-4">

                        <p class="
                            text-purple-400
                            font-semibold
                            text-sm
                            mb-2
                        ">
                            ${services.length}
                            service${services.length === 1 ? "" : "s"}
                            available
                        </p>


                        <div class="
                            flex
                            flex-wrap
                            gap-2
                        ">

                            ${
                                services
                                .slice(0, 5)
                                .map(service => {

                                    if (
                                        !service ||
                                        typeof service !== "object"
                                    ) {
                                        return "";
                                    }

                                    const serviceName =
                                        service.name ||
                                        "Service";

                                    const price =
                                        Number(
                                            service.price
                                        ) || 0;

                                    return `
                                        <span class="
                                            bg-gray-800
                                            border
                                            border-gray-700
                                            px-3
                                            py-1
                                            rounded-full
                                            text-xs
                                        ">
                                            ${escapeHtml(serviceName)}
                                            • R${price}
                                        </span>
                                    `;

                                })
                                .join("")
                            }

                        </div>

                    </div>
                    `

                    :

                    `
                    <p class="
                        text-yellow-500
                        text-sm
                        mb-4
                    ">
                        No services listed
                    </p>
                    `
                }

            </div>

        </div>


        <div class="p-5 pt-0">

            <button
                class="
                    bookBtn
                    w-full
                    bg-purple-600
                    hover:bg-purple-700
                    p-3
                    rounded-xl
                    font-bold
                    transition
                "
            >
                Book Appointment
            </button>

        </div>

    `;


    card
        .querySelector(".bookBtn")
        .addEventListener(
            "click",
            () => {

                openBooking(
                    salonId,
                    salon,
                    ownerId
                );

            }
        );


    salonsList.appendChild(card);

}



/* =========================================================
   OPEN BOOKING
========================================================= */

function openBooking(
    salonId,
    salon,
    ownerId
) {

    if (!currentUser) {

        alert(
            "Please login before booking."
        );

        window.location.href =
            "home.html";

        return;
    }


    selectedSalon = {

        id: salonId,

        ownerId:
            ownerId ||
            salon.ownerId ||
            salon.OwnerId ||
            (
                salonId === KNOWN_SALON_ID
                    ? KNOWN_OWNER_ID
                    : ""
            ),

        ...salon

    };


    document
        .getElementById(
            "selectedSalonName"
        )
        .textContent =
            salon.name ||
            "Selected Salon";


    serviceSelect.innerHTML =
        `<option value="">
            Choose service
        </option>`;


    const services =
        Array.isArray(salon.services)
            ? salon.services
            : [];


    services.forEach(service => {

        if (
            !service ||
            typeof service !== "object"
        ) {
            return;
        }


        const option =
            document.createElement(
                "option"
            );


        const name =
            service.name ||
            "Service";


        const price =
            Number(service.price) ||
            0;


        option.value =
            JSON.stringify({
                name,
                price
            });


        option.textContent =
            `${name} - R${price}`;


        serviceSelect.appendChild(
            option
        );

    });


    const dateInput =
        document.getElementById(
            "bookingDate"
        );


    const today =
        getTodaySouthAfrica();


    dateInput.min =
        today;


    dateInput.value =
        today;


    document
        .getElementById(
            "bookingTime"
        )
        .value = "";


    modal.classList.remove(
        "hidden"
    );

}



/* =========================================================
   CLOSE MODAL
========================================================= */

document
    .getElementById("cancelBooking")
    .addEventListener(
        "click",
        closeModal
    );


function closeModal() {

    modal.classList.add(
        "hidden"
    );

}


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeModal();

        }

    }
);



/* =========================================================
   BOOKING
========================================================= */

confirmBooking.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            alert(
                "Please login again."
            );

            return;

        }


        if (!selectedSalon) {

            alert(
                "Please select a salon."
            );

            return;

        }


        const customerName =
            document
                .getElementById(
                    "customerName"
                )
                .value
                .trim();


        const phone =
            document
                .getElementById(
                    "customerPhone"
                )
                .value
                .trim();


        const serviceValue =
            serviceSelect.value;


        const date =
            document
                .getElementById(
                    "bookingDate"
                )
                .value;


        const time =
            document
                .getElementById(
                    "bookingTime"
                )
                .value;


        if (
            !customerName ||
            !phone ||
            !serviceValue ||
            !date ||
            !time
        ) {

            alert(
                "Please complete all fields."
            );

            return;

        }


        let selectedService;


        try {

            selectedService =
                JSON.parse(
                    serviceValue
                );

        } catch {

            alert(
                "Please select a valid service."
            );

            return;

        }


        const salonId =
            selectedSalon.id;


        let ownerId =
            selectedSalon.ownerId ||
            selectedSalon.OwnerId ||
            "";


        if (
            salonId === KNOWN_SALON_ID &&
            !ownerId
        ) {

            ownerId =
                KNOWN_OWNER_ID;

        }


        if (!salonId) {

            alert(
                "Salon ID is missing."
            );

            return;

        }


        if (!ownerId) {

            alert(
                "This salon has no owner ID. Please contact the salon owner."
            );

            return;

        }


        confirmBooking.disabled =
            true;


        confirmBooking.textContent =
            "Booking...";


        try {

            await addDoc(
                collection(
                    db,
                    "bookings"
                ),
                {

                    userId:
                        currentUser.uid,

                    customerName:
                        customerName,

                    phone:
                        phone,

                    salonId:
                        salonId,

                    ownerId:
                        ownerId,

                    salonName:
                        selectedSalon.name ||
                        "Kasi Salon",

                    service:
                        selectedService.name,

                    price:
                        Number(
                            selectedService.price
                        ) || 0,

                    date:
                        date,

                    time:
                        time,

                    status:
                        "pending",

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );


            alert(
                "✅ Booking sent successfully!"
            );


            document
                .getElementById(
                    "customerName"
                )
                .value = "";


            document
                .getElementById(
                    "customerPhone"
                )
                .value = "";


            serviceSelect.value =
                "";


            document
                .getElementById(
                    "bookingTime"
                )
                .value = "";


            closeModal();

        }

        catch (error) {

            console.error(
                "Booking error:",
                error
            );


            alert(
                "Booking failed: " +
                error.message
            );

        }

        finally {

            confirmBooking.disabled =
                false;

            confirmBooking.textContent =
                "Confirm";

        }

    }
);



/* =========================================================
   SOUTH AFRICA DATE
========================================================= */

function getTodaySouthAfrica() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:
                "Africa/Johannesburg",

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit"
        }
    ).format(new Date());

}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   START
========================================================= */

loadSalons();

</script>
