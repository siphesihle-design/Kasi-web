<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111827">

    <title>K@si Web | Salons</title>

        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            padding-bottom: 95px;

            background:
                linear-gradient(
                    135deg,
                    #0a0a1a 0%,
                    #1a0a3e 100%
                );

            color: #fff;

            min-height: 100vh;
        }

        /* ================================
           BOTTOM NAV
        ================================ */

        .nav-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            min-height: 72px;

            background:
                rgba(17, 24, 39, 0.97);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-top:
                1px solid
                rgba(75, 85, 99, 0.45);

            display: flex;

            justify-content: space-around;
            align-items: center;

            z-index: 9998;

            padding:
                4px
                8px
                calc(
                    4px +
                    env(safe-area-inset-bottom)
                );
        }

        .nav-item {
            width: 90px;
            height: 62px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #9ca3af;

            text-decoration: none;

            font-size: 0.78rem;

            font-weight: 700;

            border-radius: 18px;

            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 1.7rem;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #a855f7;

            background:
                rgba(126, 34, 206, 0.13);
        }

        .nav-item:hover {
            color: #a855f7;
        }

        /* ================================
           SALON CARD
        ================================ */

        .salon-card {
            transition:
                transform 0.2s ease,
                border-color 0.2s ease;

            background:
                rgba(17, 17, 30, 0.7);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border:
                1px solid
                rgba(59, 130, 246, 0.3);

            border-radius: 1rem;

            overflow: hidden;
        }

        .salon-card:hover {
            transform: translateY(-3px);

            border-color:
                #9333ea;
        }

        .salon-image {
            width: 100%;
            height: 210px;

            object-fit: cover;

            display: block;

            background:
                #111827;
        }

        /* ================================
           BUTTON
        ================================ */

        .primary-btn {
            background:
                linear-gradient(
                    90deg,
                    #3b82f6,
                    #8b5cf6
                );

            border: none;

            color: white;

            padding:
                0.75rem 1.25rem;

            border-radius:
                0.75rem;

            font-weight: bold;

            width: 100%;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ================================
           MODAL
        ================================ */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.8);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            justify-content: center;
            align-items: center;

            z-index: 10000;

            padding: 1rem;

            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        /* ================================
           LOADING
        ================================ */

        .loading-box {
            text-align: center;

            padding:
                50px 20px;

            color:
                #9ca3af;
        }

        .loading-box i {
            display: block;

            font-size: 3rem;

            color:
                #3b82f6;

            margin-bottom:
                12px;
        }

        /* ================================
           EMPTY
        ================================ */

        .empty-state {
            text-align: center;

            padding:
                60px 20px;

            color:
                #9ca3af;
        }

        .empty-state i {
            font-size: 4rem;

            color:
                #8b8b98;

            margin-bottom:
                15px;
        }

        .empty-state h3 {
            color:
                #c7c7d1;

            font-size:
                1.25rem;

            font-weight:
                700;

            margin-bottom:
                8px;
        }

        .empty-state p {
            color:
                #888895;

            font-size:
                0.95rem;
        }

        /* ================================
           ERROR
        ================================ */

        .error-state {
            text-align: center;

            padding:
                40px 20px;

            color:
                #ff4757;
        }

        .error-state i {
            font-size:
                3rem;

            margin-bottom:
                10px;
        }

        .error-state p {
            font-weight:
                700;

            margin-bottom:
                6px;
        }

        .error-state small {
            color:
                #aaa;

            display:
                block;

            word-break:
                break-word;
        }

        /* ================================
           FIREBASE STATUS
        ================================ */

        #firebaseStatus {
            position: fixed;

            top: 90px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 9990;

            display: none;

            max-width: 90%;

            padding:
                8px 14px;

            border-radius:
                999px;

            font-size:
                11px;

            font-weight:
                700;

            background:
                rgba(17, 24, 39, 0.95);

            border:
                1px solid
                rgba(59, 130, 246, 0.4);

            color:
                #93c5fd;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);
        }

        /* ================================
           DEBUG PANEL
        ================================ */

        #debugPanel {
            display: none;

            margin:
                0 auto 25px;

            max-width:
                900px;

            background:
                rgba(17, 24, 39, 0.92);

            border:
                1px solid
                rgba(59, 130, 246, 0.35);

            border-radius:
                14px;

            padding:
                15px;

            font-size:
                12px;

            color:
                #9ca3af;

            word-break:
                break-word;

            line-height:
                1.7;
        }

        #debugPanel strong {
            color:
                #60a5fa;
        }

        /* ================================
           DIAGNOSTIC BADGES
        ================================ */

        .debug-ok {
            color: #4ade80 !important;
        }

        .debug-error {
            color: #f87171 !important;
        }

        .debug-warning {
            color: #fbbf24 !important;
        }

        /* ================================
           MOBILE
        ================================ */

        @media (max-width: 640px) {

            main {
                padding-top: 28px;
            }

            .salon-image {
                height: 200px;
            }

            .nav-item {
                width: 88px;
            }

            #firebaseStatus {
                top: 85px;
            }

        }

    </style>

</head>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                /* ============================

                ============================ */

                const EXPECTED_SALON_ID =
                    "Sv4zu4jERDR65IuURdss";

                const EXPECTED_OWNER_ID =
                    "prgctpY58cVmPocgLuSRLRMajOI2";


                /* ============================
                   DOM
                ============================ */

                const salonList =
                    document.getElementById(

                    );

                const bookingModal =

                    );

                const bookingForm =

                const logoutBtn =

                    );

                    );

                const bookingsToday =
                    document.getElementById(

                    );

                const custDateInput =
                    document.getElementById(
                        "custDate"
                    );

                const custTimeInput =

                        "custTime"
                    );

                const custNameInput =
                    document.getElementById(

                    );

                const custPhoneInput =

                    );

                const serviceSelect =

                    );

                const confirmBookingBtn =
                    document.getElementById(

                    );

                const bookingSalonName =
                    document.getElementById(
                        "bookingSalonName"
                    );

                const bookingSalonLocation =
                    document.getElementById(
                        "bookingSalonLocation"
                    );

                const firebaseStatus =
                    document.getElementById(
                        "firebaseStatus"
                    );

                const debugPanel =
                    document.getElementById(
                        "debugPanel"
                    );


                /* ============================
                   VARIABLES
                ============================ */

                let selectedSalonId =
                    null;

                let selectedSalonData =
                    null;

                let allSalons =
                    [];

                let salonsUnsubscribe =
                    null;

                let bookingsUnsubscribe =
                    null;


                /* ============================
                   HELPERS
                ============================ */

                function escapeHtml(
                    value
                ) {

                    if (
                        value === null ||
                        value === undefined
                    ) {

                        return "";

                    }

                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                function getLocalDateString(
                    date = new Date()
                ) {

                    return [

                        date.getFullYear(),

                        String(
                            date.getMonth() + 1
                        ).padStart(
                            2,
                            "0"
                        ),

                        String(
                            date.getDate()
                        ).padStart(
                            2,
                            "0"
                        )

                    ].join("-");

                }


                function showFirebaseStatus(
                    message,
                    type = "info"
                ) {

                    if (!firebaseStatus) {
                        return;
                    }

                    firebaseStatus.textContent =
                        message;

                    firebaseStatus.style.display =
                        "block";

                    if (
                        type === "error"
                    ) {

                        firebaseStatus.style.color =
                            "#fca5a5";

                        firebaseStatus.style.borderColor =
                            "rgba(239,68,68,0.5)";

                    } else {

                        firebaseStatus.style.color =
                            "#93c5fd";

                        firebaseStatus.style.borderColor =
                            "rgba(59,130,246,0.4)";

                    }

                    clearTimeout(
                        firebaseStatus._timer
                    );

                    firebaseStatus._timer =
                        setTimeout(
                            () => {

                                firebaseStatus.style.display =
                                    "none";

                            },
                            5000
                        );

                }


                function updateDebug(
                    data
                ) {

                    if (!debugPanel) {
                        return;
                    }

                    debugPanel.style.display =
                        "block";

                    debugPanel.innerHTML = `

                        <strong>
                            Firebase Diagnostic
                        </strong>

                        <br><br>

                        Project:
                        ${escapeHtml(
                            firebase.app()
                                .options
                                .projectId
                        )}

                        <br>

                        Firestore Database:
                        <strong>
                            (default)
                        </strong>

                        <br>

                        Salon collection:
                        <strong>
                            salons
                        </strong>

                        <br>

                        Expected Salon ID:
                        ${escapeHtml(
                            EXPECTED_SALON_ID
                        )}

                        <br>

                        Expected Owner ID:
                        ${escapeHtml(
                            EXPECTED_OWNER_ID
                        )}

                        <br><br>

                        ${data || "Checking Firestore..."}

                    `;

                }


                /* ============================
                   AUDIO
                ============================ */

                const clickSound =
                    document.getElementById(
                        "clickSound"
                    );

                if (clickSound) {
                    clickSound.volume =
                        0.4;
                }


                function playClick() {

                    if (clickSound) {

                        clickSound.currentTime =
                            0;

                        clickSound
                            .play()
                            .catch(
                                () => {}
                            );

                    }

                    if (
                        navigator.vibrate
                    ) {

                        navigator.vibrate(
                            30
                        );

                    }

                }


                document.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest(
                                "button"
                            )
                        ) {

                            playClick();

                        }

                    }
                );


                /* ============================
                   DATE LIMITS
                ============================ */

                if (custDateInput) {

                    const today =
                        new Date();

                    const maxDate =
                        new Date();

                    maxDate.setDate(
                        today.getDate() + 30
                    );

                    custDateInput.min =
                        getLocalDateString(
                            today
                        );

                    custDateInput.max =
                        getLocalDateString(
                            maxDate
                        );

                    custDateInput.value =
                        getLocalDateString(
                            today
                        );

                }


                /* ============================
                   AUTH
                ============================ */

                auth.onAuthStateChanged(
                    async user => {

                        console.log(
                            "AUTH USER:",
                            user
                                ? user.uid
                                : "Not logged in"
                        );

                        if (!user) {

                            logoutBtn.style.display =
                                "none";

                            adminBtn.style.display =
                                "none";

                            listenForBookings(
                                null
                            );

                            return;

                        }

                        logoutBtn.style.display =
                            "flex";

                        try {

                            const userSnap =
                                await db
                                    .collection(
                                        "users"
                                    )
                                    .doc(
                                        user.uid
                                    )
                                    .get();

                            if (
                                !userSnap.exists
                            ) {

                                console.warn(
                                    "No users document:",
                                    user.uid
                                );

                                adminBtn.style.display =
                                    "none";

                                listenForBookings(
                                    user.uid
                                );

                                return;

                            }

                            const userData =
                                userSnap.data() ||
                                {};

                            const role =
                                userData.role ||
                                "customer";

                            console.log(
                                "USER DATA:",
                                userData
                            );

                            if (
                                role === "admin" ||
                                role === "salon_owner"
                            ) {

                /* ============================
                   SEARCH
                ============================ */

                function executeSearch() {

                    const term =
                        searchBar
                            ? searchBar.value
                                .toLowerCase()
                                .trim()
                            : "";

                    if (!term) {

                        renderSalonList(
                            allSalons
                        );

                        return;

                    }

                    const filtered =
                        allSalons.filter(
                            salon => {

                                const name =
                                    String(
                                        salon.name ||
                                        ""
                                    ).toLowerCase();

                                const location =
                                    String(
                                        salon.location ||
                                        ""
                                    ).toLowerCase();

                                const email =
                                    String(
                                        salon.email ||
                                        ""
                                    ).toLowerCase();

                                return (
                                    name.includes(
                                        term
                                    ) ||
                                    location.includes(
                                        term
                                    ) ||
                                    email.includes(
                                        term
                                    )
                                );

                            }
                        );

                    renderSalonList(
                        filtered
                    );

                }


                if (searchBtn) {

                    searchBtn.addEventListener(
                        "click",
                        executeSearch
                    );

                }


                if (searchBar) {

                    searchBar.addEventListener(
                        "input",
                        executeSearch
                    );

                    searchBar.addEventListener(
                        "keydown",
                        event => {

                            if (
                                event.key ===
                                "Enter"
                            ) {

                                event.preventDefault();

                                executeSearch();

                            }

                        }
                    );

                }


                /* ============================
                   OPEN BOOKING MODAL
                ============================ */

                function openBooking(
                    salonId
                ) {

                    const salon =
                        allSalons.find(
                            item =>
                                item.id ===
                                salonId
                        );

                    if (!salon) {

                        showFirebaseStatus(
                            "Salon could not be found",
                            "error"
                        );

                        return;

                    }

                    if (
                        !salon.ownerId
                    ) {

                        showFirebaseStatus(
                            "This salon is not connected to an owner",
                            "error"
                        );

                        return;

                    }

                    selectedSalonId =
                        salon.id;

                    selectedSalonData =
                        salon;

                    bookingSalonName.textContent =
                        salon.name;

                    bookingSalonLocation.textContent =
                        salon.location;

                    populateServices(
                        salon.services
                    );

                    if (
                        !custDateInput.value
                    ) {

                        custDateInput.value =
                            getLocalDateString();

                    }

                    bookingModal.classList.add(
                        "active"
                    );

                    document.body.style.overflow =
                        "hidden";

                }


                /* ============================
                   SERVICES
                ============================ */

                function populateServices(
                    services
                ) {

                    serviceSelect.innerHTML =
                        "";

                    if (
                        !Array.isArray(
                            services
                        ) ||
                        !services.length
                    ) {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            "";

                        option.textContent =
                            "No services available";

                        serviceSelect.appendChild(
                            option
                        );

                        return;

                    }

                    services.forEach(
                        service => {

                            const name =
                                service?.name ||
                                "Service";

                            const price =
                                Number(
                                    service?.price
                                ) || 0;

                            const option =
                                document.createElement(
                                    "option"
                                );

                            option.value =
                                name;

                            option.dataset.price =
                                String(
                                    price
                                );

                            option.textContent =
                                `${name} — R${price.toFixed(2)}`;

                            serviceSelect.appendChild(
                                option
                            );

                        }
                    );

                }


                /* ============================
                   CLOSE MODAL
                ============================ */

                function closeBookingModal() {

                    bookingModal.classList.remove(
                        "active"
                    );

                    document.body.style.overflow =
                        "";

                    selectedSalonId =
                        null;

                    selectedSalonData =
                        null;

                }


                closeModalBtn.addEventListener(
                    "click",
                    closeBookingModal
                );


                bookingModal.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target ===
                            bookingModal
                        ) {

                            closeBookingModal();

                        }

                    }
                );


                document.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Escape" &&
                            bookingModal.classList.contains(
                                "active"
                            )
                        ) {

                            closeBookingModal();

                        }

                    }
                );


                /* ============================
                   BOOK BUTTONS
                ============================ */

                salonList.addEventListener(
                    "click",
                    event => {

                        const button =
                            event.target.closest(
                                ".bookBtn"
                            );

                        if (!button) {
                            return;
                        }

                        if (
                            button.disabled
                        ) {
                            return;
                        }

                        const salonId =
                            button.dataset.id;

                        openBooking(
                            salonId
                        );

                    }
                );


                /* ============================
                   CREATE BOOKING
                ============================ */

                bookingForm.addEventListener(
                    "submit",
                    async event => {

                        event.preventDefault();

                        const user =
                            auth.currentUser;

                        if (!user) {

                            showFirebaseStatus(
                                "Please log in before booking",
                                "error"
                            );

                            window.location.href =
                                "home.html";

                            return;

                        }

                        if (
                            !selectedSalonId ||
                            !selectedSalonData
                        ) {

                            showFirebaseStatus(
                                "Please select a salon first",
                                "error"
                            );

                            return;

                        }

                        const customerName =
                            custNameInput.value.trim();

                        const phone =
                            custPhoneInput.value.trim();

                        const date =
                            custDateInput.value;

                        const time =
                            custTimeInput.value;

                        const selectedOption =
                            serviceSelect.options[
                                serviceSelect.selectedIndex
                            ];

                        const serviceName =
                            selectedOption
                                ? selectedOption.value
                                : "";

                        const price =
                            selectedOption
                                ? Number(
                                    selectedOption.dataset.price
                                ) || 0
                                : 0;

                        if (
                            !customerName ||
                            !phone ||
                            !date ||
                            !time ||
                            !serviceName
                        ) {

                            showFirebaseStatus(
                                "Please complete all booking fields",
                                "error"
                            );

                            return;

                        }

                        if (
                            !selectedSalonData.ownerId
                        ) {

                            showFirebaseStatus(
                                "This salon has no ownerId",
                                "error"
                            );

                            return;

                        }

                        if (
                            date <
                            getLocalDateString()
                        ) {

                            showFirebaseStatus(
                                "Please select today or a future date",
                                "error"
                            );

                            return;

                        }

                        confirmBookingBtn.disabled =
                            true;

                        confirmBookingBtn.innerHTML = `
                            <i class="bx bx-loader-alt bx-spin"></i>
                            Saving Booking...
                        `;

                        try {

                            /*
                             * IMPORTANT:
                             * ownerId comes directly from
                             * the salon Firestore document.
                             */

                            const bookingData = {

                                userId:
                                    user.uid,

                                ownerId:
                                    selectedSalonData.ownerId,

                                salonId:
                                    selectedSalonId,

                                salonName:
                                    selectedSalonData.name,

                                customerName:
                                    customerName,

                                phone:
                                    phone,

                                service:
                                    serviceName,

                                price:
                                    price,

                                date:
                                    date,

                                time:
                                    time,

                                status:
                                    "pending",

                                createdAt:
                                    firebase.firestore
                                        .FieldValue
                                        .serverTimestamp(),

                                updatedAt:
                                    firebase.firestore
                                        .FieldValue
                                        .serverTimestamp()

                            };

                            console.log(
                                "CREATING BOOKING:",
                                bookingData
                            );

                            const bookingRef =
                                await db
                                    .collection(
                                        "bookings"
                                    )
                                    .add(
                                        bookingData
                                    );

                            console.log(
                                "BOOKING CREATED:",
                                bookingRef.id
                            );

                            showFirebaseStatus(
                                "Booking confirmed successfully"
                            );

                            bookingForm.reset();

                            custDateInput.value =
                                getLocalDateString();

                            closeBookingModal();

                            updateBookingCount();

                        } catch (error) {

                            console.error(
                                "BOOKING ERROR:",
                                error
                            );

                            updateDebug(`

                                <strong class="debug-error">
                                    BOOKING ERROR
                                </strong>

                                <br><br>

                                Error code:
                                ${escapeHtml(
                                    error.code ||
                                    "unknown"
                                )}

                                <br>

                                Error message:
                                ${escapeHtml(
                                    error.message ||
                                    "Unknown booking error"
                                )}

                            `);

                            showFirebaseStatus(
                                error.message ||
                                "Booking could not be saved",
                                "error"
                            );

                        } finally {

                            confirmBookingBtn.disabled =
                                false;

                            confirmBookingBtn.innerHTML =
                                "Confirm Booking";

                        }

                    }
                );


                /* =====================================================
                   BOOKING COUNT
                ====================================================== */

                function listenForBookings(
                    uid
                ) {

                    if (
                        bookingsUnsubscribe
                    ) {

                        bookingsUnsubscribe();

                        bookingsUnsubscribe =
                            null;

                    }

                    if (!uid) {

                        if (bookingsToday) {

                            bookingsToday.textContent =
                                "0 bookings today";

                        }

                        return;

                    }

                    /*
                     * No orderBy is used here so this
                     * listener does not require a composite
                     * Firestore index.
                     */

                    bookingsUnsubscribe =
                        db
                            .collection(
                                "bookings"
                            )
                            .onSnapshot(

                                snapshot => {

                                    const today =
                                        getLocalDateString();

                                    let count =
                                        0;

                                    snapshot.forEach(
                                        docSnap => {

                                            const data =
                                                docSnap.data() ||
                                                {};

                                            if (
                                                data.date ===
                                                today
                                            ) {

                                                count++;

                                            }

                                        }
                                    );

                                    bookingsToday.textContent =
                                        `${count} booking${count === 1 ? "" : "s"} today`;

                                },

                                error => {

                                    console.error(
                                        "BOOKING COUNT ERROR:",
                                        error
                                    );

                                    /*
                                     * Do not replace a successful
                                     * salon screen with a booking
                                     * count permission error.
                                     */

                                    bookingsToday.textContent =
                                        "Bookings today";

                                }

                            );

                }


                async function updateBookingCount() {

                    /*
                     * This function is intentionally lightweight.
                     * The real-time listener above keeps the header
                     * current whenever the user is authenticated.
                     */

                    const user =
                        auth.currentUser;

                    if (
                        user
                    ) {

                        listenForBookings(
                            user.uid
                        );

                    }

                }


                /* ============================
                   INITIAL LOAD
                ============================ */

                testExpectedSalon();

                loadSalons();


                /* ============================
                   CLEANUP
                ============================ */

                window.addEventListener(
                    "beforeunload",
                    () => {

                        if (
                            salonsUnsubscribe
                        ) {

                            salonsUnsubscribe();

                        }

                        if (
                            bookingsUnsubscribe
                        ) {

                            bookingsUnsubscribe();

                        }

                    }
                );

            }
        );

    </script>

</body>
