<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasi Cuts - Salons</title>
<style>
  body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #9C00E0; }
  .salon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
  .salon-card { background: #1a1a1a; border-radius: 16px; padding: 15px; border: 1px solid #333; }
  .salon-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
  .salon-card h3 { margin: 5px 0; color: #9C00E0; }
  .salon-card p { margin: 5px 0; font-size: 14px; color: #aaa; }
  .book-btn { background: #9C00E0; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold; }
  .book-btn:disabled { background: #555; cursor: not-allowed; }
  .warning { color: #ff4444; font-size: 12px; margin-top: 5px; }
</style>
</head>
<body>

<h1>🔥 Book Your Kasi Cut 🔥</h1>
<div id="salonList" class="salon-grid">Loading salons...</div>

<script type="module">
  // 1. FIREBASE CONFIG - Replace with yours
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN", 
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  let currentUser = null;

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    loadSalons();
  });

  // 2. LOAD SALONS
  async function loadSalons() {
    const salonList = document.getElementById('salonList');
    const q = query(collection(db, "salons"));
    const querySnapshot = await getDocs(q);
    
    salonList.innerHTML = "";
    
    querySnapshot.forEach((doc) => {
      const salon = doc.data();
      const salonId = doc.id;
      
      // Check if salon has an owner
      const hasOwner = salon.ownerId && salon.ownerId !== "";
      
      const salonCard = `
        <div class="salon-card">
          <img src="${salon.image}" alt="${salon.name}">
          <h3>${salon.name}</h3>
          <p>📍 ${salon.location}</p>
          <p>🕒 ${salon.hours}</p>
          ${hasOwner 
            ? `<button class="book-btn" onclick="bookSalon('${salonId}', '${salon.name}')">Book Now</button>` 
            : `<button class="book-btn" disabled>Book Now</button>
               <p class="warning">⚠️ Not available for booking</p>`
          }
        </div>
      `;
      salonList.innerHTML += salonCard;
    });
  }

  // 3. BOOKING FUNCTION
  window.bookSalon = async function(salonId, salonName) {
    if (!currentUser) {
      alert("Please login first!");
      window.location.href = "login.html";
      return;
    }

    const customerName = prompt("Enter your name:");
    if (!customerName) return;

    const time = prompt("What time do you want? e.g. 14:00");
    if (!time) return;

    try {
      await addDoc(collection(db, "bookings"), {
        salonId: salonId,
        salonName: salonName,
        customerId: currentUser.uid,
        customerName: customerName,
        time: time,
        status: "pending",
        createdAt: serverTimestamp()
      });
      alert(`Booking request sent to ${salonName}! ✅`);
    } catch (error) {
      alert("Error booking: " + error.message);
    }
  }
</script>

</body>
</html>
