<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111827">

    <title>K@si Web | Salons</title>

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            padding-bottom: 95px;

            background:
                linear-gradient(
                    135deg,
                    #0a0a1a 0%,
                    #1a0a3e 100%
                );

            color: #fff;

            min-height: 100vh;
        }

        /* ================================
           BOTTOM NAV
        ================================ */

        .nav-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            min-height: 72px;

            background:
                rgba(17, 24, 39, 0.97);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-top:
                1px solid
                rgba(75, 85, 99, 0.45);

            display: flex;

            justify-content: space-around;
            align-items: center;

            z-index: 9998;

            padding:
                4px
                8px
                calc(
                    4px +
                    env(safe-area-inset-bottom)
                );
        }

        .nav-item {
            width: 90px;
            height: 62px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #9ca3af;

            text-decoration: none;

            font-size: 0.78rem;

            font-weight: 700;

            border-radius: 18px;

            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 1.7rem;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #a855f7;

            background:
                rgba(126, 34, 206, 0.13);
        }

        .nav-item:hover {
            color: #a855f7;
        }

        /* ================================
           SALON CARD
        ================================ */

        .salon-card {
            transition:
                transform 0.2s ease,
                border-color 0.2s ease;

            background:
                rgba(17, 17, 30, 0.7);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border:
                1px solid
                rgba(59, 130, 246, 0.3);

            border-radius: 1rem;

            overflow: hidden;
        }

        .salon-card:hover {
            transform: translateY(-3px);

            border-color:
                #9333ea;
        }

        .salon-image {
            width: 100%;
            height: 210px;

            object-fit: cover;

            display: block;

            background:
                #111827;
        }

        /* ================================
           BUTTON
        ================================ */

        .primary-btn {
            background:
                linear-gradient(
                    90deg,
                    #3b82f6,
                    #8b5cf6
                );

            border: none;

            color: white;

            padding:
                0.75rem 1.25rem;

            border-radius:
                0.75rem;

            font-weight: bold;

            width: 100%;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ================================
           MODAL
        ================================ */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.8);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            justify-content: center;
            align-items: center;

            z-index: 10000;

            padding: 1rem;

            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        /* ================================
           LOADING
        ================================ */

        .loading-box {
            text-align: center;

            padding:
                50px 20px;

            color:
                #9ca3af;
        }

        .loading-box i {
            display: block;

            font-size: 3rem;

            color:
                #3b82f6;

            margin-bottom:
                12px;
        }

        /* ================================
           EMPTY
        ================================ */

        .empty-state {
            text-align: center;

            padding:
                60px 20px;

            color:
                #9ca3af;
        }

        .empty-state i {
            font-size: 4rem;

            color:
                #8b8b98;

            margin-bottom:
                15px;
        }

        .empty-state h3 {
            color:
                #c7c7d1;

            font-size:
                1.25rem;

            font-weight:
                700;

            margin-bottom:
                8px;
        }

        .empty-state p {
            color:
                #888895;

            font-size:
                0.95rem;
        }

        /* ================================
           ERROR
        ================================ */

        .error-state {
            text-align: center;

            padding:
                40px 20px;

            color:
                #ff4757;
        }

        .error-state i {
            font-size:
                3rem;

            margin-bottom:
                10px;
        }

        .error-state p {
            font-weight:
                700;

            margin-bottom:
                6px;
        }

        .error-state small {
            color:
                #aaa;

            display:
                block;

            word-break:
                break-word;
        }

        /* ================================
           FIREBASE STATUS
        ================================ */

        #firebaseStatus {
            position: fixed;

            top: 90px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 9990;

            display: none;

            max-width: 90%;

            padding:
                8px 14px;

            border-radius:
                999px;

            font-size:
                11px;

            font-weight:
                700;

            background:
                rgba(17, 24, 39, 0.95);

            border:
                1px solid
                rgba(59, 130, 246, 0.4);

            color:
                #93c5fd;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);
        }

        /* ================================
           DEBUG PANEL
        ================================ */

        #debugPanel {
            display: none;

            margin:
                0 auto 25px;

            max-width:
                900px;

            background:
                rgba(17, 24, 39, 0.85);

            border:
                1px solid
                rgba(59, 130, 246, 0.35);

            border-radius:
                14px;

            padding:
                15px;

            font-size:
                12px;

            color:
                #9ca3af;

            word-break:
                break-word;
        }

        #debugPanel strong {
            color:
                #60a5fa;
        }

        /* ================================
           MOBILE
        ================================ */

        @media (max-width: 640px) {

            main {
                padding-top: 28px;
            }

            .salon-image {
                height: 200px;
            }

            .nav-item {
                width: 88px;
            }

            #firebaseStatus {
                top: 85px;
            }

        }

    </style>

</head>


<body>


    <!-- ================================

    <div id="firebaseStatus"></div>


    <!-- ================================

    ================================= -->

    <main

        <div
            class="text-center mb-6"
        >

            <h2

            <p class="text-gray-400">

            <input

            <button

        <!-- SALONS -->

        <div

            <div

            >

                <i
                    class="bx bx-loader-alt bx-spin"
                ></i>

    ================================= -->

                class="text-xl font-bold mb-4 text-blue-400"

                Book Appointment
            </h2>


            <form
                id="bookingForm"
                class="space-y-4"
            >

                <div>

                    <label
                        class="text-xs text-gray-400 block mb-1"
                    >
                        Your Full Name
                    </label>

                    <input
                        type="text"
                        id="custName"
                        required
                        autocomplete="name"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-blue-500 outline-none"

                </div>


                <div>

                    <label
                        class="text-xs text-gray-400 block mb-1"
                    >
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="custPhone"
                        required
                        autocomplete="tel"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-blue-500 outline-none"
                    >

                </div>


                <div>

                    <label
                        class="text-xs text-gray-400 block mb-1"
                    >
                        Select Service
                    </label>

                    <select
                        id="serviceType"
                        required
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-blue-500 outline-none"
                    ></select>

                </div>


                <div
                    class="grid grid-cols-2 gap-2"
                >

                    <div>

                        <label
                            class="text-xs text-gray-400 block mb-1"
                        >
                            Date
                        </label>

                        <input
                            type="date"
                            id="custDate"
                            required
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm outline-none"

                    </div>


                    <div>

                        <label
                            class="text-xs text-gray-400 block mb-1"
                        >
                            Time
                        </label>

                        <input
                            type="time"
                            id="custTime"
                            required
                            class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm outline-none"

                    </div>

                </div>


                <button
                    type="submit"

                    class="primary-btn mt-2"

                    Confirm Booking
                </button>

            </form>

        </div>

    </div>


    <!-- ================================
         BOTTOM NAV
    ================================= -->

    <div class="nav-grid">

        <a
            href="index.html"
            class="nav-item"
        >

            <i
                class="bx bx-home-alt"
            ></i>

            <span>
                Home
            </span>

        </a>


        <a

            <i
                class="bx bx-user"
            ></i>

            <span>
                Account
            </span>

        </a>


        <a

        >

            <i
                class="bx bx-cut"
            ></i>

            <span>
                Salons
            </span>

        </a>

    </div>

    <audio

    <!-- =====================================================
         MAIN APPLICATION
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                /* ============================
                   CONSTANTS
                ============================ */

                const EXPECTED_SALON_ID =
                    "Sv4zu4jERDR65IuURdss";


                const EXPECTED_OWNER_ID =
                    "prgctpY58cVmPocgLuSRLRMajOI2";


                /* ============================
                   DOM
                ============================ */

                const salonList =
                    document.getElementById(
                        "salonList"
                    );


                const bookingModal =
                    document.getElementById(
                        "bookingModal"
                    );


                const bookingForm =
                    document.getElementById(
                        "bookingForm"
                    );


                const closeModalBtn =
                    document.getElementById(
                        "closeModalBtn"
                    );


                const adminBtn =
                    document.getElementById(
                        "adminBtn"
                    );


                const logoutBtn =
                    document.getElementById(
                        "logoutBtn"
                    );


                const searchBar =
                    document.getElementById(
                        "searchBar"
                    );


                const searchBtn =
                    document.getElementById(
                        "searchBtn"
                    );


                const bookingsToday =
                    document.getElementById(
                        "bookingsToday"
                    );


                const custDateInput =
                    document.getElementById(
                        "custDate"
                    );


                const serviceSelect =
                    document.getElementById(
                        "serviceType"
                    );


                const confirmBookingBtn =
                    document.getElementById(
                        "confirmBookingBtn"
                    );


                const firebaseStatus =
                    document.getElementById(
                        "firebaseStatus"
                    );


                const debugPanel =
                    document.getElementById(
                        "debugPanel"
                    );


                /* ============================
                   VARIABLES
                ============================ */

                let selectedSalonId =
                    null;


                let selectedSalonData =
                    null;


                let allSalons =
                    [];


                let salonsUnsubscribe =
                    null;


                let bookingsUnsubscribe =
                    null;


                /* ============================
                   STATUS
                ============================ */

                function showFirebaseStatus(
                    message,
                    type = "info"
                ) {

                    if (!firebaseStatus) {
                        return;
                    }


                    firebaseStatus.textContent =
                        message;


                    firebaseStatus.style.display =
                        "block";


                    if (
                        type === "error"
                    ) {

                        firebaseStatus.style.color =
                            "#fca5a5";


                        firebaseStatus.style.borderColor =
                            "rgba(239,68,68,0.5)";

                    } else {

                        firebaseStatus.style.color =
                            "#93c5fd";


                        firebaseStatus.style.borderColor =
                            "rgba(59,130,246,0.4)";

                    }


                    clearTimeout(
                        firebaseStatus._timer
                    );


                    firebaseStatus._timer =
                        setTimeout(
                            () => {

                                firebaseStatus.style.display =
                                    "none";

                            },
                            5000
                        );

                }


                /* ============================
                   DEBUG
                ============================ */

                function updateDebug(
                    data
                ) {

                    if (!debugPanel) {
                        return;
                    }


                    debugPanel.style.display =
                        "block";


                    debugPanel.innerHTML = `

                        <strong>Firebase Diagnostic</strong>

                        <br><br>

                        Project:
                        ${escapeHtml(
                            firebase.app()
                                .options
                                .projectId
                        )}

                        <br>

                        Salon collection:
                        salons

                        <br>

                        Expected Salon ID:
                        ${escapeHtml(
                            EXPECTED_SALON_ID
                        )}

                        <br>

                        Expected Owner ID:
                        ${escapeHtml(
                            EXPECTED_OWNER_ID
                        )}

                        <br><br>

                        ${
                            data ||
                            "Checking Firestore..."
                        }

                    `;

                }


                /* ============================
                   ESCAPE HTML
                ============================ */

                function escapeHtml(
                    value
                ) {

                    if (
                        value === null ||
                        value === undefined
                    ) {

                        return "";

                    }


                    return String(value)

                        .replace(
                            /&/g,
                            "&amp;"
                        )

                        .replace(
                            /</g,
                            "&lt;"
                        )

                        .replace(
                            />/g,
                            "&gt;"
                        )

                        .replace(
                            /"/g,
                            "&quot;"
                        )

                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                /* ============================
                   AUDIO
                ============================ */

                const clickSound =
                    document.getElementById(
                        "clickSound"
                    );


                if (clickSound) {

                    clickSound.volume =
                        0.4;

                }


                function playClick() {

                    if (clickSound) {

                        clickSound.currentTime =
                            0;


                        clickSound
                            .play()
                            .catch(
                                () => {}
                            );

                    }


                    if (
                        navigator.vibrate
                    ) {

                        navigator.vibrate(
                            30
                        );

                    }

                }


                document.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target.closest(
                                "button"
                            )
                        ) {

                            playClick();

                        }

                    }
                );


                /* ============================
                   DATE LIMIT
                ============================ */

                if (custDateInput) {

                    const today =
                        new Date();


                    const maxDate =
                        new Date();


                    maxDate.setDate(
                        today.getDate() + 30
                    );


                    function formatDate(
                        date
                    ) {

                        return [

                            date.getFullYear(),

                            String(
                                date.getMonth() + 1
                            ).padStart(
                                2,
                                "0"
                            ),

                            String(
                                date.getDate()
                            ).padStart(
                                2,
                                "0"
                            )

                        ].join("-");

                    }


                    custDateInput.min =
                        formatDate(
                            today
                        );


                    custDateInput.max =
                        formatDate(
                            maxDate
                        );

                }


                /* ============================
                   AUTH
                ============================ */

                auth.onAuthStateChanged(
                    async user => {

                        console.log(
                            "AUTH USER:",
                            user
                                ? user.uid
                                : "Not logged in"
                        );


                        if (!user) {

                            if (logoutBtn) {

                                logoutBtn.style.display =
                                    "none";

                            }


                            if (adminBtn) {

                                adminBtn.style.display =
                                    "none";

                            }


                            return;

                        }


                        if (logoutBtn) {

                            logoutBtn.style.display =
                                "flex";

                        }


                        try {

                            const userSnap =
                                await db
                                    .collection(
                                        "users"
                                    )
                                    .doc(
                                        user.uid
                                    )
                                    .get();


                            if (
                                !userSnap.exists
                            ) {

                                console.warn(
                                    "No users document:",
                                    user.uid
                                );

                                return;

                            }


                            const userData =
                                userSnap.data();


                            const role =
                                userData.role;


                            console.log(
                                "USER DATA:",
                                userData
                            );


                            if (
                                role === "admin" ||
                                role === "salon_owner"
                            ) {

                                if (adminBtn) {

                                    adminBtn.style.display =
                                        "flex";


                                    adminBtn.innerHTML =
                                        role === "admin"

                                            ? `
                                                <i class="bx bx-shield-alt-2"></i>
                                                Admin
                                              `

                                            : `
                                                <i class="bx bx-store"></i>
                                                Owner Dashboard
                                              `;


                                    adminBtn.onclick =
                                        () => {

                                            if (
                                                role === "admin"
                                            ) {

                                                window.location.href =
                                                    "admin.html";

                                            } else {

                                                window.location.href =
                                                    "owners.html";

                                            }

                                        };

                                }

                            }

                        } catch (error) {

                            console.error(
                                "User fetch error:",
                                error
                            );

                        }

                    }
                );


                /* ============================
                   DIRECT SALON TEST
                ============================ */

                async function testExpectedSalon() {

                    console.log(
                        "DIRECT SALON TEST"
                    );


                    try {

                        const snap =
                            await db
                                .collection(
                                    "salons"
                                )
                                .doc(
                                    EXPECTED_SALON_ID
                                )
                                .get();


                        console.log(
                            "Expected salon exists:",
                            snap.exists
                        );


                        if (
                            snap.exists
                        ) {

                            const data =
                                snap.data();


                            console.log(
                                "EXPECTED SALON DATA:",
                                data
                            );


                            const ownerId =
                                data.ownerId ||
                                data.OwnerId ||
                                null;


                            console.log(
                                "Salon ownerId:",
                                ownerId
                            );


                            updateDebug(`

                                Expected salon document:
                                <strong>EXISTS ✓</strong>

                                <br>

                                Salon name:
                                ${escapeHtml(
                                    data.name ||
                                    "No name"
                                )}

                                <br>

                                Owner ID:
                                ${escapeHtml(
                                    ownerId ||
                                    "MISSING"
                                )}

                                <br>

                                Image:
                                ${escapeHtml(
                                    data.image ||
                                    "MISSING"
                                )}

                                <br>

                                Services:
                                ${
                                    Array.isArray(
                                        data.services
                                    )
                                        ? data.services.length
                                        : 0
                                }

                            `);

                        } else {

                            updateDebug(`

                                Expected salon document:
                                <strong style="color:#f87171">
                                    DOES NOT EXIST ✗
                                </strong>

                                <br><br>

                                Firestore cannot find:
                                <strong>
                                    salons/${escapeHtml(
                                        EXPECTED_SALON_ID
                                    )}
                                </strong>

                            `);

                        }

                    } catch (error) {

                        console.error(
                            "DIRECT SALON TEST ERROR:",
                            error
                        );


                        updateDebug(`

                            <strong style="color:#f87171">
                                FIRESTORE ERROR
                            </strong>

                            <br><br>

                            ${escapeHtml(
                                error.message
                            )}

                        `);

                    }

                }


                /* ============================
                   LOAD SALONS
                ============================ */

                function loadSalons() {

                    if (!salonList) {
                        return;
                    }


                    if (
                        salonsUnsubscribe
                    ) {

                        salonsUnsubscribe();

                    }


                    console.log(
                        "Reading Firestore /salons..."
                    );


                    updateDebug(
                        "Reading <strong>/salons</strong> collection..."
                    );


                    salonsUnsubscribe =
                        db
                            .collection(
                                "salons"
                            )
                            .onSnapshot(

                                snapshot => {

                                    console.log(
                                        "SALONS SNAPSHOT"
                                    );


                                    console.log(
                                        "Number of salons:",
                                        snapshot.size
                                    );


                                    updateDebug(`

                                        Firestore /salons:

                                        <strong>
                                            ${snapshot.size}
                                        </strong>
                                        document(s) found.

                                    `);


                                    allSalons =
                                        [];


                                    if (
                                        snapshot.empty
                                    ) {

                                        salonList.innerHTML = `

                                            <div
                                                class="empty-state col-span-full"
                                            >

                                                <i class="bx bx-store-alt"></i>

                                                <h3>
                                                    No salons registered yet
                                                </h3>

                                                <p>
                                                    Firestore returned 0 documents from the salons collection.
                                                </p>

                                                <p
                                                    style="
                                                        margin-top:15px;
                                                        color:#60a5fa;
                                                        font-size:11px;
                                                    "
                                                >
                                                    Project:
                                                    ${escapeHtml(
                                                        firebase.app()
                                                            .options
                                                            .projectId
                                                    )}
                                                </p>

                                            </div>

                                        `;


                                        showFirebaseStatus(
                                            "Firestore returned 0 salons",
                                            "error"
                                        );


                                        return;

                                    }


                                    snapshot.forEach(
                                        docSnap => {

                                            const data =
                                                docSnap.data();


                                            console.log(
                                                "Salon:",
                                                docSnap.id,
                                                data
                                            );


                                            const salon = {

                                                id:
                                                    docSnap.id,

                                                name:
                                                    data.name ||
                                                    "Unnamed Salon",

                                                ownerId:
                                                    data.ownerId ||
                                                    data.OwnerId ||
                                                    null,

                                                email:
                                                    data.email ||
                                                    "",

                                                location:
                                                    data.location ||
                                                    "Location unavailable",

                                                hours:
                                                    data.hours ||
                                                    data.time ||
                                                    "09:00 - 18:00",

                                                image:
                                                    data.image ||
                                                    "https://via.placeholder.com/600x350?text=K%40si+Web",

                                                services:
                                                    Array.isArray(
                                                        data.services
                                                    )
                                                        ? data.services
                                                        : []

                                            };


                                            allSalons.push(
                                                salon
                                            );

                                        }
                                    );


                                    allSalons.sort(
                                        (
                                            a,
                                            b
                                        ) =>
                                            a.name.localeCompare(
                                                b.name
                                            )
                                    );


                                    renderSalonList(
                                        allSalons
                                    );


                                    updateBookingCount();


                                    showFirebaseStatus(
                                        `${allSalons.length} salon${allSalons.length === 1 ? "" : "s"} loaded`
                                    );

                                },

                                error => {

                                    console.error(
                                        "FIRESTORE SALON ERROR:",
                                        error
                                    );


                                    updateDebug(`

                                        <strong style="color:#f87171">
                                            Firestore error
                                        </strong>

                                        <br><br>

                                        ${escapeHtml(
                                            error.message
                                        )}

                                    `);


                                    salonList.innerHTML = `

                                        <div
                                            class="error-state col-span-full"
                                        >

                                            <i class="bx bx-error-circle"></i>

                                            <p>
                                                Failed to load salons
                                            </p>

                                            <small>
                                                ${escapeHtml(
                                                    error.message
                                                )}
                                            </small>

                                        </div>

                                    `;


                                    showFirebaseStatus(
                                        "Firestore error",
                                        "error"
                                    );

                                }

                            );

                }


                /* ============================
                   RENDER LIST
                ============================ */

                function renderSalonList(
                    salons
                ) {

                    salonList.innerHTML =
                        "";


                    if (
                        !salons.length
                    ) {

                        salonList.innerHTML = `

                            <div
                                class="empty-state col-span-full"
                            >

                                <i class="bx bx-search-alt"></i>

                                <h3>
                                    No salons found
                                </h3>

                                <p>
                                    Try another salon or location.
                                </p>

                            </div>

                        `;


                        return;

                    }


                    salons.forEach(
                        salon =>
                            renderSalon(
                                salon
                            )
                    );

                }


                /* ============================
                   RENDER SALON
                ============================ */

                function renderSalon(
                    salon
                ) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "salon-card flex flex-col justify-between";


                    const services =
                        Array.isArray(
                            salon.services
                        )
                            ? salon.services
                            : [];


                    const servicePreview =
                        services.length

                            ? services
                                .slice(
                                    0,
                                    3
                                )
                                .map(
                                    service => {

                                        const name =
                                            service?.name ||
                                            "Service";


                                        const price =
                                            Number(
                                                service?.price
                                            ) || 0;


                                        return `

                                            <div>
                                                ${escapeHtml(
                                                    name
                                                )}
                                                —
                                                R${price}
                                            </div>

                                        `;

                                    }
                                )
                                .join("")

                            : `
                                <div>
                                    Services available when booking
                                </div>
                              `;


                    const hasOwner =
                        !!salon.ownerId;


                    const image =
                        salon.image ||
                        "https://via.placeholder.com/600x350?text=K%40si+Web";


                    card.innerHTML = `

                        <div>

                            <img
                                src="${escapeHtml(
                                    image
                                )}"
                                alt="${escapeHtml(
                                    salon.name
                                )}"
                                class="salon-image"
                                loading="lazy"
                                onerror="
                                    this.onerror=null;
                                    this.src='https://via.placeholder.com/600x350?text=K%40si+Web';
                                "
                            >


                            <div class="p-5">

                                <h3
                                    class="text-xl font-bold mb-2 text-blue-400"
                                >
                                    ${escapeHtml(
                                        salon.name
                                    )}
                                </h3>


                                <p
                                    class="text-sm text-gray-300 mb-1"
                                >

                                    <i
                                        class="bx bx-map text-purple-400"
                                    ></i>

                                    ${escapeHtml(
                                        salon.location
                                    )}

                                </p>


                                <p
                                    class="text-sm text-gray-400 mb-4"
                                >

                                    <i
                                        class="bx bx-time text-purple-400"
                                    ></i>

                                    ${escapeHtml(
                                        salon.hours
                                    )}

                                </p>


                                <div
                                    class="text-xs text-gray-400 leading-6"
                                >

                                    ${servicePreview}

                                </div>


                                ${
                                    salon.id ===
                                    EXPECTED_SALON_ID

                                        ? `

                                            <div
                                                class="mt-3 text-[10px] text-blue-400"
                                            >
                                                ✓ Expected salon found
                                            </div>

                                          `

                                        : ""
                                }

                            </div>

                        </div>


                        <div
                            class="px-5 pb-5"
                        >

                            ${
                                !hasOwner

                                    ? `

                                        <small
                                            style="
                                                color:#ff4757;
                                                display:block;
                                                margin-bottom:8px;
                                                font-weight:700;
                                            "
                                        >
                                            ⚠️ Owner connection missing
                                        </small>

                                      `

                                    : ""
                            }


                            <button
                                class="primary-btn bookBtn"
                                data-id="${escapeHtml(
                                    salon.id
                                )}"
                                ${
                                    !hasOwner
                                        ? "disabled"
                                        : ""
                                }
                            >

                                ${
                                    hasOwner
                                        ? "Book Now"
                                        : "Not Available"
                                }

                            </button>

                        </div>

                    `;


                    salonList.appendChild(
                        card
                    );

                }


                /* ============================
                   SEARCH
                ============================ */

                function executeSearch() {

                    const term =
                        searchBar
                            ? searchBar.value
                                .toLowerCase()
                                .trim()
                            : "";


                    const filtered =
                        allSalons.filter(
                            salon => {

                                const name =
                                    String(
                                        salon.name ||
                                        ""
                                    )
                                        .toLowerCase();


                                const location =
                                    String(
                                        salon.location ||
                                        ""
                                    )
                                        .toLowerCase();


                                return (
                                    name.includes(
                                        term
                                    ) ||
                                    location.includes(
                                        term
                                    )
                                );

                            }
                        );


                    renderSalonList(
                        filtered
                    );

                }


                if (
                    searchBar
                ) {

                    searchBar.addEventListener(
                        "input",
                        executeSearch
                    );

                }


                if (
                    searchBtn
                ) {

                    searchBtn.addEventListener(
                        "click",
                        executeSearch
                    );

                }


                /* ============================
                   BOOK BUTTON
                ============================ */

                salonList.addEventListener(
                    "click",
                    event => {

                        const bookBtn =
                            event.target.closest(
                                ".bookBtn"
                            );


                        if (!bookBtn) {
                            return;
                        }


                        if (
                            bookBtn.disabled
                        ) {

                            return;

                        }


                        const currentUser =
                            auth.currentUser;


                        if (!currentUser) {

                            alert(
                                "Please login first to book an appointment."
                            );


                            window.location.href =
                                "index.html";


                            return;

                        }


                        selectedSalonId =
                            bookBtn.dataset.id;


                        selectedSalonData =
                            allSalons.find(
                                salon =>
                                    salon.id ===
                                    selectedSalonId
                            );


                        if (
                            !selectedSalonData
                        ) {

                            alert(
                                "Salon information could not be found."
                            );


                            return;

                        }


                        if (
                            !selectedSalonData.ownerId
                        ) {

                            alert(
                                "This salon is not connected to a salon owner yet."
                            );


                            return;

                        }


                        populateServices(
                            selectedSalonData
                        );


                        bookingModal.classList.add(
                            "active"
                        );

                    }
                );


                /* ============================
                   SERVICES
                ============================ */

                function populateServices(
                    salon
                ) {

                    serviceSelect.innerHTML =
                        "";


                    const services =
                        Array.isArray(
                            salon.services
                        )
                            ? salon.services
                            : [];


                    if (
                        !services.length
                    ) {

                        serviceSelect.innerHTML = `

                            <option value="">
                                No services available
                            </option>

                        `;


                        return;

                    }


                    services.forEach(
                        service => {

                            const name =
                                service?.name ||
                                "General Service";


                            const price =
                                Number(
                                    service?.price
                                ) || 0;


                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                JSON.stringify({

                                    name:
                                        name,

                                    price:
                                        price

                                });


                            option.textContent =
                                `${name} — R${price}`;


                            serviceSelect.appendChild(
                                option
                            );

                        }
                    );

                }


                /* ============================
                   CLOSE MODAL
                ============================ */

                function closeBookingModal() {

                    bookingModal.classList.remove(
                        "active"
                    );


                    selectedSalonId =
                        null;


                    selectedSalonData =
                        null;

                }


                closeModalBtn.addEventListener(
                    "click",
                    closeBookingModal
                );


                bookingModal.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target ===
                            bookingModal
                        ) {

                            closeBookingModal();

                        }

                    }
                );


                /* ============================
                   CREATE BOOKING
                ============================ */

                bookingForm.addEventListener(
                    "submit",
                    async event => {

                        event.preventDefault();


                        const currentUser =
                            auth.currentUser;


                        if (!currentUser) {

                            alert(
                                "Please login first."
                            );


                            return;

                        }


                        if (
                            !selectedSalonId ||
                            !selectedSalonData
                        ) {

                            alert(
                                "Please select a salon first."
                            );


                            return;

                        }


                        if (
                            !selectedSalonData.ownerId
                        ) {

                            alert(
                                "This salon is not connected to a salon owner."
                            );


                            return;

                        }


                        let serviceName =
                            "General Service";


                        let servicePrice =
                            0;


                        if (
                            serviceSelect.value
                        ) {

                            try {

                                const service =
                                    JSON.parse(
                                        serviceSelect.value
                                    );


                                serviceName =
                                    service.name ||
                                    "General Service";


                                servicePrice =
                                    Number(
                                        service.price
                                    ) || 0;

                            } catch (
                                error
                            ) {

                                console.error(
                                    error
                                );

                            }

                        }


                        const customerName =
                            document
                                .getElementById(
                                    "custName"
                                )
                                .value
                                .trim();


                        const phone =
                            document
                                .getElementById(
                                    "custPhone"
                                )
                                .value
                                .trim();


                        const date =
                            document
                                .getElementById(
                                    "custDate"
                                )
                                .value;


                        const time =
                            document
                                .getElementById(
                                    "custTime"
                                )
                                .value;


                        if (
                            !customerName ||
                            !phone ||
                            !date ||
                            !time
                        ) {

                            alert(
                                "Please complete all booking fields."
                            );


                            return;

                        }


                        confirmBookingBtn.disabled =
                            true;


                        confirmBookingBtn.textContent =
                            "Booking...";


                        try {

                            const bookingData = {

                                userId:
                                    currentUser.uid,

                                customerName:
                                    customerName,

                                name:
                                    customerName,

                                phone:
                                    phone,

                                salonId:
                                    selectedSalonId,

                                salonName:
                                    selectedSalonData.name,

                                salon:
                                    selectedSalonData.name,

                                ownerId:
                                    selectedSalonData.ownerId,

                                service:
                                    serviceName,

                                price:
                                    servicePrice,

                                date:
                                    date,

                                time:
                                    time,

                                status:
                                    "pending",

                                createdAt:
                                    firebase.firestore
                                        .FieldValue
                                        .serverTimestamp(),

                                updatedAt:
                                    firebase.firestore
                                        .FieldValue
                                        .serverTimestamp()

                            };


                            console.log(
                                "CREATING BOOKING:",
                                bookingData
                            );


                            const bookingRef =
                                await db
                                    .collection(
                                        "bookings"
                                    )
                                    .add(
                                        bookingData
                                    );


                            console.log(
                                "BOOKING CREATED:",
                                bookingRef.id
                            );


                            alert(
                                "Booking placed! Owner will approve soon 💈"
                            );


                            bookingForm.reset();


                            closeBookingModal();


                            updateBookingCount();

                        } catch (
                            error
                        ) {

                            console.error(
                                "BOOKING ERROR:",
                                error
                            );


                            alert(
                                "Booking failed: " +
                                error.message
                            );

                        } finally {

                            confirmBookingBtn.disabled =
                                false;


                            confirmBookingBtn.textContent =
                                "Confirm Booking";

                        }

                    }
                );


                /* ============================
                   BOOKING COUNT
                ============================ */

                function updateBookingCount() {

                    if (
                        bookingsUnsubscribe
                    ) {

                        bookingsUnsubscribe();

                        bookingsUnsubscribe =
                            null;

                    }


                    const now =
                        new Date();


                    const today =
                        [

                            now.getFullYear(),

                            String(
                                now.getMonth() + 1
                            ).padStart(
                                2,
                                "0"
                            ),

                            String(
                                now.getDate()
                            ).padStart(
                                2,
                                "0"
                            )

                        ].join("-");


                    bookingsUnsubscribe =
                        db
                            .collection(
                                "bookings"
                            )
                            .where(
                                "date",
                                "==",
                                today
                            )
                            .onSnapshot(

                                snapshot => {

                                    bookingsToday.textContent =
                                        `${snapshot.size} booking${snapshot.size === 1 ? "" : "s"} today`;

                                },

                                error => {

                                    console.error(
                                        "Booking count error:",
                                        error
                                    );


                                    bookingsToday.textContent =
                                        "0 bookings today";

                                }

                            );

                }


                /* ============================
                   LOGOUT
                ============================ */

                logoutBtn.onclick =
                    async () => {

                        try {

                            await auth.signOut();


                            window.location.href =
                                "index.html";

                        } catch (
                            error
                        ) {

                            console.error(
                                "Logout error:",
                                error
                            );


                            alert(
                                "Logout failed: " +
                                error.message
                            );

                        }

                    };


                /* ============================
                   START
                ============================ */

                updateDebug(
                    "Starting Firestore diagnostic..."
                );


                testExpectedSalon();


                loadSalons();


                updateBookingCount();


                console.log(
                    "================================"
                );


                console.log(
                    "K@si Web salons.html READY"
                );


                console.log(
                    "Firebase project:",
                    firebase.app()
                        .options
                        .projectId
                );


                console.log(
                    "Expected Salon:",
                    EXPECTED_SALON_ID
                );


                console.log(
                    "Expected Owner:",
                    EXPECTED_OWNER_ID
                );


                console.log(
                    "================================"
                );

            }
        );

    </script>

</body>

</html>
