<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Kasi Cut</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f0f0f 0%, #1a0a2e 100%); }
   .glass { backdrop-filter: blur(12px); background: rgba(17, 17, 17, 0.7); border: 1px solid rgba(139, 92, 246, 0.2); }
   .glow:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
  </style>
</head>
<body class="text-white min-h-screen">

  <nav class="glass sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
    <h2 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Kasi Cut</h2>
    <div class="flex gap-3">
      <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-5 py-2 rounded-xl font-semibold transition">🏠 Home</a>
      <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-xl font-semibold transition hidden">Logout</button>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-5xl font-extrabold text-center mb-2 bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">🔥 Book Your Kasi Cut 🔥</h1>
    <p class="text-center text-gray-400 mb-8">Find the best barbers near you in Soweto</p>
    <div id="loginStatus" class="text-center mb-6 px-4 py-2 rounded-lg glass max-w-md mx-auto"></div>
    <div id="salonsList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </div>

  <!-- BOOKING POPUP -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-black bg-opacity-80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="glass p-8 rounded-2xl w-full max-w-md glow">
      <h2 class="text-3xl font-bold mb-6 text-center bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Book Appointment</h2>
      <input id="clientName" type="text" placeholder="Your Name" class="w-full p-3 mb-4 rounded-xl bg-gray-900/50 border-gray-700 outline-none">
      <input id="clientNumber" type="tel" placeholder="Your Number" class="w-full p-3 mb-4 rounded-xl bg-gray-900/50 border-gray-700 outline-none">
      <select id="serviceSelect" class="w-full p-3 mb-4 rounded-xl bg-gray-900/50 border-gray-700 outline-none"></select>
      <div class="grid grid-cols-2 gap-4">
        <input id="bookingDate" type="date" class="w-full p-3 mb-4 rounded-xl bg-gray-900/50 border-gray-700 outline-none">
        <input id="bookingTime" type="time" class="w-full p-3 mb-4 rounded-xl bg-gray-900/50 border-gray-700 outline-none">
      </div>
      <button id="confirmBooking" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 p-4 rounded-xl font-bold mb-3">Confirm Booking 🔥</button>
      <button onclick="closeModal()" class="w-full bg-gray-800 p-3 rounded-xl">Cancel</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
    authDomain: "kasi-web-d073f.firebaseapp.com",
    projectId: "kasi-web-d073f",
    storageBucket: "kasi-web-d073f.firebasestorage.app",
    messagingSenderId: "471544855566",
    appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  let currentUser = null;
  let selectedSalonId = null;

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    const logoutBtn = document.getElementById("logoutBtn");
    if(user){
      document.getElementById("loginStatus").innerHTML = `👋 Welcome back, ${user.email}`;
      logoutBtn.classList.remove("hidden");
    } else {
      document.getElementById("loginStatus").innerHTML = `⚠️ Please login first to book`;
      logoutBtn.classList.add("hidden");
    }
    loadSalons();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });

  async function loadSalons() {
    const snapshot = await getDocs(collection(db, "salons"));
    let html = "";
    snapshot.forEach((doc) => {
      const s = doc.data();
      html += `
        <div class="glass rounded-2xl p-6 glow">
          <img src="${s.image || 'https://via.placeholder.com/400x200'}" class="w-full h-48 object-cover rounded-xl mb-4">
          <h2 class="text-2xl font-bold mb-2 text-purple-400">${s.name}</h2>
          <p class="text-gray-400 mb-4">📍 ${s.location}</p>
          <button onclick='openModal("${doc.id}", "${s.name}", ${JSON.stringify(s.services || [])})' class="w-full bg-gradient-to-r from-purple-600 to-pink-600 p-4 rounded-xl font-bold">Book Now</button>
        </div>
      `;
    });
    document.getElementById("salonsList").innerHTML = html;
  }

  window.openModal = function(salonId, salonName, services) {
    if(!currentUser){ alert("Please login first!"); return; }
    selectedSalonId = salonId;
    const serviceSelect = document.getElementById("serviceSelect");
    serviceSelect.innerHTML = `<option value="">-- Choose a service --</option>`;
    services.forEach(svc => {
      serviceSelect.innerHTML += `<option value="${svc.name}|${svc.price}">${svc.name} - R${svc.price}</option>`;
    });
    document.getElementById("bookingDate").min = new Date().toISOString().split("T")[0];
    document.getElementById("bookingModal").classList.remove("hidden");
  }

  window.closeModal = function() {
    document.getElementById("bookingModal").classList.add("hidden");
  }

  document.getElementById("confirmBooking").addEventListener("click", async () => {
    const name = document.getElementById("clientName").value;
    const number = document.getElementById("clientNumber").value;
    const [serviceName, servicePrice] = document.getElementById("serviceSelect").value.split('|');
    const date = document.getElementById("bookingDate").value;
    const time = document.getElementById("bookingTime").value;

    await addDoc(collection(db, "bookings"), {
      salonId: selectedSalonId,
      clientId: currentUser.uid,
      name: name,
      number: number,
      service: serviceName,
      price: servicePrice,
      date: date,
      time: time,
      status: "pending",
      createdAt: new Date()
    });
    alert(`✅ Booking sent!`);
    closeModal();
  });
</script>
</body>
</html>
