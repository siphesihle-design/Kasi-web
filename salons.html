<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="K@si Web - Find salons and book your next haircut."
    >

    <title>K@si Web | Salons</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {

            padding-bottom:
                calc(95px + env(safe-area-inset-bottom));

            background:
                linear-gradient(
                    135deg,
                    #0a0a1a 0%,
                    #1a0a3e 100%
                );

            color: #fff;

            min-height: 100vh;

        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            z-index: 9990 !important;
        }


        /* =========================================
           BOTTOM NAV
        ========================================= */

        .nav-grid {

            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            min-height: 78px;

            background:
                rgba(17, 24, 39, 0.98);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            border-top:
                1px solid
                rgba(75, 85, 99, 0.45);

            display: flex;

            justify-content:
                space-around;

            align-items:
                center;

            z-index: 9998;

            padding:
                5px
                8px
                calc(
                    5px +
                    env(safe-area-inset-bottom)
                );

        }


        .nav-item {

            flex:
                1;

            max-width:
                110px;

            height:
                68px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            color:
                #9ca3af;

            text-decoration:
                none;

            font-size:
                0.78rem;

            font-weight:
                700;

            border-radius:
                18px;

            transition:
                all 0.2s ease;

        }


        .nav-item i {

            font-size:
                1.9rem;

            line-height:
                1;

            margin-bottom:
                5px;

        }


        .nav-item span {

            line-height:
                1;

        }


        .nav-item.active {

            color:
                #a855f7;

            background:
                rgba(
                    126,
                    34,
                    206,
                    0.13
                );

        }


        .nav-item:hover {

            color:
                #a855f7;

        }


        /* =========================================
           SALON CARD
        ========================================= */

        .salon-card {

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;

            background:
                rgba(
                    17,
                    17,
                    30,
                    0.82
                );

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border:
                1px solid
                rgba(
                    59,
                    130,
                    246,
                    0.3
                );

            border-radius:
                1rem;

            overflow:
                hidden;

        }


        .salon-card:hover {

            transform:
                translateY(-3px);

            border-color:
                #9333ea;

        }


        .salon-image {

            width:
                100%;

            height:
                210px;

            object-fit:
                cover;

            object-position:
                center;

            display:
                block;

            background:
                #111827;

        }


        /* =========================================
           PRIMARY BUTTON
        ========================================= */

        .primary-btn {

            background:
                linear-gradient(
                    90deg,
                    #3b82f6,
                    #8b5cf6
                );

            border:
                none;

            color:
                white;

            padding:
                0.9rem 1.25rem;

            border-radius:
                0.75rem;

            font-weight:
                bold;

            width:
                100%;

            cursor:
                pointer;

            transition:
                all 0.2s ease;

        }


        .primary-btn:hover {

            opacity:
                0.9;

            transform:
                translateY(-2px);

        }


        .primary-btn:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

            transform:
                none;

        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {

            display:
                none;

            position:
                fixed;

            inset:
                0;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.82
                );

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            justify-content:
                center;

            align-items:
                center;

            z-index:
                10000;

            padding:
                1rem;

            overflow-y:
                auto;

        }


        .modal.active {

            display:
                flex;

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading-box {

            text-align:
                center;

            padding:
                50px 20px;

            color:
                #9ca3af;

        }


        .loading-box i {

            display:
                block;

            font-size:
                3rem;

            color:
                #3b82f6;

            margin-bottom:
                12px;

        }


        /* =========================================
           EMPTY
        ========================================= */

        .empty-state {

            text-align:
                center;

            padding:
                60px 20px;

            color:
                #9ca3af;

        }


        .empty-state i {

            font-size:
                4rem;

            color:
                #8b8b98;

            margin-bottom:
                15px;

        }


        .empty-state h3 {

            color:
                #c7c7d1;

            font-size:
                1.25rem;

            font-weight:
                700;

            margin-bottom:
                8px;

        }


        .empty-state p {

            color:
                #888895;

            font-size:
                0.95rem;

        }


        /* =========================================
           ERROR
        ========================================= */

        .error-state {

            text-align:
                center;

            padding:
                40px 20px;

            color:
                #ff4757;

        }


        .error-state i {

            font-size:
                3rem;

            margin-bottom:
                10px;

        }


        .error-state p {

            font-weight:
                700;

            margin-bottom:
                6px;

        }


        .error-state small {

            color:
                #aaa;

            display:
                block;

            word-break:
                break-word;

        }


        /* =========================================
           STATUS
        ========================================= */

        #firebaseStatus {

            position:
                fixed;

            top:
                90px;

            left:
                50%;

            transform:
                translateX(-50%);

            z-index:
                9990;

            display:
                none;

            max-width:
                90%;

            padding:
                8px 14px;

            border-radius:
                999px;

            font-size:
                11px;

            font-weight:
                700;

            background:
                rgba(
                    17,
                    24,
                    39,
                    0.95
                );

            border:
                1px solid
                rgba(
                    59,
                    130,
                    246,
                    0.4
                );

            color:
                #93c5fd;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.3
                );

            text-align:
                center;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 640px) {

            main {

                padding-top:
                    28px;

            }


            .salon-image {

                height:

            }


            .nav-item {

                max-width:
                    105px;

            }


            .nav-item i {

                font-size:
                    1.8rem;

            }


            #firebaseStatus {

                top:
                    85px;

            }

        }

    </style>

</head>

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {


        /* =====================================
           ELEMENTS
        ===================================== */

        const salonList =
            document.getElementById(
                "salonList"
            );


        const searchBar =
            document.getElementById(
                "searchBar"
            );


        const searchBtn =
            document.getElementById(
                "searchBtn"
            );


        const bookingModal =
            document.getElementById(
                "bookingModal"
            );


        const bookingForm =
            document.getElementById(
                "bookingForm"
            );


        const closeModalBtn =
            document.getElementById(
                "closeModalBtn"
            );


        const bookingSalonName =
            document.getElementById(
                "bookingSalonName"
            );


        const bookingSalonLocation =
            document.getElementById(
                "bookingSalonLocation"
            );


        const serviceType =
            document.getElementById(
                "serviceType"
            );


        const custName =
            document.getElementById(
                "custName"
            );


        const custPhone =
            document.getElementById(
                "custPhone"
            );


        const custDate =
            document.getElementById(
                "custDate"
            );


        const custTime =
            document.getElementById(
                "custTime"
            );


        const confirmBookingBtn =
            document.getElementById(
                "confirmBookingBtn"
            );


        const adminBtn =
            document.getElementById(
                "adminBtn"
            );


        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        const bookingsToday =
            document.getElementById(
                "bookingsToday"
            );


        const firebaseStatus =
            document.getElementById(
                "firebaseStatus"
            );


        /* =====================================
           CURRENT CANONICAL SALON
        ===================================== */

        const CANONICAL_SALON_ID =
            "x6PAOuL1w4W13yg5xIWC";


        const CANONICAL_OWNER_ID =
            "prgctpY58cVmPocgLuSRLRMajOI2";


        const DEFAULT_SALON_IMAGE =
            "https://raw.githubusercontent.com/siphesihle-design/Kasi-web/refs/heads/main/9C00E0.jpeg";


        let allSalons = [];


        let selectedSalon =
            null;


        let salonUnsubscribe =
            null;


        let bookingUnsubscribe =
            null;


        /* =====================================
           HELPERS
        ===================================== */

        function escapeHtml(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function formatDate(
            date = new Date()
        ) {

            return [

                date.getFullYear(),

                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                ),

                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                )

            ].join("-");

        }


        function showStatus(
            message,
            error = false
        ) {

            firebaseStatus.textContent =
                message;


            firebaseStatus.style.display =
                "block";


            firebaseStatus.style.color =
                error
                    ? "#fca5a5"
                    : "#93c5fd";


            firebaseStatus.style.borderColor =
                error
                    ? "rgba(239,68,68,.5)"
                    : "rgba(59,130,246,.4)";


            clearTimeout(
                firebaseStatus._timer
            );


            firebaseStatus._timer =
                setTimeout(
                    () => {

                        firebaseStatus.style.display =
                            "none";

                    },
                    4000
                );

        }


        /* =====================================
           NORMALIZE SERVICES
        ===================================== */

        function normalizeServices(
            rawServices
        ) {

            if (
                !Array.isArray(
                    rawServices
                )
            ) {

                return [];

            }


            return rawServices
                .map(
                    service => {

                        if (
                            typeof service ===
                            "string"
                        ) {

                            return {

                                name:
                                    service,

                                price:
                                    0

                            };

                        }


                        if (
                            service &&
                            typeof service ===
                            "object"
                        ) {

                            return {

                                name:
                                    service.name ||
                                    service.service ||
                                    "Service",

                                price:
                                    Number(
                                        service.price
                                    ) || 0

                            };

                        }


                        return null;

                    }
                )
                .filter(
                    Boolean
                );

        }


        /* =====================================
           CLICK SOUND
        ===================================== */

        const clickSound =
            document.getElementById(
                "clickSound"
            );


        if (clickSound) {

            clickSound.volume =
                0.4;

        }


        function playClick() {

            if (clickSound) {

                clickSound.currentTime =
                    0;

                clickSound
                    .play()
                    .catch(
                        () => {}
                    );

            }


            if (
                navigator.vibrate
            ) {

                navigator.vibrate(
                    25
                );

            }

        }


        document.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {

                    playClick();

                }

            }
        );


        /* =====================================
           DATE
        ===================================== */

        const today =
            new Date();


        const maxDate =
            new Date();


        maxDate.setDate(
            today.getDate() + 30
        );


        custDate.min =
            formatDate(
                today
            );


        custDate.max =
            formatDate(
                maxDate
            );


        custDate.value =
            formatDate(
                today
            );


        /* =====================================
           AUTH
        ===================================== */

        auth.onAuthStateChanged(
            async user => {

                console.log(
                    "AUTH:",
                    user
                        ? user.uid
                        : "not logged in"
                );


                if (!user) {

                    logoutBtn.classList.add(
                        "hidden"
                    );


                    adminBtn.classList.add(
                        "hidden"
                    );


                    stopBookingListener();


                    bookingsToday.textContent =
                        "0 bookings today";


                    return;

                }


                logoutBtn.classList.remove(
                    "hidden"
                );


                try {

                    const userSnap =
                        await db
                            .collection(
                                "users"
                            )
                            .doc(
                                user.uid
                            )
                            .get();


                    const userData =
                        userSnap.exists
                            ? userSnap.data() || {}
                            : {};


                    const role =
                        userData.role ||
                        "customer";


                    console.log(
                        "USER UID:",
                        user.uid
                    );


                    console.log(
                        "USER ROLE:",
                        role
                    );


                    if (
                        role ===
                        "admin"
                    ) {

                        adminBtn.classList.remove(
                            "hidden"
                        );


                        adminBtn.innerHTML = `

                            <i class="bx bx-shield-alt-2"></i>

                            Admin

                        `;

        /* =====================================
           LOAD SALONS
        ===================================== */

        function loadSalons() {

            if (
                salonUnsubscribe
            ) {

                salonUnsubscribe();

            }


            salonList.innerHTML = `

                <div class="loading-box col-span-full">

                    <i class="bx bx-loader-alt bx-spin"></i>

                    <p>
                        Loading salons near you...
                    </p>

                </div>

            `;


            /*
             * IMPORTANT
             *
             * We now read ONLY the canonical salon
             * document instead of displaying duplicate
             * salon documents.
             */

            salonUnsubscribe =
                db
                    .collection(
                        "salons"
                    )
                    .doc(
                        CANONICAL_SALON_ID
                    )
                    .onSnapshot(

                        snapshot => {

                            console.log(
                                "CANONICAL SALON EXISTS:",
                                snapshot.exists
                            );


                            if (
                                !snapshot.exists
                            ) {

                                allSalons =
                                    [];


                                renderSalons(
                                    []
                                );


                                showStatus(
                                    "Your salon document was not found",
                                    true
                                );


                                return;

                            }


                            const data =
                                snapshot.data() ||
                                {};


                            const rawServices =
                                data.services;


                            const services =
                                normalizeServices(
                                    rawServices
                                );


                            const ownerId =
                                data.ownerId ||
                                data.OwnerId ||
                                CANONICAL_OWNER_ID ||
                                null;


                            const location =
                                data.location ||
                                data.address ||
                                data.area ||
                                "Location not set";


                            const hours =
                                data.hours ||
                                data.time ||
                                data.openingHours ||
                                "06:00 - 18:00";


                            const image =
                                data.image ||
                                data.photo ||
                                data.imageUrl ||
                                DEFAULT_SALON_IMAGE;


                            const salon = {

                                id:
                                    snapshot.id,


                                salonId:
                                    snapshot.id,


                                ownerId:
                                    ownerId,


                                ownerEmail:
                                    data.ownerEmail ||
                                    data.email ||
                                    "",


                                name:
                                    data.name ||
                                    "Unnamed Salon",


                                location:
                                    location,


                                hours:
                                    hours,


                                image:
                                    image,


                                services:
                                    services

                            };


                            console.log(
                                "================================"
                            );


                            console.log(
                                "SALON DOCUMENT:",
                                snapshot.id
                            );


                            console.log(
                                "SALON NAME:",
                                salon.name
                            );


                            console.log(
                                "SALON OWNER:",
                                salon.ownerId
                            );


                            console.log(
                                "SALON LOCATION:",
                                salon.location
                            );


                            console.log(
                                "SALON SERVICES:",
                                salon.services
                            );


                            console.log(
                                "================================"
                            );


                            allSalons = [
                                salon
                            ];


                            renderSalons(
                                allSalons
                            );


                            showStatus(
                                "Salon loaded"
                            );

                        },


                        error => {

                            console.error(
                                "SALON LOAD ERROR:",
                                error
                            );


                            salonList.innerHTML = `

                                <div class="error-state col-span-full">

                                    <i class="bx bx-error-circle"></i>

                                    <p>
                                        Failed to load salon
                                    </p>

                                    <small>
                                        ${escapeHtml(
                                            error.message ||
                                            "Firestore error"
                                        )}
                                    </small>

                                    <br>

                                    <small>
                                        Code:
                                        ${escapeHtml(
                                            error.code ||
                                            "unknown"
                                        )}
                                    </small>

                                </div>

                            `;


                            showStatus(
                                "Unable to load salon",
                                true
                            );

                        }

                    );

        }
