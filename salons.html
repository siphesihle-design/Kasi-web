<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Salon Details | K@si Web</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

  <div
    id="salon-container"
    class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-6"
  >
    <div class="text-center py-10">
      <div
        class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-4"
      ></div>

      <p class="text-gray-500">
        Loading salon details...
      </p>
    </div>
  </div>


  <script type="module">

    // ============================================================
    // FIREBASE IMPORTS
    // ============================================================

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    //
    // IMPORTANT:
    // Replace these values with the SAME Firebase configuration
    // used by your K@si Web application.
    //
    // Project ID must be:
    // kasi-web-d073f
    //
    // ============================================================

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain:
        "kasi-web-d073f.firebaseapp.com",

      projectId:
        "kasi-web-d073f",

      storageBucket:
        "YOUR_STORAGE_BUCKET",

      messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

      appId:
        "YOUR_APP_ID"
    };


    // ============================================================
    // INITIALIZE FIREBASE
    // ============================================================

    let app;
    let db;

    try {

      app = initializeApp(firebaseConfig);

      db = getFirestore(app);

      console.log("Firebase initialized successfully.");

      console.log(
        "Firebase project:",
        firebaseConfig.projectId
      );

    } catch (error) {

      console.error(
        "Firebase initialization failed:",
        error
      );

      document.getElementById("salon-container").innerHTML = `
        <div class="text-center py-8">

          <h2 class="text-xl font-bold text-red-600 mb-2">
            Firebase Error
          </h2>

          <p class="text-gray-600">
            Firebase could not be initialized.
          </p>

        </div>
      `;
    }


    // ============================================================
    // EXACT SALON DOCUMENT ID
    // ============================================================
    //
    // IMPORTANT:
    //
    // CORRECT:
    // Sv4zu4jERDR65IuURdss
    //
    // WRONG:
    // Sv4zu4jERDR65luURdss
    //
    // The character after "65" is CAPITAL "I".
    //
    // ============================================================

    const salonId =
      "Sv4zu4jERDR65IuURdss";


    // ============================================================
    // LOAD SALON
    // ============================================================

    async function loadSalonData() {

      const container =
        document.getElementById("salon-container");


      if (!db) {

        container.innerHTML = `
          <div class="text-center py-8">

            <h2 class="text-xl font-bold text-red-600 mb-2">
              Database unavailable
            </h2>

            <p class="text-gray-600">
              Firebase was not initialized correctly.
            </p>

          </div>
        `;

        return;
      }


      try {

        console.log(
          "Fetching salon document:"
        );

        console.log(
          `salons/${salonId}`
        );


        // ========================================================
        // CREATE DOCUMENT REFERENCE
        // ========================================================

        const salonRef =
          doc(
            db,
            "salons",
            salonId
          );


        // ========================================================
        // GET DOCUMENT
        // ========================================================

        const salonSnapshot =
          await getDoc(salonRef);


        console.log(
          "Document exists:",
          salonSnapshot.exists()
        );


        // ========================================================
        // SALON DOES NOT EXIST
        // ========================================================

        if (!salonSnapshot.exists()) {

          container.innerHTML = `

            <div class="text-center py-8">

              <div class="text-5xl mb-4">
                🔍
              </div>

              <h2
                class="text-xl font-bold text-red-600 mb-2"
              >
                Salon Not Found
              </h2>

              <p class="text-gray-600 mb-4">
                No salon document was found using this ID:
              </p>

              <code
                class="inline-block bg-gray-100 px-3 py-2 rounded text-sm break-all"
              >
                ${salonId}
              </code>

            </div>

          `;

          return;
        }


        // ========================================================
        // GET SALON DATA
        // ========================================================

        const salon =
          salonSnapshot.data();


        console.log(
          "Salon data:",
          salon
        );


        // ========================================================
        // SAFE VALUES
        // ========================================================

        const name =
          salon.name || "Unnamed Salon";

        const location =
          salon.location || "Location not provided";

        const hours =
          salon.hours || "Hours not provided";

        const email =
          salon.email || "Email not provided";

        const image =
          salon.image ||
          "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1000&q=80";


        // ========================================================
        // SERVICES
        // ========================================================

        const services =
          Array.isArray(salon.services)
            ? salon.services
            : [];


        let servicesHTML = "";


        if (services.length > 0) {

          servicesHTML =
            services.map((service) => {

              const serviceName =
                service?.name ||
                "Unnamed service";

              const servicePrice =
                service?.price !== undefined &&
                service?.price !== null &&
                service?.price !== ""
                  ? service.price
                  : "0";


              return `

                <li
                  class="py-4 flex items-center justify-between gap-4"
                >

                  <span
                    class="font-medium text-gray-800"
                  >
                    ${escapeHTML(serviceName)}
                  </span>

                  <span
                    class="font-bold text-blue-600 whitespace-nowrap"
                  >
                    R${escapeHTML(String(servicePrice))}
                  </span>

                </li>

              `;

            }).join("");

        } else {

          servicesHTML = `

            <li
              class="py-4 text-gray-500 text-center"
            >
              No services listed
            </li>

          `;
        }


        // ========================================================
        // RENDER SALON
        // ========================================================

        container.innerHTML = `

          <!-- IMAGE -->

          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(name)}"
            class="w-full h-56 object-cover rounded-lg mb-5"
            onerror="
              this.src='https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1000&q=80'
            "
          />


          <!-- SALON NAME -->

          <h1
            class="text-3xl font-bold text-gray-900 mb-2"
          >
            ${escapeHTML(name)}
          </h1>


          <!-- LOCATION -->

          <div class="flex items-start gap-2 mb-3">

            <span class="text-xl">
              📍
            </span>

            <p class="text-gray-600">
              <strong>Location:</strong>
              ${escapeHTML(location)}
            </p>

          </div>


          <!-- HOURS -->

          <div class="flex items-start gap-2 mb-3">

            <span class="text-xl">
              🕒
            </span>

            <p class="text-gray-600">
              <strong>Hours:</strong>
              ${escapeHTML(hours)}
            </p>

          </div>


          <!-- EMAIL -->

          <div class="flex items-start gap-2 mb-6">

            <span class="text-xl">
              ✉️
            </span>

            <p class="text-gray-600 break-all">
              <strong>Email:</strong>
              ${escapeHTML(email)}
            </p>

          </div>


          <!-- SERVICES -->

          <div class="border-t pt-5">

            <h2
              class="text-xl font-bold text-gray-900 mb-3"
            >
              Services
            </h2>

            <ul
              class="divide-y divide-gray-200"
            >

              ${servicesHTML}

            </ul>

          </div>


          <!-- DEBUG INFO -->

          <div
            class="mt-6 bg-gray-50 border rounded-lg p-3"
          >

            <p
              class="text-xs text-gray-500"
            >
              Salon ID
            </p>

            <code
              class="text-xs text-gray-700 break-all"
            >
              ${salonId}
            </code>

          </div>

        `;

      } catch (error) {

        console.error(
          "Error fetching salon:",
          error
        );


        // ========================================================
        // FIRESTORE PERMISSION ERROR
        // ========================================================

        if (
          error.code ===
          "permission-denied"
        ) {

          container.innerHTML = `

            <div class="text-center py-8">

              <div class="text-5xl mb-4">
                🔒
              </div>

              <h2
                class="text-xl font-bold text-red-600 mb-2"
              >
                Permission Denied
              </h2>

              <p class="text-gray-600">
                Firestore rules are preventing this page
                from reading the salon.
              </p>

            </div>

          `;

          return;
        }


        // ========================================================
        // GENERAL ERROR
        // ========================================================

        container.innerHTML = `

          <div class="text-center py-8">

            <div class="text-5xl mb-4">
              ⚠️
            </div>

            <h2
              class="text-xl font-bold text-red-600 mb-2"
            >
              Failed to Load Salon
            </h2>

            <p class="text-gray-600 mb-4">
              Check the browser console for the exact error.
            </p>

            <code
              class="block bg-red-50 text-red-700 p-3 rounded text-xs text-left break-all"
            >
              ${escapeHTML(error.message || String(error))}
            </code>

          </div>

        `;
      }
    }


    // ============================================================
    // HTML ESCAPE
    // ============================================================

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ============================================================
    // START
    // ============================================================

    loadSalonData();

  </script>

</body>
</html>
