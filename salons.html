<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="K@si Web - Find salons and book your next haircut."
    >

    <title>K@si Web | Salons</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            padding-bottom: 95px;

            background:
                linear-gradient(
                    135deg,
                    #0a0a1a 0%,
                    #1a0a3e 100%
                );

            color: #fff;

            min-height: 100vh;
        }


        /* =========================================
           BOTTOM NAV
        ========================================= */

        .nav-grid {

            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            min-height: 72px;

            background:
                rgba(17, 24, 39, 0.97);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-top:
                1px solid
                rgba(75, 85, 99, 0.45);

            display: flex;

            justify-content: space-around;
            align-items: center;

            z-index: 9998;

            padding:
                4px
                8px
                calc(
                    4px +
                    env(safe-area-inset-bottom)
                );
        }


        .nav-item {

            width: 90px;
            height: 62px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            color: #9ca3af;

            text-decoration: none;

            font-size: 0.78rem;

            font-weight: 700;

            border-radius: 18px;

            transition:
                all 0.2s ease;
        }


        .nav-item i {

            font-size: 1.7rem;

            margin-bottom: 2px;
        }


        .nav-item.active {

            color: #a855f7;

            background:
                rgba(126, 34, 206, 0.13);
        }


        .nav-item:hover {

            color: #a855f7;
        }


        /* =========================================
           SALON CARD
        ========================================= */

        .salon-card {

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;

            background:
                rgba(17, 17, 30, 0.7);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border:
                1px solid
                rgba(59, 130, 246, 0.3);

            border-radius: 1rem;

            overflow: hidden;
        }


        .salon-card:hover {

            transform:
                translateY(-3px);

            border-color:
                #9333ea;
        }


        .salon-image {

            width: 100%;

            height: 210px;

            object-fit: cover;

            display: block;

            background:
                #111827;
        }


        /* =========================================
           PRIMARY BUTTON
        ========================================= */

        .primary-btn {

            background:
                linear-gradient(
                    90deg,
                    #3b82f6,
                    #8b5cf6
                );

            border: none;

            color: white;

            padding:
                0.75rem 1.25rem;

            border-radius:
                0.75rem;

            font-weight: bold;

            width: 100%;

            cursor: pointer;

            transition:
                all 0.2s ease;
        }


        .primary-btn:hover {

            opacity: 0.9;

            transform:
                translateY(-2px);
        }


        .primary-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.8);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            justify-content:
                center;

            align-items:
                center;

            z-index: 10000;

            padding: 1rem;

            overflow-y: auto;
        }


        .modal.active {

            display: flex;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading-box {

            text-align: center;

            padding:
                50px 20px;

            color:
                #9ca3af;
        }


        .loading-box i {

            display: block;

            font-size: 3rem;

            color:
                #3b82f6;

            margin-bottom:
                12px;
        }


        /* =========================================
           EMPTY
        ========================================= */

        .empty-state {

            text-align: center;

            padding:
                60px 20px;

            color:
                #9ca3af;
        }


        .empty-state i {

            font-size: 4rem;

            color:
                #8b8b98;

            margin-bottom:
                15px;
        }


        .empty-state h3 {

            color:
                #c7c7d1;

            font-size:
                1.25rem;

            font-weight:
                700;

            margin-bottom:
                8px;
        }


        .empty-state p {

            color:
                #888895;

            font-size:
                0.95rem;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error-state {

            text-align: center;

            padding:
                40px 20px;

            color:
                #ff4757;
        }


        .error-state i {

            font-size:
                3rem;

            margin-bottom:
                10px;
        }


        .error-state p {

            font-weight:
                700;

            margin-bottom:
                6px;
        }


        .error-state small {

            color:
                #aaa;

            display:
                block;

            word-break:
                break-word;
        }


        /* =========================================
           STATUS
        ========================================= */

        #firebaseStatus {

            position: fixed;

            top: 90px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 9990;

            display: none;

            max-width: 90%;

            padding:
                8px 14px;

            border-radius:
                999px;

            font-size:
                11px;

            font-weight:
                700;

            background:
                rgba(17, 24, 39, 0.95);

            border:
                1px solid
                rgba(59, 130, 246, 0.4);

            color:
                #93c5fd;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);

            text-align:
                center;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 640px) {

            main {

                padding-top:
                    28px;
            }


            .salon-image {

                height:
                    200px;
            }


            .nav-item {

                width:
                    88px;
            }


            #firebaseStatus {

                top:
                    85px;
            }

        }

    </style>

</head>


<body>

        <h2

    <div

            <div>

                    class="text-xs text-gray-400 block mb-1"
                >

                    autocomplete="tel"

                <select
                    id="serviceType"
                    required

                ></select>

            </div>


            <div

            >

                <div>

                    >

                    <input
                        type="date"
                        id="custDate"
                        required
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm outline-none"
                    >

                </div>


                <div>

                    <label
                        class="text-xs text-gray-400 block mb-1"

                    </label>


                    <input
                        type="time"
                        id="custTime"
                        required

            </div>


            <button

                id="confirmBookingBtn"

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {


        /* =====================================
           DOM
        ===================================== */

        const salonList =
            document.getElementById(
                "salonList"
            );

        const searchBar =
            document.getElementById(
                "searchBar"
            );

        const searchBtn =
            document.getElementById(
                "searchBtn"
            );

        const bookingModal =
            document.getElementById(
                "bookingModal"
            );

        const bookingForm =
            document.getElementById(
                "bookingForm"
            );

        const closeModalBtn =
            document.getElementById(
                "closeModalBtn"
            );

        const bookingSalonName =
            document.getElementById(
                "bookingSalonName"
            );

        const bookingSalonLocation =
            document.getElementById(
                "bookingSalonLocation"
            );

        const serviceType =
            document.getElementById(
                "serviceType"
            );

        const custName =
            document.getElementById(
                "custName"
            );

        const custPhone =
            document.getElementById(
                "custPhone"
            );

        const custDate =
            document.getElementById(
                "custDate"
            );

        const custTime =
            document.getElementById(
                "custTime"
            );

        const confirmBookingBtn =
            document.getElementById(
                "confirmBookingBtn"
            );

        const adminBtn =
            document.getElementById(
                "adminBtn"
            );

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );

        const bookingsToday =
            document.getElementById(
                "bookingsToday"
            );

        const firebaseStatus =
            document.getElementById(
                "firebaseStatus"
            );


        /* =====================================
           STATE
        ===================================== */

        let allSalons = [];

        let selectedSalon = null;

        let salonUnsubscribe = null;

        let bookingUnsubscribe = null;


        /* =====================================
           HELPERS
        ===================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function formatDate(
            date = new Date()
        ) {

            return [

                date.getFullYear(),

                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                ),

                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                )

            ].join("-");

        }


        function showStatus(
            message,
            error = false
        ) {

            firebaseStatus.textContent =
                message;


            firebaseStatus.style.display =
                "block";


            firebaseStatus.style.color =
                error
                    ? "#fca5a5"
                    : "#93c5fd";


            firebaseStatus.style.borderColor =
                error
                    ? "rgba(239,68,68,.5)"
                    : "rgba(59,130,246,.4)";


            clearTimeout(
                firebaseStatus._timer
            );


            firebaseStatus._timer =
                setTimeout(
                    () => {

                        firebaseStatus.style.display =
                            "none";

                    },
                    4500
                );

        }


        /* =====================================
           CLICK SOUND
        ===================================== */

        const clickSound =
            document.getElementById(
                "clickSound"
            );


        if (clickSound) {

            clickSound.volume =
                0.4;

        }


        function playClick() {

            if (clickSound) {

                clickSound.currentTime =
                    0;

                clickSound
                    .play()
                    .catch(
                        () => {}
                    );

            }


            if (
                navigator.vibrate
            ) {

                navigator.vibrate(
                    25
                );

            }

        }


        document.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest(
                        "button"
                    )
                ) {

                    playClick();

                }

            }
        );


        /* =====================================
           DATE
        ===================================== */

        const today =
            new Date();


        const maxDate =
            new Date();


        maxDate.setDate(
            today.getDate() + 30
        );


        custDate.min =
            formatDate(
                today
            );


        custDate.max =
            formatDate(
                maxDate
            );


        custDate.value =
            formatDate(
                today
            );


        /* =====================================
           AUTH STATE
        ===================================== */

        auth.onAuthStateChanged(
            async user => {

                console.log(
                    "AUTH:",
                    user
                        ? user.uid
                        : "not logged in"
                );


                if (!user) {

                    logoutBtn.classList.add(
                        "hidden"
                    );


                    adminBtn.classList.add(
                        "hidden"
                    );


                    stopBookingListener();


                    bookingsToday.textContent =
                        "0 bookings today";


                    return;

                }


                logoutBtn.classList.remove(
                    "hidden"
                );


                try {

                    const userSnap =
                        await db
                            .collection(
                                "users"
                            )
                            .doc(
                                user.uid
                            )
                            .get();


                    const userData =
                        userSnap.exists
                            ? userSnap.data() || {}
                            : {};


                    const role =
                        userData.role ||
                        "customer";


                    console.log(
                        "USER UID:",
                        user.uid
                    );


                    console.log(
                        "USER ROLE:",
                        role
                    );


                    if (
                        role === "admin"
                    ) {

                        adminBtn.classList.remove(
                            "hidden"
                        );


                        adminBtn.innerHTML = `

                            <i class="bx bx-shield-alt-2"></i>

                            Admin

                        `;


                        adminBtn.onclick =
                            () => {

                                window.location.href =
                                    "admin.html";

                            };


                    } else if (
                        role === "salon_owner"
                    ) {

                        adminBtn.classList.remove(
                            "hidden"
                        );


                        adminBtn.innerHTML = `

                            <i class="bx bx-store"></i>

                            Owner Dashboard

                        `;


                        adminBtn.onclick =
                            () => {

                                window.location.href =
                                    "owners.html";

                            };


                    } else {

                        adminBtn.classList.add(
                            "hidden"
                        );

                    }


                    listenForUserBookings(
                        user
                    );


                } catch (error) {

                    console.error(
                        "USER ERROR:",
                        error
                    );


                    adminBtn.classList.add(
                        "hidden"
                    );


                    listenForUserBookings(
                        user
                    );

                }

            }
        );


        /* =====================================
           LOGOUT
        ===================================== */

        logoutBtn.addEventListener(
            "click",
            async () => {

                try {

                    await auth.signOut();


                    showStatus(
                        "Logged out successfully"
                    );


                } catch (error) {

                    console.error(
                        error
                    );


                    showStatus(
                        error.message ||
                        "Logout failed",
                        true
                    );

                }

            }
        );


        /* =====================================
           LOAD SALONS
        ===================================== */

        function loadSalons() {

            if (
                salonUnsubscribe
            ) {

                salonUnsubscribe();

            }


            salonList.innerHTML = `

                <div
                    class="loading-box col-span-full"
                >

                    <i
                        class="bx bx-loader-alt bx-spin"
                    ></i>

                    <p>
                        Loading salons near you...
                    </p>

                </div>

            `;


            salonUnsubscribe =
                db
                    .collection(
                        "salons"
                    )
                    .onSnapshot(

                        snapshot => {

                            console.log(
                                "SALONS FOUND:",
                                snapshot.size
                            );


                            allSalons = [];


                            snapshot.forEach(
                                doc => {

                                    const data =
                                        doc.data() || {};


                                    /*
                                     * =================================
                                     * SERVICES
                                     * =================================
                                     */

                                    const rawServices =
                                        Array.isArray(
                                            data.services
                                        )
                                            ? data.services
                                            : [];


                                    const services =
                                        rawServices.map(
                                            service => {

                                                if (
                                                    typeof service ===
                                                    "string"
                                                ) {

                                                    return {

                                                        name:
                                                            service,

                                                        price:
                                                            0

                                                    };

                                                }


                                                return {

                                                    name:
                                                        service?.name ||
                                                        "Service",

                                                    price:
                                                        Number(
                                                            service?.price
                                                        ) || 0

                                                };

                                            }
                                        );


                                    /*
                                     * =================================
                                     * SALON OBJECT
                                     * =================================
                                     *
                                     * CURRENT FIRESTORE DOCUMENT:
                                     *
                                     * salons/
                                     * x6PAOuL1w4W13yg5xIWC
                                     *
                                     * ownerId:
                                     * prgctpY58cVmPocgLuSRLRMajOI2
                                     *
                                     * We use the Firestore document ID
                                     * as salonId when no salonId field
                                     * exists inside the document.
                                     */

                                    const salon = {

                                        id:
                                            doc.id,


                                        salonId:
                                            data.salonId ||
                                            doc.id,


                                        ownerId:
                                            data.ownerId ||
                                            data.OwnerId ||
                                            null,


                                        name:
                                            data.name ||
                                            "Unnamed Salon",


                                        ownerEmail:
                                            data.ownerEmail ||
                                            data.email ||
                                            "",


                                        location:
                                            data.location ||
                                            "Location unavailable",


                                        hours:
                                            data.hours ||
                                            data.time ||
                                            "09:00 - 18:00",


                                        image:
                                            data.image ||
                                            "https://via.placeholder.com/600x350?text=K%40si+Web",


                                        services:
                                            services

                                    };


                                    console.log(
                                        "SALON DOCUMENT ID:",
                                        doc.id
                                    );


                                    console.log(
                                        "SALON OWNER ID:",
                                        salon.ownerId
                                    );


                                    console.log(
                                        "SALON DATA:",
                                        salon
                                    );


                                    allSalons.push(
                                        salon
                                    );

                                }
                            );


                            allSalons.sort(
                                (a, b) =>
                                    a.name.localeCompare(
                                        b.name
                                    )
                            );


                            renderSalons(
                                allSalons
                            );


                            if (
                                allSalons.length
                            ) {

                                showStatus(
                                    `${allSalons.length} salon${allSalons.length === 1 ? "" : "s"} loaded`
                                );

                            } else {

                                showStatus(
                                    "No salons found",
                                    true
                                );

                            }

                        },


                        error => {

                            console.error(
                                "SALON LOAD ERROR:",
                                error
                            );


                            salonList.innerHTML = `

                                <div
                                    class="error-state col-span-full"
                                >

                                    <i
                                        class="bx bx-error-circle"
                                    ></i>

                                    <p>
                                        Failed to load salons
                                    </p>

                                    <small>
                                        ${escapeHtml(
                                            error.message ||
                                            "Firestore error"
                                        )}
                                    </small>

                                    <br>

                                    <small>
                                        Code:
                                        ${escapeHtml(
                                            error.code ||
                                            "unknown"
                                        )}
                                    </small>

                                </div>

                            `;


                            showStatus(
                                "Unable to load salons",
                                true
                            );

                        }

                    );

        }


        /* =====================================
           RENDER SALONS
        ===================================== */

        function renderSalons(
            salons
        ) {

            salonList.innerHTML =
                "";


            if (
                !salons.length
            ) {

                salonList.innerHTML = `

                    <div
                        class="empty-state col-span-full"
                    >

                        <i
                            class="bx bx-store-alt"
                        ></i>

                        <h3>
                            No salons found
                        </h3>

                        <p>
                            There are currently no salons available.
                        </p>

                    </div>

                `;

                return;

            }


            salons.forEach(
                salon => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "salon-card flex flex-col justify-between";


                    const hasOwner =
                        Boolean(
                            salon.ownerId
                        );


                    const servicePreview =
                        salon.services.length

                            ? salon.services
                                .slice(
                                    0,
                                    3
                                )
                                .map(
                                    service => `

                                        <div>

                                            ${escapeHtml(
                                                service.name
                                            )}

                                            —
                                            R${Number(
                                                service.price
                                            ).toFixed(2)}

                                        </div>

                                    `
                                )
                                .join("")

                            : `

                                <div>
                                    Services available when booking
                                </div>

                              `;


                    card.innerHTML = `

                        <div>

                            <img
                                src="${escapeHtml(
                                    salon.image
                                )}"
                                alt="${escapeHtml(
                                    salon.name
                                )}"
                                class="salon-image"
                                loading="lazy"
                                onerror="
                                    this.onerror=null;
                                    this.src='https://via.placeholder.com/600x350?text=K%40si+Web';
                                "
                            >


                            <div
                                class="p-5"
                            >

                                <h3
                                    class="text-xl font-bold mb-2 text-blue-400"
                                >
                                    ${escapeHtml(
                                        salon.name
                                    )}
                                </h3>


                                <p
                                    class="text-sm text-gray-300 mb-1"
                                >

                                    <i
                                        class="bx bx-map text-purple-400"
                                    ></i>

                                    ${escapeHtml(
                                        salon.location
                                    )}

                                </p>


                                <p
                                    class="text-sm text-gray-400 mb-4"
                                >

                                    <i
                                        class="bx bx-time text-purple-400"
                                    ></i>

                                    ${escapeHtml(
                                        salon.hours
                                    )}

                                </p>


                                <div
                                    class="text-xs text-gray-400 leading-6"
                                >

                                    ${servicePreview}

                                </div>


                                ${
                                    hasOwner

                                        ? `

                                            <div
                                                class="mt-3 text-[10px] text-green-400"
                                            >

                                                ✓ Owner connected

                                            </div>

                                          `

                                        : `

                                            <div
                                                class="mt-3 text-[10px] text-red-400"
                                            >

                                                ⚠ Owner connection missing

                                            </div>

                                          `
                                }

                            </div>

                        </div>


                        <div
                            class="px-5 pb-5"
                        >

                            <button
                                type="button"
                                class="primary-btn bookBtn"
                                data-id="${escapeHtml(
                                    salon.id
                                )}"
                                ${
                                    !hasOwner
                                        ? "disabled"
                                        : ""
                                }
                            >

                                ${
                                    hasOwner
                                        ? "Book Now"
                                        : "Not Available"
                                }

                            </button>

                        </div>

                    `;


                    salonList.appendChild(
                        card
                    );

                }
            );

        }


        /* =====================================
           SEARCH
        ===================================== */

        function searchSalons() {

            const term =
                searchBar.value
                    .toLowerCase()
                    .trim();


            if (!term) {

                renderSalons(
                    allSalons
                );

                return;

            }


            const filtered =
                allSalons.filter(
                    salon => {

                        return (

                            String(
                                salon.name
                            )
                                .toLowerCase()
                                .includes(
                                    term
                                )

                            ||

                            String(
                                salon.location
                            )
                                .toLowerCase()
                                .includes(
                                    term
                                )

                            ||

                            String(
                                salon.ownerEmail
                            )
                                .toLowerCase()
                                .includes(
                                    term
                                )

                        );

                    }
                );


            renderSalons(
                filtered
            );

        }


        searchBtn.addEventListener(
            "click",
            searchSalons
        );


        searchBar.addEventListener(
            "input",
            searchSalons
        );


        searchBar.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    searchSalons();

                }

            }
        );


        /* =====================================
           OPEN BOOKING
        ===================================== */

        function openBooking(
            salonId
        ) {

            const salon =
                allSalons.find(
                    item =>
                        item.id ===
                        salonId
                );


            if (!salon) {

                showStatus(
                    "Salon not found",
                    true
                );

                return;

            }


            if (!salon.ownerId) {

                showStatus(
                    "This salon is not ready for bookings",
                    true
                );

                return;

            }


            selectedSalon =
                salon;


            console.log(
                "SELECTED SALON:",
                selectedSalon
            );


            bookingSalonName.textContent =
                salon.name;


            bookingSalonLocation.textContent =
                salon.location;


            populateServices(
                salon.services
            );


            bookingModal.classList.add(
                "active"
            );


            document.body.style.overflow =
                "hidden";

        }


        /* =====================================
           BOOK BUTTON
        ===================================== */

        salonList.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        ".bookBtn"
                    );


                if (!button) {

                    return;

                }


                if (
                    button.disabled
                ) {

                    return;

                }


                openBooking(
                    button.dataset.id
                );

            }
        );


        /* =====================================
           SERVICES
        ===================================== */

        function populateServices(
            services
        ) {

            serviceType.innerHTML =
                "";


            if (
                !Array.isArray(
                    services
                ) ||
                !services.length
            ) {

                serviceType.innerHTML = `

                    <option value="">
                        No services available
                    </option>

                `;

                return;

            }


            services.forEach(
                service => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    const name =
                        service.name ||
                        "Service";


                    const price =
                        Number(
                            service.price
                        ) || 0;


                    option.value =
                        name;


                    option.dataset.price =
                        price;


                    option.textContent =
                        `${name} — R${price.toFixed(2)}`;


                    serviceType.appendChild(
                        option
                    );

                }
            );

        }


        /* =====================================
           CLOSE BOOKING
        ===================================== */

        function closeBooking() {

            bookingModal.classList.remove(
                "active"
            );


            document.body.style.overflow =
                "";


            selectedSalon =
                null;

        }


        closeModalBtn.addEventListener(
            "click",
            closeBooking
        );


        bookingModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    bookingModal
                ) {

                    closeBooking();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeBooking();

                }

            }
        );


        /* =====================================
           CREATE BOOKING
        ===================================== */

        bookingForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const user =
                    auth.currentUser;


                if (!user) {

                    showStatus(
                        "Please log in before booking",
                        true
                    );


                    window.location.href =
                        "home.html";


                    return;

                }


                if (!selectedSalon) {

                    showStatus(
                        "Please select a salon",
                        true
                    );

                    return;

                }


                if (
                    !selectedSalon.ownerId
                ) {

                    showStatus(
                        "This salon has no owner connection",
                        true
                    );

                    return;

                }


                const customerName =
                    custName.value.trim();


                const phone =
                    custPhone.value.trim();


                const date =
                    custDate.value;


                const time =
                    custTime.value;


                const selectedOption =
                    serviceType.options[
                        serviceType.selectedIndex
                    ];


                const service =
                    selectedOption
                        ? selectedOption.value
                        : "";


                const price =
                    selectedOption
                        ? Number(
                            selectedOption.dataset.price
                        ) || 0
                        : 0;


                if (
                    !customerName ||
                    !phone ||
                    !date ||
                    !time ||
                    !service
                ) {

                    showStatus(
                        "Please complete all fields",
                        true
                    );

                    return;

                }


                if (
                    date <
                    formatDate()
                ) {

                    showStatus(
                        "Please select a valid date",
                        true
                    );

                    return;

                }


                confirmBookingBtn.disabled =
                    true;


                confirmBookingBtn.innerHTML = `

                    <i
                        class="bx bx-loader-alt bx-spin"
                    ></i>

                    Saving Booking...

                `;


                try {

                    /*
                     * =================================
                     * IMPORTANT
                     * =================================
                     *
                     * Current salon:
                     *
                     * Firestore document:
                     * x6PAOuL1w4W13yg5xIWC
                     *
                     * Owner UID:
                     * prgctpY58cVmPocgLuSRLRMajOI2
                     *
                     * salonId is taken from:
                     * selectedSalon.salonId
                     *
                     * ownerId is taken from:
                     * selectedSalon.ownerId
                     */

                    const bookingData = {

                        userId:
                            user.uid,


                        ownerId:
                            selectedSalon.ownerId,


                        salonId:
                            selectedSalon.salonId ||
                            selectedSalon.id,


                        salonName:
                            selectedSalon.name,


                        customerName:
                            customerName,


                        phone:
                            phone,


                        service:
                            service,


                        price:
                            price,


                        date:
                            date,


                        time:
                            time,


                        status:
                            "pending",


                        createdAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp(),


                        updatedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    };


                    console.log(
                        "================================="
                    );


                    console.log(
                        "CREATING BOOKING"
                    );


                    console.log(
                        "Customer UID:",
                        user.uid
                    );


                    console.log(
                        "Salon ID:",
                        bookingData.salonId
                    );


                    console.log(
                        "Salon Name:",
                        bookingData.salonName
                    );


                    console.log(
                        "Owner ID:",
                        bookingData.ownerId
                    );


                    console.log(
                        "Service:",
                        bookingData.service
                    );


                    console.log(
                        "Price:",
                        bookingData.price
                    );


                    console.log(
                        "================================="
                    );


                    const bookingRef =
                        await db
                            .collection(
                                "bookings"
                            )
                            .add(
                                bookingData
                            );


                    console.log(
                        "BOOKING CREATED:",
                        bookingRef.id
                    );


                    showStatus(
                        "Booking confirmed successfully"
                    );


                    bookingForm.reset();


                    custDate.value =
                        formatDate();


                    closeBooking();


                    refreshBookingCount(
                        user.uid
                    );


                } catch (error) {

                    console.error(
                        "BOOKING ERROR:",
                        error
                    );


                    showStatus(
                        error.message ||
                        "Booking failed",
                        true
                    );

                } finally {

                    confirmBookingBtn.disabled =
                        false;


                    confirmBookingBtn.innerHTML =
                        "Confirm Booking";

                }

            }
        );


        /* =====================================
           BOOKING LISTENER
        ===================================== */

        function stopBookingListener() {

            if (
                bookingUnsubscribe
            ) {

                bookingUnsubscribe();

                bookingUnsubscribe =
                    null;

            }

        }


        function listenForUserBookings(
            user
        ) {

            stopBookingListener();


            if (!user) {

                bookingsToday.textContent =
                    "0 bookings today";

                return;

            }


            bookingUnsubscribe =
                db
                    .collection(
                        "bookings"
                    )
                    .where(
                        "userId",
                        "==",
                        user.uid
                    )
                    .onSnapshot(

                        snapshot => {

                            const today =
                                formatDate();


                            let count =
                                0;


                            snapshot.forEach(
                                doc => {

                                    const data =
                                        doc.data() ||
                                        {};


                                    if (
                                        data.date ===
                                        today
                                    ) {

                                        count++;

                                    }

                                }
                            );


                            bookingsToday.textContent =
                                `${count} booking${count === 1 ? "" : "s"} today`;

                        },


                        error => {

                            console.error(
                                "BOOKING COUNT ERROR:",
                                error
                            );


                            bookingsToday.textContent =
                                "Bookings today";

                        }

                    );

        }


        /* =====================================
           REFRESH BOOKING COUNT
        ===================================== */

        async function refreshBookingCount(
            uid
        ) {

            if (!uid) {

                return;

            }


            try {

                const snapshot =
                    await db
                        .collection(
                            "bookings"
                        )
                        .where(
                            "userId",
                            "==",
                            uid
                        )
                        .get();


                const today =
                    formatDate();


                let count =
                    0;


                snapshot.forEach(
                    doc => {

                        const data =
                            doc.data() ||
                            {};


                        if (
                            data.date ===
                            today
                        ) {

                            count++;

                        }

                    }
                );


                bookingsToday.textContent =
                    `${count} booking${count === 1 ? "" : "s"} today`;


            } catch (error) {

                console.error(
                    "REFRESH COUNT ERROR:",
                    error
                );

            }

        }


        /* =====================================
           START
        ===================================== */

        loadSalons();


        /* =====================================
           CLEANUP
        ===================================== */

        window.addEventListener(
            "beforeunload",
            () => {

                if (
                    salonUnsubscribe
                ) {

                    salonUnsubscribe();

                }


                if (
                    bookingUnsubscribe
                ) {

                    bookingUnsubscribe();

                }

            }
        );

    }
);

</script>


</body>

    </html>
