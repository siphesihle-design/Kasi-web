<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salon Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <div id="salon-container" class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-6">
    <p class="text-gray-500">Loading salon details...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Replace with your actual Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase and Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. Fetch salon details (using the exact capital 'I' ID)
    async function loadSalonData() {
      const salonId = "Sv4zu4jERDR65IuURdss";
      const container = document.getElementById("salon-container");

      try {
        const docRef = doc(db, "salons", salonId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const salon = docSnap.data();

          // Render salon metadata and nested services array
          container.innerHTML = `
            <img src="${salon.image}" alt="${salon.name}" class="w-full h-48 object-cover rounded-md mb-4" />
            <h1 class="text-2xl font-bold mb-1">${salon.name}</h1>
            <p class="text-gray-600 mb-2"><strong>Location:</strong> ${salon.location}</p>
            <p class="text-gray-600 mb-2"><strong>Hours:</strong> ${salon.hours}</p>
            <p class="text-gray-600 mb-4"><strong>Email:</strong> ${salon.email}</p>

            <h2 class="text-xl font-semibold mb-2 border-b pb-1">Services</h2>
            <ul class="divide-y divide-gray-200">
              ${
                salon.services && salon.services.length > 0
                  ? salon.services.map(s => `
                      <li class="py-2 flex justify-between">
                        <span>${s.name}</span>
                        <span class="font-bold">R${s.price}</span>
                      </li>
                    `).join('')
                  : '<li class="py-2 text-gray-500">No services listed</li>'
              }
            </ul>
          `;
        } else {
          container.innerHTML = `<p class="text-red-500">Salon not found in database.</p>`;
        }
      } catch (error) {
        console.error("Error fetching document:", error);
        container.innerHTML = `<p class="text-red-500">Failed to load salon details. Check console for details.</p>`;
      }
    }

    loadSalonData();
  </script>
</body>
</html>
