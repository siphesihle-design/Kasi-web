<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Kasi Cut</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-center mb-6 text-purple-500">🔥 Book Your Kasi Cut 🔥</h1>
    <div id="loginStatus" class="text-center mb-4 text-gray-400">Checking login...</div>
    <div id="salonsList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <!-- BOOKING POPUP -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 p-6 rounded-xl w-full max-w-md border-purple-700">
      <h2 class="text-2xl font-bold mb-4 text-purple-500">Book Appointment</h2>
      
      <label class="text-sm text-gray-400">Your Name</label>
      <input id="clientName" type="text" placeholder="e.g. Sipho Dlamini" class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-purple-500 outline-none">
      
      <label class="text-sm text-gray-400">Your Number</label>
      <input id="clientNumber" type="tel" placeholder="e.g. 0711234567" class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-purple-500 outline-none">

      <label class="text-sm text-gray-400">Select Service</label>
      <select id="serviceSelect" class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-purple-500 outline-none">
        <option value="">-- Choose a service --</option>
      </select>

      <label class="text-sm text-gray-400">Preferred Date</label>
      <input id="bookingDate" type="date" class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-purple-500 outline-none">

      <label class="text-sm text-gray-400">Preferred Time</label>
      <input id="bookingTime" type="time" class="w-full p-3 mb-4 rounded-lg bg-gray-800 border-gray-700 focus:border-purple-500 outline-none">
      
      <button id="confirmBooking" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold mb-2">Confirm Booking</button>
      <button onclick="closeModal()" class="w-full bg-gray-700 hover:bg-gray-600 p-3 rounded-lg">Cancel</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
    authDomain: "kasi-web-d073f.firebaseapp.com",
    projectId: "kasi-web-d073f",
    storageBucket: "kasi-web-d073f.firebasestorage.app",
    messagingSenderId: "471544855566",
    appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;
  let selectedSalonId = null;
  let selectedSalonName = null;
  let selectedSalonServices = [];
  
  // CHECK IF USER IS LOGGED IN
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    document.getElementById("loginStatus").innerHTML = user 
      ? `Logged in as: ${user.email}` 
      : `Please login first to book`;
    loadSalons();
  });

  // LOAD SALONS FROM FIRESTORE
  async function loadSalons() {
    const snapshot = await getDocs(collection(db, "salons"));
    let html = "";
    
    if(snapshot.empty){
      html = `<p class="text-center text-gray-500 col-span-3">No salons found yet</p>`;
    }

    snapshot.forEach((doc) => {
      const s = doc.data();
      const salonId = doc.id;

      let servicesList = '<p class="text-sm text-gray-500">No services listed</p>';
      if(s.services && s.services.length > 0){
        servicesList = s.services.map(svc => 
          `<p class="text-sm text-gray-300">• ${svc.name} - R${svc.price} - ${svc.duration}min</p>`
        ).join('');
      }
      
      html += `
        <div class="bg-gray-900 p-6 rounded-xl border-gray-800 hover:border-purple-600 transition">
          <img src="${s.image || 'https://via.placeholder.com/400x200/111/fff?text=Salon'}" class="w-full h-48 object-cover rounded-lg mb-4">
          <h2 class="text-2xl font-bold mb-2 text-purple-400">${s.name || 'No Name'}</h2>
          <p class="text-gray-400">📍 ${s.location || 'No location'}</p>
          <p class="text-gray-400 mb-3">🕒 ${s.hours || 'No hours'}</p>
          
          <div class="mb-4 bg-gray-800 p-3 rounded-lg">
            <h3 class="font-bold text-purple-400 mb-2">Services:</h3>
            ${servicesList}
          </div>
          
          <button onclick='openModal("${salonId}", "${s.name}", ${JSON.stringify(s.services || [])})' class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold">
            Book Now
          </button>
        </div>
      `;
    });
    document.getElementById("salonsList").innerHTML = html;
  }

  // OPEN BOOKING POPUP
  window.openModal = function(salonId, salonName, services) {
    if(!currentUser){
      alert("Please login first!");
      return;
    }
    selectedSalonId = salonId;
    selectedSalonName = salonName;
    selectedSalonServices = services;

    // Populate service dropdown
    const serviceSelect = document.getElementById("serviceSelect");
    serviceSelect.innerHTML = `<option value="">-- Choose a service --</option>`;
    services.forEach(svc => {
      serviceSelect.innerHTML += `<option value="${svc.name}|R${svc.price}">${svc.name} - R${svc.price}</option>`;
    });

    document.getElementById("bookingModal").classList.remove("hidden");
  }

  // CLOSE POPUP
  window.closeModal = function() {
    document.getElementById("bookingModal").classList.add("hidden");
    document.getElementById("clientName").value = "";
    document.getElementById("clientNumber").value = "";
    document.getElementById("serviceSelect").value = "";
    document.getElementById("bookingDate").value = "";
    document.getElementById("bookingTime").value = "";
  }

  // SAVE BOOKING TO FIRESTORE
  document.getElementById("confirmBooking").addEventListener("click", async () => {
    const name = document.getElementById("clientName").value.trim();
    const number = document.getElementById("clientNumber").value.trim();
    const service = document.getElementById("serviceSelect").value;
    const date = document.getElementById("bookingDate").value;
    const time = document.getElementById("bookingTime").value;

    if(!name || !number || !service || !date || !time){
      alert("Please fill all fields: Name, Number, Service, Date, Time");
      return;
    }

    const [serviceName, servicePrice] = service.split('|');

    try {
      await addDoc(collection(db, "bookings"), {
        salonId: selectedSalonId,
        salonName: selectedSalonName,
        clientId: currentUser.uid,
        clientEmail: currentUser.email,
        name: name,
        number: number,
        service: serviceName,
        price: servicePrice,
        date: date,
        time: time,
        status: "pending",
        createdAt: new Date()
      });

      alert(`Booking request for ${serviceName} sent to ${selectedSalonName}! 🔥`);
      closeModal();
    } catch(error) {
      alert("Error: " + error.message);
    }
  });

</script>

</body>
</html>
