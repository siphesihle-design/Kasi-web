<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111827">

    <title>K@si Web | Salons</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            padding-bottom: 95px;

            background:
                linear-gradient(
                    135deg,
                    #0a0a1a 0%,
                    #1a0a3e 100%
                );

            color: #fff;

            min-height: 100vh;
        }

        /* =================================
           BOTTOM NAV
        ================================= */

        .nav-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            min-height: 72px;

            background:
                rgba(17, 24, 39, 0.97);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border-top:
                1px solid
                rgba(75, 85, 99, 0.45);

            display: flex;

            justify-content: space-around;
            align-items: center;

            z-index: 9998;

            padding:
                4px
                8px
                calc(
                    4px +
                    env(safe-area-inset-bottom)
                );
        }

        .nav-item {
            width: 90px;
            height: 62px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #9ca3af;

            text-decoration: none;

            font-size: 0.78rem;

            font-weight: 700;

            border-radius: 18px;

            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 1.7rem;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #a855f7;

            background:
                rgba(126, 34, 206, 0.13);
        }

        .nav-item:hover {
            color: #a855f7;
        }

        /* =================================
           SALON CARD
        ================================= */

        .salon-card {
            transition:
                transform 0.2s ease,
                border-color 0.2s ease;

            background:
                rgba(17, 17, 30, 0.7);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border:
                1px solid
                rgba(59, 130, 246, 0.3);

            border-radius: 1rem;

            overflow: hidden;
        }

        .salon-card:hover {
            transform: translateY(-3px);

            border-color:
                #9333ea;
        }

        .salon-image {
            width: 100%;
            height: 210px;

            object-fit: cover;

            display: block;

            background:
                #111827;
        }

        /* =================================
           BUTTON
        ================================= */

        .primary-btn {
            background:
                linear-gradient(
                    90deg,
                    #3b82f6,
                    #8b5cf6
                );

            border: none;

            color: white;

            padding:
                0.75rem 1.25rem;

            border-radius:
                0.75rem;

            font-weight: bold;

            width: 100%;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* =================================
           MODAL
        ================================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.8);

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            justify-content: center;
            align-items: center;

            z-index: 10000;

            padding: 1rem;

            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        /* =================================
           LOADING
        ================================= */

        .loading-box {
            text-align: center;

            padding:
                50px 20px;

            color:
                #9ca3af;
        }

        .loading-box i {
            display: block;

            font-size: 3rem;

            color:
                #3b82f6;

            margin-bottom:
                12px;
        }

        /* =================================
           EMPTY
        ================================= */

        .empty-state {
            text-align: center;

            padding:
                60px 20px;

            color:
                #9ca3af;
        }

        .empty-state i {
            font-size: 4rem;

            color:
                #8b8b98;

            margin-bottom:
                15px;
        }

        .empty-state h3 {
            color:
                #c7c7d1;

            font-size:
                1.25rem;

            font-weight:
                700;

            margin-bottom:
                8px;
        }

        .empty-state p {
            color:
                #888895;

            font-size:
                0.95rem;
        }

        /* =================================
           ERROR
        ================================= */

        .error-state {
            text-align: center;

            padding:
                40px 20px;

            color:
                #ff4757;
        }

        .error-state i {
            font-size:
                3rem;

            margin-bottom:
                10px;
        }

        .error-state p {
            font-weight:
                700;

            margin-bottom:
                6px;
        }

        .error-state small {
            color:
                #aaa;

            display:
                block;

            word-break:
                break-word;
        }

        /* =================================
           FIREBASE STATUS
        ================================= */

        #firebaseStatus {
            position: fixed;

            top: 90px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 9990;

            display: none;

            max-width: 90%;

            padding:
                8px 14px;

            border-radius:
                999px;

            font-size:
                11px;

            font-weight:
                700;

            background:
                rgba(17, 24, 39, 0.95);

            border:
                1px solid
                rgba(59, 130, 246, 0.4);

            color:
                #93c5fd;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);
        }

        /* =================================
           DIAGNOSTICS
        ================================= */

        #debugPanel {
            display: none;

            margin:
                0 auto 25px;

            max-width:
                900px;

            background:
                rgba(17, 24, 39, 0.92);

            border:
                1px solid
                rgba(59, 130, 246, 0.35);

            border-radius:
                14px;

            padding:
                15px;

            font-size:
                12px;

            color:
                #9ca3af;

            word-break:
                break-word;

            line-height:
                1.75;
        }

        #debugPanel strong {
            color:
                #60a5fa;
        }

        .debug-section {
            padding:
                12px 0;

            border-bottom:
                1px solid
                rgba(75, 85, 99, 0.3);
        }

        .debug-section:last-child {
            border-bottom: none;
        }

        .debug-ok {
            color: #4ade80 !important;
        }

        .debug-error {
            color: #f87171 !important;
        }

        .debug-warning {
            color: #fbbf24 !important;
        }

        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 640px) {

            main {
                padding-top: 28px;
            }

            .salon-image {
                height: 200px;
            }

            .nav-item {
                width: 88px;
            }

            #firebaseStatus {
                top: 85px;
            }

        }

    </style>

</head>

                <button

        </div>

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                /* =================================
                   CONSTANTS
                ================================= */

                const EXPECTED_SALON_ID =
                    "Sv4zu4jERDR65IuURdss";

                const EXPECTED_OWNER_ID =
                    "prgctpY58cVmPocgLuSRLRMajOI2";


                /* =================================
                   DOM
                ================================= */

                const salonList =
                    document.getElementById(
                        "salonList"
                    );

                const bookingModal =
                    document.getElementById(
                        "bookingModal"
                    );

                const bookingForm =
                    document.getElementById(
                        "bookingForm"
                    );

                const closeModalBtn =
                    document.getElementById(
                        "closeModalBtn"
                    );

                const adminBtn =
                    document.getElementById(
                        "adminBtn"
                    );

                const logoutBtn =
                    document.getElementById(
                        "logoutBtn"
                    );

                const searchBar =
                    document.getElementById(
                        "searchBar"
                    );

                const searchBtn =
                    document.getElementById(
                        "searchBtn"
                    );

                const bookingsToday =
                    document.getElementById(
                        "bookingsToday"
                    );

                const custDate =
                    document.getElementById(
                        "custDate"
                    );

                const custTime =
                    document.getElementById(
                        "custTime"
                    );

                const custName =
                    document.getElementById(
                        "custName"
                    );

                const custPhone =
                    document.getElementById(
                        "custPhone"
                    );

                const serviceType =
                    document.getElementById(
                        "serviceType"
                    );

                const confirmBookingBtn =
                    document.getElementById(
                        "confirmBookingBtn"
                    );

                const bookingSalonName =
                    document.getElementById(
                        "bookingSalonName"
                    );

                const bookingSalonLocation =
                    document.getElementById(
                        "bookingSalonLocation"
                    );

                const firebaseStatus =
                    document.getElementById(
                        "firebaseStatus"
                    );

                const debugPanel =
                    document.getElementById(
                        "debugPanel"
                    );


                /* =================================
                   STATE
                ================================= */

                let allSalons =
                    [];

                let selectedSalonId =
                    null;

                let selectedSalonData =
                    null;

                let salonsUnsubscribe =
                    null;

                let bookingsUnsubscribe =
                    null;


                /*
                 * Diagnostics are kept separately.
                 * This prevents one async test from
                 * overwriting another.
                 */

                const diagnostic = {

                    project:
                        firebaseApp.options.projectId,

                    collectionCount:
                        null,

                    collectionError:
                        null,

                    directExists:
                        null,

                    directData:
                        null,

                    directError:
                        null

                };


                /* =================================
                   HELPERS
                ================================= */

                function escapeHtml(
                    value
                ) {

                    if (
                        value === null ||
                        value === undefined
                    ) {

                        return "";

                    }

                    return String(value)
                        .replace(
                            /&/g,
                            "&amp;"
                        )
                        .replace(
                            /</g,
                            "&lt;"
                        )
                        .replace(
                            />/g,
                            "&gt;"
                        )
                        .replace(
                            /"/g,
                            "&quot;"
                        )
                        .replace(
                            /'/g,
                            "&#039;"
                        );

                }


                function formatDate(
                    date = new Date()
                ) {

                    return [

                        date.getFullYear(),

                        String(
                            date.getMonth() + 1
                        ).padStart(
                            2,
                            "0"
                        ),

                        String(
                            date.getDate()
                        ).padStart(
                            2,
                            "0"
                        )

                    ].join("-");

                }


                function showStatus(
                    message,
                    type = "info"
                ) {

                    if (!firebaseStatus) {
                        return;
                    }

                    firebaseStatus.textContent =
                        message;

                    firebaseStatus.style.display =
                        "block";

                    if (
                        type === "error"
                    ) {

                        firebaseStatus.style.color =
                            "#fca5a5";

                        firebaseStatus.style.borderColor =
                            "rgba(239,68,68,0.5)";

                    } else {

                        firebaseStatus.style.color =
                            "#93c5fd";

                        firebaseStatus.style.borderColor =
                            "rgba(59,130,246,0.4)";

                    }

                    clearTimeout(
                        firebaseStatus._timer
                    );

                    firebaseStatus._timer =
                        setTimeout(
                            () => {

                                firebaseStatus.style.display =
                                    "none";

                            },
                            5000
                        );

                }


                /* =================================
                   DIAGNOSTIC PANEL
                ================================= */

                function renderDiagnostics() {

                    if (!debugPanel) {
                        return;
                    }

                    let directHtml = "";

                    if (
                        diagnostic.directExists ===
                        true
                    ) {

                        const data =
                            diagnostic.directData ||
                            {};

                        const ownerId =
                            data.ownerId ||
                            data.OwnerId ||
                            "";

                        directHtml = `

                            <div
                                class="debug-section"
                            >

                                <strong class="debug-ok">
                                    DIRECT DOCUMENT TEST ✓
                                </strong>

                                <br><br>

                                Path:
                                <strong>
                                    /salons/${escapeHtml(
                                        EXPECTED_SALON_ID
                                    )}
                                </strong>

                                <br>

                                Exists:
                                <strong class="debug-ok">
                                    YES
                                </strong>

                                <br>

                                Name:
                                ${escapeHtml(
                                    data.name ||
                                    "Missing"
                                )}

                                <br>

                                Owner ID:
                                ${escapeHtml(
                                    ownerId ||
                                    "Missing"
                                )}

                                <br>

                                Owner match:
                                ${
                                    ownerId ===
                                    EXPECTED_OWNER_ID
                                        ? `
                                            <strong class="debug-ok">
                                                YES ✓
                                            </strong>
                                          `
                                        : `
                                            <strong class="debug-error">
                                                NO ✗
                                            </strong>
                                          `
                                }

                                <br>

                                Location:
                                ${escapeHtml(
                                    data.location ||
                                    "Missing"
                                )}

                                <br>

                                Email:
                                ${escapeHtml(
                                    data.email ||
                                    "Missing"
                                )}

                                <br>

                                Services:
                                ${
                                    Array.isArray(
                                        data.services
                                    )
                                        ? data.services.length
                                        : 0
                                }

                            </div>

                        `;

                    } else if (
                        diagnostic.directExists ===
                        false
                    ) {

                        directHtml = `

                            <div
                                class="debug-section"
                            >

                                <strong class="debug-error">
                                    DIRECT DOCUMENT TEST ✗
                                </strong>

                                <br><br>

                                Path:
                                <strong>
                                    /salons/${escapeHtml(
                                        EXPECTED_SALON_ID
                                    )}
                                </strong>

                /* =================================

                ================================= */

                function loadSalons() {

                    if (
                        salonsUnsubscribe
                    ) {

                        salonsUnsubscribe();

                        salonsUnsubscribe =
                            null;

                    }


                    salonList.innerHTML = `

                        <div
                            class="loading-box col-span-full"
                        >

                            <i
                                class="bx bx-loader-alt bx-spin"
                            ></i>

                            <p>
                                Loading salons near you...
                            </p>

                        </div>

                    `;


                    salonsUnsubscribe =
                        db
                            .collection(
                                "salons"
                            )
                            .onSnapshot(

                                snapshot => {

                                    console.log(
                                        "REALTIME SALONS:",
                                        snapshot.size
                                    );


                                    allSalons =
                                        [];


                                    snapshot.forEach(
                                        docSnap => {

                                            const data =
                                                docSnap.data() ||
                                                {};


                                            const services =
                                                Array.isArray(
                                                    data.services
                                                )
                                                    ? data.services
                                                    : [];


                                            const normalizedServices =
                                                services.map(
                                                    service => {

                                                        if (
                                                            typeof service ===
                                                            "string"
                                                        ) {

                                                            return {

                                                                name:
                                                                    service,

                                                                price:
                                                                    0

                                                            };

                                                        }


                                                        return {

                                                            name:
                                                                service?.name ||
                                                                "Service",

                                                            price:
                                                                Number(
                                                                    service?.price
                                                                ) ||
                                                                0

                                                        };

                                                    }
                                                );


                                            allSalons.push({

                                                id:
                                                    docSnap.id,

                                                name:
                                                    data.name ||
                                                    "Unnamed Salon",

                                                ownerId:
                                                    data.ownerId ||
                                                    data.OwnerId ||
                                                    null,

                                                email:
                                                    data.email ||
                                                    data.ownerEmail ||
                                                    "",

                                                location:
                                                    data.location ||
                                                    "Location unavailable",

                                                hours:
                                                    data.hours ||
                                                    data.time ||
                                                    "09:00 - 18:00",

                                                image:
                                                    data.image ||
                                                    "https://via.placeholder.com/600x350?text=K%40si+Web",

                                                services:
                                                    normalizedServices

                                            });

                                        }
                                    );


                                    allSalons.sort(
                                        (
                                            a,
                                            b
                                        ) =>
                                            a.name.localeCompare(
                                                b.name
                                            )
                                    );


                                    renderSalonList(
                                        allSalons
                                    );

                                        allSalons.length >
                                        0
                                    ) {

                                            `${allSalons.length} salon${allSalons.length === 1 ? "" : "s"} loaded`
                                        );

                                    } else {

                                        );

                /* =================================
                   SEARCH
                ================================= */

                function executeSearch() {

                    const term =
                        searchBar.value
                            .toLowerCase()
                            .trim();


                    if (!term) {

                        renderSalonList(
                            allSalons
                        );

                        return;

                    }


                    const filtered =
                        allSalons.filter(
                            salon => {

                                const name =
                                    String(
                                        salon.name ||
                                        ""
                                    ).toLowerCase();

                                const location =
                                    String(
                                        salon.location ||
                                        ""
                                    ).toLowerCase();

                                const email =
                                    String(
                                        salon.email ||
                                        ""
                                    ).toLowerCase();


                                return (

                                    name.includes(
                                        term
                                    ) ||

                                    location.includes(
                                        term
                                    ) ||

                                    email.includes(
                                        term
                                    )

                                );

                            }
                        );


                    renderSalonList(
                        filtered
                    );

                }


                searchBtn.addEventListener(
                    "click",
                    executeSearch
                );


                searchBar.addEventListener(
                    "input",
                    executeSearch
                );


                searchBar.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            event.preventDefault();

                            executeSearch();

                        }

                    }
                );

                   OPEN BOOKING
                ================================= */

                function openBooking(
                    salonId
                ) {

                    const salon =
                        allSalons.find(
                            item =>
                                item.id ===
                                salonId
                        );


                    if (!salon) {

                        showStatus(
                            "Salon not found",
                            "error"
                        );

                        return;

                    }


                    if (
                        !salon.ownerId
                    ) {

                        showStatus(
                            "This salon has no ownerId",
                            "error"
                        );

                        return;

                    }


                    selectedSalonId =
                        salon.id;

                    selectedSalonData =
                        salon;


                    bookingSalonName.textContent =
                        salon.name;

                    bookingSalonLocation.textContent =
                        salon.location;


                    populateServices(
                        salon.services
                    );


                    bookingModal.classList.add(
                        "active"
                    );


                    document.body.style.overflow =
                        "hidden";

                }

                        if (!button) {
                            return;
                        }


                        if (
                            button.disabled
                        ) {
                            return;
                        }


                        openBooking(
                            button.dataset.id

                    }
                );


                /* =================================
                   SERVICES
                ================================= */

                function populateServices(
                    services
                ) {

                    serviceType.innerHTML =
                        "";


                    if (
                        !Array.isArray(
                            services
                        ) ||
                        !services.length
                    ) {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            "";

                        option.textContent =
                            "No services available";

                        serviceType.appendChild(
                            option
                        );

                        return;

                    }


                    services.forEach(
                        service => {

                            const name =
                                service?.name ||
                                "Service";

                            const price =
                                Number(
                                    service?.price
                                ) ||
                                0;


                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                name;


                            option.dataset.price =
                                String(
                                    price
                                );


                            option.textContent =
                                `${name} — R${price.toFixed(2)}`;


                            serviceType.appendChild(
                                option
                            );

                        }
                    );

                }

                    selectedSalonData =
                        null;

                }


                closeModalBtn.addEventListener(
                    "click",
                    closeBooking
                );


                bookingModal.addEventListener(
                    "click",
                    event => {

                        if (
                            event.target ===
                            bookingModal
                        ) {

                            closeBooking();

                        }

                    }
                );


                document.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Escape"
                        ) {

                            closeBooking();

                        }

                    }
                );


                /* =================================
                   CREATE BOOKING
                ================================= */

                bookingForm.addEventListener(
                    "submit",
                    async event => {

                        event.preventDefault();


                        const user =
                            auth.currentUser;


                        if (!user) {

                            showStatus(
                                "Please log in before booking",
                                "error"
                            );

                            window.location.href =
                                "home.html";

                            return;

                        }


                        if (
                            !selectedSalonId ||
                            !selectedSalonData
                        ) {

                            showStatus(
                                "Please select a salon",
                                "error"
                            );

                            return;

                        }


                        if (
                            !selectedSalonData.ownerId
                        ) {

                            showStatus(
                                "Salon owner connection is missing",
                                "error"
                            );

                            return;

                        }


                        const customerName =
                            custName.value.trim();

                        const phone =
                            custPhone.value.trim();

                        const date =
                            custDate.value;

                        const time =
                            custTime.value;


                        const selectedOption =
                            serviceType.options[
                                serviceType.selectedIndex
                            ];


                        const service =
                            selectedOption
                                ? selectedOption.value
                                : "";


                        const price =
                            selectedOption
                                ? Number(
                                    selectedOption.dataset.price
                                ) || 0
                                : 0;


                        if (
                            !customerName ||
                            !phone ||
                            !date ||
                            !time ||
                            !service
                        ) {

                            showStatus(
                                "Please complete all fields",
                                "error"
                            );

                            return;

                        }


                        if (
                            date <
                            formatDate()
                        ) {

                            showStatus(
                                "Please select a valid date",
                                "error"
                            );

                            return;

                        }


                        confirmBookingBtn.disabled =
                            true;


                        confirmBookingBtn.innerHTML = `
                            <i
                                class="bx bx-loader-alt bx-spin"
                            ></i>
                            Saving Booking...
                        `;


                        try {

                            const bookingData = {

                                userId:
                                    user.uid,

                                ownerId:
                                    selectedSalonData.ownerId,

                                salonId:
                                    selectedSalonId,

                                salonName:
                                    selectedSalonData.name,

                                customerName:
                                    customerName,

                                phone:
                                    phone,

                                service:
                                    service,

                                price:
                                    price,

                                date:
                                    date,

                                time:
                                    time,

                                status:
                                    "pending",

                                createdAt:
                                    firebase.firestore
                                        .FieldValue
                                        .serverTimestamp(),

                                updatedAt:
                                    firebase.firestore
                                        .FieldValue
                                        .serverTimestamp()

                            };


                            console.log(
                                "BOOKING DATA:",
                                bookingData
                            );


                            const bookingRef =
                                await db
                                    .collection(
                                        "bookings"
                                    )
                                    .add(
                                        bookingData
                                    );


                            console.log(
                                "BOOKING CREATED:",
                                bookingRef.id
                            );


                            showStatus(
                                "Booking confirmed successfully"
                            );


                            bookingForm.reset();


                            custDate.value =
                                formatDate();


                            closeBooking();


                            updateBookingCount();

                        } catch (error) {

                            console.error(
                                "BOOKING ERROR:",
                                error
                            );


                            showStatus(
                                error.message ||
                                "Booking failed",
                                "error"
                            );


                            renderDiagnostics();


                        } finally {

                            confirmBookingBtn.disabled =
                                false;


                            confirmBookingBtn.innerHTML =
                                "Confirm Booking";

                        }

                    }
                );


                /* =================================
                   BOOKING COUNT
                ================================= */

                function stopBookingListener() {

                    if (
                        bookingsUnsubscribe
                    ) {

                        bookingsUnsubscribe();

                        bookingsUnsubscribe =
                            null;

                    }

                }


                function listenForBookings(
                    uid
                ) {

                    stopBookingListener();


                    if (!uid) {

                        bookingsToday.textContent =
                            "0 bookings today";

                        return;

                    }


                    /*
                     * We use only the date field here.
                     * No composite index is required.
                     */

                    bookingsUnsubscribe =
                        db
                            .collection(
                                "bookings"
                            )
                            .onSnapshot(

                                snapshot => {

                                    const today =
                                        formatDate();

                                    let count =
                                        0;


                                    snapshot.forEach(
                                        docSnap => {

                                            const data =
                                                docSnap.data() ||
                                                {};


                                            if (
                                                data.date ===
                                                today
                                            ) {

                                                count++;

                                            }

                                        }
                                    );


                                    bookingsToday.textContent =
                                        `${count} booking${count === 1 ? "" : "s"} today`;

                                },

                                error => {

                                    console.error(
                                        "BOOKING COUNT ERROR:",
                                        error
                                    );


                                    bookingsToday.textContent =
                                        "Bookings today";

                                }

                            );

                }


                function updateBookingCount() {

                    const user =
                        auth.currentUser;


                    if (
                        user
                    ) {

                        listenForBookings(
                            user.uid
                        );

                    }

                }


                /* =================================
                   INITIALIZE
                ================================= */

                console.log(
                    "Starting Firestore diagnostics..."
                );


                /*
                 * Run both tests independently.
                 */

                testExpectedSalon();

                testSalonCollection();


                /*
                 * Then start realtime loading.
                 */

                loadSalons();


                /* =================================
                   CLEANUP
                ================================= */

                window.addEventListener(
                    "beforeunload",
                    () => {

                        if (
                            salonsUnsubscribe
                        ) {

                            salonsUnsubscribe();

                        }

                        if (
                            bookingsUnsubscribe
                        ) {

                            bookingsUnsubscribe();

                        }

                    }
                );

            }
        );

    </script>

</body>

                          </html>
