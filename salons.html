<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasi Cuts - Salons</title>
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<style>
  body { font-family: 'Poppins', sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #9C00E0; }
.glass-card { background: rgba(26,26,26,0.8); backdrop-filter: blur(10px); border-radius: 16px; padding: 15px; border: 1px solid #333; margin-bottom: 20px; }
.salon-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
.primary-btn { background: #9C00E0; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 999; }
.modal.active { display: flex; }
.modal-content { background: #1a1a1a; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; }
.modal-content input,.modal-content select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; color: #fff; }
</style>

<!-- FIREBASE INIT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDoc, doc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
    authDomain: "kasi-web-d073f.firebaseapp.com",
    projectId: "kasi-web-d073f",
    storageBucket: "kasi-web-d073f.firebasestorage.app",
    messagingSenderId: "471544855566",
    appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
  };

  const app = initializeApp(firebaseConfig);
  window.firebaseAuth = getAuth(app);
  window.firebaseDB = getFirestore(app);
  window.onAuthState = onAuthStateChanged;
  window.dbDoc = doc;
  window.dbGet = getDoc;
  window.addDoc = addDoc;
  window.collection = collection;
  window.onSnapshot = onSnapshot;
  window.query = query;
  window.where = where;
  window.orderBy = orderBy;
  window.serverTimestamp = serverTimestamp;
  window.logOut = signOut;
</script>
</head>
<body>

<h1>🔥 Book Your Kasi Cut 🔥</h1>

<input id="searchBar" placeholder="Search salons..." style="width:100%; padding:10px; border-radius:8px; margin-bottom:10px; background:#1a1a1a; border:1px solid #333; color:#fff;">
<button id="searchBtn" class="primary-btn">Search</button>
<p id="bookingsToday" style="text-align:center; color:#9C00E0;">0 bookings today</p>

<div id="salonList">Loading salons...</div>

<button id="adminBtn" style="display:none; margin-top:10px;" class="primary-btn">Dashboard</button>
<button id="logoutBtn" style="display:none; margin-top:10px; background:#333;" class="primary-btn">Logout</button>

<!-- BOOKING MODAL -->
<div id="bookingModal" class="modal">
  <div class="modal-content">
    <h2>Book Appointment</h2>
    <form id="bookingForm">
      <input type="text" id="custName" placeholder="Your Name" required>
      <input type="tel" id="custPhone" placeholder="Your Phone" required>
      <select id="serviceType" required>
        <option value="">Select Service</option>
        <option value="Fade — R80">Fade — R80</option>
        <option value="Beard — R50">Beard — R50</option>
        <option value="Full Cut — R120">Full Cut — R120</option>
      </select>
      <input type="date" id="custDate" required>
      <input type="time" id="custTime" required>
      <button type="submit" class="primary-btn">Confirm Booking</button>
      <button type="button" onclick="bookingModal.classList.remove('active')" style="background:#333; margin-top:8px;" class="primary-btn">Cancel</button>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!window.firebaseAuth) {
        document.getElementById('salonList').innerHTML = "Error: Firebase not connected. Check your config.";
        return;
    }
    const auth = window.firebaseAuth;
    const db = window.firebaseDB;
    const onAuthState = window.onAuthState;
    const dbDoc = window.dbDoc; const dbGet = window.dbGet;
    const addDoc = window.addDoc; const collection = window.collection;
    const onSnapshot = window.onSnapshot; const query = window.query;
    const where = window.where; const orderBy = window.orderBy;
    const serverTimestamp = window.serverTimestamp;
    const signOut = window.logOut;

    const salonList = document.getElementById('salonList');
    const bookingModal = document.getElementById('bookingModal');
    const bookingForm = document.getElementById('bookingForm');
    const adminBtn = document.getElementById('adminBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchBar = document.getElementById('searchBar');
    const searchBtn = document.getElementById('searchBtn');
    const bookingsToday = document.getElementById('bookingsToday');

    let selectedSalonId = null;
    let selectedSalonData = null;
    let allSalons = [];

    document.getElementById('custDate').min = new Date().toISOString().split('T')[0];

    onAuthState(auth, async (user) => {
        if(user) {
            logoutBtn.style.display = 'block';
            const userSnap = await dbGet(dbDoc(db, "users", user.uid));
            if(userSnap.exists()){
                const role = userSnap.data().role;
                if(role === 'admin' || role === 'salon_owner') adminBtn.style.display = 'block';
                adminBtn.onclick = () => window.location.href = role === 'admin'? 'admin.html' : 'owners.html';
            }
        } else {
            logoutBtn.style.display = 'none';
            adminBtn.style.display = 'none';
        }
    });

    const q = query(collection(db, "salons"), orderBy("name"));
    onSnapshot(q, (snapshot) => {
        allSalons = [];
        salonList.innerHTML = "";
        if(snapshot.empty) {
            salonList.innerHTML = `<p style="text-align:center; color:#888;">No salons yet. Ask admin to add one.</p>`;
            return;
        }
        snapshot.forEach(docSnap => {
            const salon = { id: docSnap.id,...docSnap.data() };
            allSalons.push(salon);
            renderSalon(salon);
        });
        updateBookingCount();
    });

    function renderSalon(salon){
        const noOwner =!salon.ownerId;
        const card = document.createElement('div');
        card.className = 'glass-card salon-card';
        card.innerHTML = `
            <img src="${salon.image || 'https://via.placeholder.com/400x180/9C00E0/FFFFFF?text=Kasi+Cuts'}" alt="${salon.name}">
            <h3>${salon.name}</h3>
            <p><i class='bx bx-map'></i> ${salon.location || 'Soweto'}</p>
            <p><i class='bx bx-time'></i> ${salon.hours || '9AM - 6PM'}</p>
            ${noOwner? `<small style="color:#ff4757; display:block; margin-bottom:8px;">⚠️ Not available for booking</small>` : ''}
            <button class="primary-btn bookBtn" data-id="${salon.id}" ${noOwner? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>Book Now</button>
        `;
        salonList.appendChild(card);
    }

    searchBtn.onclick = () => {
        const term = searchBar.value.toLowerCase();
        salonList.innerHTML = "";
        allSalons.filter(s => s.name.toLowerCase().includes(term) || s.location?.toLowerCase().includes(term))
           .forEach(renderSalon);
    }

    salonList.addEventListener('click', (e) => {
        const bookBtn = e.target.closest('.bookBtn');
        if(bookBtn){
            if(bookBtn.disabled) return;
            if(!auth.currentUser){ alert("Please login first"); window.location.href = 'index.html'; return; }
            selectedSalonId = bookBtn.dataset.id;
            selectedSalonData = allSalons.find(s => s.id === selectedSalonId);
            bookingModal.classList.add('active');
        }
    });

    bookingForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if(!auth.currentUser) return;

        const serviceVal = document.getElementById('serviceType').value;
        const [service, priceStr] = serviceVal.split(' — R');
        const price = Number(priceStr);

        try {
            await addDoc(collection(db, "bookings"), {
                userId: auth.currentUser.uid,
                ownerId: selectedSalonData.ownerId,
                salonId: selectedSalonId,
                salon: selectedSalonData.name,
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                service: service,
                price: price,
                status: "pending",
                date: document.getElementById('custDate').value,
                time: document.getElementById('custTime').value,
                createdAt: serverTimestamp()
            });

            alert("Booking placed! Owner will approve soon 💈");
            bookingModal.classList.remove('active');
            bookingForm.reset();
        } catch(err) {
            console.error("Booking error:", err);
            alert("Booking failed: " + err.message);
        }
    });

    function updateBookingCount(){
        const todayStr = new Date().toISOString().split('T')[0];
        const q = query(collection(db, "bookings"), where("date", "==", todayStr));
        onSnapshot(q, (snap) => {
            bookingsToday.textContent = `${snap.size} bookings today`;
        });
    }

    logoutBtn.onclick = () => {
        signOut(auth).then(() => window.location.href = 'index.html');
    }
});
</script>

</body>
</html>
