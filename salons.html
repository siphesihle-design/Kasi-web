                                    "Location not provided",

                                hours:
                                    data.hours ||
                                    data.time ||
                                    data.openingHours ||
                                    "Hours not provided",

                                image:
                                    data.image ||
                                    data.photo ||
                                    data.imageUrl ||
                                    DEFAULT_SALON_IMAGE,

                                services:
                                    normalizeServices(
                                        data.services
                                    )

                            };

                            console.log(
                                "SALON ID:",
                                salon.salonId
                            );

                            console.log(
                                "REAL OWNER ID:",
                                salon.ownerId
                            );

                            console.log(
                                "SERVICES:",
                                salon.services
                            );

                            allSalons = [
                                salon
                            ];

                            renderSalons(
                                allSalons
                            );

                            if (ownerId) {

                                showStatus(
                                    "Salon loaded successfully"
                                );

                            }

                        },

                        error => {

                            console.error(
                                "SALON LOAD ERROR:",
                                error
                            );

                            salonList.innerHTML = `

                                <div class="error-state col-span-full">

                                    <i class="bx bx-error-circle"></i>

                                    <p>
                                        Failed to load salon
                                    </p>

                                    <small>
                                        ${escapeHtml(
                                            error.message ||
                                            "Firestore error"
                                        )}
                                    </small>

                                    <br>

                                    <small>
                                        Code:
                                        ${escapeHtml(
                                            error.code ||
                                            "unknown"
                                        )}
                                    </small>

                                </div>

                            `;

                            showStatus(
                                "Unable to load salon",
                                true
                            );

                        }

                    );

        }

        /*
         * RENDER
         */

        function renderSalons(
            salons
        ) {

            salonList.innerHTML = "";

            if (
                !salons.length
            ) {

                salonList.innerHTML = `

                    <div class="empty-state col-span-full">

                        <i class="bx bx-store-alt"></i>

                        <h3>
                            No salons found
                        </h3>

                        <p>
                            Your salon has not been registered yet.
                        </p>

                    </div>

                `;

                return;

            }

            salons.forEach(
                salon => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "salon-card flex flex-col justify-between";

                    const hasOwner =
                        Boolean(
                            salon.ownerId
                        );

                    let servicePreview = "";

                    if (
                        salon.services.length
                    ) {

                        servicePreview =
                            salon.services
                                .slice(0, 3)
                                .map(
                                    service => `

                                        <div class="flex justify-between gap-2">

                                            <span>
                                                ${escapeHtml(
                                                    service.name
                                                )}
                                            </span>

                                            <span class="text-blue-400 font-semibold">
                                                R${Number(
                                                    service.price
                                                ).toFixed(2)}
                                            </span>

                                        </div>

                                    `
                                )
                                .join("");

                    }

                    else {

                        servicePreview = `

                            <div class="text-gray-500">
                                Services will appear here when added.
                            </div>

                        `;

                    }

                    card.innerHTML = `

                        <div>

                            <img
                                class="salon-image"
                                src="${escapeHtml(
                                    salon.image ||
                                    DEFAULT_SALON_IMAGE
                                )}"
                                alt="${escapeHtml(
                                    salon.name
                                )}"
                                loading="lazy"
                                onerror="this.onerror=null;this.src='${DEFAULT_SALON_IMAGE}'"
                            >

                            <div class="p-5">

                                <div class="flex items-start justify-between gap-3">

                                    <div>

                                        <h3 class="text-xl font-bold text-white">
                                            ${escapeHtml(
                                                salon.name
                                            )}
                                        </h3>

                                        <p class="text-sm text-gray-400 mt-1">

                                            <i class="bx bx-map"></i>

                                            ${escapeHtml(
                                                salon.location
                                            )}

                                        </p>

                                    </div>

                                    <span
                                        class="text-xs px-2 py-1 rounded-full bg-green-500/10 text-green-400 border border-green-500/20"
                                    >
                                        Open
                                    </span>

                                </div>

                                <div class="mt-4">

                                    <div class="flex items-center gap-2 text-sm text-gray-400 mb-2">

                                        <i class="bx bx-time text-blue-400"></i>

                                        <span>
                                            ${escapeHtml(
                                                salon.hours
                                            )}
                                        </span>

                                    </div>

                                </div>

                                <div class="mt-4">

                                    <p class="text-xs uppercase tracking-wide text-gray-500 mb-2">
                                        Services
                                    </p>

                                    <div class="space-y-1 text-sm text-gray-300">

                                        ${servicePreview}

                                    </div>

                                </div>

                            </div>

                        </div>

                        <div class="p-5 pt-0">

                            <button
                                type="button"
                                class="primary-btn book-btn"
                                data-salon-id="${escapeHtml(
                                    salon.salonId
                                )}"
                                ${hasOwner ? "" : "disabled"}
                            >

                                <i class="bx bx-calendar-check mr-1"></i>

                                ${
                                    hasOwner
                                        ? "Book Appointment"
                                        : "Salon Owner Not Connected"
                                }

                            </button>

                        </div>

                    `;

                    salonList.appendChild(
                        card
                    );

                }
            );

        }

        /*
         * OPEN MODAL
         */

        function openBookingModal(
            salon
        ) {

            if (!salon) {
                return;
            }

            if (!salon.ownerId) {

                showStatus(
                    "This salon has no owner connected",
                    true
                );

                return;

            }

            selectedSalon =
                salon;

            bookingSalonName.textContent =
                salon.name;

            bookingSalonLocation.textContent =
                salon.location;

            serviceType.innerHTML = "";

            if (
                salon.services.length
            ) {

                salon.services.forEach(
                    service => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            service.name;

                        option.textContent =
                            `${service.name} — R${Number(
                                service.price
                            ).toFixed(2)}`;

                        option.dataset.price =
                            service.price;

                        serviceType.appendChild(
                            option
                        );

                    }
                );

            }

            else {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = "";

                option.textContent =
                    "No services available";

                option.disabled = true;
                option.selected = true;

                serviceType.appendChild(
                    option
                );

            }

            bookingModal.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

            setTimeout(
                () => {
                    custName.focus();
                },
                150
            );

        }

        function closeBookingModal() {

            bookingModal.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

            selectedSalon =
                null;

        }

        closeModalBtn.addEventListener(
            "click",
            closeBookingModal
        );

        bookingModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    bookingModal
                ) {

                    closeBookingModal();

                }

            }
        );

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeBookingModal();

                }

            }
        );

        /*
         * BOOK BUTTON
         */

        salonList.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        ".book-btn"
                    );

                if (!button) {
                    return;
                }

                const salonId =
                    button.dataset.salonId;

                const salon =
                    allSalons.find(
                        item =>
                            item.salonId ===
                            salonId
                    );

                if (salon) {

                    openBookingModal(
                        salon
                    );

                }

            }
        );

        /*
         * CREATE BOOKING
         */

        bookingForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                if (!selectedSalon) {

                    showStatus(
                        "Please select a salon",
                        true
                    );

                    return;

                }

                const user =
                    auth.currentUser;

                if (!user) {

                    showStatus(
                        "Please log in before booking",
                        true
                    );

                    setTimeout(
                        () => {

                            window.location.href =
                                "index.html";

                        },
                        800
                    );

                    return;

                }

                /*
                 * CRITICAL SECURITY CHECK
                 */

                if (
                    !selectedSalon.ownerId
                ) {

                    showStatus(
                        "This salon is not connected to an owner",
                        true
                    );

                    return;

                }

                const name =
                    custName.value.trim();

                const phone =
                    custPhone.value.trim();

                const service =
                    serviceType.value;

                const date =
                    custDate.value;

                const time =
                    custTime.value;

                if (
                    !name ||
                    !phone ||
                    !service ||
                    !date ||
                    !time
                ) {

                    showStatus(
                        "Please complete all booking fields",
                        true
                    );

                    return;

                }

                confirmBookingBtn.disabled =
                    true;

                confirmBookingBtn.innerHTML = `

                    <i class="bx bx-loader-alt bx-spin"></i>

                    Booking...

                `;

                try {

                    const selectedService =
                        selectedSalon.services.find(
                            item =>
                                item.name ===
                                service
                        );

                    const price =
                        selectedService
                            ? Number(
                                selectedService.price
                            ) || 0
                            : 0;

                    /*
                     * THIS IS THE IMPORTANT PART.
                     *
                     * ownerId is taken directly from
                     * the salon document.
                     */

                    const bookingData = {

                        userId:
                            user.uid,

                        ownerId:
                            selectedSalon.ownerId,

                        salonId:
                            selectedSalon.salonId,

                        salonName:
                            selectedSalon.name,

                        customerName:
                            name,

                        phone:
                            phone,

                        service:
                            service,

                        price:
                            price,

                        date:
                            date,

                        time:
                            time,

                        status:
                            "pending",

                        createdAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp(),

                        updatedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    };

                    console.log(
                        "================================"
                    );

                    console.log(
                        "CREATING BOOKING"
                    );

                    console.log(
                        "CUSTOMER UID:",
                        user.uid
                    );

                    console.log(
                        "SALON ID:",
                        selectedSalon.salonId
                    );

                    console.log(
                        "OWNER ID:",
                        selectedSalon.ownerId
                    );

                    console.log(
                        "SERVICE:",
                        service
                    );

                    console.log(
                        "PRICE:",
                        price
                    );

                    console.log(
                        "DATE:",
                        date
                    );

                    console.log(
                        "TIME:",
                        time
                    );

                    console.log(
                        "BOOKING DATA:",
                        bookingData
                    );

                    console.log(
                        "================================"
                    );

                    const bookingRef =
                        await db
                            .collection(
                                "bookings"
                            )
                            .add(
                                bookingData
                            );

                    console.log(
                        "BOOKING CREATED:",
                        bookingRef.id
                    );

                    showStatus(
                        "Booking confirmed successfully!"
                    );

                    bookingForm.reset();

                    custDate.value =
                        formatDate(
                            new Date()
                        );

                    closeBookingModal();

                }

                catch (error) {

                    console.error(
                        "BOOKING ERROR:",
                        error
                    );

                    console.error(
                        "ERROR CODE:",
                        error.code
                    );

                    console.error(
                        "ERROR MESSAGE:",
                        error.message
                    );

                    showStatus(
                        error.message ||
                        "Booking failed",
                        true
                    );

                }

                finally {

                    confirmBookingBtn.disabled =
                        false;

                    confirmBookingBtn.innerHTML = `

                        <i class="bx bx-calendar-check mr-1"></i>

                        Confirm Booking

                    `;

                }

            }
        );

        /*
         * CUSTOMER BOOKING COUNTER
         */

        function listenForUserBookings(
            user
        ) {

            stopBookingListener();

            if (!user) {

                bookingsToday.textContent =
                    "0 bookings today";

                return;

            }

            const todayDate =
                formatDate(
                    new Date()
                );

            bookingUnsubscribe =
                db
                    .collection("bookings")
                    .where(
                        "userId",
                        "==",
                        user.uid
                    )
                    .where(
                        "date",
                        "==",
                        todayDate
                    )
                    .onSnapshot(

                        snapshot => {

                            const count =
                                snapshot.size;

                            bookingsToday.textContent =
                                `${count} ${
                                    count === 1
                                        ? "booking"
                                        : "bookings"
                                } today`;

                        },

                        error => {

                            console.error(
                                "BOOKING COUNTER ERROR:",
                                error
                            );

                            bookingsToday.textContent =
                                "0 bookings today";

                        }

                    );

        }

        function stopBookingListener() {

            if (
                bookingUnsubscribe
            ) {

                bookingUnsubscribe();

                bookingUnsubscribe =
                    null;

            }

        }

        /*
         * SEARCH
         */

        function performSearch() {

            const search =
                searchBar.value
                    .trim()
                    .toLowerCase();

            if (!search) {

                renderSalons(
                    allSalons
                );

                return;

            }

            const filtered =
                allSalons.filter(
                    salon => {

                        return (

                            salon.name
                                .toLowerCase()
                                .includes(search)

                            ||

                            salon.location
                                .toLowerCase()
                                .includes(search)

                            ||

                            salon.services.some(
                                service =>
                                    service.name
                                        .toLowerCase()
                                        .includes(search)
                            )

                        );

                    }
                );

            renderSalons(
                filtered
            );

            if (
                !filtered.length
            ) {

                showStatus(
                    "No salons matched your search"
                );

            }

        }

        searchBtn.addEventListener(
            "click",
            performSearch
        );

        searchBar.addEventListener(
            "input",
            performSearch
        );

        searchBar.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    performSearch();

                }

            }
        );

        /*
         * START
         */

        loadSalons();

    }
);

</script></body></html>
