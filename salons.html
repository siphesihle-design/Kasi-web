<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Kasi Cut</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-center mb-6 text-purple-500">🔥 Book Your Kasi Cut 🔥</h1>

    <input id="searchInput" type="text" placeholder="Search salons..." class="w-full p-3 rounded-lg bg-gray-800 text-white mb-3">
    <button onclick="searchSalons()" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold mb-4">Search</button>

    <p class="text-center text-purple-400 mb-6">0 bookings today</p>

    <div id="salonsList" class="grid gap-6"></div>
  </div>

<script>
  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    // paste your config here
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let currentUser = null;
  auth.onAuthStateChanged(user => { currentUser = user; loadSalons(); });

  function loadSalons() {
    db.collection("salons").get().then(snapshot => {
      const salonsList = document.getElementById("salonsList");
      salonsList.innerHTML = "";
      snapshot.forEach(doc => {
        const salon = doc.data();
        const isOwner = currentUser && salon.ownerId === currentUser.uid;
        
        const card = `
          <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
            <img src="${salon.image}" class="w-full h-48 object-cover rounded-lg mb-4">
            <h2 class="text-2xl font-bold mb-2">${salon.name}</h2>
            <p class="text-gray-400 mb-1">📍 ${salon.location}</p>
            <p class="text-gray-400 mb-3">🕒 ${salon.hours}</p>
            
            ${isOwner ? 
              `<button onclick="bookSalon('${doc.id}')" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold">Book Now</button>` :
              `<p class="text-red-500">⚠️ Not available for booking</p>`
            }
          </div>
        `;
        salonsList.innerHTML += card;
      });
    });
  }

  function bookSalon(salonId) {
    alert("Booking modal would open for: " + salonId);
  }

  function searchSalons() {
    loadSalons(); // we can add filter later
  }
</script>

</body>
</html>
