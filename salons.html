<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Kasi Cut</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-center mb-6 text-purple-500">🔥 Book Your Kasi Cut 🔥</h1>

    <input id="searchInput" type="text" placeholder="Search salons..." class="w-full p-3 rounded-lg bg-gray-800 text-white mb-3">
    <button id="searchBtn" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold mb-4">Search</button>
    <p class="text-center text-purple-400 mb-6">0 bookings today</p>

    <div id="salonsList" class="grid gap-6"></div>
  </div>

<script type="module">
  // Import the functions you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
    authDomain: "kasi-web-d073f.firebaseapp.com",
    databaseURL: "https://kasi-web-d073f-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "kasi-web-d073f",
    storageBucket: "kasi-web-d073f.firebasestorage.app",
    messagingSenderId: "471544855566",
    appId: "1:471544855566:web:aa669a968b8af0ceb6905f",
    measurementId: "G-Q8QVN2T54S"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    loadSalons();
  });

  async function loadSalons() {
    const salonsList = document.getElementById("salonsList");
    salonsList.innerHTML = "Loading salons...";
    
    const querySnapshot = await getDocs(collection(db, "salons"));
    
    if(querySnapshot.empty){
      salonsList.innerHTML = "<p class='text-center text-red-500'>No salons found. Add one in Firestore first.</p>";
      return;
    }

    let html = "";
    querySnapshot.forEach((doc) => {
      const s = doc.data();
      const isOwner = currentUser && s.ownerId === currentUser.uid;
      
      html += `
        <div class="bg-gray-900 p-6 rounded-xl border-gray-800">
          <img src="${s.image}" class="w-full h-48 object-cover rounded-lg mb-4">
          <h2 class="text-2xl font-bold mb-2">${s.name}</h2>
          <p class="text-gray-400">📍 ${s.location}</p>
          <p class="text-gray-400 mb-3">🕒 ${s.hours}</p>
          
          ${isOwner ? 
            `<button class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold">Book Now</button>` :
            `<p class="text-red-500">⚠️ Not available for booking</p>`
          }
        </div>
      `;
    });
    salonsList.innerHTML = html;
  }

  document.getElementById("searchBtn").addEventListener("click", loadSalons);
</script>

</body>
</html>
