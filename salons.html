<script type="module">

import {
    initializeApp

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain: "kasi-web-d073f.firebaseapp.com",

    projectId: "kasi-web-d073f",

    storageBucket: "kasi-web-d073f.firebasestorage.app",

    messagingSenderId: "471544855566",

    appId: "1:471544855566:web:aa669a968b8af0ceb6905f"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   YOUR EXISTING SALON DOCUMENT
========================================================= */

const KNOWN_SALON_ID = "ZcqMQy4lBIFVs6wDZxzB";


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let selectedSalon = null;


const salonsList =
    document.getElementById("salonsList");

const modal =
    document.getElementById("bookingModal");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginStatus =
    document.getElementById("loginStatus");

const databaseStatus =
    document.getElementById("databaseStatus");

const serviceSelect =
    document.getElementById("serviceSelect");

const confirmBooking =
    document.getElementById("confirmBooking");


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


/* =========================================================
   TODAY SOUTH AFRICA
========================================================= */

function getTodaySouthAfrica() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Africa/Johannesburg",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(new Date());

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(auth, user => {

    currentUser = user || null;


    if (user) {

        loginStatus.innerHTML = `
            👋 Logged in as
            <b class="text-purple-400">
                ${escapeHtml(user.email || "User")}
            </b>
        `;

        logoutBtn.classList.remove("hidden");

    } else {

        loginStatus.innerHTML = `
            ⚠️
            <span class="text-yellow-400">
                Login is required before booking.
            </span>
        `;

        logoutBtn.classList.add("hidden");

    }

});


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(auth);

            window.location.href = "index.html";

        } catch (error) {

            console.error(
                "Logout error:",
                error
            );

        }

    }
);


/* =========================================================
   LOAD SALONS
========================================================= */

async function loadSalons() {

    salonsList.innerHTML = `
        <div class="text-center col-span-full text-gray-400 py-10">

            <i class="bx bx-loader-alt bx-spin text-4xl text-purple-500"></i>

            <p class="mt-3">
                Loading salons...
            </p>

        </div>
    `;


    databaseStatus.classList.add("hidden");


    try {

        console.log(
            "Loading salons collection..."
        );


        /*
         * FIRST:
         * Load every document in salons.
         */

        const snapshot =
            await getDocs(
                collection(db, "salons")
            );


        console.log(
            "Salon documents found:",
            snapshot.size
        );


        /*
         * If Firestore says there are salons,
         * render them.
         */

        if (!snapshot.empty) {

            salonsList.innerHTML = "";

            let count = 0;


            snapshot.forEach(
                salonDoc => {

                    const salon =
                        salonDoc.data();


                    console.log(
                        "Salon:",
                        salonDoc.id,
                        salon
                    );


                    if (!salon) {
                        return;
                    }


                    renderSalon(
                        salonDoc.id,
                        salon
                    );


                    count++;

                }
            );


            if (count > 0) {

                databaseStatus.innerHTML = `
                    <span class="text-green-400">
                        ✓ ${count} salon${count === 1 ? "" : "s"} found.
                    </span>
                `;

                databaseStatus.className =
                    "status-box text-center text-sm bg-green-950/30 border border-green-800";

                databaseStatus.classList.remove(
                    "hidden"
                );

                return;
            }

        }


        /*
         * FALLBACK:
         *
         * Directly check your salon document.
         *
         * This makes the page more reliable while
         * your Firestore data is being set up.
         */

        console.log(
            "Collection empty. Checking known salon document..."
        );


        const directSalon =
            await getDoc(
                doc(
                    db,
                    "salons",
                    KNOWN_SALON_ID
                )
            );


        if (directSalon.exists()) {

            console.log(
                "Direct salon found:",
                directSalon.id
            );


            salonsList.innerHTML = "";

            renderSalon(
                directSalon.id,
                directSalon.data()
            );


            databaseStatus.innerHTML = `
                <span class="text-green-400">
                    ✓ Salon found successfully.
                </span>
            `;

            databaseStatus.className =
                "status-box text-center text-sm bg-green-950/30 border border-green-800";

            databaseStatus.classList.remove(
                "hidden"
            );

            return;

        }


        /*
         * Nothing found.
         */

        salonsList.innerHTML = `

            <div class="col-span-full text-center py-14">

                <i class="bx bx-store-alt empty-icon"></i>

                <h3 class="text-2xl font-bold mt-4">
                    No salons registered yet
                </h3>

                <p class="text-gray-500 mt-2">
                    Your salon has not been added to the salons collection.
                </p>

            </div>

        `;


        databaseStatus.innerHTML = `
            <span class="text-yellow-400">
                ⚠️ Firestore returned no salon documents.
            </span>
        `;

        databaseStatus.className =
            "status-box text-center text-sm bg-yellow-950/30 border border-yellow-800";

        databaseStatus.classList.remove(
            "hidden"
        );


    } catch (error) {

        console.error(
            "LOAD SALONS ERROR:",
            error
        );


        salonsList.innerHTML = `

            <div class="col-span-full text-center py-10">

                <i class="bx bx-error-circle text-5xl text-red-500"></i>

                <h3 class="text-xl font-bold text-red-400 mt-3">
                    Unable to load salons
                </h3>

                <p class="text-gray-400 text-sm mt-2">
                    ${escapeHtml(error.message)}
                </p>

            </div>

        `;


        databaseStatus.innerHTML = `
            <span class="text-red-400">
                Firebase error: ${escapeHtml(error.message)}
            </span>
        `;

        databaseStatus.className =
            "status-box text-center text-sm bg-red-950/30 border border-red-800";

        databaseStatus.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   RENDER SALON
========================================================= */

function renderSalon(id, salon) {

    console.log(
        "Rendering salon:",
        id,
        salon
    );


    const services =
        Array.isArray(salon.services)
            ? salon.services
            : [];


    const card =
        document.createElement("div");


    card.className =
        "salon-card flex flex-col";


    /*
     * Image
     */

    const image =
        salon.image ||
        "https://via.placeholder.com/600x300/111827/a855f7?text=Kasi+Salon";


    /*
     * Services HTML
     */

    let servicesHtml = "";


    if (services.length > 0) {

        servicesHtml =
            services
                .slice(0, 5)
                .map(service => {

                    if (
                        !service ||
                        typeof service !== "object"
                    ) {
                        return "";
                    }


                    const serviceName =
                        service.name ||
                        "Service";


                    const price =
                        Number(service.price);


                    if (
                        Number.isFinite(price)
                    ) {

                        return `
                            <span class="service-pill">
                                ${escapeHtml(serviceName)}
                                · R${price}
                            </span>
                        `;

                    }


                    return `
                        <span class="service-pill">
                            ${escapeHtml(serviceName)}
                        </span>
                    `;

                })
                .join("");

    } else {

        servicesHtml = `
            <span class="text-yellow-500 text-sm">
                No services listed
            </span>
        `;

    }


    /*
     * Salon card
     */

    card.innerHTML = `

        <div>

            <img
                src="${escapeHtml(image)}"
                class="salon-image"
                alt="${escapeHtml(salon.name || "Salon")}"
                onerror="
                    this.src='https://via.placeholder.com/600x300/111827/a855f7?text=Kasi+Salon'
                "
            >


            <div class="p-5">

                <h3 class="text-2xl font-bold mb-3">
                    ${escapeHtml(
                        salon.name ||
                        "Unnamed Salon"
                    )}
                </h3>


                <p class="text-gray-400 mb-2 flex items-center gap-2">

                    <i class="bx bx-map text-purple-400"></i>

                    <span>
                        ${escapeHtml(
                            salon.location ||
                            "Location not provided"
                        )}
                    </span>

                </p>


                <p class="text-gray-400 mb-4 flex items-center gap-2">

                    <i class="bx bx-time text-purple-400"></i>

                    <span>
                        ${escapeHtml(
                            salon.hours ||
                            "Hours not provided"
                        )}
                    </span>

                </p>


                <div class="mb-5">

                    <p class="text-gray-400 text-sm mb-2">
                        Services
                    </p>

                    <div>
                        ${servicesHtml}
                    </div>

                </div>

            </div>

        </div>


        <div class="px-5 pb-5">

            <button
                class="bookBtn w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 p-3 rounded-xl font-bold transition"
            >
                <i class="bx bx-calendar-plus mr-1"></i>
                Book Appointment
            </button>

        </div>

    `;


    /*
     * Booking button
     */

    card
        .querySelector(".bookBtn")
        .addEventListener(
            "click",
            () => {

                openBooking(
                    id,
                    salon
                );

            }
        );


    salonsList.appendChild(card);

}


/* =========================================================
   OPEN BOOKING
========================================================= */

function openBooking(
    salonId,
    salon
) {

    if (!currentUser) {

        alert(
            "Please login before booking."
        );

        window.location.href =
            "home.html";

        return;

    }


    /*
     * Get ownerId directly from
     * the Firestore salon document.
     */

    const ownerId =
        salon.ownerId || "";


    if (!ownerId) {

        alert(
            "This salon does not have an owner linked yet."
        );

        console.error(
            "Salon missing ownerId:",
            salonId
        );

        return;

    }


    selectedSalon = {

        id: salonId,

        ownerId: ownerId,

        ...salon

    };


    document
        .getElementById(
            "selectedSalonName"
        )
        .textContent =
        salon.name ||
        "Selected Salon";


    /*
     * Services
     */

    serviceSelect.innerHTML =
        `<option value="">
            Choose service
        </option>`;


    const services =
        Array.isArray(salon.services)
            ? salon.services
            : [];


    services.forEach(
        service => {

            if (
                !service ||
                typeof service !== "object"
            ) {
                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            const name =
                service.name ||
                "Service";


            const price =
                Number(service.price) || 0;


            option.value =
                JSON.stringify({
                    name,
                    price
                });


            option.textContent =
                `${name} - R${price}`;


            serviceSelect.appendChild(
                option
            );

        }
    );


    /*
     * Date
     */

    const today =
        getTodaySouthAfrica();


    const dateInput =
        document.getElementById(
            "bookingDate"
        );


    dateInput.min =
        today;


    dateInput.value =
        today;


    document.getElementById(
        "bookingTime"
    ).value = "";


    /*
     * Open modal
     */

    modal.classList.remove(
        "hidden"
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

    modal.classList.add(
        "hidden"
    );

}


document
    .getElementById(
        "cancelBooking"
    )
    .addEventListener(
        "click",
        closeModal
    );


modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   CONFIRM BOOKING
========================================================= */

confirmBooking.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            alert(
                "Please login again."
            );

            return;

        }


        if (!selectedSalon) {

            alert(
                "Please select a salon."
            );

            return;

        }


        const customerName =
            document
                .getElementById(
                    "customerName"
                )
                .value
                .trim();


        const phone =
            document
                .getElementById(
                    "customerPhone"
                )
                .value
                .trim();


        const serviceValue =
            serviceSelect.value;


        const date =
            document
                .getElementById(
                    "bookingDate"
                )
                .value;


        const time =
            document
                .getElementById(
                    "bookingTime"
                )
                .value;


        if (
            !customerName ||
            !phone ||
            !serviceValue ||
            !date ||
            !time
        ) {

            alert(
                "Please complete all fields."
            );

            return;

        }


        let selectedService;


        try {

            selectedService =
                JSON.parse(
                    serviceValue
                );

        } catch (error) {

            alert(
                "Please select a valid service."
            );

            return;

        }


        const salonId =
            selectedSalon.id;


        const ownerId =
            selectedSalon.ownerId;


        /*
         * Final safety check
         */

        if (
            !salonId ||
            !ownerId
        ) {

            alert(
                "This salon is not configured correctly. Owner ID is missing."
            );

            return;

        }


        confirmBooking.disabled =
            true;


        confirmBooking.textContent =
            "Booking...";


        try {

            const bookingData = {

                userId:
                    currentUser.uid,

                ownerId:
                    ownerId,

                salonId:
                    salonId,

                salonName:
                    selectedSalon.name ||
                    "Kasi Salon",

                customerName:
                    customerName,

                phone:
                    phone,

                service:
                    selectedService.name,

                price:
                    Number(
                        selectedService.price
                    ) || 0,

                date:
                    date,

                time:
                    time,

                status:
                    "pending",

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            };


            console.log(
                "Creating booking:",
                bookingData
            );


            await addDoc(
                collection(
                    db,
                    "bookings"
                ),
                bookingData
            );


            alert(
                "✅ Booking sent successfully!"
            );


            document
                .getElementById(
                    "customerName"
                )
                .value = "";


            document
                .getElementById(
                    "customerPhone"
                )
                .value = "";


            serviceSelect.value =
                "";


            document
                .getElementById(
                    "bookingTime"
                )
                .value = "";


            closeModal();


        } catch (error) {

            console.error(
                "Booking error:",
                error
            );


            alert(
                "Booking failed: " +
                error.message
            );


        } finally {

            confirmBooking.disabled =
                false;

            confirmBooking.textContent =
                "Confirm";

        }

    }
);


/* =========================================================
   START
========================================================= */

loadSalons();

</script>

</body>
