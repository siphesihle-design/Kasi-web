<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Your Kasi Cut</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-center mb-6 text-purple-500">🔥 Book Your Kasi Cut 🔥</h1>
    <div id="loginStatus" class="text-center mb-4 text-gray-400"></div>
    <div id="salonsList" class="grid gap-6"></div>
  </div>

  <!-- BOOKING POPUP -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4">
    <div class="bg-gray-900 p-6 rounded-xl w-full max-w-md">
      <h2 class="text-2xl font-bold mb-4 text-purple-500">Book Appointment</h2>
      <input id="clientName" type="text" placeholder="Your Name" class="w-full p-3 mb-3 rounded-lg bg-gray-800">
      <input id="clientNumber" type="tel" placeholder="Your Number" class="w-full p-3 mb-3 rounded-lg bg-gray-800">
      <input id="bookingTime" type="time" class="w-full p-3 mb-4 rounded-lg bg-gray-800">
      <button id="confirmBooking" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold mb-2">Confirm Booking</button>
      <button onclick="closeModal()" class="w-full bg-gray-700 p-3 rounded-lg">Cancel</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
    authDomain: "kasi-web-d073f.firebaseapp.com",
    projectId: "kasi-web-d073f",
    storageBucket: "kasi-web-d073f.firebasestorage.app",
    messagingSenderId: "471544855566",
    appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;
  let selectedSalonId = null;
  
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    document.getElementById("loginStatus").innerHTML = user 
      ? `Logged in as: ${user.email}` 
      : `Please login first`;
    loadSalons();
  });

  async function loadSalons() {
    const snapshot = await getDocs(collection(db, "salons"));
    let html = "";
    
    snapshot.forEach((doc) => {
      const s = doc.data();
      const salonId = doc.id;
      const servicesList = s.services ? s.services.map(svc => `<p class="text-sm">• ${svc}</p>`).join('') : '';
      
      html += `
        <div class="bg-gray-900 p-6 rounded-xl border-gray-800">
          <img src="${s.image}" class="w-full h-48 object-cover rounded-lg mb-4">
          <h2 class="text-2xl font-bold mb-2">${s.name}</h2>
          <p class="text-gray-400">📍 ${s.location}</p>
          <p class="text-gray-400 mb-3">🕒 ${s.hours}</p>
          
          <div class="mb-4 bg-gray-800 p-3 rounded-lg">
            <h3 class="font-bold text-purple-400 mb-2">Services:</h3>
            ${servicesList}
          </div>
          
          <button onclick="openModal('${salonId}')" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold">
            Book Now
          </button>
        </div>
      `;
    });
    document.getElementById("salonsList").innerHTML = html;
  }

  window.openModal = function(salonId) {
    if(!currentUser){
      alert("Please login first!");
      return;
    }
    selectedSalonId = salonId;
    document.getElementById("bookingModal").classList.remove("hidden");
  }

  window.closeModal = function() {
    document.getElementById("bookingModal").classList.add("hidden");
  }

  document.getElementById("confirmBooking").addEventListener("click", async () => {
    const name = document.getElementById("clientName").value;
    const number = document.getElementById("clientNumber").value;
    const time = document.getElementById("bookingTime").value;

    if(!name || !number || !time){
      alert("Please fill all fields");
      return;
    }

    await addDoc(collection(db, "bookings"), {
      salonId: selectedSalonId,
      clientId: currentUser.uid,
      clientEmail: currentUser.email,
      name: name,
      number: number,
      time: time,
      status: "pending",
      createdAt: new Date()
    });

    alert("Booking sent! 🔥");
    closeModal();
  });

</script>

</body>
</html>
