<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Fresh Cuts, No Lines</title>
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css?v=30">
</head>
<body class="cover-page">
    <div class="cover-container">
        <div class="cover-logo"><i class='bx bx-cut'></i></div>
        <h1 class="cover-title">K@si Web</h1>
        <h2 class="cover-subtitle">Book in</h2>
        <p class="cover-subtext">Book your barber. Skip the queue. Get fresh.</p>
        
        <div class="cover-image glass-card">
           <img src="B57E654F.jpeg" alt="Kasi Mural" onerror="this.src='https://via.placeholder.com/400x220/FF6B00/FFFFFF?text=KASI+MURAL'">
        </div>
        
        <a href="home.html" id="getStartedBtn" class="cover-btn primary-btn">Get Started <i class='bx bx-right-arrow-alt'></i></a>
        <p class="cover-footer">© 2026 K@si Web • Made for Kasi People</p>
    </div>

<script>
    const getStartedBtn = document.getElementById('getStartedBtn');
    getStartedBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if(navigator.vibrate) navigator.vibrate(50);
        getStartedBtn.innerHTML = `Loading... <i class='bx bx-loader-circle bx-spin'></i>`;
        getStartedBtn.style.opacity = "0.7"; 
        getStartedBtn.style.pointerEvents = "none";
        setTimeout(() => { window.location.href = 'home.html'; }, 350);
    });
</script>
</body>
</html>
