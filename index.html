<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>K@si Web | Fresh Cuts, No Lines</title>

    <meta name="theme-color" content="#3B82F6">
    <meta name="description" content="K@si Web - Book your barber, skip the queue and get fresh.">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: linear-gradient(
                135deg,
                #0a0a1a 0%,
                #1a0a3e 100%
            );

            color: white;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .page {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .logo-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .logo-icon i {
            color: #3B82F6;
            filter:
                drop-shadow(0 0 12px rgba(59,130,246,0.5));
        }

        .title {
            font-size: clamp(2.5rem, 12vw, 4rem);
            font-weight: 900;
            margin: 0 0 8px;

            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #a78bfa
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .typed-wrapper {
            min-height: 45px;
            font-size: clamp(1.4rem, 6vw, 2rem);
            font-weight: 700;
            margin-bottom: 8px;
        }

        #typed-text {
            color: #60a5fa;
        }

        .cursor {
            color: #60a5fa;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .subtitle {
            color: #9ca3af;
            margin: 0 0 30px;
            font-size: 1rem;
        }

        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            background: rgba(17,17,30,0.7);

            border:
                1px solid
                rgba(59,130,246,0.3);

            border-radius: 20px;
        }

        .hero-image {
            width: 100%;
            height: 270px;

            object-fit: cover;

            display: block;

            border-radius: 20px;
        }

        .image-card {
            overflow: hidden;
            margin-bottom: 22px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.4);
        }

        .glow:hover {
            box-shadow:
                0 0 25px
                rgba(59,130,246,0.5);
        }

        .main-button,
        .subscribe-button {
            width: 100%;
            border: none;

            padding: 16px;

            border-radius: 14px;

            font-size: 1rem;
            font-weight: 800;

            color: white;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

            margin-bottom: 12px;
        }

        .main-button {
            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed
                );
        }

        .subscribe-button {
            background:
                linear-gradient(
                    90deg,
                    #4f46e5,
                    #2563eb
                );
        }

        .main-button:hover,
        .subscribe-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 25px
                rgba(59,130,246,0.3);
        }

        .main-button:active,
        .subscribe-button:active {
            transform: scale(0.98);
        }

        .footer {
            color: #6b7280;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        /* COOKIE */

        .cookie-banner {
            position: fixed;

            bottom: 20px;
            left: 10px;
            right: 10px;

            z-index: 9999;

            display: none;
            justify-content: center;
        }

        .cookie-box {
            position: relative;

            width: 100%;
            max-width: 500px;

            padding: 20px;

            background:
                rgba(15,15,30,0.96);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border:
                1px solid
                rgba(59,130,246,0.4);

            border-radius: 18px;

            color: white;

            box-shadow:
                0 0 25px
                rgba(59,130,246,0.3);

            animation:
                slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .cookie-icon {
            font-size: 38px;
            text-align: center;
        }

        .cookie-title {
            color: #60a5fa;
            text-align: center;
            font-weight: 800;
            margin: 5px 0 8px;
        }

        .cookie-description {
            color: #9ca3af;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .cookie-close {
            position: absolute;
            top: 7px;
            right: 12px;

            border: none;
            background: transparent;

            color: #9ca3af;

            font-size: 28px;

            cursor: pointer;
        }

        .cookie-close:hover {
            color: #3B82F6;
        }

        .cookie-buttons {
            display: flex;
            gap: 10px;
        }

        .cookie-buttons button {
            flex: 1;

            border: none;

            padding: 12px;

            border-radius: 12px;

            color: white;
            font-weight: 700;

            cursor: pointer;
        }

        #acceptAllCookies {
            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed
                );
        }

        #essentialCookies {
            background: #374151;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .hero-image {
                height: 230px;
            }

            .cookie-buttons {
                flex-direction: column;
            }
        }
    </style>

    <!-- ONESIGNAL -->
    <script
        src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
        defer>
    </script>

    <script>
        window.OneSignalDeferred =
            window.OneSignalDeferred || [];

        OneSignalDeferred.push(async function(OneSignal) {

            try {

                await OneSignal.init({
                    appId:
                        "9a85cfba-e375-4527-a9d3-a772dc9c0fa0"
                });

            } catch (error) {

                console.error(
                    "OneSignal initialization error:",
                    error
                );

            }

        });
    </script>
</head>

<body>

<div class="page">

    <div class="logo-icon">
        <i class="bx bx-cut"></i>
    </div>

    <h1 class="title">
        K@si Web
    </h1>

    <div class="typed-wrapper">
        <span id="typed-text"></span>
        <span class="cursor">|</span>
    </div>

    <p class="subtitle">
        Book your barber. Skip the queue. Get fresh.
    </p>

    <div class="glass image-card glow">

        <img
            src="683B4C35-1E45-4922-9A56-56BDD423D1F2.jpeg"
            alt="Fresh Cut"
            class="hero-image"
            onerror="
                this.src='https://via.placeholder.com/500x300/1a0a3e/3b82f6?text=Fresh+Cut'
            "
        >

    </div>

    <a
        href="home.html"
        id="getStartedBtn"
        class="main-button"
        style="
            display:block;
            text-decoration:none;
        "
    >
        Get Started
        <i class="bx bx-right-arrow-alt"></i>
    </a>

    <button
        id="subscribe-btn"
        class="subscribe-button"
        type="button"
    >
        🔔 Get Booking Alerts
    </button>

    <p class="footer">
        © 2026 K@si Web • Made for Kasi People
    </p>

</div>


<!-- COOKIE BANNER -->

<div
    id="cookieBanner"
    class="cookie-banner"
>

    <div class="cookie-box">

        <div class="cookie-icon">
            🍪
        </div>

        <h4 class="cookie-title">
            COOKIES & NOTIFICATIONS
        </h4>

        <p class="cookie-description">
            We use cookies to save your preferences.
            Owners can receive instant booking alerts.
        </p>

        <button
            id="cookieClose"
            class="cookie-close"
            type="button"
            aria-label="Close"
        >
            ×
        </button>

        <div class="cookie-buttons">

            <button
                id="acceptAllCookies"
                type="button"
            >
                Accept All
            </button>

            <button
                id="essentialCookies"
                type="button"
            >
                Essential Only
            </button>

        </div>

    </div>

</div>


<script>

    /* ================================
       TYPING ANIMATION
    ================================= */

    const words = [
        "Fresh Cuts",
        "No Lines",
        "Kasi Prices"
    ];

    let wordIndex = 0;
    let charIndex = 0;
    let deleting = false;

    const typedText =
        document.getElementById("typed-text");

    function typeText() {

        if (!typedText) return;

        const word =
            words[wordIndex];

        if (deleting) {

            charIndex--;

        } else {

            charIndex++;

        }

        typedText.textContent =
            word.substring(0, charIndex);

        if (
            !deleting &&
            charIndex >= word.length
        ) {

            deleting = true;

            setTimeout(
                typeText,
                1500
            );

            return;
        }

        if (
            deleting &&
            charIndex <= 0
        ) {

            deleting = false;

            wordIndex =
                (wordIndex + 1) %
                words.length;
        }

        setTimeout(
            typeText,
            deleting ? 80 : 120
        );
    }

    typeText();


    /* ================================
       COOKIE SYSTEM
    ================================= */

    const banner =
        document.getElementById(
            "cookieBanner"
        );

    const acceptAll =
        document.getElementById(
            "acceptAllCookies"
        );

    const essential =
        document.getElementById(
            "essentialCookies"
        );

    const closeButton =
        document.getElementById(
            "cookieClose"
        );

    const subscribeButton =
        document.getElementById(
            "subscribe-btn"
        );


    function hideBanner() {

        if (banner) {

            banner.style.display =
                "none";
        }
    }


    function showBanner() {

        if (banner) {

            banner.style.display =
                "flex";
        }
    }


    function saveCookieChoice(choice) {

        localStorage.setItem(
            "kasiCookieChoice",
            choice
        );

        hideBanner();
    }


    const savedChoice =
        localStorage.getItem(
            "kasiCookieChoice"
        );

    if (!savedChoice) {

        setTimeout(
            showBanner,
            1000
        );
    }


    acceptAll?.addEventListener(
        "click",
        async () => {

            saveCookieChoice("all");

            try {

                if (
                    window.OneSignalDeferred
                ) {

                    OneSignalDeferred.push(
                        async function(OneSignal) {

                            try {

                                await OneSignal.showNativePrompt();

                                await OneSignal
                                    .registerForPushNotifications();

                            } catch (error) {

                                console.error(
                                    "Notification permission error:",
                                    error
                                );

                            }

                        }
                    );

                }

            } catch (error) {

                console.error(error);

            }

        }
    );


    essential?.addEventListener(
        "click",
        () => {

            saveCookieChoice(
                "essential"
            );

        }
    );


    closeButton?.addEventListener(
        "click",
        () => {

            saveCookieChoice(
                "essential"
            );

        }
    );


    /* ================================
       BOOKING ALERT BUTTON
    ================================= */

    subscribeButton?.addEventListener(
        "click",
        () => {

            const choice =
                localStorage.getItem(
                    "kasiCookieChoice"
                );

            if (choice !== "all") {

                showBanner();

                alert(
                    "Please choose Accept All first to enable booking alerts 🍪"
                );

                return;
            }

            if (
                window.OneSignalDeferred
            ) {

                OneSignalDeferred.push(
                    async function(OneSignal) {

                        try {

                            await OneSignal
                                .showNativePrompt();

                            await OneSignal
                                .registerForPushNotifications();

                        } catch (error) {

                            console.error(
                                "OneSignal error:",
                                error
                            );

                            alert(
                                "Notification setup could not be completed."
                            );

                        }

                    }
                );

            }

        }
    );

</script>

</body>
                </html>
