<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Fresh Cuts, No Lines</title>
    <meta name="theme-color" content="#3B82F6">
    <meta name="description" content="K@si Web - Book your barber, skip the queue and get fresh.">
    
    <link rel="manifest" href="manifest.json">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a3e 100%);
            background-attachment: fixed;
        }

        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(17, 17, 30, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .glow:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .cookie-banner {
            position: fixed;
            bottom: 20px;
            left: 10px;
            right: 10px;
            z-index: 9999;
            display: flex;
            justify-content: center;
        }

        .cookie-box {
            position: relative;
            max-width: 500px;
            width: 100%;
            padding: 20px;
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 15px;
            color: #fff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .landing-image {
            min-height: 250px;
        }

        @media (max-width: 480px) {
            .landing-image {
                min-height: 220px;
            }
        }
    </style>

    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function (OneSignal) {
            try {
                await OneSignal.init({
                    appId: "9a85cfba-e375-4527-a9d3-a772dc9c0fa0"
                });
            } catch (error) {
                console.error("OneSignal initialization error:", error);
            }
        });
    </script>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4 py-8">

    <main class="text-center max-w-lg w-full">
        <!-- LOGO -->
        <div class="text-8xl mb-4">
            <i class="bx bx-cut text-blue-500"></i>
        </div>

        <!-- BRAND -->
        <h1 class="text-5xl font-extrabold mb-2 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
            K@si Web
        </h1>

        <!-- ANIMATED TITLE -->
        <div class="text-2xl h-10 mb-2">
            <span id="typed-text" class="text-blue-400"></span>
            <span class="cursor text-blue-400">|</span>
        </div>

        <p class="text-gray-400 mb-8">
            Book your barber. Skip the queue. Get fresh.
        </p>

        <!-- COVER IMAGE -->
        <div class="glass rounded-2xl p-0 mb-8 overflow-hidden glow">
            <img src="683B4C35-1E45-4922-9A56-56BDD423D1F2.jpeg" alt="Fresh haircut" class="landing-image w-full h-64 object-cover" onerror="this.src='https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=800&q=80'">
        </div>

        <!-- ENTER K@SI WEB -->
        <a href="home.html" id="getStartedBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 p-4 rounded-xl font-bold mb-3 block transition transform hover:scale-105">
            Get Started
            <i class="bx bx-right-arrow-alt"></i>
        </a>

        <!-- NOTIFICATIONS -->
        <button id="subscribe-btn" type="button" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 p-4 rounded-xl font-bold transition">
            🔔 Get Booking Alerts
        </button>

        <p class="text-gray-500 text-sm mt-6">
            © 2026 K@si Web • Made for Kasi People
        </p>
    </main>

    <!-- COOKIE BANNER -->
    <div id="cookieBanner" class="cookie-banner" style="display:none;">
        <div class="cookie-box">
            <div class="text-4xl text-center mb-2">🍪</div>
            <h4 class="text-blue-400 text-center font-bold mb-2">COOKIES & NOTIFICATIONS</h4>
            <p class="text-gray-400 text-sm text-center mb-4">
                We use cookies to save your bookings. Owners get instant alerts when you book.
            </p>
            <button type="button" id="cookieClose" class="absolute top-2 right-3 text-gray-400 hover:text-blue-400 text-2xl" aria-label="Close cookie notice">
                ×
            </button>
            <div class="flex gap-3">
                <button type="button" id="acceptAllCookies" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 p-3 rounded-xl font-bold">
                    Accept All
                </button>
                <button type="button" id="essentialCookies" class="flex-1 bg-gray-700 hover:bg-gray-600 p-3 rounded-xl font-bold">
                    Essential Only
                </button>
            </div>
        </div>
    </div>

    <script>
        /* WORD ANIMATION */
        const words = ["Fresh Cuts", "No Lines", "Kasi Prices"];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typedText = document.getElementById("typed-text");

        function type() {
            if (!typedText) return;
            const currentWord = words[wordIndex];

            if (isDeleting) {
                typedText.textContent = currentWord.substring(0, charIndex--);
            } else {
                typedText.textContent = currentWord.substring(0, charIndex++);
            }

            if (!isDeleting && charIndex === currentWord.length) {
                isDeleting = true;
                setTimeout(type, 1500);
                return;
            }

            if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
            }

            setTimeout(type, isDeleting ? 80 : 120);
        }

        document.addEventListener("DOMContentLoaded", () => {
            type();

            /* COOKIE SYSTEM */
            const banner = document.getElementById("cookieBanner");
            const acceptAll = document.getElementById("acceptAllCookies");
            const essential = document.getElementById("essentialCookies");
            const closeBtn = document.getElementById("cookieClose");
            const subBtn = document.getElementById("subscribe-btn");

            function saveChoice(choice) {
                localStorage.setItem("kasiCookieChoice", choice);
                if (banner) banner.style.display = "none";
            }

            const existingChoice = localStorage.getItem("kasiCookieChoice");
            if (!existingChoice && banner) {
                setTimeout(() => { banner.style.display = "flex"; }, 800);
            }

            acceptAll?.addEventListener("click", () => {
                saveChoice("all");
                if (window.OneSignalDeferred) {
                    OneSignalDeferred.push(async function (OneSignal) {
                        try {
                            await OneSignal.showNativePrompt();
                            await OneSignal.registerForPushNotifications();
                        } catch (error) {
                            console.error("Notification permission error:", error);
                        }
                    });
                }
            });

            essential?.addEventListener("click", () => saveChoice("essential"));
            closeBtn?.addEventListener("click", () => saveChoice("essential"));

            subBtn?.addEventListener("click", () => {
                const choice = localStorage.getItem("kasiCookieChoice");
                if (choice !== "all") {
                    alert("Please accept all cookies first to enable notifications 🍪");
                    if (banner) banner.style.display = "flex";
                    return;
                }

                if (window.OneSignalDeferred) {
                    OneSignalDeferred.push(async function (OneSignal) {
                        try {
                            await OneSignal.showNativePrompt();
                        } catch (error) {
                            console.error("Notification prompt error:", error);
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
