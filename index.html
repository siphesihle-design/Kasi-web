<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Fresh Cuts, No Lines</title>
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background: linear-gradient(135deg, #0f0f0f 0%, #1a0a2e 100%); }
     .glass { backdrop-filter: blur(12px); background: rgba(17, 17, 17, 0.7); border: 1px solid rgba(139, 92, 246, 0.2); }
     .glow:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
     .cursor { animation: blink 1s infinite; }
      @keyframes blink { 50% { opacity: 0; } }
     .cookie-banner { position: fixed; bottom: 20px; left: 10px; right: 10px; z-index: 9999; display: flex; justify-content: center; }
     .cookie-box { position: relative; max-width: 500px; width: 100%; padding: 20px; background: rgba(20,20,30,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(139, 92, 246, 0.4); border-radius: 15px; color: #fff; }
    </style>

    <!-- ONESIGNAL SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({ appId: "9a85cfba-e375-4527-a9d3-a772dc9c0fa0" });
      });
    </script>
</head>
<body class="text-white min-h-screen flex items-center justify-center">
    <div class="text-center px-4 max-w-lg">
        <div class="text-8xl mb-4"><i class='bx bx-cut text-purple-500'></i></div>
        <h1 class="text-5xl font-extrabold mb-2 bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">K@si Web</h1>
        <div class="text-2xl h-10 mb-2"><span id="typed-text" class="text-purple-400"></span><span class="cursor text-purple-400">|</span></div>
        <p class="text-gray-400 mb-8">Book your barber. Skip the queue. Get fresh.</p>

        <div class="glass rounded-2xl p-0 mb-8 overflow-hidden glow">
           <img src="683B4C35-1E45-4922-9A56-56BDD423D1F2.jpeg" alt="Fresh Cut" class="w-full h-64 object-cover" onerror="this.src='https://via.placeholder.com/400x250/1a0a2e/8b5cf6?text=Fresh+Cut'">
        </div>

        <a href="home.html" id="getStartedBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 p-4 rounded-xl font-bold mb-3 block transition transform hover:scale-105">Get Started <i class='bx bx-right-arrow-alt'></i></a>
        
        <button id="subscribe-btn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 p-4 rounded-xl font-bold">🔔 Get Booking Alerts</button>
        <p class="text-gray-500 text-sm mt-6">© 2026 K@si Web • Made for Kasi People</p>
    </div>

    <!-- COOKIE BANNER -->
    <div id="cookieBanner" class="cookie-banner" style="display:none;">
      <div class="cookie-box">
        <div class="text-4xl text-center mb-2">🍪</div>
        <h4 class="text-purple-400 text-center font-bold mb-2">COOKIES & NOTIFICATIONS</h4>
        <p class="text-gray-400 text-sm text-center mb-4">We use cookies to save your bookings. Allow notifications for instant alerts.</p>
        <button class="absolute top-2 right-3 text-gray-400" id="cookieClose">×</button>
        <div class="flex gap-3">
          <button id="acceptAllCookies" class="flex-1 bg-purple-600 p-3 rounded-xl font-bold">Accept All</button>
          <button id="essentialCookies" class="flex-1 bg-gray-700 p-3 rounded-xl font-bold">Essential Only</button>
        </div>
      </div>
    </div>

<script>
    // WORD ANIMATION
    const words = ["Fresh Cuts", "No Lines", "Kasi Prices"];
    let wordIndex = 0; let charIndex = 0; let isDeleting = false;
    const typedText = document.getElementById('typed-text');
    function type() {
        const currentWord = words[wordIndex];
        if (isDeleting) { typedText.textContent = currentWord.substring(0, charIndex--); } 
        else { typedText.textContent = currentWord.substring(0, charIndex++); }
        if (!isDeleting && charIndex === currentWord.length) { isDeleting = true; setTimeout(type, 1500); return; } 
        else if (isDeleting && charIndex === 0) { isDeleting = false; wordIndex = (wordIndex + 1) % words.length; }
        setTimeout(type, isDeleting? 80 : 120);
    }
    document.addEventListener('DOMContentLoaded', type);

    // COOKIE + ONESIGNAL
    const banner = document.getElementById('cookieBanner');
    const acceptAll = document.getElementById('acceptAllCookies');
    const essential = document.getElementById('essentialCookies');
    const closeBtn = document.getElementById('cookieClose');
    const subBtn = document.getElementById('subscribe-btn');

    setTimeout(() => { if(banner) banner.style.display = 'flex'; }, 800);

    function saveChoice(choice) {
        localStorage.setItem('kasiCookieChoice', choice);
        if(banner) banner.style.display = 'none';
    }

    acceptAll?.addEventListener('click', () => {
        saveChoice('all');
        OneSignalDeferred.push(async function(OneSignal) { await OneSignal.showNativePrompt(); });
    });
    essential?.addEventListener('click', () => saveChoice('essential'));
    closeBtn?.addEventListener('click', () => saveChoice('essential'));
    subBtn?.addEventListener('click', async () => {
        OneSignalDeferred.push(async function(OneSignal) { await OneSignal.showNativePrompt(); });
    });
</script>
</body>
</html>
