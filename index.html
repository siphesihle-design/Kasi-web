<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Fresh Cuts, No Lines</title>
    <meta name="theme-color" content="#3B82F6">
    
    <!-- CSS & Icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a3e 100%); 
        }
        .glass { 
            backdrop-filter: blur(12px); 
            background: rgba(17, 17, 30, 0.7); 
            border: 1px solid rgba(59, 130, 246, 0.3); 
        }
        .glow:hover { 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); 
        }
        .cursor { 
            animation: blink 1s infinite; 
        }
        @keyframes blink { 
            50% { opacity: 0; } 
        }
        .cookie-banner { 
            position: fixed; 
            bottom: 20px; 
            left: 10px; 
            right: 10px; 
            z-index: 9999; 
            display: flex; 
            justify-content: center; 
        }
        .cookie-box { 
            position: relative; 
            max-width: 500px; 
            width: 100%; 
            padding: 20px; 
            background: rgba(15,15,30,0.95); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(59, 130, 246, 0.4); 
            border-radius: 15px; 
            color: #fff; 
            box-shadow: 0 0 20px rgba(59,130,246,0.3); 
            animation: slideUp 0.4s ease; 
        }
        @keyframes slideUp { 
            from { transform: translateY(100px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
    </style>

    <!-- ONESIGNAL SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({ appId: "9a85cfba-e375-4527-a9d3-a772dc9c0fa0" });
        });
    </script>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <div class="text-center w-full max-w-lg">
        <!-- Brand Header -->
        <div class="text-7xl sm:text-8xl mb-3"><i class='bx bx-cut text-blue-500'></i></div>
        <h1 class="text-4xl sm:text-5xl font-extrabold mb-2 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">K@si Web</h1>
        
        <!-- Typewriter Subtitle -->
        <div class="text-xl sm:text-2xl h-10 mb-2 font-medium">
            <span id="typed-text" class="text-blue-400"></span><span class="cursor text-blue-400">|</span>
        </div>
        <p class="text-gray-400 text-sm sm:text-base mb-6">Book your barber. Skip the queue. Get fresh.</p>

        <!-- Image Card -->
        <div class="glass rounded-2xl p-0 mb-6 overflow-hidden glow transition duration-300">
           <img src="683B4C35-1E45-4922-9A56-56BDD423D1F2.jpeg" alt="Fresh Cut" class="w-full h-56 sm:h-64 object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x250/1a0a3e/3b82f6?text=Fresh+Cut';">
        </div>

        <!-- Primary Action Buttons -->
        <a href="home.html" id="getStartedBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 p-4 rounded-xl font-bold mb-3 block transition transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-blue-500/20">
            Get Started <i class='bx bx-right-arrow-alt align-middle text-xl'></i>
        </a>
        
        <button id="subscribe-btn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 p-4 rounded-xl font-bold transition transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-indigo-500/20">
            🔔 Get Booking Alerts
        </button>

        <p class="text-gray-500 text-xs sm:text-sm mt-6">© 2026 K@si Web • Made for Kasi People</p>
    </div>

    <!-- Audio Element for Feedback -->
    <audio id="clickSound" src="mixkit-select-click-1109.wav" preload="auto"></audio>

    <!-- COOKIE & CONSENT BANNER -->
    <div id="cookieBanner" class="cookie-banner" style="display:none;">
      <div class="cookie-box">
        <div class="text-3xl text-center mb-1">🍪</div>
        <h4 class="text-blue-400 text-center font-bold mb-1 text-base sm:text-lg">COOKIES & NOTIFICATIONS</h4>
        <p class="text-gray-400 text-xs sm:text-sm text-center mb-4 leading-relaxed">
            We use cookies to save your bookings. Owners get instant alerts when you book.
        </p>
        <button class="absolute top-2 right-3 text-gray-400 hover:text-blue-400 text-2xl font-bold leading-none" id="cookieClose">&times;</button>
        <div class="flex gap-3">
          <button id="acceptAllCookies" class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 p-3 rounded-xl font-bold text-sm transition active:scale-95">Accept All</button>
          <button id="essentialCookies" class="flex-1 bg-gray-700 hover:bg-gray-600 p-3 rounded-xl font-bold text-sm transition active:scale-95">Essential Only</button>
        </div>
      </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // 1. SOUND & HAPTIC FEEDBACK
        const clickSound = document.getElementById('clickSound');
        if (clickSound) clickSound.volume = 0.4;

        function playClick() {
            if (clickSound) {
                clickSound.currentTime = 0;
                clickSound.play().catch(() => {});
            }
            if (navigator.vibrate) navigator.vibrate(30);
        }

        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.tagName === 'A' || e.target.closest('a')) {
                playClick();
            }
        });

        // 2. TYPEWRITER WORD ANIMATION
        const words = ["Fresh Cuts", "No Lines", "Kasi Prices"];
        let wordIndex = 0; 
        let charIndex = 0; 
        let isDeleting = false;
        const typedText = document.getElementById('typed-text');

        function type() {
            if (!typedText) return;
            const currentWord = words[wordIndex];
            
            if (isDeleting) { 
                typedText.textContent = currentWord.substring(0, charIndex--); 
            } else { 
                typedText.textContent = currentWord.substring(0, charIndex++); 
            }

            if (!isDeleting && charIndex === currentWord.length) { 
                isDeleting = true; 
                setTimeout(type, 1500); 
                return; 
            } else if (isDeleting && charIndex === 0) { 
                isDeleting = false; 
                wordIndex = (wordIndex + 1) % words.length; 
            }

            setTimeout(type, isDeleting ? 80 : 120);
        }

        type();

        // 3. COOKIE & ONESIGNAL CONSENT LOGIC
        const banner = document.getElementById('cookieBanner');
        const acceptAll = document.getElementById('acceptAllCookies');
        const essential = document.getElementById('essentialCookies');
        const closeBtn = document.getElementById('cookieClose');
        const subBtn = document.getElementById('subscribe-btn');

        const cookieChoice = localStorage.getItem('kasiCookieChoice');
        if (!cookieChoice && banner) {
            setTimeout(() => { banner.style.display = 'flex'; }, 800);
        }

        function saveChoice(choice) {
            localStorage.setItem('kasiCookieChoice', choice);
            if (banner) banner.style.display = 'none';
        }

        acceptAll?.addEventListener('click', () => {
            saveChoice('all');
            if (window.OneSignalDeferred) {
                OneSignalDeferred.push(async function(OneSignal) { 
                    try {
                        await OneSignal.showNativePrompt();
                        await OneSignal.registerForPushNotifications();
                    } catch (err) {
                        console.error("OneSignal error:", err);
                    }
                });
            }
        });

        essential?.addEventListener('click', () => saveChoice('essential'));
        closeBtn?.addEventListener('click', () => saveChoice('essential'));
        
        subBtn?.addEventListener('click', async () => {
            const choice = localStorage.getItem('kasiCookieChoice');
            if (choice !== 'all') {
                alert("Please accept all cookies first to enable notifications 🍪");
                if (banner) banner.style.display = 'flex';
                return;
            }
            if (window.OneSignalDeferred) {
                OneSignalDeferred.push(async function(OneSignal) { 
                    try {
                        await OneSignal.showNativePrompt(); 
                    } catch (err) {
                        console.error("OneSignal error:", err);
                    }
                });
            }
        });
    });
</script>
</body>
</html>
