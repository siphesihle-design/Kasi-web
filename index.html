<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K@si Web - Fresh Cut</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f1a;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 36px;
      color: #3b82f6;
      margin: 0;
    }
    h2 {
      font-size: 20px;
      color: #8b5cf6;
      margin: 10px 0;
    }
    p {
      color: #aaa;
      margin-bottom: 30px;
    }
    #subscribe-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }
    #subscribe-btn:active {
      transform: scale(0.97);
    }
    /* Cookie Banner */
    .cookie-banner {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #1a1a2e;
      padding: 20px;
      border-radius: 16px;
      text-align: left;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .cookie-banner h3 {
      color: #8b5cf6;
      margin: 0 0 10px;
    }
    .cookie-banner button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }
    .accept {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }
    .essential {
      background: transparent;
      color: #8b5cf6;
    }
  </style>
</head>
<body>

  <div class="logo">✂️</div>
  <h1>K@si Web</h1>
  <h2>Fresh Cut</h2>
  <p>Book your barber. Skip the queue. Get fresh.</p>

  <img src="your-barbershop-image.jpg" alt="Barbershop" style="width:100%; max-width:400px; border-radius:16px; margin-bottom:20px;">

  <!-- NEW SUBSCRIBE BUTTON -->
  <button id="subscribe-btn">🔔 Get Booking Alerts</button>

  <!-- COOKIE BANNER -->
  <div class="cookie-banner">
    <h3>🍪 COOKIES & NOTIFICATIONS</h3>
    <p>We use cookies to save your bookings. Allow notifications so barbers get instant alerts.</p>
    <button class="accept">Accept All</button>
    <button class="essential">Essential Only</button>
  </div>


  <!-- ONESIGNAL CODE -->
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "9a85cfba-e375-4527-a9d3-a772dc9c0fa0",
      });

      // Trigger prompt only when user clicks the button
      const btn = document.getElementById("subscribe-btn");
      btn.addEventListener("click", async () => {
        await OneSignal.showNativePrompt();
      });
    });
  </script>

</body>
</html>
