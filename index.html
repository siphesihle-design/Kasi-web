<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Fresh Cuts, No Lines</title>
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css?v=31">
</head>
<body class="cover-page">
    <div class="cover-container">
        <div class="cover-logo"><i class='bx bx-cut'></i></div>
        <h1 class="cover-title">K@si Web</h1>
        <div class="word-animation"><span id="typed-text"></span><span class="cursor">|</span></div>
        <p class="cover-subtext">Book your barber. Skip the queue. Get fresh.</p>

        <div class="cover-image glass-card" style="padding:0; margin:30px 0;">
           <img src="683B4C35-1E45-4922-9A56-56BDD423D1F2.jpeg" alt="Fresh Cut" onerror="this.src='https://via.placeholder.com/400x220/1a1a2e/7B68EE?text=Kasi+Web'">
        </div>

        <a href="home.html" id="getStartedBtn" class="cover-btn primary-btn">Get Started <i class='bx bx-right-arrow-alt'></i></a>
        <p class="cover-footer">© 2026 K@si Web • Made for Kasi People</p>
    </div>

    <!-- COOKIE BANNER -->
    <div id="cookieBanner" class="cookie-banner" style="display:none;">
      <div class="cookie-box glass-card">
        <div class="cookie-icon">🍪</div>
        <div class="cookie-text">
          <h4>COOKIES & DATA CHOICE</h4>
          <p>We use cookies and local storage to save your bookings, remember your salon, and make K@si Web faster for you. We don't sell your data.</p>
        </div>
        <button class="cookie-close" id="cookieClose">×</button>

        <div class="cookie-btns">
          <button id="acceptAllCookies" class="primary-btn">Accept All</button>
          <button id="essentialCookies" class="secondary-btn">Essential Only</button>
        </div>
      </div>
    </div>

    <!-- MIXKIT SOUND -->
    <audio id="clickSound" src="mixkit-select-click-1109.wav" preload="auto"></audio>
    <audio id="notifSound" src="mixkit-select-click-1109.wav" preload="auto"></audio>

<script>
    // WORD ANIMATION
    const words = ["Hair cuts made easy", "Skip the line", "Book in seconds", "Stay fresh"];
    let wordIndex = 0; let charIndex = 0; let isDeleting = false;
    const typedText = document.getElementById("typed-text");
    function type() {
        const currentWord = words[wordIndex];
        typedText.textContent = isDeleting? currentWord.substring(0, charIndex - 1) : currentWord.substring(0, charIndex + 1);
        isDeleting? charIndex-- : charIndex++;
        let typeSpeed = isDeleting? 80 : 120;
        if (!isDeleting && charIndex === currentWord.length) { typeSpeed = 2000; isDeleting = true; }
        else if (isDeleting && charIndex === 0) { isDeleting = false; wordIndex = (wordIndex + 1) % words.length; typeSpeed = 500; }
        setTimeout(type, typeSpeed);
    }
    document.addEventListener("DOMContentLoaded", type);

    // CLICK SOUND + VIBRATE FUNCTION
    const clickSound = document.getElementById('clickSound');
    clickSound.volume = 0.4;
    function playClick() {
        clickSound.currentTime = 0;
        clickSound.play().catch(()=>{});
        if(navigator.vibrate) navigator.vibrate(50);
    }

    // BUTTON CLICK WITH SOUND + VIBRATE
    const getStartedBtn = document.getElementById('getStartedBtn');
    getStartedBtn.addEventListener('click', (e) => {
        e.preventDefault();
        playClick();
        getStartedBtn.innerHTML = `Loading... <i class='bx bx-loader-circle bx-spin'></i>`;
        getStartedBtn.style.opacity = "0.7";
        getStartedBtn.style.pointerEvents = "none";
        setTimeout(() => { window.location.href = 'home.html'; }, 350);
    });

    // ========== COOKIE BANNER LOGIC ==========
    const banner = document.getElementById('cookieBanner');
    const acceptAll = document.getElementById('acceptAllCookies');
    const essential = document.getElementById('essentialCookies');
    const closeBtn = document.getElementById('cookieClose');

    // Check if user already chose
    const cookieChoice = localStorage.getItem('kasiCookieChoice');
    if(!cookieChoice) {
        setTimeout(() => { if(banner) banner.style.display = 'flex'; }, 1500); // show after 1.5s
    }

    function saveChoice(choice) {
        playClick(); // SOUND ON CLICK
        localStorage.setItem('kasiCookieChoice', choice);
        if(banner) banner.style.display = 'none';

        if(choice === 'all') {
            console.log("All cookies accepted - Enable OneSignal + Analytics");
        } else {
            console.log("Essential cookies only - Bookings only");
        }
    }

    acceptAll?.addEventListener('click', () => saveChoice('all'));
    essential?.addEventListener('click', () => saveChoice('essential'));
    closeBtn?.addEventListener('click', () => saveChoice('essential'));
</script>
</body>
</html>
