<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>K@si Web | Welcome</title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            padding-bottom: 95px;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a3e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .nav-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: rgba(17, 24, 39, 0.97);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(75, 85, 99, 0.45);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9998;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            width: 90px;
            height: 62px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 18px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-item.active {
            color: #a855f7;
            background: rgba(126, 34, 206, 0.13);
        }

        .nav-item:hover {
            color: #a855f7;
        }

        .primary-btn {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .primary-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="bx bx-cut text-purple-500"></i>
                <span class="bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">K@si Web</span>
            </h1>

            <div class="flex gap-2">
                <button type="button" id="headerAuthBtn" class="bg-purple-600 hover:bg-purple-700 text-xs px-4 py-2 rounded-xl font-bold flex items-center gap-1">
                    <i class='bx bx-log-in'></i> Login
                </button>
            </div>
        </div>
    </header>

    <!-- HERO SECTION -->
    <main class="max-w-4xl mx-auto px-4 py-16 text-center flex flex-col items-center justify-center min-h-[70vh]">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-400 text-xs font-semibold mb-6">
            <i class='bx bx-sparkles'></i> Book Your Next Cut In Seconds
        </div>

        <h2 class="text-4xl md:text-6xl font-black mb-6 leading-tight bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500 bg-clip-text text-transparent">
            Fresh Cuts. Zero Lines.<br>Your Local Barbers Online.
        </h2>

        <p class="text-gray-400 text-base md:text-lg max-w-xl mb-8">
            Skip the long township salon queues. Find local barbers, compare prices, and lock in your appointment instant.
        </p>

        <!-- GET STARTED BUTTON -->
        <button type="button" id="getStartedBtn" class="primary-btn text-lg px-8 py-4 rounded-2xl shadow-lg shadow-purple-500/25">
            <span>Get Started</span>
            <i class='bx bx-right-arrow-alt text-2xl'></i>
        </button>
    </main>

    <!-- AUTH MODAL -->
    <div id="authModal" class="modal">
        <div class="bg-gray-950 p-6 rounded-2xl border border-purple-500/40 w-full max-w-md relative shadow-2xl">
            <button type="button" id="closeAuthModal" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">✕</button>
            <h3 id="modalTitle" class="text-xl font-bold text-purple-400 mb-4">Login to K@si Web</h3>

            <form id="authForm" class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Email Address</label>
                    <input type="email" id="authEmail" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm focus:border-purple-500 outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Password</label>
                    <input type="password" id="authPassword" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm focus:border-purple-500 outline-none">
                </div>

                <button type="submit" id="submitAuthBtn" class="primary-btn w-full mt-2">Login</button>
            </form>

            <div class="text-center mt-4 text-xs text-gray-400">
                <span id="toggleAuthText">Don't have an account?</span>
                <button type="button" id="toggleAuthBtn" class="text-purple-400 font-bold ml-1 hover:underline bg-transparent border-0">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="nav-grid">
        <a href="index.html" class="nav-item active">
            <i class="bx bx-home-alt"></i>
            <span>Home</span>
        </a>
        <a href="home.html" class="nav-item">
            <i class="bx bx-user"></i>
            <span>Account</span>
        </a>
        <a href="salons.html" class="nav-item">
            <i class="bx bx-cut"></i>
            <span>Salons</span>
        </a>
    </div>

    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

    <!-- FIREBASE LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
          apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
          authDomain: "kasi-web-d073f.firebaseapp.com",
          databaseURL: "https://kasi-web-d073f-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "kasi-web-d073f",
          storageBucket: "kasi-web-d073f.firebasestorage.app",
          messagingSenderId: "471544855566",
          appId: "1:471544855566:web:aa669a968b8af0ceb6905f",
          measurementId: "G-Q8QVN2T54S"
      };

      firebase.initializeApp(firebaseConfig);
      window.firebaseAuth = firebase.auth();
      window.firebaseDB = firebase.firestore();
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const auth = window.firebaseAuth;
        const getStartedBtn = document.getElementById('getStartedBtn');
        const headerAuthBtn = document.getElementById('headerAuthBtn');
        const authModal = document.getElementById('authModal');
        const closeAuthModal = document.getElementById('closeAuthModal');
        const authForm = document.getElementById('authForm');
        const toggleAuthBtn = document.getElementById('toggleAuthBtn');
        const toggleAuthText = document.getElementById('toggleAuthText');
        const modalTitle = document.getElementById('modalTitle');
        const submitAuthBtn = document.getElementById('submitAuthBtn');
        const clickSound = document.getElementById('clickSound');

        let isSignUpMode = false;
        let currentUser = null;

        function playClick() {
            if (clickSound) {
                clickSound.currentTime = 0;
                clickSound.play().catch(() => {});
            }
            if (navigator.vibrate) navigator.vibrate(30);
        }

        // Track Auth State
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                headerAuthBtn.innerHTML = `<i class='bx bx-user-check'></i> My Account`;
            } else {
                headerAuthBtn.innerHTML = `<i class='bx bx-log-in'></i> Login`;
            }
        });

        // Modal Helpers
        function openModal() {
            if (authModal) authModal.classList.add('active');
        }

        function closeModal() {
            if (authModal) authModal.classList.remove('active');
        }

        // Action for Get Started Button
        if (getStartedBtn) {
            getStartedBtn.onclick = (e) => {
                e.preventDefault();
                playClick();
                if (currentUser) {
                    window.location.href = 'salons.html';
                } else {
                    openModal();
                }
            };
        }

        // Header Login / Account Button
        if (headerAuthBtn) {
            headerAuthBtn.onclick = (e) => {
                e.preventDefault();
                playClick();
                if (currentUser) {
                    window.location.href = 'home.html';
                } else {
                    openModal();
                }
            };
        }

        if (closeAuthModal) {
            closeAuthModal.onclick = closeModal;
        }

        // Navigation Bar Explicit Redirection
        document.querySelectorAll('.nav-item').forEach(navItem => {
            navItem.onclick = (e) => {
                e.preventDefault();
                playClick();
                const targetHref = navItem.getAttribute('href');
                if (targetHref) {
                    window.location.href = targetHref;
                }
            };
        });

        // Toggle Login vs Signup
        if (toggleAuthBtn) {
            toggleAuthBtn.onclick = (e) => {
                e.preventDefault();
                isSignUpMode = !isSignUpMode;
                if (isSignUpMode) {
                    modalTitle.textContent = "Create K@si Web Account";
                    submitAuthBtn.textContent = "Sign Up";
                    toggleAuthText.textContent = "Already have an account?";
                    toggleAuthBtn.textContent = "Login";
                } else {
                    modalTitle.textContent = "Login to K@si Web";
                    submitAuthBtn.textContent = "Login";
                    toggleAuthText.textContent = "Don't have an account?";
                    toggleAuthBtn.textContent = "Sign Up";
                }
            };
        }

        // Handle Login/Signup Form Submission
        if (authForm) {
            authForm.onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('authEmail').value.trim();
                const password = document.getElementById('authPassword').value.trim();

                try {
                    if (isSignUpMode) {
                        const res = await auth.createUserWithEmailAndPassword(email, password);
                        await window.firebaseDB.collection('users').doc(res.user.uid).set({
                            email: email,
                            role: 'client',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        alert("Account created successfully!");
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                    closeModal();
                    window.location.href = 'salons.html';
                } catch (err) {
                    alert("Auth Error: " + err.message);
                }
            };
        }
    });
    </script>
</body>
</html>
