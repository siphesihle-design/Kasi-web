<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>K@si Web | Welcome</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css?v=29">
</head>
<body class="cover-page">
    <div class="cover-container">
        <div class="cover-logo"><i class='bx bx-cut'></i></div>
        <h1 class="typing-text">K@si Web</h1>
        <p class="cover-tagline">Hair cut made easy</p>
        <p class="cover-sub">Book fresh fades. Skip the lines. Support Kasi barbers.</p>
        <a href="home.html" class="primary-btn cover-btn">Get Started <i class='bx bx-right-arrow-alt'></i></a>
    </div>

    <script>
        // TYPING EFFECT
        const text = "K@si Web";
        const typingElement = document.querySelector('.typing-text');
        let i = 0;
        typingElement.textContent = '';
        function typeWriter() {
            if (i < text.length) {
                typingElement.textContent += text.charAt(i);
                i++;
                setTimeout(typeWriter, 150);
            }
        }
        window.onload = typeWriter;
    </script>
</body>
</html>
