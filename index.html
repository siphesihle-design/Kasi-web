<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Fresh Cuts, No Lines</title>
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css?v=38">

    <!-- ONESIGNAL SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "9a85cfba-e375-4527-a9d3-a772dc9c0fa0",
        });
      });
    </script>
</head>
<body class="cover-page">
    <div class="cover-container">
        <div class="cover-logo"><i class='bx bx-cut'></i></div>
        <h1 class="cover-title">K@si Web</h1>
        <div class="word-animation"><span id="typed-text"></span><span class="cursor">|</span></div>
        <p class="cover-subtext">Book your barber. Skip the queue. Get fresh.</p>

        <div class="cover-image glass-card" style="padding:0; margin:30px 0;">
           <img src="683B4C35-1E45-4922-9A56-56BDD423D1F2.jpeg" alt="Fresh Cut">
        </div>

        <a href="home.html" id="getStartedBtn" class="cover-btn primary-btn">Get Started <i class='bx bx-right-arrow-alt'></i></a>
        
        <!-- NEW BUTTON FOR IPHONE -->
        <button id="subscribe-btn" class="cover-btn primary-btn" style="margin-top:15px; background:linear-gradient(135deg, #7B68EE, #3b82f6);">
          🔔 Get Booking Alerts
        </button>

        <p class="cover-footer">© 2026 K@si Web • Made for Kasi People</p>
    </div>

    <!-- COOKIE BANNER -->
    <div id="cookieBanner" class="cookie-banner" style="display:none;">
      <div class="cookie-box">
        <div style="display:flex; align-items:flex-start; gap:12px; margin-bottom:15px;">
            <div class="cookie-icon">🍪</div>
            <div class="cookie-text" style="flex:1;">
                <h4>COOKIES & NOTIFICATIONS</h4>
                <p>We use cookies to save your bookings. Allow notifications so barbers get instant alerts.</p>
            </div>
            <button class="cookie-close" id="cookieClose">×</button>
        </div>
        <div class="cookie-btns">
          <button id="acceptAllCookies" class="primary-btn">Accept All</button>
          <button id="essentialCookies" class="secondary-btn">Essential Only</button>
        </div>
      </div>
    </div>

    <audio id="clickSound" src="mixkit-select-click-1109.wav" preload="auto"></audio>

<script>
    // WORD ANIMATION
    const words = ["Fresh Cuts", "No Lines", "Kasi Prices"];
    let wordIndex = 0; let charIndex = 0; let isDeleting = false;
    const typedText = document.getElementById('typed-text');
    function type() {
        const currentWord = words[wordIndex];
        if (isDeleting) { typedText.textContent = currentWord.substring(0, charIndex--); } 
        else { typedText.textContent = currentWord.substring(0, charIndex++); }
        if (!isDeleting && charIndex === currentWord.length) { isDeleting = true; setTimeout(type, 1500); return; } 
        else if (isDeleting && charIndex === 0) { isDeleting = false; wordIndex = (wordIndex + 1) % words.length; }
        setTimeout(type, isDeleting? 80 : 120);
    }
    document.addEventListener('DOMContentLoaded', type);

    // SOUND
    const clickSound = document.getElementById('clickSound');
    function playClick() { 
        if(clickSound) { 
            clickSound.currentTime = 0; 
            clickSound.play().catch(e=>{}); 
        }
    }
    
    document.querySelectorAll('.primary-btn,.secondary-btn,.cover-btn').forEach(btn => {
        btn.addEventListener('click', playClick);
    });

    // COOKIE + ONESIGNAL FIXED
    const banner = document.getElementById('cookieBanner');
    const acceptAll = document.getElementById('acceptAllCookies');
    const essential = document.getElementById('essentialCookies');
    const closeBtn = document.getElementById('cookieClose');
    const subBtn = document.getElementById('subscribe-btn');

    setTimeout(() => { if(banner) banner.style.display = 'flex'; }, 800);

    function saveChoice(choice) {
        playClick();
        if(banner) banner.style.display = 'none';
        // NO prompt here anymore
    }

    acceptAll?.addEventListener('click', () => saveChoice('all'));
    essential?.addEventListener('click', () => saveChoice('essential'));
    closeBtn?.addEventListener('click', () => saveChoice('essential'));

    // DIRECT CLICK FOR APPLE
    subBtn?.addEventListener('click', async () => {
        playClick();
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.showNativePrompt(); // Fires instantly from click
        });
    });
</script>
</body>
</html>
