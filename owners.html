!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Owner Dashboard</title>
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css?v=39">
    <style>
     .status-pill { padding:5px 10px; border-radius:20px; font-size:0.8rem; font-weight:700; }
     .status-pending { background:rgba(255,165,0,0.2); color:#FFA500; }
     .status-approved { background:rgba(0,200,83,0.2); color:#00c853; }
     .status-completed { background:rgba(123,104,238,0.2); color:#7B68EE; }
     .status-declined { background:rgba(255,71,87,0.2); color:#ff4757; }

        /* COOKIE BANNER CSS */
      .cookie-banner {
            position: fixed; bottom: 20px; left: 10px; right: 10px;
            z-index: 9999; display: flex; justify-content: center;
        }
      .cookie-box {
            position: relative; max-width: 500px; width: 100%; padding: 20px;
            background: rgba(20,20,30,0.95); backdrop-filter: blur(10px);
            border: 1px solid rgba(123,104,238,0.4); border-radius: 15px;
            color: #fff; box-shadow: 0 0 20px rgba(123,104,238,0.3);
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
      .cookie-icon { font-size: 2rem; margin-bottom: 10px; text-align: center; }
      .cookie-text h4 { color: #7B68EE; margin: 0 0 8px 0; font-size: 1rem; text-align: center; }
      .cookie-text p { font-size: 0.85rem; color: #B0B0D0; margin: 0 0 15px 0; line-height: 1.4; text-align: center; }
      .cookie-close {
            position: absolute; top: 8px; right: 12px;
            background: none; border: none; color: #B0B0D0;
            font-size: 1.5rem; cursor: pointer; transition: 0.2s;
        }
      .cookie-close:hover { color: #7B68EE; }
      .cookie-btns { display: flex; gap: 10px; }
      .cookie-btns button {
            flex: 1; padding: 12px; font-size: 0.9rem;
            border-radius: 10px; border: none; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
      .cookie-btns button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <header class="header">
        <h1><i class='bx bx-store'></i> Owner Dashboard</h1>
        <nav>
            <a href="home.html" class="nav-item" id="homeBtn"><i class='bx bx-home-alt'></i><span>Home</span></a>
            <a href="#" id="logoutBtn" class="nav-item"><i class='bx bx-log-out'></i><span>Logout</span></a>
        </nav>
    </header>

    <div class="container">
        <div id="loadingScreen" class="glass-card" style="text-align:center; padding:40px;">
            <i class='bx bx-loader-circle bx-spin' style="font-size:2rem; color:#7B68EE;"></i>
            <p>Loading your bookings...</p>
        </div>

        <div id="ownerContent" style="display:none;">
            <div class="glass-card">
                <h2>Today's Bookings</h2>
                <p id="todayDate" style="color:#B0B0D0; margin-bottom:15px;"></p>
                <div id="ownerBookings" style="display:flex; flex-direction:column; gap:15px;">
                    <p style="text-align:center; color:#888;">Loading bookings...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- COOKIE BANNER -->
    <div id="cookieBanner" class="cookie-banner" style="display:none;">
      <div class="cookie-box glass-card">
        <div class="cookie-icon">🍪</div>
        <div class="cookie-text">
          <h4>COOKIES & DATA CHOICE</h4>
          <p>We use cookies to save your bookings and send you push notifications. We don't sell your data.</p>
        </div>
        <button class="cookie-close" id="cookieClose">×</button>
        <div class="cookie-btns">
          <button id="acceptAllCookies" class="primary-btn">Accept All</button>
          <button id="essentialCookies" class="secondary-btn">Essential Only</button>
        </div>
      </div>
    </div>

    <!-- SOUNDS -->
    <audio id="clickSound" src="mixkit-select-click-1109.wav" preload="auto"></audio>
    <audio id="notifySound" src="notify.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc, orderBy } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
            authDomain: "kasi-web-d073f.firebaseapp.com",
            projectId: "kasi-web-d073f",
            storageBucket: "kasi-web-d073f.firebasestorage.app",
            messagingSenderId: "471544855566",
            appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ownerBookings = document.getElementById('ownerBookings');
        const logoutBtn = document.getElementById('logoutBtn');
        const homeBtn = document.getElementById('homeBtn');
        const todayDate = document.getElementById('todayDate');
        const loadingScreen = document.getElementById('loadingScreen');
        const ownerContent = document.getElementById('ownerContent');
        const clickSound = document.getElementById('clickSound');
        const notifySound = document.getElementById('notifySound');

        clickSound.volume = 0.4; notifySound.volume = 0.4;

        function playClick() {
            clickSound.currentTime = 0;
            clickSound.play().catch(()=>{});
            if(navigator.vibrate) navigator.vibrate(50);
        }

        todayDate.textContent = new Date().toLocaleDateString('en-ZA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        let currentOwnerUid = null;
        let ownerSalonId = null;
        let redirecting = false;

        // CLICK SOUND ON ALL BUTTONS
        document.addEventListener('click', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.closest('.nav-item')) {
                playClick();
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user &&!redirecting) {
                redirecting = true;
                window.location.href = 'index.html';
                return;
            }

            try {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if(!userSnap.exists() || userSnap.data().role!== 'salon_owner') {
                    if(!redirecting) { redirecting = true; alert("Access Denied. You are not a salon owner."); window.location.href = 'index.html'; }
                    return;
                }

                currentOwnerUid = user.uid;
                ownerSalonId = userSnap.data().salonId; // lowercase d

                if(!ownerSalonId){
                    alert("Error: No salonId found for this owner account. Please contact admin.");
                    signOut(auth);
                    return;
                }

                loadingScreen.style.display = 'none';
                ownerContent.style.display = 'block';

                const today = new Date().toISOString().split('T')[0];
                // FIX: Query by salonId not ownerId
                const q = query(collection(db, "bookings"),
                    where("salonId", "==", ownerSalonId),
                    where("date", "==", today),
                    orderBy("createdAt", "desc")
                );

                let firstLoad = true;
                onSnapshot(q, (snapshot) => {
                    if(!firstLoad && snapshot.docChanges().some(change => change.type === 'added')) {
                        notifySound.play().catch(()=>{});
                        if(navigator.vibrate) navigator.vibrate([200, 100, 200]); // VIBRATE ON NEW BOOKING
                    }
                    firstLoad = false;
                    renderBookings(snapshot);
                });
            } catch(err) {
                console.error(err);
                alert("Error loading dashboard: " + err.message);
            }
        });

        function renderBookings(snapshot) {
            if(snapshot.empty) {
                ownerBookings.innerHTML = `<p style="text-align:center; color:#888;">No bookings for today 💈</p>`;
                return;
            }
            ownerBookings.innerHTML = "";
            snapshot.forEach(docSnap => {
                const b = docSnap.data();
                const id = docSnap.id;
                const statusClass = `status-${b.status}`;

                ownerBookings.innerHTML += `
                <div class="glass-card" style="padding:15px; border-left:4px solid #7B68EE;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <h3 style="margin:0;">${b.name}</h3>
                        <span class="status-pill ${statusClass}">${b.status.toUpperCase()}</span>
                    </div>
                    <p><i class='bx bx-cut'></i> ${b.service} - R${b.price}</p>
                    <p><i class='bx bx-time'></i> ${b.time}</p>
                    <p><i class='bx bx-phone'></i> ${b.phone}</p>

                    ${b.status === 'pending'? `
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <button class="primary-btn approveBtn" data-id="${id}" style="flex:1;">Approve</button>
                        <button class="secondary-btn declineBtn" data-id="${id}" style="flex:1;">Decline</button>
                    </div>
                    ` : b.status === 'approved'? `
                    <button class="primary-btn doneBtn" data-id="${id}" style="margin-top:10px; width:100%;">Mark as Done</button>
                    ` : ''}
                </div>`;
            });
        }

        // BUTTON CLICKS
        document.addEventListener('click', async (e) => {
            const approveBtn = e.target.closest('.approveBtn');
            const declineBtn = e.target.closest('.declineBtn');
            const doneBtn = e.target.closest('.doneBtn');

            try {
                if(approveBtn) await updateDoc(doc(db, "bookings", approveBtn.dataset.id), { status: "approved" });
                if(declineBtn) await updateDoc(doc(db, "bookings", declineBtn.dataset.id), { status: "declined" });
                if(doneBtn) await updateDoc(doc(db, "bookings", doneBtn.dataset.id), { status: "completed" });
            } catch(err) {
                alert("Error updating booking: " + err.message);
            }
        });

        homeBtn.addEventListener('click', () => {
            window.location.href = 'home.html';
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = 'index.html')
        });

        // ========== COOKIE BANNER LOGIC ==========
        const banner = document.getElementById('cookieBanner');
        const acceptAll = document.getElementById('acceptAllCookies');
        const essential = document.getElementById('essentialCookies');
        const closeBtn = document.getElementById('cookieClose');

        const cookieChoice = localStorage.getItem('kasiCookieChoice');
        if(!cookieChoice) {
            setTimeout(() => { if(banner) banner.style.display = 'flex'; }, 1500);
        }

        function saveChoice(choice) {
            playClick();
            localStorage.setItem('kasiCookieChoice', choice);
            if(banner) banner.style.display = 'none';
            console.log(choice === 'all'? "All cookies accepted - Enable OneSignal" : "Essential cookies only");
        }

        acceptAll?.addEventListener('click', () => saveChoice('all'));
        essential?.addEventListener('click', () => saveChoice('essential'));
        closeBtn?.addEventListener('click', () => saveChoice('essential'));
    </script>
</body>
</html>
