<body class="bg-gray-950 text-white min-h-screen">


<header class="bg-gray-900 border-b border-gray-800">

    <div

<main class="max-w-md mx-auto px-4 py-10">

         LOGIN SECTION
    ====================================================== -->

        id="loginSection"
        class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl"
    >

        <h2 class="text-3xl font-bold mb-2">
            Salon Owner Login
        </h2>

        <p class="text-gray-400 mb-6">
            Login to manage your salon and bookings.
        </p>


        <div
            id="loginError"
            class="hidden bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg mb-4 break-words"

            id="loginPassword"

        <button
            id="loginBtn"
            type="button"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed p-3 rounded-lg font-bold transition"
        >
            Login
        </button>


        <p class="text-center text-gray-500 text-sm mt-6">
            Don't have an owner account?
        </p>


        <button
            id="showRegisterBtn"
            type="button"
            class="w-full mt-3 bg-gray-800 hover:bg-gray-700 p-3 rounded-lg transition"
        >
            Create Owner Account
        </button>

    </section>



    <!-- =====================================================
         REGISTER SECTION
    ====================================================== -->

    <section
        id="registerSection"
        class="hidden bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl"
    >

        <h2 class="text-3xl font-bold mb-2">
            Create Owner Account
        </h2>

        <p class="text-gray-400 mb-6">
            Create your salon owner account.
        </p>


        <div
            id="registerError"
            class="hidden bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg mb-4 break-words"
        ></div>


        <label
            for="registerEmail"
            class="block text-sm text-gray-400 mb-2"
        >
            Email
        </label>

        <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            placeholder="owner@example.com"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label
            for="registerPassword"
            class="block text-sm text-gray-400 mb-2"
        >
            Password
        </label>

        <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label
            for="registerConfirmPassword"
            class="block text-sm text-gray-400 mb-2"

            Confirm Password

        <input
            id="registerConfirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat password"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <button
            id="registerBtn"
            type="button"
            class="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed p-3 rounded-lg font-bold transition"

            Create Owner Account

        <button

            class="w-full mt-3 bg-gray-800 hover:bg-gray-700 p-3 rounded-lg transition"

<script type="module">


/* =========================================================

========================================================= */

    setDoc,
    query,
    collection,
    where,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";



/* =========================================================
   FIREBASE CONFIGURATION
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    databaseURL:
        "https://kasi-web-d073f-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f",

    measurementId:
        "G-Q8QVN2T54S"

};



/* =========================================================

try {

/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
    "click",
    loginOwner
);



async function loginOwner() {

    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;


    clearErrors();


    if (
        !email ||
        !password
    ) {

        showLoginError(
            "Please enter your email and password."
        );

        return;

    }


    if (!firebaseReady()) {

        showLoginError(
            "Firebase could not be initialized. Please check the Firebase configuration."
        );

        return;

    }


    loginBtn.disabled =
        true;


    loginBtn.textContent =
        "Logging in...";


    try {

        /* =================================================
           AUTHENTICATE
        ================================================= */

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        console.log(
            "Authenticated UID:",
            user.uid
        );



        /* =================================================
           GET USERS DOCUMENT
        ================================================= */

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        /*
         * If the Firebase Auth account exists but
         * the users document does not exist, create
         * the owner profile.
         *
         * This prevents the user from being
         * unnecessarily kicked out.
         */

        if (
            !userSnap.exists()
        ) {

            await setDoc(
                userRef,
                {

                    email:
                        user.email ||
                        email,

                    role:
                        "salon_owner",

                    salonId:
                        null,

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge: true
                }
            );


            console.log(
                "Owner profile created."
            );

        }


        const freshUserSnap =
            await getDoc(
                userRef
            );


        const userData =
            freshUserSnap.data() || {};


        const role =
            userData.role ||
            userData.Role ||
            null;


        /*
         * Only salon_owner is allowed into
         * this page.
         */

        if (
            role !==
            "salon_owner"
        ) {

            await signOut(auth);


            showLoginError(
                "This account is not registered as a salon owner."
            );


            return;

        }



        /* =================================================
           FIND SALON
        ================================================= */

        let salonId =
            userData.salonId ||
            null;


        /*
         * First verify the saved salon ID.
         */

        if (salonId) {

            const salonRef =
                doc(
                    db,
                    "salons",
                    salonId
                );


            const salonSnap =
                await getDoc(
                    salonRef
                );


            if (
                !salonSnap.exists()
            ) {

                console.warn(
                    "Saved salonId does not exist:",
                    salonId
                );


                salonId =
                    null;

            }

        }



        /*
         * If no valid salonId was found,
         * search by ownerId.
         */

        if (!salonId) {

            salonId =
                await findSalonForOwner(
                    user.uid
                );

        }



        /*
         * If still no salon exists, create a
         * predictable salon document.
         *
         * This is useful for newly registered
         * owners.
         */

        if (!salonId) {

            salonId =
                `salon_${user.uid}`;


            const salonRef =
                doc(
                    db,
                    "salons",
                    salonId
                );


            const salonSnap =
                await getDoc(
                    salonRef
                );


            if (
                !salonSnap.exists()
            ) {

                await setDoc(
                    salonRef,
                    {

                        salonId:
                            salonId,

                        ownerId:
                            user.uid,

                        ownerEmail:
                            user.email ||
                            email,

                        name:
                            "My Salon",

                        location:
                            "",

                        hours:
                            "",

                        services:
                            [],

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );


                console.log(
                    "New salon created:",
                    salonId
                );

            }

        }



        /* =================================================
           ENSURE SALON BELONGS TO THIS OWNER
        ================================================= */

        const salonRef =
            doc(
                db,
                "salons",
                salonId
            );


        const salonSnap =
            await getDoc(
                salonRef
            );


        if (
            salonSnap.exists()
        ) {

            const salonData =
                salonSnap.data();


            /*
             * If ownerId is missing, repair it.
             *
             * NEVER overwrite a different existing
             * ownerId.
             */

            if (
                !salonData.ownerId
            ) {

                await setDoc(
                    salonRef,
                    {

                        ownerId:
                            user.uid,

                        ownerEmail:
                            user.email ||
                            email,

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge: true
                    }
                );


                console.log(
                    "Missing ownerId repaired."
                );

            }


            /*
             * If another owner already owns this
             * salon, do not take it over.
             */

            else if (
                salonData.ownerId !==
                user.uid
            ) {

                console.error(
                    "Salon belongs to another owner."
                );


                await signOut(auth);


                showLoginError(
                    "This salon is already linked to another owner account."
                );


                return;

            }

        }



        /* =================================================
           SAVE SALON ID TO USERS
        ================================================= */

        await setDoc(
            userRef,
            {

                email:
                    user.email ||
                    email,

                role:
                    "salon_owner",

                salonId:
                    salonId,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge: true
            }
        );


        console.log(
            "Owner profile linked to salon:",
            salonId
        );



        /* =================================================
           SAVE SESSION
        ================================================= */

        sessionStorage.setItem(
            "ownerUid",
            user.uid
        );


        sessionStorage.setItem(
            "ownerSalonId",
            salonId
        );


        sessionStorage.setItem(
            "justLoggedIn",
            "true"
        );



        /* =================================================
           REDIRECT
        ================================================= */

        window.location.replace(
            "ownerdashboard.html"
        );

    }


    catch (error) {

        console.error(
            "Owner login failed:",
            error
        );


        showLoginError(
            firebaseErrorMessage(
                error
            )
        );

    }


    finally {

        loginBtn.disabled =
            false;


        loginBtn.textContent =
            "Login";

    }

}



/* =========================================================
   FIND SALON BY OWNER ID
========================================================= */

async function findSalonForOwner(
    ownerId
) {

    try {

        console.log(
            "Searching salons where ownerId =",
            ownerId
        );


        const salonQuery =
            query(
                collection(
                    db,
                    "salons"
                ),
                where(
                    "ownerId",
                    "==",
                    ownerId
                )
            );


        const snapshot =
            await getDocs(
                salonQuery
            );


        if (
            snapshot.empty
        ) {

            console.log(
                "No salon found using ownerId."
            );


            return null;

        }


        /*
         * Return the first matching salon.
         */

        const salonDoc =
            snapshot.docs[0];


        console.log(
            "Salon found:",
            salonDoc.id
        );


        return salonDoc.id;

    }


    catch (error) {

        console.error(
            "Salon search failed:",
            error
        );


        /*
         * Permission errors should not crash
         * the entire login flow.
         */

        return null;

    }

}



/* =========================================================
   REGISTER OWNER
========================================================= */

registerBtn.addEventListener(
    "click",
    registerOwner
);



async function registerOwner() {

    const email =
        document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "registerConfirmPassword"
            )
            .value;


    clearErrors();


    if (
        !email ||
        !password ||
        !confirmPassword
    ) {

        showRegisterError(
            "Please complete all fields."
        );


        return;

    }


    if (
        password.length <
        6
    ) {

        showRegisterError(
            "Password must contain at least 6 characters."
        );


        return;

    }


    if (
        password !==
        confirmPassword
    ) {

        showRegisterError(
            "Passwords do not match."
        );


        return;

    }


    if (!firebaseReady()) {

        showRegisterError(
            "Firebase could not be initialized."
        );


        return;

    }


    registerBtn.disabled =
        true;


    registerBtn.textContent =
        "Creating account...";


    try {

        /* =================================================
           CREATE FIREBASE AUTH USER
        ================================================= */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        console.log(
            "Created owner UID:",
            user.uid
        );



        /* =================================================
           CREATE USER DOCUMENT
        ================================================= */

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        await setDoc(
            userRef,
            {

                email:
                    email,

                role:
                    "salon_owner",

                salonId:
                    null,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            },
            {
                merge: true
            }
        );



        /* =================================================
           CREATE SALON
        ================================================= */

        const salonId =
            `salon_${user.uid}`;


        const salonRef =
            doc(
                db,
                "salons",
                salonId
            );


        await setDoc(
            salonRef,
            {

                salonId:
                    salonId,

                ownerId:
                    user.uid,

                ownerEmail:
                    email,

                name:
                    "My Salon",

                location:
                    "",

                hours:
                    "",

                services:
                    [],

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            },
            {
                merge: true
            }
        );



        /* =================================================
           LINK SALON TO USER
        ================================================= */

        await setDoc(
            userRef,
            {

                salonId:
                    salonId,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge: true
            }
        );



        /* =================================================
           SESSION
        ================================================= */

        sessionStorage.setItem(
            "ownerUid",
            user.uid
        );


        sessionStorage.setItem(
            "ownerSalonId",
            salonId
        );


        sessionStorage.setItem(
            "justLoggedIn",
            "true"
        );



        /* =================================================
           GO TO DASHBOARD
        ================================================= */

        window.location.replace(
            "ownerdashboard.html"
        );

    }


    catch (error) {

        console.error(
            "Owner registration failed:",
            error
        );


        showRegisterError(
            firebaseErrorMessage(
                error
            )
        );

    }


    finally {

        registerBtn.disabled =
            false;


        registerBtn.textContent =
            "Create Owner Account";

    }

}

/* =========================================================
   AUTH STATE
========================================================= */

if (auth && db) {

    onAuthStateChanged(
        auth,
        async user => {

            console.log(
                "Auth state:",
                user
                    ? user.uid
                    : "signed out"
            );


            if (!user) {

                pageLoading.classList.add(
                    "hidden"
                );


                return;

            }


            /*
             * If we already have a logged-in owner,
             * don't keep showing the login page.
             */

            try {

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnap =
                    await getDoc(
                        userRef
                    );


                if (
                    !userSnap.exists()
                ) {

                    /*
                     * Repair missing profile.
                     */

                    await setDoc(
                        userRef,
                        {

                            email:
                                user.email ||
                                "",

                            role:
                                "salon_owner",

                            salonId:
                                null,

                            createdAt:
                                serverTimestamp(),

                            updatedAt:
                                serverTimestamp()

                        },
                        {
                            merge: true
                        }
                    );


                    pageLoading.classList.add(
                        "hidden"
                    );


                    return;

                }


                const data =
                    userSnap.data();


                const role =
                    data.role ||
                    data.Role ||
                    null;


                if (
                    role ===
                    "salon_owner"
                ) {

                    /*
                     * Only redirect if this page was
                     * opened with a valid owner session.
                     */

                    const justLoggedIn =
                        sessionStorage.getItem(
                            "justLoggedIn"
                        );


                    if (
                        justLoggedIn ===
                        "true"
                    ) {

                        sessionStorage.removeItem(
                            "justLoggedIn"
                        );


                        window.location.replace(
                            "ownerdashboard.html"
                        );


                        return;

                    }

                }

            }


            catch (error) {

                console.error(
                    "Auth state check failed:",
                    error
                );

            }


            pageLoading.classList.add(
                "hidden"
            );

        }
    );

}



/* =========================================================
   CLEAR ERRORS
========================================================= */

function clearErrors() {

    loginError.classList.add(
        "hidden"
    );


    registerError.classList.add(
        "hidden"
    );


    loginError.textContent =
        "";


    registerError.textContent =
        "";

}



/* =========================================================
   SHOW LOGIN ERROR
========================================================= */

function showLoginError(
    message
) {

    loginError.textContent =
        message;


    loginError.classList.remove(
        "hidden"
    );

}



/* =========================================================
   SHOW REGISTER ERROR
========================================================= */

function showRegisterError(
    message
) {

    registerError.textContent =
        message;


    registerError.classList.remove(
        "hidden"
    );

}



/* =========================================================
   FIREBASE ERROR HANDLER
========================================================= */

function firebaseErrorMessage(
    error
) {

    console.error(
        "Firebase error code:",
        error.code
    );


    switch (
        error.code
    ) {

        case "auth/api-key-not-valid":

            return (
                "Firebase rejected the API key. Make sure this page is using the Web App configuration from the kasi-web-d073f Firebase project."
            );


        case "auth/invalid-api-key":

            return (
                "The Firebase API key is invalid."
            );


        case "auth/invalid-credential":

            return (
                "Incorrect email or password."
            );


        case "auth/invalid-email":

            return (
                "Please enter a valid email address."
            );


        case "auth/user-not-found":

            return (
                "No Firebase account was found with this email."
            );


        case "auth/wrong-password":

            return (
                "Incorrect password."
            );


        case "auth/email-already-in-use":

            return (
                "An account with this email already exists."
            );


        case "auth/weak-password":

            return (
                "Password must contain at least 6 characters."
            );


        case "auth/network-request-failed":

            return (
                "Network error. Check your internet connection."
            );


        case "auth/too-many-requests":

            return (
                "Too many attempts. Please try again later."
            );


        case "auth/user-disabled":

            return (
                "This Firebase account has been disabled."
            );


        case "auth/operation-not-allowed":

            return (
                "Email/password authentication is not enabled in Firebase Authentication."
            );


        case "permission-denied":

            return (
                "Firestore permission denied. Check your Firestore security rules."
            );


        default:

            return (
                error.message ||
                "Something went wrong. Please try again."
            );

    }

}


</script>
