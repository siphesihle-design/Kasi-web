<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="K@si Web Salon Owner Login"
    >

    <title>K@si Web | Salon Owner</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-950 text-white min-h-screen">


<header class="bg-gray-900 border-b border-gray-800">

    <div
        class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center"
    >

        <h1 class="text-2xl font-bold">
            💈 K@si Web
        </h1>

        <a
            href="index.html"
            class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg transition"
        >
            Home
        </a>

    </div>

</header>


<main class="max-w-md mx-auto px-4 py-10">


    <!-- =====================================================
         LOGIN SECTION
    ====================================================== -->

    <section
        id="loginSection"
        class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl"
    >

        <h2 class="text-3xl font-bold mb-2">
            Salon Owner Login
        </h2>

        <p class="text-gray-400 mb-6">
            Login to manage your salon and bookings.
        </p>


        <div
            id="loginError"
            class="hidden bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg mb-4"
        ></div>


        <label
            for="loginEmail"
            class="block text-sm text-gray-400 mb-2"
        >
            Email
        </label>

        <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="owner@example.com"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label
            for="loginPassword"
            class="block text-sm text-gray-400 mb-2"
        >
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <button
            id="loginBtn"
            type="button"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed p-3 rounded-lg font-bold transition"
        >
            Login
        </button>


        <p class="text-center text-gray-500 text-sm mt-6">
            Don't have an owner account?
        </p>


        <button
            id="showRegisterBtn"
            type="button"
            class="w-full mt-3 bg-gray-800 hover:bg-gray-700 p-3 rounded-lg transition"
        >
            Create Owner Account
        </button>

    </section>



    <!-- =====================================================
         REGISTER SECTION
    ====================================================== -->

    <section
        id="registerSection"
        class="hidden bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl"
    >

        <h2 class="text-3xl font-bold mb-2">
            Create Owner Account
        </h2>

        <p class="text-gray-400 mb-6">
            Create your salon owner account.
        </p>


        <div
            id="registerError"
            class="hidden bg-red-900/40 border border-red-700 text-red-300 p-3 rounded-lg mb-4"
        ></div>


        <label
            for="registerEmail"
            class="block text-sm text-gray-400 mb-2"
        >
            Email
        </label>

        <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            placeholder="owner@example.com"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label
            for="registerPassword"
            class="block text-sm text-gray-400 mb-2"
        >
            Password
        </label>

        <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="At least 6 characters"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <label
            for="registerConfirmPassword"
            class="block text-sm text-gray-400 mb-2"
        >
            Confirm Password
        </label>

        <input
            id="registerConfirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat password"
            class="w-full p-3 mb-4 rounded-lg bg-gray-800 border border-gray-700 outline-none focus:border-blue-500"
        >


        <button
            id="registerBtn"
            type="button"
            class="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed p-3 rounded-lg font-bold transition"
        >
            Create Owner Account
        </button>


        <button
            id="showLoginBtn"
            type="button"
            class="w-full mt-3 bg-gray-800 hover:bg-gray-700 p-3 rounded-lg transition"
        >
            Back to Login
        </button>

    </section>



    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
        id="pageLoading"
        class="hidden text-center mt-6 text-gray-400"
    >

        <div class="animate-pulse">
            Checking account...
        </div>

    </div>


</main>



<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    query,
    collection,
    where,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);



/* =========================================================
   ELEMENTS
========================================================= */

const loginSection =
    document.getElementById(
        "loginSection"
    );

const registerSection =
    document.getElementById(
        "registerSection"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const registerBtn =
    document.getElementById(
        "registerBtn"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const registerError =
    document.getElementById(
        "registerError"
    );

const pageLoading =
    document.getElementById(
        "pageLoading"
    );



/* =========================================================
   LOGIN / REGISTER TOGGLE
========================================================= */

document
    .getElementById("showRegisterBtn")
    .addEventListener(
        "click",
        () => {

            loginSection.classList.add(
                "hidden"
            );

            registerSection.classList.remove(
                "hidden"
            );

            clearErrors();

        }
    );


document
    .getElementById("showLoginBtn")
    .addEventListener(
        "click",
        () => {

            registerSection.classList.add(
                "hidden"
            );

            loginSection.classList.remove(
                "hidden"
            );

            clearErrors();

        }
    );



/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
    "click",
    loginOwner
);


async function loginOwner() {

    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;


    clearErrors();


    if (!email || !password) {

        showLoginError(
            "Please enter your email and password."
        );

        return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
        "Logging in...";


    try {

        /* -------------------------------------------------
           FIREBASE AUTH LOGIN
        ------------------------------------------------- */

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        console.log(
            "Authenticated user:",
            user.uid
        );


        /* -------------------------------------------------
           LOAD USER DOCUMENT
        ------------------------------------------------- */

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const userSnap =
            await getDoc(
                userRef
            );


        /*
         * The account must have a users document.
         */

        if (!userSnap.exists()) {

            await signOut(auth);

            showLoginError(
                "This account does not have a K@si Web owner profile."
            );

            return;

        }


        const userData =
            userSnap.data();


        console.log(
            "User profile:",
            userData
        );


        /* -------------------------------------------------
           CHECK OWNER ROLE
        ------------------------------------------------- */

        const role =
            userData.role ||
            userData.Role ||
            null;


        if (
            role !==
            "salon_owner"
        ) {

            await signOut(auth);

            showLoginError(
                "This account is not registered as a salon owner."
            );

            return;

        }


        /* -------------------------------------------------
           FIND SALON
        ------------------------------------------------- */

        let salonId =
            userData.salonId ||
            null;


        /*
         * If the user document already contains
         * salonId, verify that the salon actually exists.
         */

        if (salonId) {

            const salonRef =
                doc(
                    db,
                    "salons",
                    salonId
                );


            const salonSnap =
                await getDoc(
                    salonRef
                );


            if (!salonSnap.exists()) {

                console.warn(
                    "Stored salonId does not exist:",
                    salonId
                );

                salonId =
                    null;

            }

        }


        /*
         * If salonId is missing or invalid,
         * search salons using ownerId.
         */

        if (!salonId) {

            salonId =
                await findSalonForOwner(
                    user.uid
                );

        }


        /* -------------------------------------------------
           REPAIR USER DOCUMENT
        ------------------------------------------------- */

        if (salonId) {

            console.log(
                "Salon found:",
                salonId
            );


            /*
             * Make sure the salon also has
             * the correct ownerId.
             */

            try {

                const salonRef =
                    doc(
                        db,
                        "salons",
                        salonId
                    );


                const salonSnap =
                    await getDoc(
                        salonRef
                    );


                if (
                    salonSnap.exists()
                ) {

                    const salonData =
                        salonSnap.data();


                    if (
                        !salonData.ownerId
                    ) {

                        await setDoc(
                            salonRef,
                            {
                                ownerId:
                                    user.uid,

                                updatedAt:
                                    serverTimestamp()
                            },
                            {
                                merge: true
                            }
                        );

                    }

                }

            } catch (salonRepairError) {

                console.warn(
                    "Salon ownerId repair skipped:",
                    salonRepairError
                );

            }


            /*
             * Save salonId back to user profile.
             */

            if (
                userData.salonId !==
                salonId
            ) {

                await setDoc(
                    userRef,
                    {

                        salonId:
                            salonId,

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge: true
                    }
                );

            }

        } else {

            /*
             * No salon exists yet.
             *
             * This is NOT an error.
             *
             * The owner dashboard can allow
             * the owner to create the salon.
             */

            console.log(
                "No salon found. New owner can create one."
            );

        }


        /* -------------------------------------------------
           SAVE LOGIN STATE
        ------------------------------------------------- */

        sessionStorage.setItem(
            "justLoggedIn",
            "true"
        );


        sessionStorage.setItem(
            "ownerUid",
            user.uid
        );


        if (salonId) {

            sessionStorage.setItem(
                "ownerSalonId",
                salonId
            );

        } else {

            sessionStorage.removeItem(
                "ownerSalonId"
            );

        }


        /* -------------------------------------------------
           REDIRECT
        ------------------------------------------------- */

        window.location.replace(
            "ownerdashboard.html"
        );


    } catch (error) {

        console.error(
            "Owner login error:",
            error
        );


        showLoginError(
            getFirebaseErrorMessage(
                error
            )
        );

    } finally {

        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "Login";

    }

}



/* =========================================================
   ENTER KEY LOGIN
========================================================= */

document
    .getElementById("loginEmail")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                loginOwner();

            }

        }
    );


document
    .getElementById("loginPassword")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                loginOwner();

            }

        }
    );



/* =========================================================
   REGISTER OWNER
========================================================= */

registerBtn.addEventListener(
    "click",
    registerOwner
);


async function registerOwner() {

    const email =
        document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;

    const confirmPassword =
        document
            .getElementById(
                "registerConfirmPassword"
            )
            .value;


    clearErrors();


    if (
        !email ||
        !password ||
        !confirmPassword
    ) {

        showRegisterError(
            "Please complete all fields."
        );

        return;

    }


    if (
        password.length <
        6
    ) {

        showRegisterError(
            "Password must contain at least 6 characters."
        );

        return;

    }


    if (
        password !==
        confirmPassword
    ) {

        showRegisterError(
            "Passwords do not match."
        );

        return;

    }


    registerBtn.disabled =
        true;

    registerBtn.textContent =
        "Creating account...";


    try {

        /* -------------------------------------------------
           CREATE FIREBASE AUTH ACCOUNT
        ------------------------------------------------- */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        console.log(
            "New owner UID:",
            user.uid
        );


        /* -------------------------------------------------
           CREATE USER PROFILE
        ------------------------------------------------- */

        await setDoc(
            doc(
                db,
                "users",
                user.uid
            ),
            {

                email:
                    email,

                role:
                    "salon_owner",

                salonId:
                    null,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }
        );


        /*
         * New owner does not have a salon yet.
         *
         * The owner dashboard should show
         * the Create Salon screen.
         */

        sessionStorage.setItem(
            "justLoggedIn",
            "true"
        );


        sessionStorage.setItem(
            "ownerUid",
            user.uid
        );


        sessionStorage.removeItem(
            "ownerSalonId"
        );


        window.location.replace(
            "ownerdashboard.html"
        );


    } catch (error) {

        console.error(
            "Owner registration error:",
            error
        );


        showRegisterError(
            getFirebaseErrorMessage(
                error
            )
        );

    } finally {

        registerBtn.disabled =
            false;

        registerBtn.textContent =
            "Create Owner Account";

    }

}



/* =========================================================
   ENTER KEY REGISTER
========================================================= */

document
    .getElementById(
        "registerConfirmPassword"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                registerOwner();

            }

        }
    );



/* =========================================================
   AUTH STATE
========================================================= */

let authStateChecking =
    true;


onAuthStateChanged(
    auth,
    async user => {

        /*
         * Do not redirect while the page
         * is still determining authentication.
         */

        if (!user) {

            authStateChecking =
                false;

            pageLoading.classList.add(
                "hidden"
            );

            return;

        }


        try {

            console.log(
                "Existing Firebase session:",
                user.uid
            );


            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if (
                !userSnap.exists()
            ) {

                console.log(
                    "Authenticated user has no profile."
                );

                await signOut(auth);

                authStateChecking =
                    false;

                pageLoading.classList.add(
                    "hidden"
                );

                return;

            }


            const userData =
                userSnap.data();


            if (
                userData.role ===
                "salon_owner"
            ) {

                /*
                 * If already logged in as an owner,
                 * go directly to dashboard.
                 */

                sessionStorage.setItem(
                    "ownerUid",
                    user.uid
                );


                if (
                    userData.salonId
                ) {

                    sessionStorage.setItem(
                        "ownerSalonId",
                        userData.salonId
                    );

                }


                window.location.replace(
                    "ownerdashboard.html"
                );

                return;

            }


            /*
             * Authenticated but not an owner.
             */

            await signOut(auth);

        } catch (error) {

            console.error(
                "Auth state error:",
                error
            );

        }


        authStateChecking =
            false;

        pageLoading.classList.add(
            "hidden"
        );

    }
);



/* =========================================================
   FIND SALON FOR OWNER
========================================================= */

async function findSalonForOwner(
    ownerId
) {

    try {

        console.log(
            "Searching salons for owner:",
            ownerId
        );


        const q =
            query(
                collection(
                    db,
                    "salons"
                ),
                where(
                    "ownerId",
                    "==",
                    ownerId
                )
            );


        const snapshot =
            await getDocs(q);


        if (
            snapshot.empty
        ) {

            console.log(
                "No salon found for owner."
            );

            return null;

        }


        /*
         * Use the first matching salon.
         */

        const salonDoc =
            snapshot.docs[0];


        console.log(
            "Matching salon:",
            salonDoc.id
        );


        return salonDoc.id;

    } catch (error) {

        console.error(
            "Could not find salon:",
            error
        );

        /*
         * Do not block owner login just because
         * the salon lookup failed.
         */

        return null;

    }

}



/* =========================================================
   ERROR HELPERS
========================================================= */

function clearErrors() {

    loginError.classList.add(
        "hidden"
    );

    registerError.classList.add(
        "hidden"
    );

    loginError.textContent =
        "";

    registerError.textContent =
        "";

}



function showLoginError(
    message
) {

    loginError.textContent =
        message;

    loginError.classList.remove(
        "hidden"
    );

}



function showRegisterError(
    message
) {

    registerError.textContent =
        message;

    registerError.classList.remove(
        "hidden"
    );

}



/* =========================================================
   FIREBASE ERROR MESSAGES
========================================================= */

function getFirebaseErrorMessage(
    error
) {

    switch (
        error.code
    ) {

        case "auth/invalid-credential":

            return (
                "Incorrect email or password."
            );


        case "auth/invalid-email":

            return (
                "Please enter a valid email address."
            );


        case "auth/user-not-found":

            return (
                "No account was found with this email."
            );


        case "auth/wrong-password":

            return (
                "Incorrect password."
            );


        case "auth/email-already-in-use":

            return (
                "An account with this email already exists."
            );


        case "auth/weak-password":

            return (
                "Password is too weak. Use at least 6 characters."
            );


        case "auth/network-request-failed":

            return (
                "Network error. Check your internet connection."
            );


        case "auth/too-many-requests":

            return (
                "Too many login attempts. Please try again later."
            );


        case "auth/user-disabled":

            return (
                "This account has been disabled."
            );


        case "auth/operation-not-allowed":

            return (
                "Email/password login is not enabled in Firebase Authentication."
            );


        default:

            return (
                error.message ||
                "Something went wrong. Please try again."
            );

    }

}

</script>


</body>

    </html>
