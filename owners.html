<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>K@si Web | Owner Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-950 text-white min-h-screen">


<header
    class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40"
>

    <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"
    >

        <h1 class="text-2xl font-bold">
            💈 Owner Dashboard
        </h1>

        <div class="flex gap-2">

            <a
                href="home.html"
                class="bg-gray-800 px-4 py-2 rounded-lg"
            >
                Home
            </a>

            <button
                id="logoutBtn"
                class="bg-red-600 px-4 py-2 rounded-lg"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="max-w-7xl mx-auto px-4 py-8">


    <div
        id="loading"
        class="text-center py-20"
    >
        Loading dashboard...
    </div>


    <!-- =====================================================
         CREATE SALON
    ====================================================== -->

    <section
        id="createSalonSection"
        class="hidden max-w-xl mx-auto"
    >

        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6"
        >

            <h2 class="text-2xl font-bold mb-2">
                Create Your Salon
            </h2>

            <p class="text-gray-400 mb-6">
                Your owner account is ready.
                Now connect it to your salon.
            </p>


            <input
                id="salonName"
                type="text"
                placeholder="Salon name"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <input
                id="salonLocation"
                type="text"
                placeholder="Location"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <input
                id="salonHours"
                type="text"
                placeholder="Opening hours e.g. 09:00 - 18:00"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <input
                id="salonImage"
                type="url"
                placeholder="Image URL (optional)"
                class="w-full p-3 mb-3 rounded-lg bg-gray-800 border border-gray-700"
            >


            <button
                id="createSalonBtn"
                class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold"
            >
                Create Salon
            </button>

        </div>

    </section>


    <!-- =====================================================
         OWNER CONTENT
    ====================================================== -->

    <section
        id="ownerContent"
        class="hidden"
    >

        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6"
        >

            <h2
                id="salonTitle"
                class="text-3xl font-bold"
            >
                My Salon
            </h2>

            <p
                id="salonInfo"
                class="text-gray-400 mt-2"
            ></p>

        </div>


        <div
            class="bg-gray-900 border border-gray-800 rounded-2xl p-6"
        >

            <div
                class="flex justify-between items-center mb-5"
            >

                <div>

                    <h2 class="text-2xl font-bold">
                        Today's Bookings
                    </h2>

                    <p
                        id="todayDate"
                        class="text-gray-400"
                    ></p>

                </div>

            </div>


            <div
                id="bookingsList"
                class="space-y-4"
            >
                Loading bookings...
            </div>

        </div>

    </section>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    addDoc,
    collection,
    query,
    where,
    onSnapshot,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let salonId = null;

let unsubscribeBookings = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById("loading");

const createSalonSection =
    document.getElementById(
        "createSalonSection"
    );

const ownerContent =
    document.getElementById(
        "ownerContent"
    );


/* =========================================================
   SOUTH AFRICAN DATE
========================================================= */

function todayZA() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Africa/Johannesburg",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(
        new Date()
    );

}


document.getElementById(
    "todayDate"
).textContent =
    todayZA();


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "index.html";

            return;
        }


        currentUser = user;


        try {

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(userRef);


            if (!userSnap.exists()) {

                alert(
                    "Your user profile does not exist."
                );

                await signOut(auth);

                window.location.href =
                    "index.html";

                return;
            }


            const userData =
                userSnap.data();


            if (
                userData.role !==
                "salon_owner"
            ) {

                alert(
                    "Access denied. This page is for salon owners."
                );

                window.location.href =
                    "salons.html";

                return;
            }


            salonId =
                userData.salonId || null;


            loading.classList.add(
                "hidden"
            );


            if (!salonId) {

                createSalonSection.classList.remove(
                    "hidden"
                );

                return;
            }


            await loadSalon();

            ownerContent.classList.remove(
                "hidden"
            );

            listenForBookings();


        } catch (error) {

            console.error(error);

            loading.innerHTML = `
                <p class="text-red-400">
                    ${escapeHtml(error.message)}
                </p>
            `;

        }

    }
);


/* =========================================================
   CREATE SALON
========================================================= */

document.getElementById(
    "createSalonBtn"
).addEventListener(
    "click",
    async () => {

        const name =
            document.getElementById(
                "salonName"
            ).value.trim();


        const location =
            document.getElementById(
                "salonLocation"
            ).value.trim();


        const hours =
            document.getElementById(
                "salonHours"
            ).value.trim();


        const image =
            document.getElementById(
                "salonImage"
            ).value.trim();


        if (!name || !location) {

            alert(
                "Please enter your salon name and location."
            );

            return;
        }


        const button =
            document.getElementById(
                "createSalonBtn"
            );


        button.disabled = true;

        button.textContent =
            "Creating...";


        try {

            /*
             Create salon first.
            */

            const salonRef =
                await addDoc(
                    collection(
                        db,
                        "salons"
                    ),
                    {

                        ownerId:
                            currentUser.uid,

                        name:
                            name,

                        location:
                            location,

                        hours:
                            hours ||
                            "09:00 - 18:00",

                        image:
                            image || "",

                        services: [

                            {
                                name: "Basic Cut",
                                price: 80
                            },

                            {
                                name: "Fade",
                                price: 120
                            },

                            {
                                name: "Premium Cut",
                                price: 150
                            }

                        ],

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );


            /*
             IMPORTANT FIX:

             Connect the owner user to
             the newly-created salon.
            */

            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {

                    salonId:
                        salonRef.id,

                    role:
                        "salon_owner",

                    email:
                        currentUser.email,

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge: true
                }
            );


            salonId =
                salonRef.id;


            createSalonSection.classList.add(
                "hidden"
            );

            ownerContent.classList.remove(
                "hidden"
            );


            await loadSalon();

            listenForBookings();


        } catch (error) {

            console.error(error);

            alert(
                "Could not create salon: " +
                error.message
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Create Salon";

        }

    }
);


/* =========================================================
   LOAD SALON
========================================================= */

async function loadSalon() {

    const salonSnap =
        await getDoc(
            doc(
                db,
                "salons",
                salonId
            )
        );


    if (!salonSnap.exists()) {

        alert(
            "Your salon no longer exists."
        );

        return;
    }


    const salon =
        salonSnap.data();


    document.getElementById(
        "salonTitle"
    ).textContent =
        salon.name || "My Salon";


    document.getElementById(
        "salonInfo"
    ).textContent =
        `${salon.location || ""} • ${salon.hours || ""}`;

}


/* =========================================================
   LISTEN TO TODAY'S BOOKINGS
========================================================= */

function listenForBookings() {

    if (unsubscribeBookings) {

        unsubscribeBookings();

    }


    const q =
        query(
            collection(
                db,
                "bookings"
            ),

            where(
                "salonId",
                "==",
                salonId
            ),

            where(
                "date",
                "==",
                todayZA()
            )
        );


    unsubscribeBookings =
        onSnapshot(
            q,
            snapshot => {

                renderBookings(
                    snapshot
                );

            },

            error => {

                console.error(error);

                document.getElementById(
                    "bookingsList"
                ).innerHTML = `
                    <p class="text-red-400">
                        Could not load bookings:
                        ${escapeHtml(error.message)}
                    </p>
                `;

            }
        );

}


/* =========================================================
   RENDER BOOKINGS
========================================================= */

function renderBookings(
    snapshot
) {

    const container =
        document.getElementById(
            "bookingsList"
        );


    if (snapshot.empty) {

        container.innerHTML = `
            <div class="text-center py-10 text-gray-500">
                No bookings for today 💈
            </div>
        `;

        return;
    }


    const bookings =
        snapshot.docs.map(
            bookingDoc => ({

                id:
                    bookingDoc.id,

                ...bookingDoc.data()

            })
        );


    bookings.sort(
        (a, b) =>
            String(a.time || "")
                .localeCompare(
                    String(b.time || "")
                )
    );


    container.innerHTML = "";


    bookings.forEach(
        booking => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "border border-gray-800 bg-gray-950 rounded-xl p-5";


            card.innerHTML = `

                <div class="flex justify-between items-start gap-3">

                    <div>

                        <h3 class="text-xl font-bold">
                            ${escapeHtml(
                                booking.customerName ||
                                "Customer"
                            )}
                        </h3>

                        <p class="text-gray-400">
                            📞 ${escapeHtml(
                                booking.phone ||
                                "No phone"
                            )}
                        </p>

                    </div>

                    <span
                        class="px-3 py-1 rounded-full text-sm font-bold ${statusClass(
                            booking.status
                        )}"
                    >
                        ${escapeHtml(
                            booking.status ||
                            "pending"
                        )}
                    </span>

                </div>


                <div class="mt-4 space-y-1 text-gray-300">

                    <p>
                        ✂️ ${escapeHtml(
                            booking.service ||
                            "Service"
                        )}
                    </p>

                    <p>
                        💰 R${Number(
                            booking.price || 0
                        )}
                    </p>

                    <p>
                        🕐 ${escapeHtml(
                            booking.time ||
                            "--:--"
                        )}
                    </p>

                </div>


                <div
                    class="flex gap-2 mt-5"
                >

                    ${
                        booking.status === "pending"
                        ? `
                            <button
                                class="approve flex-1 bg-green-600 hover:bg-green-700 p-2 rounded-lg"
                                data-id="${booking.id}"
                            >
                                Approve
                            </button>

                            <button
                                class="decline flex-1 bg-red-600 hover:bg-red-700 p-2 rounded-lg"
                                data-id="${booking.id}"
                            >
                                Decline
                            </button>
                        `
                        : ""
                    }


                    ${
                        booking.status === "approved"
                        ? `
                            <button
                                class="complete w-full bg-purple-600 hover:bg-purple-700 p-2 rounded-lg"
                                data-id="${booking.id}"
                            >
                                Mark as Completed
                            </button>
                        `
                        : ""
                    }

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   BOOKING ACTIONS
========================================================= */

document.addEventListener(
    "click",
    async event => {

        const approve =
            event.target.closest(
                ".approve"
            );


        const decline =
            event.target.closest(
                ".decline"
            );


        const complete =
            event.target.closest(
                ".complete"
            );


        let id = null;

        let status = null;


        if (approve) {

            id =
                approve.dataset.id;

            status =
                "approved";

        }


        if (decline) {

            id =
                decline.dataset.id;

            status =
                "declined";

        }


        if (complete) {

            id =
                complete.dataset.id;

            status =
                "completed";

        }


        if (!id || !status) return;


        try {

            await updateDoc(
                doc(
                    db,
                    "bookings",
                    id
                ),
                {

                    status:
                        status,

                    updatedAt:
                        serverTimestamp()

                }
            );

        } catch (error) {

            console.error(error);

            alert(
                "Could not update booking: " +
                error.message
            );

        }

    }
);


/* =========================================================
   LOGOUT
========================================================= */

document.getElementById(
    "logoutBtn"
).addEventListener(
    "click",
    async () => {

        if (unsubscribeBookings) {

            unsubscribeBookings();

        }

        await signOut(auth);

        window.location.href =
            "index.html";

    }
);


/* =========================================================
   HELPERS
========================================================= */

function statusClass(status) {

    switch (status) {

        case "approved":
            return "bg-green-900 text-green-300";

        case "declined":
            return "bg-red-900 text-red-300";

        case "completed":
            return "bg-purple-900 text-purple-300";

        default:
            return "bg-yellow-900 text-yellow-300";
    }

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
