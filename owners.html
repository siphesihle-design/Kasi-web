<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>K@si Web | Owner Dashboard</title>
    <meta name="theme-color" content="#7B68EE">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css?v=39">
    <style>
    .status-pill { padding:5px 10px; border-radius:20px; font-size:0.8rem; font-weight:700; }
    .status-pending { background:rgba(255,165,0,0.2); color:#FFA500; }
    .status-approved { background:rgba(0,200,83,0.2); color:#00c853; }
    .status-completed { background:rgba(123,104,238,0.2); color:#7B68EE; }
    .status-declined { background:rgba(255,71,87,0.2); color:#ff4757; }
    </style>
</head>
<body>
    <header class="header">
        <h1><i class='bx bx-store'></i> Owner Dashboard</h1>
        <nav>
            <a href="home.html" class="nav-item" id="homeBtn"><i class='bx bx-home-alt'></i><span>Home</span></a>
            <a href="#" id="logoutBtn" class="nav-item"><i class='bx bx-log-out'></i><span>Logout</span></a>
        </nav>
    </header>

    <div class="container">
        <div id="loadingScreen" class="glass-card" style="text-align:center; padding:40px;">
            <i class='bx bx-loader-circle bx-spin' style="font-size:2rem; color:#7B68EE;"></i>
            <p>Loading your bookings...</p>
        </div>

        <div id="ownerContent" style="display:none;">
            <div class="glass-card">
                <h2>Today's Bookings</h2>
                <p id="todayDate" style="color:#B0B0D0; margin-bottom:15px;"></p>
                <div id="ownerBookings" style="display:flex; flex-direction:column; gap:15px;">
                    <p style="text-align:center; color:#888;">Loading bookings...</p>
                </div>
            </div>
        </div>
    </div>

    <audio id="clickSound" src="mixkit-select-click-1109.wav" preload="auto"></audio>
    <audio id="notifySound" src="notify.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
            authDomain: "kasi-web-d073f.firebaseapp.com",
            projectId: "kasi-web-d073f",
            storageBucket: "kasi-web-d073f.firebasestorage.app",
            messagingSenderId: "471544855566",
            appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ownerBookings = document.getElementById('ownerBookings');
        const logoutBtn = document.getElementById('logoutBtn');
        const homeBtn = document.getElementById('homeBtn');
        const todayDate = document.getElementById('todayDate');
        const loadingScreen = document.getElementById('loadingScreen');
        const ownerContent = document.getElementById('ownerContent');

        todayDate.textContent = new Date().toLocaleDateString('en-ZA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        let ownerSalonId = null;
        let redirecting = false;

        onAuthStateChanged(auth, async (user) => {
            if (!user &&!redirecting) {
                redirecting = true;
                window.location.href = 'index.html';
                return;
            }

            const userSnap = await getDoc(doc(db, "users", user.uid));
            if(!userSnap.exists() || userSnap.data().role!== 'salon_owner') {
                if(!redirecting) { redirecting = true; alert("Access Denied"); window.location.href = 'index.html'; }
                return;
            }

            ownerSalonId = userSnap.data().salonId;

            if(!ownerSalonId){
                alert("Error: No salonId found");
                signOut(auth);
                return;
            }

            loadingScreen.style.display = 'none';
            ownerContent.style.display = 'block';

            const today = new Date().toISOString().split('T')[0];
            const q = query(collection(db, "bookings"),
                where("salonId", "==", ownerSalonId),
                where("date", "==", today),
                orderBy("createdAt", "desc")
            );

            onSnapshot(q, (snapshot) => {
                renderBookings(snapshot);
            }, (error) => {
                alert("DB Error: " + error.message);
                console.error(error);
            });
        });

        function renderBookings(snapshot) {
            if(snapshot.empty) {
                ownerBookings.innerHTML = `<p style="text-align:center; color:#888;">No bookings for today 💈</p>`;
                return;
            }
            ownerBookings.innerHTML = "";
            snapshot.forEach(docSnap => {
                const b = docSnap.data();
                const id = docSnap.id;
                const statusClass = `status-${b.status}`;

                ownerBookings.innerHTML += `
                <div class="glass-card" style="padding:15px; border-left:4px solid #7B68EE;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <h3 style="margin:0;">${b.customerName || b.name || 'Customer'}</h3>
                        <span class="status-pill ${statusClass}">${(b.status || 'pending').toUpperCase()}</span>
                    </div>
                    <p><i class='bx bx-cut'></i> ${b.service || 'Service'} - R${b.price || 0}</p>
                    <p><i class='bx bx-time'></i> ${b.time || '--:--'}</p>
                    <p><i class='bx bx-phone'></i> ${b.phone || 'No phone'}</p>

                    ${b.status === 'pending'? `
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <button class="primary-btn approveBtn" data-id="${id}" style="flex:1;">Approve</button>
                        <button class="secondary-btn declineBtn" data-id="${id}" style="flex:1;">Decline</button>
                    </div>
                    ` : b.status === 'approved'? `
                    <button class="primary-btn doneBtn" data-id="${id}" style="margin-top:10px; width:100%;">Mark as Done</button>
                    ` : ''}
                </div>`;
            });
        }

        document.addEventListener('click', async (e) => {
            const approveBtn = e.target.closest('.approveBtn');
            const declineBtn = e.target.closest('.declineBtn');
            const doneBtn = e.target.closest('.doneBtn');

            if(approveBtn) await updateDoc(doc(db, "bookings", approveBtn.dataset.id), { status: "approved" });
            if(declineBtn) await updateDoc(doc(db, "bookings", declineBtn.dataset.id), { status: "declined" });
            if(doneBtn) await updateDoc(doc(db, "bookings", doneBtn.dataset.id), { status: "completed" });
        });

        homeBtn.addEventListener('click', () => { window.location.href = 'home.html'; });
        logoutBtn.addEventListener('click', () => { signOut(auth).then(() => window.location.href = 'index.html') });
    </script>
</body>
</html>
