<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K@si Web | Salons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f0f0f 0%, #1a0a2e 100%); }
   .glass { backdrop-filter: blur(12px); background: rgba(17, 17, 17, 0.7); border: 1px solid rgba(139, 92, 246, 0.2); }
   .glow:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
  </style>
</head>
<body class="text-white min-h-screen">

  <!-- NAVBAR -->
  <nav class="glass sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
    <h2 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Kasi Cut</h2>
    <div class="flex gap-3">
      <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-5 py-2 rounded-xl font-semibold">🏠 Home</a>
      <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-xl font-semibold hidden">Logout</button>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-5xl font-extrabold text-center mb-2 bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">🔥 Book Your Kasi Cut 🔥</h1>
    <p class="text-center text-gray-400 mb-8">Find the best barbers near you in Soweto</p>
    <div id="loginStatus" class="text-center mb-6 px-4 py-2 rounded-lg glass max-w-md mx-auto"></div>
    <div id="salonsList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",authDomain: "kasi-web-d073f.firebaseapp.com",projectId: "kasi-web-d073f",storageBucket: "kasi-web-d073f.firebasestorage.app",messagingSenderId: "471544855566",appId: "1:471544855566:web:aa669a968b8af0ceb6905f"};
  const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
  let currentUser = null;

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    const logoutBtn = document.getElementById("logoutBtn");
    if(user){
      document.getElementById("loginStatus").innerHTML = `👋 Welcome back, ${user.email}`;
      logoutBtn.classList.remove("hidden");
    } else {
      document.getElementById("loginStatus").innerHTML = `⚠️ Please login on index page first to book`;
      logoutBtn.classList.add("hidden");
    }
    loadSalons();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => { await signOut(auth); window.location.href = "index.html"; });

  async function loadSalons() {
    const snapshot = await getDocs(collection(db, "salons"));
    let html = "";
    if(snapshot.empty){ html = `<p class="text-center text-gray-500 col-span-3 glass p-8 rounded-2xl">No salons found yet</p>`; }
    snapshot.forEach((doc) => {
      const s = doc.data();
      const location = s.location || s['location '] || 'No location'; // fixes space bug
      let servicesList = '<p class="text-sm text-gray-500">No services listed</p>';
      if(s.services && s.services.length > 0){
        servicesList = s.services.map(svc =>
          `<div class="flex justify-between text-sm py-1 border-b border-gray-800">
            <span>${svc.name}</span>
            <span class="text-purple-400">R${svc.price || 0} • ${svc.duration || 30}min</span>
          </div>`
        ).join('');
      }
      html += `
        <div class="glass rounded-2xl p-6 glow transition transform hover:-translate-y-1">
          <img src="${s.image || 'https://via.placeholder.com/400x200/1a0a2e/8b5cf6'}" class="w-full h-48 object-cover rounded-xl mb-4">
          <h2 class="text-2xl font-bold mb-2 text-purple-400">${s.name}</h2>
          <p class="text-gray-400 mb-1">📍 ${location}</p>
          <div class="mb-5 bg-gray-900/30 p-4 rounded-xl"><h3 class="font-bold text-purple-400 mb-3">Services:</h3>${servicesList}</div>
          <a href="book.html?salonId=${doc.id}" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 p-4 rounded-xl font-bold block text-center">Book Now</a>
        </div>
      `;
    });
    document.getElementById("salonsList").innerHTML = html;
  }
</script>
</body>
</html>
