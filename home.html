<html lang="en">

<head>

    <!-- =========================================================

    <!-- =========================================================
         FIREBASE
         ========================================================= 

    <script src=https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js></script>

    <script src=https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js></script>

    <script src=https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js></script>


    <!-- =========================================================
         GLOBAL CSS
         ========================================================= 

    <style>

        /* =====================================================
           DESIGN TOKENS
           ===================================================== */

        :root {

            --bg:
                #07070d;

            --bg-2:
                #0b0b14;

            --surface:
                Rgba(18,18,29,.82);

            --surface-2:
                Rgba(25,25,39,.90);

            --surface-3:
                Rgba(31,31,49,.88);

            --border:
                Rgba(255,255,255,.09);

            --border-strong:
                Rgba(255,255,255,.16);

            --text:
                #ffffff;

            --muted:
                #a5a5b7;

            --muted-2:
                #777789;

            --primary:
                #7b68ee;

            --primary-2:
                #8b5cf6;

            --blue:
                #3b82f6;

            --green:
                #25d366;

            --yellow:
                #f5c451;

            --red:
                #ff5f6d;

            --cyan:
                #22d3ee;

            --shadow:
                0 25px 80px rgba(0,0,0,.38);

            --shadow-soft:
                0 15px 45px rgba(0,0,0,.24);

            --radius:
                24px;

            --radius-sm:
                16px;

            --max:
                1180px;

        }


        /* =====================================================
           RESET
           ===================================================== */

{
            Box-sizing:
                Border-box;

            Margin:
                0;

            Padding:
                0;
        }


        Html {
            Scroll-behavior:
                Smooth;
        }


        Body {

            Min-height:
                100vh;

            Background:
                Radial-gradient(
                    Circle at 15% 10%,
                    Rgba(123,104,238,.14),
                    Transparent 32%
                ),
                Radial-gradient(
                    Circle at 85% 20%,
                    Rgba(59,130,246,.09),
                    Transparent 30%
                ),
                Var(--bg);

            Color:
                Var(--text);

            Font-family:
                "Inter",
                Sans-serif;

            Overflow-x:
                Hidden;

            Padding-bottom:
                105px;
        }


        Body.auth-mode {
            Padding-bottom:
                0;
        }


        Button,
        Input,
        Select {
            Font:
                Inherit;
        }


        Button {
            Cursor:
                Pointer;
        }


        A {
            Color:
                Inherit;

            Text-decoration:
                None;
        }


        Img {
            Max-width:
                100%;

            Display:
                Block;
        }


        ::selection {
            Background:
                Rgba(123,104,238,.45);

            Color:
                White;
        }


        /* =====================================================
           SCROLLBAR
           ===================================================== */

        ::-webkit-scrollbar {
            Width:
                6px;

            Height:
                6px;
        }


        ::-webkit-scrollbar-track {
            Background:
                Transparent;
        }


        ::-webkit-scrollbar-thumb {
            Background:
                Rgba(255,255,255,.15);

            Border-radius:
                20px;
        }


        ::-webkit-scrollbar-thumb:hover {
            Background:
                Rgba(255,255,255,.25);
        }


        /* =====================================================
           LOADING OVERLAY
           ===================================================== */

        #loadingOverlay {

            Position:
                Fixed;

            Inset:
                0;

            z-index:
                9999;

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Center;

            Background:
                Rgba(7,7,13,.98);

            Backdrop-filter:
                Blur(18px);

            Transition:
                Opacity .3s ease,
                Visibility .3s ease;
        }


        #loadingOverlay.hidden {

            Opacity:
                0;

            Visibility:
                Hidden;

            Pointer-events:
                None;
        }


        .loader-box {

            Width:
                Min(88vw,360px);

            Padding:
                34px 26px;

            Border:
                1px solid var(--border);

            Border-radius:
                28px;

            Background:
                Rgba(18,18,29,.92);

            Box-shadow:
                Var(--shadow);

            Text-align:
                Center;
        }


        .loader-logo {

            Width:
                64px;

            Height:
                64px;

            Margin:
                0 auto 18px;

            Display:
                Grid;

            Place-items:
                Center;

            Border-radius:
                20px;

            Background:
                Linear-gradient(
                    135deg,
                    Var(--primary),
                    Var(--primary-2)
                );

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                27px;

            Font-weight:
                800;

            Box-shadow:
                0 15px 45px rgba(123,104,238,.35);
        }


        .loader-spinner {

            Width:
                28px;

            Height:
                28px;

            Margin:
                0 auto 15px;

            Border:
                3px solid rgba(255,255,255,.12);

            Border-top-color:
                Var(--primary);

            Border-radius:
                50%;

            Animation:
                Spin .8s linear infinite;
        }


        @keyframes spin {

            To {
                Transform:
                    Rotate(360deg);
            }

        }


        .loader-title {

            Font-size:
                15px;

            Font-weight:
                800;

            Margin-bottom:
                6px;
        }


        .loader-text {

            Color:
                Var(--muted);

            Font-size:
                13px;

            Line-height:
                1.6;
        }


        /* =====================================================
           ROLE REDIRECT OVERLAY
           ===================================================== */

        #roleRedirectOverlay {

            Position:
                Fixed;

            Inset:
                0;

            z-index:
                9998;

            Display:
                None;

            Align-items:
                Center;

            Justify-content:
                Center;

            Padding:
                24px;

            Background:
                Rgba(7,7,13,.94);

            Backdrop-filter:
                Blur(20px);
        }


        #roleRedirectOverlay.show {
            Display:
                Flex;
        }


        .redirect-box {

            Width:
                Min(92vw,400px);

            Padding:
                32px 25px;

            Text-align:
                Center;

            Border:
                1px solid var(--border);

            Border-radius:
                28px;

            Background:
                Var(--surface);

            Box-shadow:
                Var(--shadow);
        }


        .redirect-icon {

            Width:
                60px;

            Height:
                60px;

            Margin:
                0 auto 17px;

            Display:
                Grid;

            Place-items:
                Center;

            Border-radius:
                20px;

            Background:
                Rgba(123,104,238,.15);

            Color:
                #b9adff;

            Font-size:
                28px;
        }


        .redirect-box h3 {

            Margin-bottom:
                8px;

            Font-size:
                19px;
        }


        .redirect-box p {

            Color:
                Var(--muted);

            Font-size:
                13px;

            Line-height:
                1.6;
        }


        /* =====================================================
           AUTH SCREEN
           ===================================================== */

        #authScreen {

            Min-height:
                100vh;

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Center;

            Padding:
                25px 16px;
        }


        .auth-shell {

            Width:
                Min(1120px,100%);

            Min-height:
                650px;

            Display:
                Grid;

            Grid-template-columns:
                1fr 1fr;

            Overflow:
                Hidden;

            Border:
                1px solid var(--border);

            Border-radius:
                30px;

            Background:
                Rgba(12,12,21,.78);

            Box-shadow:
                Var(--shadow);

            Backdrop-filter:
                Blur(25px);
        }


        .auth-brand {

            Position:
                Relative;

            Overflow:
                Hidden;

            Padding:
                52px;

            Display:
                Flex;

            Flex-direction:
                Column;

            Justify-content:
                Center;

            Background:
                Radial-gradient(
                    Circle at 25% 20%,
                    Rgba(123,104,238,.28),
                    Transparent 38%
                ),
                Radial-gradient(
                    Circle at 80% 80%,
                    Rgba(59,130,246,.17),
                    Transparent 35%
                ),
                #0b0b14;
        }


        .auth-brand::after {

            Content:
                "";

            Position:
                Absolute;

            Width:
                280px;

            Height:
                280px;

            Right:
                -120px;

            Top:
                -120px;

            Border:
                1px solid rgba(255,255,255,.07);

            Border-radius:
                50%;

            Box-shadow:
                0 0 0 55px rgba(255,255,255,.015),
                0 0 0 110px rgba(255,255,255,.01);
        }


        .brand-logo {

            Display:
                Flex;

            Align-items:
                Center;

            Gap:
                10px;

            Margin-bottom:
                30px;
        }


        .brand-mark {

            Width:
                50px;

            Height:
                50px;

            Display:
                Grid;

            Place-items:
                Center;

            Border-radius:
                16px;

            Background:
                Linear-gradient(
                    135deg,
                    Var(--primary),
                    Var(--primary-2)
                );

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                22px;

            Font-weight:
                800;

            Box-shadow:
                0 12px 35px rgba(123,104,238,.3);
        }


        .brand-name {

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                25px;

            Font-weight:
                800;
        }


        .brand-kicker {

            Color:
                #a99cff;

            Text-transform:
                Uppercase;

            Letter-spacing:
                2px;

            Font-size:
                11px;

            Font-weight:
                800;

            Margin-bottom:
                13px;
        }


        .auth-brand h1 {

            Max-width:
                510px;

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                Clamp(42px,5vw,68px);

            Line-height:
                .98;

            Letter-spacing:
                -.04em;

            Margin-bottom:
                22px;
        }


        .auth-brand h1 span {

            Color:
                #9b8cff;
        }


        .auth-brand-description {

            Max-width:
                470px;

            Color:
                Var(--muted);

            Font-size:
                15px;

            Line-height:
                1.8;

            Margin-bottom:
                28px;
        }


        .brand-features {

            Display:
                Grid;

            Gap:
                12px;
        }


        .brand-feature {

            Display:
                Flex;

            Align-items:
                Center;

            Gap:
                11px;

            Color:
                #ddddeb;

            Font-size:
                13px;
        }


        .brand-feature I {

            Width:
                30px;

            Height:
                30px;

            Display:
                Grid;

            Place-items:
                Center;

            Border-radius:
                10px;

            Color:
                #b7aaff;

            Background:
                Rgba(123,104,238,.13);

            Font-size:
                17px;
        }


        .auth-panel {

            Padding:
                45px;

            Display:
                Flex;

            Flex-direction:
                Column;

            Justify-content:
                Center;

            Background:
                Rgba(17,17,27,.7);
        }


        .auth-tabs {

            Display:
                Grid;

            Grid-template-columns:
                1fr 1fr;

            Gap:
                5px;

            Padding:
                5px;

            Margin-bottom:
                23px;

            Border:
                1px solid var(--border);

            Border-radius:
                15px;

            Background:
                Rgba(255,255,255,.03);
        }


        .auth-tab {

            Min-height:
                43px;

            Border:
                0;

            Border-radius:
                11px;

            Background:
                Transparent;

            Color:
                Var(--muted);

            Font-weight:
                700;
        }


        .auth-tab.active {

            Background:
                Rgba(123,104,238,.18);

            Color:
                White;
        }


        .auth-heading {

            Margin-bottom:
                21px;
        }


        .auth-heading h2 {

            Font-size:
                25px;

            Margin-bottom:
                7px;
        }


        .auth-heading p {

            Color:
                Var(--muted);

            Font-size:
                13px;

            Line-height:
                1.6;
        }


        .auth-message {

            Display:
                None;

            Margin-bottom:
                16px;

            Padding:
                12px 14px;

            Border:
                1px solid rgba(255,95,109,.2);

            Border-radius:
                13px;

            Background:
                Rgba(255,95,109,.08);

            Color:
                #ffb5bc;

            Font-size:
                12px;

            Line-height:
                1.5;
        }


        .auth-message.show {
            Display:
                Block;
        }


        .form-group {

            Margin-bottom:
                15px;
        }


        .form-group label {

            Display:
                Block;

            Margin-bottom:
                7px;

            Color:
                #ddddeb;

            Font-size:
                12px;

            Font-weight:
                700;
        }


        .input-wrap {
            Position:
                Relative;
        }


        .input-wrap > i:first-child {

            Position:
                Absolute;

            Left:
                14px;

            Top:
                50%;

            Transform:
                translateY(-50%);

            color:
                var(--muted-2);

            font-size:
                18px;
        }


        .form-control {

            Width:
                100%;

            Height:
                49px;

            Padding:
                0 43px;

            Border:
                1px solid var(--border);

            Border-radius:
                14px;

            Outline:
                None;

            Color:
                White;

            Background:
                Rgba(255,255,255,.045);

            Transition:
                .2s ease;
        }


        Select.form-control {
            Padding-right:
                14px;
        }


        .form-control::placeholder {
            Color:
                #686879;
        }


        .form-control:focus {

            Border-color:
                Rgba(123,104,238,.6);

            Box-shadow:
                0 0 0 4px rgba(123,104,238,.08);
        }


        .password-toggle {

            Position:
                Absolute;

            Right:
                10px;

            Top:
                50%;

            Transform:
                translateY(-50%);

            width:
                32px;

            Height:
                32px;

            Border:
                0;

            Border-radius:
                9px;

            Color:
                Var(--muted);

            Background:
                Transparent;
        }


        .primary-btn {

            Width:
                100%;

            Min-height:
                50px;

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Center;

            Gap:
                8px;

            Border:
                0;

            Border-radius:
                14px;

            Background:
                Linear-gradient(
                    135deg,
                    Var(--primary),
                    Var(--primary-2)
                );

            Color:
                White;

            Font-weight:
                800;

            Box-shadow:
                0 13px 30px rgba(123,104,238,.2);

            Transition:
                Transform .2s ease,
                Box-shadow .2s ease;
        }


        .primary-btn:hover {

            Transform:
                translateY(-2px);

            box-shadow:
                0 17px 36px rgba(123,104,238,.3);
        }


        .primary-btn:disabled {

            Opacity:
                .55;

            Cursor:
                Not-allowed;

            Transform:
                None;
        }


        .role-note {

            Display:
                Flex;

            Gap:
                8px;

            Margin:
                -2px 0 16px;

            Color:
                Var(--muted);

            Font-size:
                11px;

            Line-height:
                1.5;
        }


        .role-note I {
            Color:
                #9f92ff;

            Font-size:
                15px;
        }


        .owner-link {

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Center;

            Gap:
                7px;

            Margin-top:
                17px;

            Color:
                #aaa0ff;

            Font-size:
                12px;

            Font-weight:
                700;
        }


        .auth-footer {

            Margin-top:
                20px;

            Color:
                Var(--muted-2);

            Font-size:
                11px;

            Line-height:
                1.6;

            Text-align:
                Center;
        }


        /* =====================================================
           APP SHELL
           ===================================================== */

        .app-shell {

            Display:
                None;

            Width:
                Min(var(--max),100%);

            Margin:
                0 auto;

            Padding:
                0 18px;
        }


        .app-shell.visible {
            Display:
                Block;
        }


        /* =====================================================
           TOP BAR
           ===================================================== */

        .topbar {

            Position:
                Sticky;

            Top:
                0;

            z-index:
                100;

            Margin:
                0 -18px;

            Padding:
                13px 18px;

            Border-bottom:
                1px solid rgba(255,255,255,.05);

            Background:
                Rgba(7,7,13,.72);

            Backdrop-filter:
                Blur(22px);
        }


        .topbar-inner {

            Max-width:
                Var(--max);

            Margin:
                0 auto;

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Space-between;
        }


        .top-brand {

            Display:
                Flex;

            Align-items:
                Center;

            Gap:
                10px;
        }


        .top-mark {

            Width:
                39px;

            Height:
                39px;

            Display:
                Grid;

            Place-items:
                Center;

            Border-radius:
                12px;

            Background:
                Linear-gradient(
                    135deg,
                    Var(--primary),
                    Var(--primary-2)
                );

            Font-family:
                "Playfair Display",
                Serif;

            Font-weight:
                800;

            Font-size:
                17px;
        }


        .top-brand strong {

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                19px;
        }


        .top-brand small {

            Display:
                Block;

            Margin-top:
                1px;

            Color:
                Var(--muted-2);

            Font-size:
                9px;

            Text-transform:
                Uppercase;

            Letter-spacing:
                1.2px;
        }


        .top-actions {

            Display:
                Flex;

            Align-items:
                Center;

            Gap:
                8px;
        }


        .icon-btn {

            Width:
                40px;

            Height:
                40px;

            Display:
                Grid;

            Place-items:
                Center;

            Border:
                1px solid var(--border);

            Border-radius:
                12px;

            Color:
                #d9d9e5;

            Background:
                Rgba(255,255,255,.035);

            Transition:
                .2s ease;
        }


        .icon-btn:hover {

            Border-color:
                Var(--border-strong);

            Background:
                Rgba(255,255,255,.07);
        }


        .role-pill {

            Display:
                None;

            Align-items:
                Center;

            Gap:
                6px;

            Min-height:
                34px;

            Padding:
                0 10px;

            Border:
                1px solid var(--border);

            Border-radius:
                999px;

            Color:
                #cfc9ff;

            Background:
                Rgba(123,104,238,.08);

            Font-size:
                10px;

            Font-weight:
                800;

            Text-transform:
                Uppercase;

            Letter-spacing:
                .7px;
        }


        .role-pill.show {
            Display:
                Inline-flex;
        }


        /* =====================================================
           HERO
           ===================================================== */

        .hero {

            Position:
                Relative;

            Overflow:
                Hidden;

            Margin-top:
                22px;

            Padding:
                34px;

            Border:
                1px solid var(--border);

            Border-radius:
                Var(--radius);

            Background:
                Linear-gradient(
                    135deg,
                    Rgba(123,104,238,.16),
                    Rgba(59,130,246,.06) 50%,
                    Rgba(255,255,255,.025)
                );

            Box-shadow:
                Var(--shadow-soft);
        }


        .hero::before {

            Content:
                "";

            Position:
                Absolute;

            Width:
                260px;

            Height:
                260px;

            Right:
                -100px;

            Top:
                -120px;

            Border-radius:
                50%;

            Background:
                Rgba(123,104,238,.12);

            Filter:
                Blur(2px);
        }


        .hero-content {

            Position:
                Relative;

            z-index:
                1;

            Max-width:
                760px;
        }


        .eyebrow {

            Display:
                Inline-flex;

            Align-items:
                Center;

            Gap:
                7px;

            Margin-bottom:
                12px;

            Color:
                #a99cff;

            Font-size:
                10px;

            Font-weight:
                800;

            Text-transform:
                Uppercase;

            Letter-spacing:
                1.5px;
        }


        .eyebrow-dot {

            Width:
                6px;

            Height:
                6px;

            Border-radius:
                50%;

            Background:
                Var(--green);

            Box-shadow:
                0 0 12px rgba(37,211,102,.7);
        }


        .hero h1 {

            Max-width:
                750px;

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                Clamp(35px,6vw,65px);

            Line-height:
                1;

            Letter-spacing:
                -.045em;

            Margin-bottom:
                14px;
        }


        .hero h1 span {

            Color:
                #9b8cff;
        }


        .hero-welcome {

            Color:
                #eeeef5;

            Font-size:
                15px;

            Font-weight:
                700;

            Margin-bottom:
                8px;

                12px;

                800;

                30px;

                12px;

                14px;
        }

                23px;

                Var(--muted);

                11px;

                Inline-flex;

            Align-items:
                Center;

            Gap:
                5px;

            Color:
                #aaa0ff;

            Font-size:
                11px;

            Font-weight:
                800;

           FEATURED CAROUSEL
           ===================================================== */

            Position:
                Relative;
        }

                Smooth;

            Scrollbar-width:
                None;

                2px 2px 8px;
        }

            Display:
                None;
        }

            Height:
                100%;

                Cover;

            Transition:
                Transform .5s ease;
        }

                Scale(1.04);
        }


        .style-badge {

            Position:
                Absolute;

            Left:

            Top:

            Padding:

            Border-radius:
                999px;

            Background:
                Rgba(0,0,0,.48);

                Blur(10px);

            Color:
                White;

            Font-size:
                9px;

            Font-weight:
                800;
        }


        .style-rating {

            Position:
                Absolute;

                12px;

            Top:
                12px;

            Display:
                Flex;

            Align-items:
                Center;

            Gap:
                4px;

            Padding:
                6px 8px;

            Border-radius:
                999px;

            Background:
                Rgba(0,0,0,.5);

            Backdrop-filter:
                Blur(10px);

            Color:
                White;

            Font-size:
                10px;

            Font-weight:
                800;
        }

            Color:
                Var(--yellow);
        }

            Padding:
                16px;
        }


        .style-body h3 {

            Margin-bottom:
                7px;

            Font-size:
                15px;
        }


        .style-meta {

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Space-between;

            Color:
                Var(--muted);

            Font-size:
                11px;
        }


        .style-price {

            Color:
                White;

            Font-size:
                14px;

            Font-weight:
                800;
        }


        .carousel-dots {

            Display:
                Flex;

            Justify-content:
                Center;

            Gap:
                6px;

            Margin-top:
                12px;
        }


        .carousel-dot {

            Width:
                7px;

            Height:
                7px;

            Padding:

            Border:

                Rgba(255,255,255,.18);

            Transition:
                .2s ease;
        }


        .carousel-dot.active {

            Width:
                22px;

            Border-radius:
                999px;

            Background:
                Var(--primary);
        }


        /* =====================================================
           QUICK ACCESS
           ===================================================== */

        .quick-grid {

            Display:
                Grid;

            Grid-template-columns:
                Repeat(3,1fr);

            Gap:
                12px;
        }


        .quick-card {

            Min-height:
                105px;

            Display:
                Flex;

            Flex-direction:
                Column;

            Justify-content:
                Space-between;

            Padding:
                17px;

            Border:
                1px solid var(--border);

            Border-radius:
                19px;

            Background:
                Var(--surface);

            Color:
                White;

            Text-align:
                Left;

            Transition:
                .2s ease;
        }

            Appearance:
                None;
        }


        .quick-card:hover:not(:disabled) {

            Transform:

            background:
                var(--surface-2);
        }


        .quick-card:disabled {

            Cursor:
                Not-allowed;

            Opacity:
                .55;
        }


        .quick-icon {

            Width:
                37px;

            Height:
                37px;

            Display:
                Grid;

            Place-items:
                Center;

            Border-radius:
                11px;

            Background:
                Rgba(123,104,238,.12);

            Color:
                #afa4ff;

            Font-size:
                19px;
        }


        .quick-card strong {

            Font-size:
                12px;
        }


        .quick-card span {

            Color:
                Var(--muted-2);

            Font-size:
                9px;
        }


        /* =====================================================
           MAIN CONTENT GRID
           ===================================================== */

        .content-grid {

            Display:
                Grid;

            Grid-template-columns:
                1.35fr .65fr;

            Gap:
                14px;

            Align-items:
                Start;
        }


        .panel {

            Border:
                1px solid var(--border);

            Border-radius:
                Var(--radius);

            Background:
                Var(--surface);

            Box-shadow:
                Var(--shadow-soft);

                Hidden;

        .panel-header {

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Space-between;

            Padding:
                18px 19px;

            Border-bottom:
                1px solid rgba(255,255,255,.055);
        }


        .panel-header h2 {

            Font-size:
                15px;
        }


        .panel-header span {

            Color:
                Var(--muted-2);

            Font-size:
                10px;
        }

           BOOKING SUMMARY
           ===================================================== */

        .booking-highlight {

            Display:
                None;

            Margin:
                14px;

            Padding:
                14px;

            Border:
                1px solid rgba(123,104,238,.18);

            Border-radius:
                16px;

            Background:
                Rgba(123,104,238,.07);
        }


        .booking-highlight.show {
            Display:
                Block;
        }


        .booking-highlight-top {

            Display:
                Flex;

            Align-items:
                Center;

            Justify-content:
                Space-between;

            Margin-bottom:
                10px;
        }

            Color:
                #a99cff;

            Font-size:
                9px;

            Font-weight:
                800;

            Text-transform:
                Uppercase;

            Letter-spacing:
                1px;
        }


        .booking-highlight-status {

            Padding:
                5px 8px;

            Border-radius:
                999px;

            Background:
                Rgba(255,255,255,.06);

                #ddd;

                9px;

            Font-weight:
                800;

            Text-transform:
                Uppercase;
        }


        .booking-highlight h3 {

            Margin-bottom:
                4px;

            Font-size:
                15px;
        }


        .booking-highlight p {

            Color:
                Var(--muted);

                11px;

            Line-height:

                Flex;

                Flex-start;

                Space-between;

                12px;

            Font-size:
                13px;

            Font-weight:
                800;

            Margin-bottom:
                5px;
        }

                Var(--muted);

                10px;
        }

            Display:
                Flex;

                Wrap;

                8px;

            Margin-top:
                10px;

                Inline-flex;

                Center;

                4px;

                Var(--muted-2);

                9px;

            Color:
                #9286f8;
        }

            Display:
                Inline-flex;

            Align-items:
                Center;

                Center;

            Border-radius:

            Font-size:
                8px;

            Font-weight:
                800;

            Text-transform:
                Uppercase;

                Nowrap;

            Color:
                #f6d47d;

            Background:
                Rgba(245,196,81,.1);
        }


        .status.confirmed {

            Color:
                #79e8a1;

            Background:
                Rgba(37,211,102,.1);
        }


        .status.completed {

            Color:
                #8ddcff;

            Background:
                Rgba(34,211,238,.1);
        }


        .status.cancelled {

            Color:
                #ff9da5;

            Background:
                Rgba(255,95,109,.1);
        }


        .empty-state {

            Padding:
                40px 20px;

                Center;
        }

            Width:

            Height:

            Place-items:
                Center;

                17px;

            Background:
                Rgba(123,104,238,.08);

            Color:
                #8f83ef;

            Font-size:
                24px;

            Font-size:
                14px;

            Margin-bottom:
                6px;

            Margin:
                0 auto 16px;

            Color:
                Var(--muted);

            Font-size:
                11px;

            Line-height:
                1.6;
        }

            Min-height:
                38px;

                Inline-flex;

            Align-items:
                Center;

            Justify-content:

                6px;

            Padding:
                0 13px;

            Border:

                11px;

            Background:
                Rgba(255,255,255,.045);

            Color:

                10px;

                800;

                Relative;

                290px;

            Overflow:
                Hidden;
        }

            Position:
                Absolute;

            Inset:
                0;
        }


        .discover-image::after {

            Content:
                "";

            Position:
                Absolute;

            Inset:
                0;

            Background:
                Linear-gradient(
                    180deg,

                    Rgba(0,0,0,.88)
                );
        }


        .discover-image img {

            Width:
                100%;

            Height:
                100%;

            Object-fit:
                Cover;
        }


        .discover-content {

            Position:
                Absolute;

            Left:
                18px;

            Right:
                18px;

            Bottom:
                18px;

            z-index:
                1;
        }


        .discover-label {

            Color:
                #b4aaff;

            Font-size:
                9px;

            Font-weight:
                800;

            Text-transform:
                Uppercase;

            Margin-bottom:
                7px;
        }


        .discover-content h2 {

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                24px;

            Margin-bottom:
                7px;
        }


        .discover-content p {

            Color:
                #c5c5d0;

            Font-size:
                10px;

            Line-height:
                1.6;

            Margin-bottom:
                13px;
        }

           PROFILE
           ===================================================== */

        .profile-panel {

            Margin-top:
                14px;

            Padding:
                18px;
        }


        .profile-top {

            Display:
                Flex;

            Align-items:
                Center;

            Gap:
                13px;
        }


        .profile-avatar {

            Width:
                52px;

            Height:
                52px;

            Flex:
                0 0 52px;

            Display:
                Grid;

            Place-items:
                Center;

            Overflow:
                Hidden;

            Border:
                1px solid rgba(255,255,255,.1);

            Border-radius:
                17px;

            Background:
                Linear-gradient(
                    135deg,
                    Rgba(123,104,238,.3),
                    Rgba(59,130,246,.2)
                );

            Color:
                White;

            Font-size:
                20px;

            Font-weight:
                800;
        }


        .profile-avatar img {

            Width:
                100%;

            Height:
                100%;

            Object-fit:
                Cover;
        }


        .profile-info {
            Min-width:
                0;

            Flex:
                1;
        }


        .profile-name {

            Overflow:
                Hidden;

            Text-overflow:
                Ellipsis;

            White-space:
                Nowrap;

            Font-size:
                14px;

            Font-weight:
                800;
        }


        .profile-email {

            Overflow:
                Hidden;

            Text-overflow:
                Ellipsis;

            White-space:
                Nowrap;

                4px;

            Color:
                Var(--muted);

            Font-size:
                10px;
        }

            Display:
                Inline-flex;

            Align-items:
                Center;

            Gap:
                5px;

            Margin-top:
                6px;

            Color:
                #82e9a4;

            Font-size:
                9px;

            Font-weight:
                700;
        }


        .profile-status I {
            Font-size:
                6px;
        }


        .logout-btn {

            Min-height:
                38px;

            Padding:
                0 12px;

            Display:
                Inline-flex;

            Align-items:
                Center;

            Gap:
                6px;

            Border:
                1px solid rgba(255,95,109,.18);

            Border-radius:
                11px;

            Background:
                Rgba(255,95,109,.06);

            Color:
                #ff9da5;

            Font-size:
                10px;

            Font-weight:
                800;
        }

           ELITE SECTION
           ===================================================== */

        .elite-section {

            Position:
                Relative;

            Min-height:
                310px;

            Overflow:
                Hidden;

            Margin-top:
                30px;

            Border:
                1px solid var(--border);

            Border-radius:
                26px;

            Background:
                #0b0b14;
        }


        .elite-image {

            Position:
                Absolute;

            Inset:
                0;
        }


        .elite-image::after {

            Content:
                "";

            Position:
                Absolute;

            Inset:
                0;

            Background:
                Linear-gradient(
                    90deg,
                    Rgba(7,7,13,.94),
                    Rgba(7,7,13,.68) 50%,
                    Rgba(7,7,13,.2)
                );
        }


        .elite-image img {

            Width:
                100%;

            Height:
                100%;

            Object-fit:
                Cover;
        }

            Position:
                Relative;

            z-index:
                1;

            Max-width:
                580px;

            Padding:
                43px 35px;
        }

            Display:
                Inline-flex;

            Align-items:
                Center;

            Gap:
                7px;

            Color:
                #b5aaff;

            Font-size:
                10px;

            Font-weight:
                800;

            Text-transform:
                Uppercase;

            Letter-spacing:
                1.5px;

            Margin-bottom:
                11px;
        }


        .elite-content h2 {

            Font-family:
                "Playfair Display",
                Serif;

            Font-size:
                Clamp(31px,5vw,46px);

            Line-height:
                1;

            Margin-bottom:
                12px;
        }


        .elite-content p {

            Color:
                #c0c0cc;

            Font-size:
                12px;

            Line-height:
                1.75;

            Margin-bottom:
                19px;
        }


        /* =====================================================
           ACCOUNT LOCK
           ===================================================== */

        .client-locked {

            Position:
                Relative;
        }


        .client-locked .lock-icon {

            Margin-left:
                Auto;

            Color:
                Var(--muted-2);
        }

           BOTTOM NAV
           ===================================================== */

        .bottom-nav {

            Position:
                Fixed;

            Left:
                50%;

            Bottom:
                14px;

            z-index:
                300;

            Width:
                Min(calc(100% - 22px),520px);

            Transform:
                translateX(-50%);

            display:
                grid;

            grid-template-columns:
                repeat(3,1fr);

            padding:
                7px;

            Border:
                1px solid rgba(255,255,255,.09);

            Border-radius:
                22px;

            Background:
                Rgba(14,14,23,.9);

            Backdrop-filter:
                Blur(22px);

            Box-shadow:
                0 20px 55px rgba(0,0,0,.42);
        }


        .bottom-item {

            Min-height:
                50px;

            Display:
                Flex;

            Flex-direction:
                Column;

            Align-items:
                Center;

            Justify-content:
                Center;

            Gap:
                3px;

            Border:
                0;

            Border-radius:
                16px;

            Background:
                Transparent;

            Color:
                Var(--muted-2);

            Font-size:
                9px;

            Font-weight:
                700;
        }


        .bottom-item I {
            Font-size:
                19px;
        }


        .bottom-item.active {

            Color:
                White;

            Background:
                Rgba(123,104,238,.13);
        }


        .bottom-item:disabled {

            Cursor:
                Not-allowed;

            Opacity:
                .38;
        }

           TOAST
           ===================================================== */

        #toast {

            Position:
                Fixed;

            Left:
                50%;

            Bottom:
                87px;

            z-index:
                10000;

            Width:
                Min(calc(100% - 30px),430px);

            Transform:
                Translate(-50%,20px);

            Opacity:
                0;

            Pointer-events:
                None;

            Display:
                Flex;

            Align-items:
                Center;

            Gap:
                9px;

            Padding:
                13px 15px;

            Border:
                1px solid var(--border);

            Border-radius:
                14px;

            Background:
                Rgba(20,20,31,.95);

            Backdrop-filter:
                Blur(18px);

            Box-shadow:
                Var(--shadow);

            Color:
                White;

            Font-size:
                11px;

            Transition:
                .25s ease;
        }


        #toast.show {

            Opacity:
                1;

            Transform:
                Translate(-50%,0);
        }


        #toast I {

            Color:
                #a99cff;

            Font-size:
                18px;
        }

           ERROR STATE
           ===================================================== */

            Display:
                None;

            Margin:
                16px 0 0;

            Padding:
                14px;

            Border:
                1px solid rgba(255,95,109,.2);

            Border-radius:
                14px;

            Background:
                Rgba(255,95,109,.06);

            Color:

        Function escapeHTML(
            Value
        ) {

            Return String(
                Value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           ROLE NORMALIZATION
           
           IMPORTANT:
           Firestore is the source of truth.
           The login dropdown is NOT trusted.
           ===================================================== */

        Function normalizeRole(
            rawRole
        ) {

            If (
                rawRole === null ||
                rawRole === undefined
            ) {

                Return "customer";

            }


            Const role =
                String(
                    rawRole
                )
                    .trim()
                    .toLowerCase()
                    .replace(
                        /[_-]+/g,
                        " "
                    )
                    .replace(
                        /\s+/g,
                        " "
                    );


            /* -----------------------------------------------
               ADMIN
               ----------------------------------------------- */

            If (
                Role === "admin" ||
                Role === "administrator" ||
                Role === "system admin" ||
                Role === "super admin" ||
                Role === "superadmin"
            ) {

                Return "admin";

            }


            /* -----------------------------------------------
               SALON OWNER
               ----------------------------------------------- */

            If (
                Role === "salon owner" ||
                Role === "owner" ||
                Role === "salonowner" ||
                Role === "barber owner" ||
                Role === "barberowner" ||
                Role === "business owner" ||
                Role === "salon manager"
            ) {

                Return "salon_owner";

            }


            /* -----------------------------------------------
               CUSTOMER
               ----------------------------------------------- */

            If (
                Role === "customer" ||
                Role === "client" ||
                Role === "user" ||
                Role === "member" ||
                Role === "customer user"
            ) {

                Return "customer";

            }


            /*
             * Unknown roles are intentionally treated as
             * customer-safe mode.
             *
             * They NEVER receive elevated permissions.
             */

            Return "customer";

        }

        /* =====================================================
           DATE HELPERS
           ===================================================== */

        Function parseBookingDate(
            Booking
        ) {

            Const dateValue =
                Booking?.date;


            Const timeValue =
                Booking?.time ||
                "00:00";


            If (
                !dateValue
            ) {

                Return null;

            }


            /*
             * Firebase Timestamp
             */

            If (
                Typeof dateValue.toDate ===
                "function"
            ) {

                Const d =
                    dateValue.toDate();


                const parts =
                    timeValue
                        .split(":")
                        .map(
                            Number
                        );


                If (
                    Parts.length >= 2 &&
                    Number.isFinite(parts[0]) &&
                    Number.isFinite(parts[1])
                ) {

                    d.setHours(
                        parts[0],
                        parts[1],
                        0,
                        0
                    );

                }


                Return d;

            }


            /*
             * JavaScript Date
             */

            If (
                dateValue instanceof Date
            ) {

                Return new Date(
                    dateValue.getTime()
                );

            }


            Const raw =
                String(
                    dateValue
                ).trim();


            /*
             * YYYY-MM-DD
             */

            If (
                /^\d{4}-\d{2}-\d{2}$/.test(
                    Raw
                )
            ) {

                Const parts =
                    Raw.split(
                        "-"
                    ).map(
                        Number
                    );


                Const timeParts =
                    timeValue
                        .split(":")
                        .map(
                            Number
                        );


                Const d =
                    New Date(
                        Parts[0],
                        Parts[1] – 1,
                        Parts[2],
                        Number.isFinite(
                            timeParts[0]
                        )
                            ? timeParts[0]
                            : 0,
                        Number.isFinite(
                            timeParts[1]
                        )
                            ? timeParts[1]
                            : 0
                    );


                Return d;

            }


            Const parsed =
                New Date(
                    `${raw} ${timeValue}`
                );


            If (
                Number.isNaN(
                    Parsed.getTime()
                )
            ) {

                Return null;

            }


            Return parsed;

        }

        /* =====================================================

           ===================================================== */

        Async function getUserProfile(
            User
        ) {

            If (
                !user ||
                !db
            ) {

                Return null;

            }


            Const ref =
                Db.collection(
                    "users"
                ).doc(
                    User.uid
                );


            Const snapshot =
                Await ref.get();


            If (
                !snapshot.exists
            ) {

                Return null;

            }


            Return snapshot.data() || {};

        }


        /* =====================================================
           VERIFIED ROLE
           
           IMPORTANT:
           This function ONLY trusts Firestore.
           ===================================================== */

        Async function getVerifiedRole(
            User
        ) {

            If (
                !user
            ) {

                Return "customer";

            }


            Const profile =
                Await getUserProfile(
                    User
                );


            currentProfile =
                profile || {};


            if (
                !profile
            ) {

                Return "customer";

            }


            Const possibleRoles = [

                Profile.role,

                Profile.Role,

                Profile.userRole,

                Profile.user_type,

                Profile.accountType

            ];


            For (
                Const rawRole of possibleRoles
            ) {

                If (
                    rawRole !== undefined &&
                    rawRole !== null &&
                    String(
                        rawRole
                    ).trim()
                ) {

                    Return normalizeRole(
                        rawRole
                    );

                }

            }


            Return "customer";

        }

            ) {

                    "Opening your salon management portal…";

                Return;

            }


            redirectTitle.textContent =
                "Client account verified";

                "Opening your K@si grooming space…";

        Function setButtonLoading(
            Button,
            Loading,
            loadingText,
            normalHTML
        ) {

            If (
                Loading
            ) {

                Button.disabled =
                    True;

                Button.dataset.originalHTML =
                    Button.innerHTML;

                Button.innerHTML =
                    `
                        <I class="bx bx-loader-alt bx-spin"></i>

        /* =====================================================
           LOGIN
           ===================================================== */

        Async function handleLogin(
            Event
        ) {

            Event.preventDefault();

            clearAuthMessage();

            clearFirebaseError();


            const email =
                document
                    .getElementById(
                        "loginEmail"
                    )
                    .value
                    .trim();


            Const password =
                Document
                    .getElementById(
                        "loginPassword"
                    )
                    .value;


            If (
                !email ||
                !password
            ) {

                showAuthMessage(
                    "Please enter your email and password."
                );

                Return;

            }


            If (
                !auth
            ) {

                showAuthMessage(
                    K@si authentication is not available.
                );

                Return;

            }


            Try {

                setButtonLoading(
                    loginBtn,
                    true,
                    "Verifying…"
                );


                showLoading(
                    "Verifying your K@si account…"
                );


                /*
                 * The selected account type is intentionally
                 * NOT used to determine permissions.
                 */

                Const credential =
                    Await auth.signInWithEmailAndPassword(
                        Email,
                        Password
                    );


                Const user =
                    Credential.user;


                If (
                    !user
                ) {

                    Throw new Error(
                        "No authenticated user was returned."
                    );

                }


                /*
                 * Read actual Firestore role.
                 */

                Const verifiedRole =
                    Await getVerifiedRole(
                        User
                    );


                currentUser =
                    user;

                currentRole =
                    verifiedRole;


                saveRoleSession(
                    user,
                    verifiedRole,
                    currentProfile
                );


                /*
                 * CUSTOMER:
                 * Stay on home.html.
                 */

                If (
                    verifiedRole === "customer"
                ) {

                    Document.body.classList.remove(
                        "auth-mode"
                    );

                    authScreen.style.display =
                        "none";

                    appShell.classList.add(
                        "visible"
                    );


                    Await loadUser(
                        User
                    );


                    hideLoading();


                    showToast(
                        "Welcome back, " +
                        getFirstName(
                            getProfileName(
                                currentProfile,
                                user
                            )
                        ) +
                        "!"
                    );


                    Return;

                }


                /*
                 * ADMIN / OWNER:
                 * Send them to their correct portal.
                 */

                showRoleRedirect(
                    verifiedRole
                );


                hideLoading();


                setTimeout(
                    () => {

                        Window.location.href =
                            getRoleDestination(
                                verifiedRole
                            );

                    },
                    450
                );

            } catch (
                Error
            ) {

                Console.error(
                    "Login error:",
                    Error
                );


                hideLoading();


                let message =
                    "Unable to sign in. Please try again.";


                Const code =
                    Error?.code ||
                    "";


                If (
                    Code ===
                    "auth/user-not-found"
                ) {

                    Message =
                        "No account was found with that email.";

                } else if (
                    Code ===
                    "auth/wrong-password"
                ) {

                    Message =
                        "The password is incorrect.";

                } else if (
                    Code ===
                    "auth/invalid-credential"
                ) {

                    Message =
                        "The email or password is incorrect.";

                } else if (
                    Code ===
                    "auth/invalid-email"
                ) {

                    Message =
                        "Please enter a valid email address.";

                } else if (
                    Code ===
                    "auth/too-many-requests"
                ) {

                    Message =
                        "Too many attempts. Please wait and try again.";

                } else if (
                    Code ===
                    "auth/network-request-failed"
                ) {

                    Message =
                        "Network problem. Check your internet connection.";

                }


                showAuthMessage(
                    message
                );

            } finally {

                setButtonLoading(
                    loginBtn,
                    false,
                    "",
                    `
                        <I class="bx bx-log-in"></i>
                        Sign In
                    `
                );

            }

        }


        /* =====================================================
           SIGNUP
           ===================================================== */

        Async function handleSignup(
            Event
        ) {

            Event.preventDefault();

            clearAuthMessage();

            clearFirebaseError();


            const name =
                document
                    .getElementById(
                        "signupName"
                    )
                    .value
                    .trim();


            Const email =
                Document
                    .getElementById(
                        "signupEmail"
                    )
                    .value
                    .trim();


            Const password =
                Document
                    .getElementById(
                        "signupPassword"
                    )
                    .value;


            Const confirm =
                Document
                    .getElementById(
                        "signupConfirm"
                    )
                    .value;


            If (
                Name.length < 2
            ) {

                showAuthMessage(
                    "Please enter your full name."
                );

                Return;

            }


            If (
                Password.length < 6
            ) {

                showAuthMessage(
                    "Password must contain at least 6 characters."
                );

                Return;

            }


            If (
                Password !== confirm
            ) {

                showAuthMessage(
                    "Passwords do not match."
                );

                Return;

            }


            If (
                !auth ||
                !db
            ) {

                showAuthMessage(
                    K@si authentication is unavailable.
                );

                Return;

            }


            Try {

                setButtonLoading(
                    signupBtn,
                    true,
                    "Creating account…"
                );


                showLoading(
                    "Creating your K@si client account…"
                );


                /*
                 * New public registrations ALWAYS become
                 * customer accounts.
                 *
                 * Nobody can create an admin/owner account
                 * through this form.
                 */

                Const credential =
                    Await auth.createUserWithEmailAndPassword(
                        Email,
                        Password
                    );


                Const user =
                    Credential.user;


                If (
                    !user
                ) {

                    Throw new Error(
                        "Account creation failed."
                    );

                }


                Await user.updateProfile(
                    {
                        displayName:
                            name
                    }
                );


                Const userRef =
                    Db.collection(
                        "users"
                    ).doc(
                        User.uid
                    );


                Await userRef.set(
                    {

                        Name:
                            Name,

                        displayName:
                            name,

                        fullName:
                            name,

                        email:
                            email,

                        role:
                            "customer",

                        createdAt:
                            firebase.firestore.FieldValue.serverTimestamp(),

                        updatedAt:
                            firebase.firestore.FieldValue.serverTimestamp()

                    },
                    {
                        Merge:
                            True
                    }
                );


                currentUser =
                    user;

                currentRole =
                    "customer";

                currentProfile = {

                    name:
                        name,

                    displayName:
                        name,

                    email:
                        email,

                    role:
                        "customer"

                };


                saveRoleSession(
                    user,
                    "customer",
                    currentProfile
                );


                Document.body.classList.remove(
                    "auth-mode"
                );


                authScreen.style.display =
                    "none";


                appShell.classList.add(
                    "visible"
                );


                Await loadUser(
                    User
                );


                hideLoading();


                showToast(
                    "Welcome to K@si, " +
                    getFirstName(
                        name
                    ) +
                    "!"
                );

            } catch (
                Error
            ) {

                Console.error(
                    "Signup error:",
                    Error
                );


                hideLoading();


                let message =
                    "Unable to create your account.";


                Const code =
                    Error?.code ||
                    "";


                If (
                    Code ===
                    "auth/email-already-in-use"
                ) {

                    Message =
                        "An account with this email already exists.";

                } else if (
                    Code ===
                    "auth/invalid-email"
                ) {

                    Message =
                        "Please enter a valid email address.";

                } else if (
                    Code ===
                    "auth/weak-password"
                ) {

                    Message =
                        "Please choose a stronger password.";

                } else if (
                    Code ===
                    "auth/network-request-failed"
                ) {

                    Message =
                        "Network problem. Check your connection.";

                }


                showAuthMessage(
                    message
                );

            } finally {

                setButtonLoading(
                    signupBtn,
                    false,
                    "",
                    `
                        <I class="bx bx-user-plus"></i>
                        Create Client Account
                    `
                );

            }

        }


        /* =====================================================
           LOAD USER
           ===================================================== */

        Async function loadUser(
            User
        ) {

            If (
                !user
            ) {

                Return;

            }


            Try {

                showLoading(
                    "Loading your K@si space…"
                );


                Const profile =
                    Await getUserProfile(
                        User
                    );


                currentProfile =
                    profile || {};


                /*
                 * If no profile exists, safe customer mode.
                 */

                currentRole =
                    await getVerifiedRole(
                        user
                    );


                /*
                 * If an elevated role somehow appears while
                 * on home.html, route it immediately.
                 */

                If (
                    currentRole === "admin" ||
                    currentRole === "salon_owner"
                ) {

                    saveRoleSession(
                        user,
                        currentRole,
                        currentProfile
                    );


                    showRoleRedirect(
                        currentRole
                    );


                    setTimeout(
                        () => {

                            Window.location.href =
                                getRoleDestination(
                                    currentRole
                                );

                        },
                        350
                    );


                    Return;

                }


                /*
                 * From this point onward, this is a client.
                 */

                currentRole =
                    "customer";


                setAccountUI(
                    currentRole
                );


                Const displayName =
                    getProfileName(
                        currentProfile,
                        user
                    );


                welcomeText.textContent =
                    "Welcome back, " +
                    getFirstName(
                        displayName
                    ) +
                    ".";


                profileName.textContent =
                    displayName;


                profileEmail.textContent =
                    user.email ||
                    currentProfile.email ||
                    "Email unavailable";


                setProfileAvatar(
                    displayName,
                    user.photoURL
                );


                Await loadUserBookings(
                    User
                );


                setAccountUI(
                    currentRole
                );


            } catch (
                Error
            ) {

                Console.error(
                    "loadUser error:",
                    Error
                );


                showToast(
                    "Some account information could not be loaded.",
                    "error"
                );


                currentRole =
                    "customer";


                setAccountUI(
                    "customer"
                );

            }

        }

            bookingList.innerHTML =
