<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K@si Web | Login</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3B82F6">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="glass-card login-section">

        <h1 style="text-align:center;">
            K@si Web
        </h1>

        <p class="tagline">
            Fresh cuts. No lines.
        </p>

        <div class="form-group">

            <input
                type="email"
                id="userEmail"
                placeholder="Email Address"
                autocomplete="email"
            >

            <input
                type="password"
                id="userPassword"
                placeholder="Password"
                autocomplete="current-password"
            >

            <select id="userRole" style="display:none;">
                <option value="customer">
                    I'm a Customer
                </option>

                <option value="salon_owner">
                    I'm a Salon Owner
                </option>
            </select>

            <button
                type="button"
                id="loginBtn"
                class="primary-btn"
            >
                Login
            </button>

            <button
                type="button"
                id="signupBtn"
                class="secondary-btn"
            >
                Sign Up
            </button>

            <button
                type="button"
                id="toggleOwnerSignup"
                class="secondary-btn"
            >
                Sign up as Salon Owner
            </button>

            <p
                id="message"
                style="text-align:center;margin-top:15px;"
            ></p>

        </div>

    </div>

    <div
        class="glass-card"
        style="margin-top:20px;text-align:center;"
    >
        <h3>Book your Kasi cut</h3>

        <p>
            Find a salon, choose your service and book your
            appointment without standing in a queue.
        </p>

        <a
            href="salons.html"
            class="primary-btn"
            style="display:inline-block;text-decoration:none;"
        >
            Browse Salons
        </a>
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyCjmaSIPBngbF3SbhP1AH4Frfn4Mz1QXHk",
    authDomain: "kasi-web-d073f.firebaseapp.com",
    projectId: "kasi-web-d073f",
    storageBucket: "kasi-web-d073f.firebasestorage.app",
    messagingSenderId: "471544855566",
    appId: "1:471544855566:web:aa669a968b8af0ceb6905f"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   ELEMENTS
========================================================= */

const emailInput =
    document.getElementById("userEmail");

const passwordInput =
    document.getElementById("userPassword");

const roleSelect =
    document.getElementById("userRole");

const loginBtn =
    document.getElementById("loginBtn");

const signupBtn =
    document.getElementById("signupBtn");

const toggleOwnerSignup =
    document.getElementById("toggleOwnerSignup");

const message =
    document.getElementById("message");


let ownerSignup = false;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, error = false) {

    message.textContent = text;

    message.style.color =
        error ? "#ff4757" : "#3B82F6";
}


/* =========================================================
   BUTTON LOADING
========================================================= */

function loading(button, state, normalText) {

    button.disabled = state;

    button.textContent =
        state ? "Please wait..." : normalText;
}


/* =========================================================
   REDIRECT USER
========================================================= */

async function redirectUser(user) {

    const userRef =
        doc(db, "users", user.uid);

    const snap =
        await getDoc(userRef);

    if (!snap.exists()) {

        await setDoc(userRef, {

            email: user.email,

            role: "customer",

            createdAt: serverTimestamp()

        });

        window.location.href =
            "salons.html";

        return;
    }


    const data = snap.data();

    if (data.role === "admin") {

        window.location.href =
            "dashboard.html";

    } else if (data.role === "salon_owner") {

        window.location.href =
            "owners.html";

    } else {

        window.location.href =
            "salons.html";
    }
}


/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password.",
                true
            );

            return;
        }


        loading(
            loginBtn,
            true,
            "Login"
        );


        try {

            const credentials =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            showMessage(
                "Login successful. Redirecting..."
            );


            await redirectUser(
                credentials.user
            );


        } catch (error) {

            console.error(error);

            showMessage(
                friendlyFirebaseError(error),
                true
            );

            loading(
                loginBtn,
                false,
                "Login"
            );
        }

    }
);


/* =========================================================
   SIGN UP
========================================================= */

signupBtn.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const role =
            roleSelect.value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password.",
                true
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                true
            );

            return;
        }


        loading(
            signupBtn,
            true,
            "Sign Up"
        );


        try {

            const credentials =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            /*
             IMPORTANT:

             For customers:
                 role = customer

             For owners:
                 role = salon_owner

             An owner must create/link a salon before
             the owner dashboard can show bookings.
            */

            await setDoc(
                doc(
                    db,
                    "users",
                    credentials.user.uid
                ),
                {

                    email: email,

                    role: role,

                    salonId: null,

                    createdAt:
                        serverTimestamp()

                }
            );


            showMessage(
                "Account created successfully."
            );


            /*
             Owners need to be connected to a salon.
             Send them to the owner dashboard where
             they can create one.
            */

            if (role === "salon_owner") {

                window.location.href =
                    "owners.html";

            } else {

                window.location.href =
                    "salons.html";
            }


        } catch (error) {

            console.error(error);

            showMessage(
                friendlyFirebaseError(error),
                true
            );

            loading(
                signupBtn,
                false,
                "Sign Up"
            );
        }

    }
);


/* =========================================================
   OWNER SIGNUP TOGGLE
========================================================= */

toggleOwnerSignup.addEventListener(
    "click",
    () => {

        ownerSignup =
            !ownerSignup;


        if (ownerSignup) {

            roleSelect.style.display =
                "block";

            roleSelect.value =
                "salon_owner";

            toggleOwnerSignup.textContent =
                "Sign up as Customer";

        } else {

            roleSelect.style.display =
                "none";

            roleSelect.value =
                "customer";

            toggleOwnerSignup.textContent =
                "Sign up as Salon Owner";
        }

    }
);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) return;

        /*
         Do not automatically redirect here.

         This prevents refresh/login loops.
         User is redirected only after login/signup.
        */

    }
);


/* =========================================================
   FIREBASE ERROR MESSAGES
========================================================= */

function friendlyFirebaseError(error) {

    switch (error.code) {

        case "auth/invalid-email":
            return "Invalid email address.";

        case "auth/user-not-found":
            return "No account exists with this email.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/email-already-in-use":
            return "This email is already registered.";

        case "auth/weak-password":
            return "Password is too weak.";

        case "auth/too-many-requests":
            return "Too many attempts. Please try again later.";

        default:
            return error.message ||
                "Something went wrong.";
    }
}

</script>

</body>
</html>
