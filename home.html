        /* =====================================================
           SORT BOOKINGS
           ===================================================== */

        Function sortBookings(
            Bookings
        ) {

            Bookings.sort(
                (
                    A,
                    B
                ) => {

                    Const dateA =
                        parseBookingDate(
                            a
                        );


                    Const dateB =
                        parseBookingDate(
                            b
                        );


                    If (
                        !dateA &&
                        !dateB
                    ) {

                        Return 0;

                    }


                    If (
                        !dateA
                    ) {

                        Return 1;

                    }


                    If (
                        !dateB
                    ) {

                        Return -1;

                    }


                    Return (
                        dateA.getTime() –
                        dateB.getTime()
                    );

                }
            );

        }


        /* =====================================================
           BOOKING STATS
           ===================================================== */

        Function renderBookingStats(
            Bookings
        ) {

            Const now =
                New Date();


            Const upcoming =
                Bookings.filter(
                    Booking => {

                        Const date =
                            parseBookingDate(
                                booking
                            );


                        Return (
                            Date &&
                            Date >= now &&
                            getBookingStatus(
                                booking
                            ) !==
                                "cancelled"
                        );

                    }
                );


            Const confirmed =
                Bookings.filter(
                    Booking => {

                        Const status =
                            getBookingStatus(
                                booking
                            );


                        Return (
                            Status.includes(
                                "confirm"
                            )
                        );

                    }
                );


            bookingCount.textContent =
                String(
                    Bookings.length
                );


            upcomingCount.textContent =
                String(
                    Upcoming.length
                );


            confirmedCount.textContent =
                String(
                    Confirmed.length
                );

        }


        /* =====================================================
           NEXT BOOKING
           ===================================================== */

        Function renderNextBooking(
            Bookings
        ) {

            Const now =
                New Date();


            Const upcoming =
                Bookings
                    .filter(
                        Booking => {

                            Const date =
                                parseBookingDate(
                                    booking
                                );


                            Return (
                                Date &&
                                Date >= now &&
                                getBookingStatus(
                                    booking
                                ) !==
                                    "cancelled"
                            );

                        }
                    )
                    .sort(
                        (
                            A,
                            B
                        ) => {

                            Return (
                                parseBookingDate(
                                    a
                                ).getTime() –
                                parseBookingDate(
                                    b
                                ).getTime()
                            );

                        }
                    );


            If (
                !upcoming.length
            ) {

                bookingHighlight.classList.remove(
                    "show"
                );

                Return;

            }


            Const booking =
                Upcoming[0];


            Const salonName =
                Booking.salonName ||
                Booking.salon ||
                "Salon";


            Const service =
                Booking.serviceName ||
                Booking.service ||
                "Grooming service";


            Const date =
                formatBookingDate(
                    booking
                );


            Const time =
                formatBookingTime(
                    booking
                );


            Const status =
                getBookingStatus(
                    booking
                );


            nextBookingName.textContent =

            nextBookingDetails.textContent =

            nextBookingStatus.textContent =

            nextBookingStatus.className =
                "booking-highlight-status";


            bookingHighlight.classList.add(
                "show"
            );

        /* =====================================================
           SWIPE CAROUSEL
           ===================================================== */

        Function getCarouselIndex() {

            Const cards =
                styleCarousel.querySelectorAll(
                    ".style-card"
                );


            If (
                !cards.length
            ) {

                Return 0;

            }


            Const scrollLeft =
                styleCarousel.scrollLeft;


            let closestIndex =
                0;


            Let closestDistance =
                Infinity;


            Cards.forEach(
                (
                    Card,
                    Index
                ) => {

                    Const distance =
                        Math.abs(
                            Card.offsetLeft –
                            scrollLeft
                        );


                    If (
                        Distance <
                        closestDistance
                    ) {

                        closestDistance =
                            distance;

                        closestIndex =
                            index;

                    }

                }
            );


            Return closestIndex;

        }


        Function updateCarouselDots() {

            Const index =
                getCarouselIndex();


            carouselDots.forEach(
                (
                    Dot,
                    dotIndex
                ) => {

                    Dot.classList.toggle(
                        "active",
                        dotIndex ===
                        index
                    );

                }
            );

        }


        Function scrollToCard(
            Index
        ) {

            Const cards =
                styleCarousel.querySelectorAll(
                    ".style-card"
                );


            If (
                !cards[index]
            ) {

                Return;

            }


            styleCarousel.scrollTo(
                {

                    Left:
                        Cards[index].offsetLeft,

                    Behavior:
                        "smooth"

                }
            );


            updateCarouselDots();

        }


        Function startCarouselAutoplay() {

            stopCarouselAutoplay();


            swipeTimer =
                setInterval(
                    () => {

                        If (
                            userIsTouchingSwipe
                        ) {

                            Return;

                        }


                        Const cards =
                            styleCarousel.querySelectorAll(
                                ".style-card"
                            );


                        If (
                            Cards.length <
                            2
                        ) {

                            Return;

                        }


                        Let index =
                            getCarouselIndex();


                        index =
                            (
                                Index + 1
                            ) %
                            Cards.length;


                        scrollToCard(
                            index
                        );

                    },
                    5000
                );

        }


        Function stopCarouselAutoplay() {

            If (
                swipeTimer
            ) {

                clearInterval(
                    swipeTimer
                );

                swipeTimer =
                    null;

            }

        }


        Function setupSwipeGallery() {

            If (
                !styleCarousel
            ) {

                Return;

            }


            styleCarousel.addEventListener(
                "scroll",
                () => {

                    updateCarouselDots();

                },
                {
                    Passive:
                        True
                }
            );


            styleCarousel.addEventListener(
                "touchstart",
                () => {

                    userIsTouchingSwipe =
                        true;

                },
                {
                    Passive:
                        True
                }
            );


            styleCarousel.addEventListener(
                "touchend",
                () => {

                    setTimeout(
                        () => {

                            userIsTouchingSwipe =
                                false;

                        },
                        1200
                    );

                },
                {
                    Passive:
                        True
                }
            );


            styleCarousel.addEventListener(
                "mouseenter",
                () => {

                    userIsTouchingSwipe =
                        true;

                }
            );


            styleCarousel.addEventListener(
                "mouseleave",
                () => {

                    userIsTouchingSwipe =
                        false;

                }
            );


            carouselDots.forEach(
                (
                    Dot,
                    Index
                ) => {

                    Dot.addEventListener(
                        "click",
                        () => {

                            scrollToCard(
                                index
                            );

                        }
                    );

                }
            );


            updateCarouselDots();

            startCarouselAutoplay();

        }


        /* =====================================================
           REFRESH
           ===================================================== */

        Async function refreshDashboard() {

            If (
                !currentUser
            ) {

                showToast(
                    "Please sign in first.",
                    "error"
                );

                Return;

            }


            Try {

                showLoading(
                    "Refreshing your K@si space…"
                );


                /*
                 * Verify role again during refresh.
                 * This means a role changed in Firestore is
                 * not silently trusted.
                 */

                Const verifiedRole =
                    Await getVerifiedRole(
                        currentUser
                    );


                currentRole =
                    verifiedRole;


                if (
                    verifiedRole === "admin" ||
                    verifiedRole === "salon_owner"
                ) {

                    saveRoleSession(
                        currentUser,
                        verifiedRole,
                        currentProfile
                    );


                    showRoleRedirect(
                        verifiedRole
                    );


                    hideLoading();


                    setTimeout(
                        () => {

                            Window.location.href =
                                getRoleDestination(
                                    verifiedRole
                                );

                        },
                        400
                    );


                    Return;

                }


                Await loadUser(
                    currentUser
                );


                hideLoading();


                showToast(
                    "Your K@si space is up to date."
                );

            } catch (
                Error
            ) {

                Console.error(
                    "Refresh error:",
                    Error
                );


                hideLoading();


                showToast(
                    "Refresh failed. Please try again.",
                    "error"
                );

            }

        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        Async function logout() {

            If (
                !auth
            ) {

                Return;

            }


            Try {

                showLoading(
                    "Signing you out…"
                );


                Await auth.signOut();


                currentUser =
                    null;

                currentProfile =
                    null;

                currentRole =
                    "customer";

                currentBookings =
                    [];


                Try {

                    sessionStorage.clear();

                } catch (
                    storageError
                ) {

                    Console.warn(
                        "Session clear failed:",
                        storageError
                    );

                }


                hideLoading();


                document.body.classList.add(
                    "auth-mode"
                );


                appShell.classList.remove(
                    "visible"
                );


                authScreen.style.display =
                    "flex";


                setAccountUI(
                    "customer"
                );


                showLogin();


                document
                    .getElementById(
                        "loginForm"
                    )
                    .reset();


                showToast(
                    "Signed out successfully."
                );

            } catch (
                Error
            ) {

                Console.error(
                    "Logout error:",
                    Error
                );


                hideLoading();


                showToast(
                    "Unable to sign out. Please try again.",
                    "error"
                );

            }

        }


        /* =====================================================
           OWNER PORTAL LINK
           ===================================================== */

        Function openOwnerPortal() {

            If (
                !currentUser
            ) {

                showSignup();

                showAuthMessage(
                    "Salon owners must use a verified salon-owner account."
                );

                Return;

            }


            If (
                isSalonOwner()
            ) {

                openRoleAccount();

                return;

            }


            If (
                isAdmin()
            ) {

                showToast(
                    "This is an admin account. Open the Admin portal instead.",
                    "info"
                );

                Return;

            }


            showToast(
                "Your account is currently a client account.",
                "info"
            );

        }


        /* =====================================================
           QUICK BOOKING
           ===================================================== */

        Function goToBookings() {

            Const target =
                Document.getElementById(
                    "bookings"
                );


            If (
                Target
            ) {

                Target.scrollIntoView(
                    {
                        Behavior:
                            "smooth",
                        Block:
                            "start"
                    }
                );

            }

        }


        /* =====================================================
           EVENT LISTENERS
           ===================================================== */

        Function setupEventListeners() {


            loginTab.addEventListener(
                "click",
                showLogin
            );


            signupTab.addEventListener(
                "click",
                showSignup
            );


            loginForm.addEventListener(
                "submit",
                handleLogin
            );


            signupForm.addEventListener(
                "submit",
                handleSignup
            );


            Document
                .getElementById(
                    "refreshBtn"
                )
                .addEventListener(
                    "click",
                    refreshDashboard
                );


            Document
                .getElementById(
                    "logoutBtn"
                )
                .addEventListener(
                    "click",
                    Logout
                );


            Document
                .getElementById(
                    "bookingQuickBtn"
                )
                .addEventListener(
                    "click",
                    goToBookings
                );


            Document
                .getElementById(
                    "heroBookingBtn"
                )
                .addEventListener(
                    "click",
                    goToBookings
                );


            accountQuickBtn.addEventListener(
                "click",
                openRoleAccount
            );


            accountBottomBtn.addEventListener(
                "click",
                openRoleAccount
            );


            Document
                .getElementById(
                    "ownerPortalLink"
                )
                .addEventListener(
                    "click",
                    openOwnerPortal
                );


            setupPasswordToggles();

        }


        /* =====================================================
           FIREBASE INITIALIZATION
           ===================================================== */

        Function initializeFirebase() {

            Try {

                If (
                    !window.firebase
                ) {

                    Throw new Error(
                        "Firebase SDK did not load."
                    );

                }


                If (
                    !firebase.apps.length
                ) {

                    App =
                        Firebase.initializeApp(
                            firebaseConfig
                        );

                } else {

                    App =
                        Firebase.app();

                }


                Auth =
                    Firebase.auth();


                Db =
                    Firebase.firestore();


                /*
                 * Keep Firebase persistence enabled.
                 */

                Auth.setPersistence(
                    Firebase.auth.Auth.Persistence.LOCAL
                )
                    .catch(
                        Error => {

                            Console.warn(
                                "Auth persistence could not be enabled:",
                                Error
                            );

                        }
                    );


                Return true;

            } catch (
                Error
            ) {

                Console.error(
                    "Firebase initialization failed:",
                    Error
                );


                showFirebaseError(
                    K@si could not connect to Firebase. Check your Firebase configuration and internet connection.
                );


                hideLoading();


                return false;

            }

        }


        /* =====================================================
           AUTH STATE
           ===================================================== */

        Function setupAuthStateListener() {

            If (
                !auth
            ) {

                Return;

            }


            Auth.onAuthStateChanged(
                Async user => {

                    Try {

                        currentUser =
                            user;


                        if (
                            user
                        ) {

                            /*
                             * Authenticated.
                             */

                            Document.body.classList.remove(
                                "auth-mode"
                            );


                            authScreen.style.display =
                                "none";


                            appShell.classList.add(
                                "visible"
                            );


                            showLoading(
                                "Verifying your K@si role…"
                            );


                            Const verifiedRole =
                                Await getVerifiedRole(
                                    User
                                );


                            currentRole =
                                verifiedRole;


                            /*
                             * Elevated users never remain
                             * on the customer dashboard.
                             */

                            If (
                                verifiedRole ===
                                    "admin" ||
                                verifiedRole ===
                                    "salon_owner"
                            ) {

                                saveRoleSession(
                                    user,
                                    verifiedRole,
                                    currentProfile
                                );


                                showRoleRedirect(
                                    verifiedRole
                                );


                                hideLoading();


                                setTimeout(
                                    () => {

                                        Window.location.href =
                                            getRoleDestination(
                                                verifiedRole
                                            );

                                    },
                                    350
                                );


                                Return;

                            }


                            /*
                             * Customer mode.
                             */

                            currentRole =
                                "customer";


                            setAccountUI(
                                "customer"
                            );


                            Await loadUser(
                                User
                            );


                            hideLoading();


                            authStateReady =
                                true;


                        } else {

                            /*
                             * Signed out.
                             */

                            currentUser =
                                null;

                            currentProfile =
                                null;

                            currentRole =
                                "customer";

                            currentBookings =
                                [];


                            Document.body.classList.add(
                                "auth-mode"
                            );


                            appShell.classList.remove(
                                "visible"
                            );


                            authScreen.style.display =
                                "flex";


                            roleRedirectOverlay.classList.remove(
                                "show"
                            );


                            hideLoading();


                            authStateReady =
                                true;

                        }

                    } catch (
                        Error
                    ) {

                        Console.error(
                            "Auth state error:",
                            Error
                        );


                        currentRole =
                            "customer";


                        setAccountUI(
                            "customer"
                        );


                        hideLoading();


                        showFirebaseError(
                            "Your authentication state could not be fully verified. Please refresh and try again."
                        );

                    }

                }
            );

        }


        /* =====================================================
           PREVENT INVALID CUSTOMER PORTAL ACCESS
           ===================================================== */

        Function protectClientPortalButtons() {

            /*
             * These controls call openRoleAccount().
             * openRoleAccount checks the actual currentRole.
             *
             * This is UI protection only.
             *
             * Firestore security rules must still enforce
             * actual database permissions.
             */

        }


        /* =====================================================
           PAGE START
           ===================================================== */

        Document.addEventListener(
            "DOMContentLoaded",
            () => {

                showLoading(
                    "Starting K@si..."
                );


                setupEventListeners();

                setupSwipeGallery();

                protectClientPortalButtons();


                const firebaseReady =
                    initializeFirebase();


                if (
                    !firebaseReady
                ) {

                    Document.body.classList.add(
                        "auth-mode"
                    );

                    Return;

                }


                setupAuthStateListener();

            }
        );


        /* =====================================================
           PAGE VISIBILITY REFRESH
           ===================================================== */

        Document.addEventListener(
            "visibilitychange",
            () => {

                If (
                    Document.visibilityState ===
                    "visible" &&
                    currentUser &&
                    authStateReady
                ) {

                    /*
                     * Lightweight role verification when the
                     * user returns to the page.
                     */

                    getVerifiedRole(
                        currentUser
                    )
                        .then(
                            verifiedRole => {

                                if (
                                    verifiedRole !==
                                    normalizeRole(
                                        currentRole
                                    )
                                ) {

                                    currentRole =
                                        verifiedRole;


                                    if (
                                        verifiedRole ===
                                            "admin" ||
                                        verifiedRole ===
                                            "salon_owner"
                                    ) {

                                        saveRoleSession(
                                            currentUser,
                                            verifiedRole,
                                            currentProfile
                                        );


                                        showRoleRedirect(
                                            verifiedRole
                                        );


                                        setTimeout(
                                            () => {

                                                Window.location.href =
                                                    getRoleDestination(
                                                        verifiedRole
                                                    );

                                            },
                                            300
                                        );

                                    }

                                }

                            }
                        )
                        .catch(
                            Error => {

                                Console.warn(
                                    "Background role check failed:",
                                    Error
                                );

                            }
                        );

                }

            }
        );


        /* =====================================================
           GLOBAL ERROR SAFETY
           ===================================================== */

        Window.addEventListener(
            "unhandledrejection",
            Event => {

                Console.error(
                    "Unhandled promise rejection:",
                    Event.reason
                );

            }
        );


        Window.addEventListener(
            "error",
            Event => {

                Console.error(
                    "K@si runtime error:",
                    Event.error ||
                    Event.message
                );

            }
        );

    </script>
