<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>K@si Web | Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-950 text-white min-h-screen">


<header
    class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40"
>

    <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"
    >

        <h1 class="text-2xl font-bold">
            📊 K@si Dashboard
        </h1>


        <div class="flex gap-2">

            <a
                href="home.html"
                class="bg-gray-800 px-4 py-2 rounded-lg"
            >
                Home
            </a>

            <button
                id="logoutBtn"
                class="bg-red-600 px-4 py-2 rounded-lg"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="max-w-7xl mx-auto px-4 py-8">


    <div
        id="loading"
        class="text-center py-20"
    >
        Loading...
    </div>


    <section
        id="content"
        class="hidden"
    >


        <!-- STATS -->

        <div
            class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"
        >

            <div class="bg-gray-900 p-5 rounded-xl">
                <p class="text-gray-400">
                    Total Bookings
                </p>

                <h2
                    id="totalBookings"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </h2>
            </div>


            <div class="bg-gray-900 p-5 rounded-xl">
                <p class="text-gray-400">
                    Pending
                </p>

                <h2
                    id="pendingBookings"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </h2>
            </div>


            <div class="bg-gray-900 p-5 rounded-xl">
                <p class="text-gray-400">
                    Salons
                </p>

                <h2
                    id="totalSalons"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </h2>
            </div>


            <div class="bg-gray-900 p-5 rounded-xl">
                <p class="text-gray-400">
                    Users
                </p>

                <h2
                    id="totalUsers"
                    class="text-3xl font-bold mt-2"
                >
                    0
                </h2>
            </div>

        </div>


        <!-- BOOKINGS -->

        <div
            class="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden"
        >

            <div class="p-5 border-b border-gray-800">

                <h2 class="text-2xl font-bold">
                    All Bookings
                </h2>

            </div>


            <div class="overflow-x-auto">

                <table class="w-full">

                    <thead>

                        <tr class="bg-gray-800">

                            <th class="p-3 text-left">
                                Customer
                            </th>

                            <th class="p-3 text-left">
                                Salon
                            </th>

                            <th class="p-3 text-left">
                                Service
                            </th>

                            <th class="p-3 text-left">
                                Date
                            </th>

                            <th class="p-3 text-left">
                                Time
                            </th>

                            <th class="p-3 text-left">
                                Status
                            </th>

                            <th class="p-3 text-left">
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="bookingsTable"
                    >

                    </tbody>

                </table>

            </div>

        </div>


    </section>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    updateDoc,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCjmaSIPBngBf3SbhP1AH4Frfn4Mz1QXHk",

    authDomain:
        "kasi-web-d073f.firebaseapp.com",

    projectId:
        "kasi-web-d073f",

    storageBucket:
        "kasi-web-d073f.firebasestorage.app",

    messagingSenderId:
        "471544855566",

    appId:
        "1:471544855566:web:aa669a968b8af0ceb6905f"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "index.html";

            return;
        }


        try {

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if (!userSnap.exists()) {

                alert(
                    "User profile not found."
                );

                await signOut(auth);

                window.location.href =
                    "index.html";

                return;
            }


            const userData =
                userSnap.data();


            if (
                userData.role !==
                "admin"
            ) {

                if (
                    userData.role ===
                    "salon_owner"
                ) {

                    window.location.href =
                        "owners.html";

                } else {

                    window.location.href =
                        "salons.html";
                }

                return;
            }


            document.getElementById(
                "loading"
            ).classList.add("hidden");


            document.getElementById(
                "content"
            ).classList.remove("hidden");


            loadDashboard();


        } catch (error) {

            console.error(error);

            document.getElementById(
                "loading"
            ).innerHTML = `
                <p class="text-red-400">
                    ${escapeHtml(error.message)}
                </p>
            `;

        }

    }
);


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadDashboard() {

    try {

        const bookingsQuery =
            query(
                collection(
                    db,
                    "bookings"
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const bookingsSnap =
            await getDocs(
                bookingsQuery
            );


        const salonsSnap =
            await getDocs(
                collection(
                    db,
                    "salons"
                )
            );


        const usersSnap =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        document.getElementById(
            "totalBookings"
        ).textContent =
            bookingsSnap.size;


        document.getElementById(
            "pendingBookings"
        ).textContent =
            bookingsSnap.docs.filter(
                item =>
                    item.data().status ===
                    "pending"
            ).length;


        document.getElementById(
            "totalSalons"
        ).textContent =
            salonsSnap.size;


        document.getElementById(
            "totalUsers"
        ).textContent =
            usersSnap.size;


        renderBookings(
            bookingsSnap
        );


    } catch (error) {

        console.error(error);

        alert(
            "Dashboard error: " +
            error.message
        );

    }

}


/* =========================================================
   RENDER BOOKINGS
========================================================= */

function renderBookings(
    snapshot
) {

    const table =
        document.getElementById(
            "bookingsTable"
        );


    table.innerHTML = "";


    if (snapshot.empty) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="p-8 text-center text-gray-500"
                >
                    No bookings found.
                </td>
            </tr>
        `;

        return;
    }


    snapshot.forEach(
        bookingDoc => {

            const b =
                bookingDoc.data();


            const id =
                bookingDoc.id;


            const row =
                document.createElement(
                    "tr"
                );


            row.className =
                "border-t border-gray-800";


            row.innerHTML = `

                <td class="p-3">
                    ${escapeHtml(
                        b.customerName ||
                        "Customer"
                    )}
                </td>


                <td class="p-3">
                    ${escapeHtml(
                        b.salonName ||
                        "Salon"
                    )}
                </td>


                <td class="p-3">
                    ${escapeHtml(
                        b.service ||
                        "Service"
                    )}

                    <br>

                    <span class="text-gray-500">
                        R${Number(
                            b.price || 0
                        )}
                    </span>
                </td>


                <td class="p-3">
                    ${escapeHtml(
                        b.date || "-"
                    )}
                </td>


                <td class="p-3">
                    ${escapeHtml(
                        b.time || "-"
                    )}
                </td>


                <td class="p-3">
                    <span
                        class="px-2 py-1 rounded-lg text-xs ${statusClass(
                            b.status
                        )}"
                    >
                        ${escapeHtml(
                            b.status ||
                            "pending"
                        )}
                    </span>
                </td>


                <td class="p-3">

                    ${
                        b.status === "pending"
                        ? `

                            <button
                                class="approve bg-green-600 px-3 py-1 rounded mr-1"
                                data-id="${id}"
                            >
                                Approve
                            </button>

                            <button
                                class="decline bg-red-600 px-3 py-1 rounded"
                                data-id="${id}"
                            >
                                Decline
                            </button>

                        `
                        : ""
                    }


                    ${
                        b.status === "approved"
                        ? `

                            <button
                                class="complete bg-purple-600 px-3 py-1 rounded"
                                data-id="${id}"
                            >
                                Complete
                            </button>

                        `
                        : ""
                    }

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   UPDATE BOOKING
========================================================= */

document.addEventListener(
    "click",
    async event => {

        const approve =
            event.target.closest(
                ".approve"
            );


        const decline =
            event.target.closest(
                ".decline"
            );


        const complete =
            event.target.closest(
                ".complete"
            );


        let id = null;

        let status = null;


        if (approve) {

            id =
                approve.dataset.id;

            status =
                "approved";

        }


        if (decline) {

            id =
                decline.dataset.id;

            status =
                "declined";

        }


        if (complete) {

            id =
                complete.dataset.id;

            status =
                "completed";

        }


        if (!id || !status) return;


        try {

            await updateDoc(
                doc(
                    db,
                    "bookings",
                    id
                ),
                {

                    status:
                        status,

                    updatedAt:
                        serverTimestamp()

                }
            );


            loadDashboard();


        } catch (error) {

            console.error(error);

            alert(
                "Could not update booking: " +
                error.message
            );

        }

    }
);


/* =========================================================
   LOGOUT
========================================================= */

document.getElementById(
    "logoutBtn"
).addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.href =
            "index.html";

    }
);


/* =========================================================
   HELPERS
========================================================= */

function statusClass(status) {

    if (status === "approved")
        return "bg-green-900 text-green-300";

    if (status === "declined")
        return "bg-red-900 text-red-300";

    if (status === "completed")
        return "bg-purple-900 text-purple-300";

    return "bg-yellow-900 text-yellow-300";

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
